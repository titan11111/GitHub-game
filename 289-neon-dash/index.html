<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>289｜LUNAR STRIKER 月面機動ロボ</title>
<style>
:root{
  box-sizing:border-box;
  --bg:#0b0920; --panel:#1b1939; --ink:#eceaff; --mute:#9d9ad0; --line:#38356e;
  --key:#26234f; --key-on:#ffb238; --key-on-ink:#1b1840;
  /* ステージは「ゲーム機の画面」なので固定色 */
  --s-ink:#120f2b; --s-a1:#e9ecf8; --s-a2:#a2abdc; --s-a3:#2b2d63; --s-b1:#7c85bf; --s-b2:#565d97;
  --s-teal:#3fe0d0; --s-amber:#ffb238; --s-hot:#ff4f8b;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{
  position:fixed;inset:0;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  touch-action:manipulation;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
}
.wrap{
  width:100%;max-width:920px;height:100%;margin:0 auto;display:flex;flex-direction:column;gap:8px;min-height:0;
  padding:calc(8px + env(safe-area-inset-top,0px)) calc(10px + env(safe-area-inset-right,0px))
          calc(10px + env(safe-area-inset-bottom,0px)) calc(10px + env(safe-area-inset-left,0px));
}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:0 0 auto}
h1{font-size:15px;font-weight:700;margin:0;letter-spacing:.12em;color:#ffd27a}
h1 small{font-size:11px;font-weight:400;color:var(--mute);letter-spacing:.04em;margin-left:6px}
.sys{display:flex;gap:6px}
.sysb{
  font:inherit;font-size:12px;color:var(--ink);background:var(--key);border:2px solid var(--line);
  border-radius:4px;padding:7px 10px;min-width:64px;cursor:pointer;touch-action:manipulation;
}
.sysb[aria-pressed="true"]{background:var(--key-on);color:var(--key-on-ink);border-color:var(--key-on)}
.sysb,.go{transition:transform .06s}
.screen{flex:1 1 0;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center}
.stage{
  --u:1px;position:relative;box-sizing:content-box;width:320px;height:200px;flex:0 0 auto;
  background:#04020d;border:3px solid #05030f;border-radius:6px;box-shadow:0 0 0 2px var(--line),0 0 26px rgba(120,80,220,.35);overflow:hidden;
}
.stage canvas,.stage svg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 78% 82% at 50% 52%,rgba(4,2,13,0) 52%,rgba(4,2,13,.6) 100%)}
.hud{
  position:absolute;inset:0;pointer-events:none;padding:calc(var(--u)*10) calc(var(--u)*12);
  display:flex;justify-content:space-between;align-items:flex-start;
  font:700 calc(var(--u)*17)/1.15 ui-monospace,Menlo,Consolas,monospace;color:#ffd27a;text-shadow:0 calc(var(--u)*2) 0 #120f2b;
}
.hp{display:flex;gap:calc(var(--u)*4)}
.hp i{width:calc(var(--u)*16);height:calc(var(--u)*11);border:calc(var(--u)*2) solid #120f2b;border-radius:calc(var(--u)*3);background:#2b2d63}
.hp i.on{background:#3fe0d0;box-shadow:0 0 calc(var(--u)*8) #3fe0d0}
.nm{margin-top:calc(var(--u)*5);font-size:calc(var(--u)*11);color:#e9ecf8;letter-spacing:.06em}
.cg{margin-top:calc(var(--u)*4);width:calc(var(--u)*96);height:calc(var(--u)*6);border:calc(var(--u)*1.5) solid #120f2b;border-radius:calc(var(--u)*3);background:#2b2d63;overflow:hidden}
.cg[hidden]{display:none}
.cg b{display:block;height:100%;width:0;background:#ffb238}
.cg.full b{background:#fff6d0;box-shadow:0 0 calc(var(--u)*8) #ffb238}
.cg.cd b{background:#565d97}
.sc{text-align:right}
.sc small{display:block;font-size:calc(var(--u)*12);color:#a2abdc}
.ovl{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*10);
  background:radial-gradient(ellipse at center,rgba(8,5,26,.25),rgba(8,5,26,.78));text-align:center;
}
.ovl[hidden]{display:none}
.ttl{font:900 calc(var(--u)*46)/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em;color:#fff6d0;
  text-shadow:0 calc(var(--u)*3) 0 #ff4f8b,0 0 calc(var(--u)*22) rgba(255,178,56,.8)}
.sub{font-size:calc(var(--u)*16);color:#3fe0d0;letter-spacing:.3em}
.msg{font-size:calc(var(--u)*15);color:#e9ecf8;line-height:1.7;white-space:pre-line;min-height:1em}
.ups{display:flex;gap:calc(var(--u)*8);justify-content:center}
.ups[hidden]{display:none}
.up{
  font:inherit;width:calc(var(--u)*150);padding:calc(var(--u)*10) calc(var(--u)*6);color:#e9ecf8;background:rgba(27,25,57,.92);
  border:calc(var(--u)*2.5) solid #38356e;border-radius:calc(var(--u)*8);cursor:pointer;touch-action:manipulation;transition:transform .06s;
}
.up b{display:block;font-size:calc(var(--u)*17);color:#ffd27a;margin-bottom:calc(var(--u)*4)}
.up span{display:block;font-size:calc(var(--u)*12);line-height:1.4}
.up.sel{border-color:#ffb238;box-shadow:0 0 calc(var(--u)*14) rgba(255,178,56,.7);transform:translateY(calc(var(--u)*-3))}
.up:active{transform:scale(.95)}
.go[hidden]{display:none}
.go{
  font:inherit;font-weight:700;font-size:calc(var(--u)*20);color:#1b1840;background:#ffb238;border:calc(var(--u)*3) solid #120f2b;
  border-radius:calc(var(--u)*8);padding:calc(var(--u)*10) calc(var(--u)*28);cursor:pointer;touch-action:manipulation;
  box-shadow:0 calc(var(--u)*5) 0 #120f2b;animation:pulse 1.1s ease-in-out infinite;
}
@keyframes pulse{50%{transform:scale(1.06)}}
.deck{
  flex:0 0 auto;margin-top:auto;position:relative;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px 6px;
  padding:14px 14px 16px;border-radius:16px 16px 28px 28px;border:2px solid var(--line);
  background:linear-gradient(180deg,#2a2658,#15122f 55%,#0d0b20);
  box-shadow:inset 0 2px 0 rgba(160,150,255,.25),inset 0 -10px 24px rgba(0,0,0,.5),0 0 18px rgba(63,224,208,.12);
}
.deck::before{content:"";position:absolute;left:16px;right:16px;top:5px;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,#3fe0d0,transparent);opacity:.7}
.lcd{
  grid-column:1 / -1;font:700 11px/1.5 ui-monospace,Menlo,Consolas,monospace;color:#3fe0d0;letter-spacing:.04em;text-align:center;
  background:#07061a;border:1px solid #2b2862;border-radius:6px;padding:4px 8px;text-shadow:0 0 8px rgba(63,224,208,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.lcd b{color:#ffb238;text-shadow:0 0 8px rgba(255,178,56,.7)}
.dpad{
  position:relative;width:min(34vw,140px);height:min(34vw,140px);border-radius:50%;touch-action:none;cursor:pointer;
  background:radial-gradient(circle at 50% 45%,#1a1740,#0b0920 70%);box-shadow:inset 0 3px 8px rgba(0,0,0,.7),0 0 0 2px var(--line);
}
.dpad::before,.dpad::after{content:"";position:absolute;background:linear-gradient(180deg,#4a4690,#2b2862);border-radius:9px;box-shadow:0 4px 0 #120f2b,inset 0 1px 0 rgba(255,255,255,.25);pointer-events:none}
.dpad::before{left:34%;right:34%;top:7%;bottom:7%}
.dpad::after{top:34%;bottom:34%;left:7%;right:7%;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.dpad .arr{position:absolute;z-index:1;pointer-events:none;font-size:15px;line-height:1;color:#a2abdc;transform:translate(-50%,-50%);transition:color .06s}
.dpad .arr.u{left:50%;top:19%} .dpad .arr.d{left:50%;top:81%} .dpad .arr.l{left:19%;top:50%} .dpad .arr.r{left:81%;top:50%}
.dpad i{position:absolute;z-index:1;left:50%;top:50%;width:16%;height:16%;transform:translate(-50%,-50%);border-radius:50%;background:#1b1840;box-shadow:inset 0 2px 3px rgba(0,0,0,.7);pointer-events:none}
.dpad.press-u .arr.u,.dpad.press-d .arr.d,.dpad.press-l .arr.l,.dpad.press-r .arr.r{color:#ffb238;text-shadow:0 0 10px #ffb238}
.mid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-width:0}
.pill{
  font:700 9px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;color:#a2abdc;background:linear-gradient(180deg,#3a3780,#201d4c);
  border:2px solid #120f2b;border-radius:14px;width:100%;max-width:74px;min-height:44px;padding:0 2px;cursor:pointer;touch-action:none;
  box-shadow:0 4px 0 #120f2b,inset 0 1px 0 rgba(255,255,255,.2);transition:transform .06s,filter .06s;
}
.ab{position:relative;width:min(34vw,140px);height:min(34vw,140px)}
.rb{
  position:absolute;width:50%;height:50%;border-radius:50%;font:900 22px/1 ui-monospace,Menlo,Consolas,monospace;color:#120f2b;
  border:3px solid #120f2b;cursor:pointer;touch-action:none;transition:transform .06s,filter .06s;will-change:transform;padding:0;
}
#btnB{left:0;bottom:4%;background:radial-gradient(circle at 35% 30%,#c8fff8,#3fe0d0 55%,#178a80);box-shadow:0 5px 0 #0c4a46,0 0 14px rgba(63,224,208,.5)}
#btnA{right:0;top:4%;background:radial-gradient(circle at 35% 30%,#fff1c8,#ffb238 55%,#b56f10);box-shadow:0 5px 0 #6b3f06,0 0 14px rgba(255,178,56,.5)}
.rb.on,.rb:active{transform:translateY(4px) scale(.93);filter:brightness(1.25)}
.pill.on,.pill:active{transform:translateY(3px) scale(.94);filter:brightness(1.4)}
.sysb:active,.go:active{transform:scale(.93)}
.rb:focus-visible,.pill:focus-visible,.sysb:focus-visible,.go:focus-visible{outline:3px solid var(--s-teal);outline-offset:2px}
h1{white-space:nowrap}
@media (max-width:420px){ h1 small{display:none} }
@media (orientation:portrait){ .screen{flex:0 0 auto} }
@media (orientation:landscape) and (max-height:520px){
  .wrap{max-width:none;display:grid;grid-template-columns:minmax(118px,21vw) minmax(0,1fr) minmax(118px,21vw);grid-template-rows:auto minmax(0,1fr);gap:6px 10px;
    padding-top:calc(5px + env(safe-area-inset-top,0px));padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
  header{grid-column:1 / -1}
  h1{font-size:13px} .sysb{padding:4px 10px}
  .deck,.mid{display:contents}
  .lcd{display:none}
  .dpad{grid-column:1;grid-row:2;align-self:end;justify-self:center;width:min(21vw,130px);height:min(21vw,130px)}
  .ab{grid-column:3;grid-row:2;align-self:end;justify-self:center;width:min(21vw,130px);height:min(21vw,130px)}
  #selBtn{grid-column:1;grid-row:2;align-self:start;justify-self:center}
  #staBtn{grid-column:3;grid-row:2;align-self:start;justify-self:center}
  .screen{grid-column:2;grid-row:2;height:100%}
}

    <meta property="og:title" content="289｜LUNAR STRIKER 月面機動ロボ">

<body>
<div class="wrap" id="wrap">
  <header id="hd">
    <h1>LUNAR STRIKER<small>月面機動ロボ</small></h1>
    <div class="sys">
      <button class="sysb" id="muteBtn" type="button" aria-pressed="false">音 ON</button>
    </div>
  </header>

  <div class="screen" id="screen">
    <div class="stage" id="stageBox">
      <canvas id="bg"></canvas>
      <div class="vig"></div>
      <div class="hud" id="hud">
        <div class="lf"><div class="hp" id="hp" aria-label="残り耐久"></div><div class="nm" id="nm"></div><div class="cg" id="cg" hidden><b id="cgB"></b></div></div>
        <div class="sc"><span id="score">0</span><small id="dist">0m</small></div>
      </div>
      <div class="ovl" id="ovl">
        <div class="ttl" id="ovT">LUNAR STRIKER</div>
        <div class="sub" id="ovS">月面機動ロボ</div>
        <div class="msg" id="ovM"></div>
        <div class="ups" id="ups" hidden>
          <button class="up" type="button" data-i="0"><b>装甲強化</b><span>最大HP+1<br>全回復</span></button>
          <button class="up" type="button" data-i="1"><b>出力強化</b><span>パワーLvの<br>下限+1</span></button>
          <button class="up" type="button" data-i="2"><b>急速チャージ</b><span>ため時間を<br>短縮</span></button>
        </div>
        <button class="go" id="goBtn" type="button">START</button>
      </div>
    </div>
  </div>

  <div class="deck" id="pad">
    <div class="lcd" id="lcd" aria-live="polite"></div>
    <div class="dpad" id="dpad" role="group" aria-label="十字キー">
      <span class="arr u">▲</span><span class="arr d">▼</span><span class="arr l">◀</span><span class="arr r">▶</span><i></i>
    </div>
    <div class="mid">
      <button class="pill" id="selBtn" type="button" aria-label="セレクト：ロボを切り替える">SELECT</button>
      <button class="pill" id="staBtn" type="button" aria-label="スタート／ポーズ">START</button>
    </div>
    <div class="ab" role="group" aria-label="アクションボタン">
      <button class="rb" id="btnB" type="button" data-k="b" aria-label="Bボタン">B</button>
      <button class="rb" id="btnA" type="button" data-k="a" aria-label="Aボタン">A</button>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';
var NS='http://www.w3.org/2000/svg';
var $=function(id){return document.getElementById(id)};
var W=640, H=400, GROUND=340, G=2200, RUN=260, DASH=620, L=36, FOOT=4, S=2;
var D2R=Math.PI/180, TAU=Math.PI*2, INK='#120f2b';
function rnd(a,b){return a+Math.random()*(b-a)}

var el={robot:$('robot'),hip:$('hip'),legF:$('legF'),kneeF:$('kneeF'),legB:$('legB'),kneeB:$('kneeB'),
  torso:$('torsoG'),head:$('headG'),armF:$('armF'),elbowF:$('elbowF'),armB:$('armB'),elbowB:$('elbowB'),
  flame:$('flame'),flash:$('flash'),shadow:$('shadow'),fxBack:$('fxBack'),world:$('world'),
  score:$('score'),dist:$('dist'),hp:$('hp'),ovl:$('ovl'),ovT:$('ovT'),ovS:$('ovS'),ovM:$('ovM'),go:$('goBtn')};
var bg=$('bg');
var bc=bg.getContext('2d',{alpha:false}), fc=bc;             /* 1枚のcanvasに全部描く（SVGと前景canvasは廃止） */
function setScale(v){S=v;bg.width=Math.round(W*S);bg.height=Math.round(H*S)}
setScale(2);

/* ================= コントロールパネル（設定・音・入力・ポーズ） ================= */
var LS={
  get:function(k,d){try{var v=localStorage.getItem('tg.289.'+k);return v===null?d:v}catch(_){return d}},
  set:function(k,v){try{localStorage.setItem('tg.289.'+k,String(v))}catch(_){}}
};
var best=+LS.get('best',0)||0, muted=LS.get('mute','0')==='1';

var AC=null,master=null,noiseBuf=null,bgmBuf=null,bgmSrc=null;
function audioInit(){
  if(AC)return;
  try{
    var C=window.AudioContext||window.webkitAudioContext; AC=new C();
    master=AC.createGain(); master.gain.value=muted?0:0.6; master.connect(AC.destination);
    noiseBuf=AC.createBuffer(1,Math.floor(AC.sampleRate*0.6),AC.sampleRate);
    var d=noiseBuf.getChannelData(0); for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }catch(_){AC=null}
}
function makeBgm(){
  var sr=22050,st=0.11,N=64,len=Math.round(sr*st*N),b=AC.createBuffer(1,len,sr),d=b.getChannelData(0);
  var roots=[45,41,43,40], arps=[[57,60,64,69],[53,57,60,65],[55,59,62,67],[52,55,59,64]], seq=[0,1,2,1,3,2,1,2];
  function hz(m){return 440*Math.pow(2,(m-69)/12)}
  function add(t0,dur,fn){var i0=Math.round(t0*sr),n=Math.round(dur*sr);for(var i=0;i<n;i++)d[(i0+i)%len]+=fn(i/sr,i/n)}
  function sq(f,duty,vol,pw){return function(t,u){return ((t*f%1)<duty?1:-1)*vol*Math.pow(1-u,pw)}}
  for(var s=0;s<N;s++){
    var bar=s>>4,t0=s*st;
    add(t0,st*0.9,sq(hz(roots[bar]-12+(s%4===2?12:0)),0.5,0.13,1));
    add(t0,st*1.7,sq(hz(arps[bar][seq[s%8]]+12),0.25,0.05,2));
    if(s%4===0)add(t0,0.12,function(t,u){return Math.sin(TAU*(110*t-300*t*t))*0.4*(1-u)});
    if(s%8===4)add(t0,0.09,function(t,u){return (Math.random()*2-1)*0.16*(1-u)*(1-u)});
    if(s%2===1)add(t0,0.03,function(t,u){return (Math.random()*2-1)*0.05*(1-u)});
  }
  return b;
}
function bgmStart(){
  if(!AC||bgmSrc)return;
  try{
    if(!bgmBuf)bgmBuf=makeBgm();
    bgmSrc=AC.createBufferSource(); bgmSrc.buffer=bgmBuf; bgmSrc.loop = true;
    var g=AC.createGain(); g.gain.value=0.55; bgmSrc.connect(g); g.connect(master); bgmSrc.start();
  }catch(_){bgmSrc=null}
}
function unlock(){
  audioInit();                                          // 失敗時は AC=null＝音無しでもゲームは止めない
  if(AC && AC.state === 'suspended' && !paused){ AC.resume(); }
  bgmStart();
}
function tone(type,f0,f1,dur,vol,delay){
  if(!AC||muted)return;
  var t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.02);
}
function noise(dur,vol,f0,f1){
  if(!AC||muted)return;
  var t=AC.currentTime,s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();
  s.buffer=noiseBuf;f.type='lowpass';f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(Math.max(40,f1),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+dur+0.02);
}
var sfx={
  shoot:function(){tone('square',920,380,0.07,0.10)},
  jump:function(){tone('triangle',300,620,0.12,0.16)},
  jump2:function(){tone('triangle',480,980,0.14,0.16)},
  dash:function(){noise(0.2,0.22,3200,500)},
  land:function(){noise(0.08,0.14,700,200)},
  hit:function(){tone('square',220,110,0.05,0.12)},
  boom:function(s){noise(Math.min(0.55,0.28*s),0.4,1800,90);tone('sine',150,40,0.25,0.3)},
  hurt:function(){tone('sawtooth',420,90,0.3,0.22)},
  pick:function(){tone('square',660,660,0.07,0.12);tone('square',990,990,0.1,0.12,0.07)},
  warn:function(){tone('square',330,330,0.14,0.14);tone('square',330,330,0.14,0.14,0.22)},
  swing:function(){noise(0.09,0.16,2600,700)},
  smash:function(){noise(0.12,0.3,1400,200);tone('square',180,70,0.12,0.2)},
  homing:function(){tone('triangle',1200,700,0.06,0.07)},
  full:function(){tone('square',880,880,0.06,0.1);tone('square',1320,1320,0.1,0.1,0.06)},
  beam:function(){noise(0.55,0.4,5000,300);tone('sawtooth',90,60,0.9,0.28);tone('square',1400,200,0.9,0.1)},
  moon:function(){tone('triangle',260,1100,0.4,0.2);noise(0.3,0.2,3000,600)},
  change:function(){tone('square',520,520,0.06,0.12);tone('square',780,780,0.06,0.12,0.06);tone('square',1040,1040,0.12,0.12,0.12)},
  start:function(){tone('square',440,440,0.08,0.13);tone('square',660,660,0.08,0.13,0.09);tone('square',880,880,0.16,0.13,0.18)}
};

var muteBtn=$('muteBtn');
function vib(){try{if(navigator.vibrate)navigator.vibrate(14)}catch(_){}}
function setMute(m){

function pattern(x){
  var lv=lvl(),hs=[249,278,212,188],i;
  if(dist<30&&stage===0&&loopN===0){addDrone(x,249,0);return}
  var pool=['d','d','w','s','v'];
  if(stage>=1||loopN>0)pool.push('sh','h','h');
  if(stage>=2||loopN>0)pool.push('t','t','sh');
  if(stage===2||stage===4)pool.push('vt','vt');
  if(stage===4)pool.push('gt','gt');
  if(stage===3)pool.push('pf','pf','pf');
  var c=pool[Math.random()*pool.length|0];
  if(c==='d'){var n=1+(Math.random()*Math.min(3,1+lv)|0),by=hs[Math.random()*hs.length|0];for(i=0;i<n;i++)addDrone(x+i*48,by,i)}
  else if(c==='w'){addWalker(x+20);if(lv>3)addDrone(x+90,212,1)}
  else if(c==='s'){addSpike(x);if(lv>2)addSpike(x+34);if(lv>1)addDrone(x+20,204,0)}
  else if(c==='v'){addDrone(x,249,0);addDrone(x+44,212,1);addDrone(x+88,278,2)}
  else if(c==='sh'){addShield(x+20);if(lv>4)addDrone(x+80,196,0)}
  else if(c==='h'){addHopper(x);if(lv>3)addHopper(x+60)}
  else if(c==='vt'){addVent(x);if(lv>4)addVent(x+70);if(lv>2)addDrone(x+30,188,0)}
  else if(c==='gt'){addGate(x+20);if(lv>5)addDrone(x+110,249,0)}
  else if(c==='pf'){                                          /* 道中の浮遊足場：上にチップ */
    var hi=Math.random()<.4;plats.push({x0:x,x1:x+110,y:GROUND-(hi?150:84),a:1});
    for(i=0;i<3;i++)addFloatChip(x+25+i*30,GROUND-(hi?150:84)-34);
    if(Math.random()<.6)addHopper(x+140);else addWalker(x+160);
  }
  else{addTurret(x+10);if(lv>5)addHopper(x+80)}
}

/* ================= 更新 ================= */
function updateRobot(dt){
  var upHit=keys.up&&!prev.up, upOff=!keys.up&&prev.up, aHit=keys.a&&!prev.a, bHit=keys.b&&!prev.b, downHit=keys.down&&!prev.down;
  prev.up=keys.up;prev.a=keys.a;prev.b=keys.b;prev.down=keys.down;
  if(R.dropT>0)R.dropT-=dt;

  R.dashCD-=dt;R.shootCD-=dt;R.shootCD2-=dt;R.shootT-=dt;R.landT-=dt;R.inv-=dt;R.hurtT-=dt;R.spCD-=dt;
  R.recoil=Math.max(0,R.recoil-dt*9);
  if(R.spinT>0)R.spinT-=dt;
  if(R.atk){R.atk.t+=dt;if(R.atk.t>=R.atk.dur)R.atk=null}
  if(R.abT>0){R.abT-=dt;if(R.abT<=0)R.ab=null}
  var busy=R.hurtT>0||R.beamT>0||R.moon||R.rushT>0;

  {                                                       /* Bボタンため（3機共通） */
    if(keys.b){if(!busy&&R.spCD<=0){R.chg+=dt*chgMul;if(R.chg>=CHG&&!R.chgFull){R.chgFull=true;sfx.full()}}}
    else{
      if(R.chgFull&&!busy&&R.dashT<=0){if(TYPE===0)rush();else if(TYPE===1)moonsault();else if(TYPE===3)crescent();else galaxy();busy=true}
      R.chg=0;R.chgFull=false;
    }
  }

  var move=(keys.right?1:0)-(keys.left?1:0);
  if(R.hurtT>0){
    R.vx=-R.dir*190;R.vy+=grav()*dt;R.dashT=0;upHit=false;
  }else if(R.beamT>0){
    R.beamT-=dt;R.vx=-R.dir*26;R.vy=R.ground?0:R.vy+G*dt*0.12;upHit=false;R.crouch=false;
    if(R.beamT<=0)R.spCD=2.2;
  }else if(R.moon){
    R.moonT+=dt;R.vx=R.dir*235;R.vy+=grav()*0.8*dt;upHit=false;
    R.ghostT-=dt; if(R.ghostT<=0){ghost();R.ghostT=0.05}
  }else if(R.rushT>0){                                    /* ロボA：ブーストラッシュ */
    R.rushT-=dt;R.vx=R.dir*880;R.vy=0;upHit=false;
    R.ghostT-=dt; if(R.ghostT<=0){ghost();R.ghostT=0.025}
    if(R.rushT<=0)R.spCD=1.0;
  }else if(R.dashT>0){
    R.dashT-=dt;R.vx=R.dir*DASH;R.vy=0;
    R.ghostT-=dt; if(R.ghostT<=0){ghost();R.ghostT=0.04}
  }else{
    if(move&&!R.atk)R.dir=move;
    if(R.plat&&R.ground&&downHit&&!R.atk){R.plat=null;R.ground=false;R.jumps=1;R.dropT=0.28;R.y+=2}   /* 足場の上で下＝すり抜けて降りる */
    R.crouch=keys.down&&R.ground&&!R.plat;
    var tv=R.crouch?0:move*RUN*STAT[TYPE].run;
    if(stage===1&&R.ground&&!R.plat&&!R.crouch)R.vx+=(tv-R.vx)*(1-Math.exp(-dt*9));else R.vx=tv;   /* STAGE 2 は氷で滑る */
    if(R.atk&&R.ground)R.vx=R.crouch?0:R.dir*(R.atk.t<0.1?170:0);
    if((TYPE===0||TYPE===3)&&bHit&&R.dashCD<=0&&(R.ground||!R.airDashed)){
      if(TYPE===3)melee('s');
      R.dashT=0.22;R.dashCD=0.5;R.crouch=false;R.spinT=0;R.ghostT=0;
      if(!R.ground)R.airDashed=true;
      puff(R.x-R.dir*14,R.y-(R.ground?4:48),6,'#e9ecf8',130,R.ground);sfx.dash();
    }
    R.vy+=grav()*dt;
  }
  if(upHit)R.jbuf=0.13;else if(R.jbuf>0)R.jbuf-=dt;         /* 先行入力：着地の少し前に押しても跳ぶ */
  if(R.coy>0)R.coy-=dt;
  if(R.jbuf>0&&!busy){
    if(R.ground||R.coy>0){R.vy=-640*STAT[TYPE].jmp;R.ground=false;R.plat=null;R.jumps=1;R.dashT=0;R.crouch=false;R.jbuf=0;R.coy=0;puff(R.x,R.y-2,5,'#c9bdf8',110,true);sfx.jump()}
    else if(upHit&&R.jumps<2){R.vy=-560*STAT[TYPE].jmp;R.jumps=2;R.spinT=SPIN;R.atk=null;R.dashT=0;R.jbuf=0;booms.push({x:R.x,y:R.y-4,t:0,max:.3,s:0});puff(R.x,R.y-6,4,'#ffb238',90,false);sfx.jump2()}
  }
  if(upOff&&R.vy<-240&&!R.moon)R.vy=-240;

  var py=R.y,floor=GROUND,np=null,pi,pp;
  R.x+=R.vx*dt;R.y+=R.vy*dt;
  if(R.x<camX+18)R.x=camX+18;
  if(boss&&R.x>camX+W-18)R.x=camX+W-18;                   /* ボス戦は画面固定 */
  if(R.dropT<=0&&R.vy>=0)for(pi=0;pi<plats.length;pi++){
    pp=plats[pi];if(pp.a>0.6&&py<=pp.y+0.5&&R.y>=pp.y&&R.x>pp.x0-6&&R.x<pp.x1+6){floor=pp.y;np=pp}
  }
  if(R.y<floor-1&&R.ground&&R.dashT<=0&&!(R.rushT>0)){R.ground=false;R.coy=0.09}   /* 足場の端から落ちる（少しの間は跳べる） */
  if(R.y>=floor){

    if(!R.ground){R.landT=0.14;puff(R.x,R.y-2,7,'#c9bdf8',140,true);sfx.land()}
    if(R.moon){                                           /* ムーンサルト着地の衝撃波 */
      R.moon=false;R.spCD=1.2;R.inv=Math.max(R.inv,0.25);
      var sx=R.x+R.dir*26,mlv=plv(),mr=120+30*(mlv-1);boom(sx,floor-12,1.9+.3*(mlv-1));shake(9,.34);puff(sx,floor-4,14,'#ffd24a',260,true);

      }

    }

  }

  }
  if(!busy&&R.dashT<=0){
    if(TYPE===0){if(keys.a&&R.shootCD<=0&&R.spinT<=0)fire(0)}
    else if(TYPE===1){if(aHit){R.ab='p';R.abT=.16}else if(bHit){R.ab='k';R.abT=.16}if(R.ab&&!R.atk){melee(R.ab);R.ab=null}}
    else if(TYPE===3){if(aHit){R.ab='s';R.abT=.16}if(R.ab&&!R.atk){melee(R.ab);R.ab=null}}

  for(var n in P)P[n]+=(T[n]-P[n])*k;
  R.air+=((R.ground?0:1)-R.air)*(1-Math.exp(-dt*16));
  var auto=-Math.max(ext(P.hF,P.kF),ext(P.hB,P.kB));

}

/* 格闘・ムーンサルト・ギャラクシー砲の当たり */
function specialHits(dt){
  var i,e,mb=meleeBox(),a=R.atk;
  if(mb){
    for(i=ents.length-1;i>=0;i--){
      e=ents[i];if(e.item||e.ng||a.hit.indexOf(e)>=0)continue;
      if(mb.x1>e.x-e.hw&&mb.x0<e.x+e.hw&&mb.y1>e.y+e.top&&mb.y0<e.y+e.bot){
        if(e.k==='shot'){
          if(a.k==='s')bullets.push({k:0,x:e.x,y:e.y,vx:R.dir*760,vy:0,d:3,life:1.5,big:true});   /* 斬撃は弾を跳ね返す */
          puff(e.x,e.y,5,a.k==='s'?'#b4ff5a':'#ff4f8b',160,false);ents.splice(i,1);sfx.hit();continue;
        }
        if(e.k==='shield'&&e.sh>0&&R.x<e.x){a.hit.push(e);e.sh-=mb.d;e.shf=.12;impact(e.x-26,(mb.y0+mb.y1)/2);if(e.sh<=0)shBreak(e);continue}
        a.hit.push(e);e.hp-=mb.d;e.flash=.08;impact(e.x-R.dir*e.hw*.6,Math.max(mb.y0,Math.min(mb.y1,e.y+(e.top+e.bot)/2)));
        if(e.hp<=0){kill(e);ents.splice(i,1)}
      }
    }
    if(boss&&boss.dead<=0&&!a.boss&&mb.x1>boss.x-boss.hw&&mb.x0<boss.x+boss.hw&&mb.y1>boss.y-boss.hh&&mb.y0<boss.y+boss.hh){
      a.boss=true;hitBoss(mb.d);impact(boss.x-R.dir*50,(mb.y0+mb.y1)/2);
    }
  }
  if(R.moon){
    var cx=R.x,cy=R.y-44;
    for(i=ents.length-1;i>=0;i--){
      e=ents[i];if(e.item||e.ng||e.mh===R.moonId)continue;
      var dx=e.x-cx,dy=e.y+(e.top+e.bot)/2-cy;
      if(dx*dx+dy*dy<(66+e.hw)*(66+e.hw)){
        if(e.k==='shot'){ents.splice(i,1);continue}
        e.mh=R.moonId;e.hp-=14;e.flash=.08;impact(e.x,e.y+(e.top+e.bot)/2);
        if(e.hp<=0){kill(e);ents.splice(i,1)}
      }
    }
    if(boss&&boss.dead<=0&&!R.moonBoss&&Math.abs(boss.x-cx)<66+boss.hw&&Math.abs(boss.y-cy)<66+boss.hh){R.moonBoss=true;hitBoss(30+8*(plv()-1));impact(boss.x-R.dir*40,boss.y)}
  }
  if(R.beamT>0&&R.beamT<BEAM-0.06){
    var m=muzzle(),by=m[1],blv=plv(),bh=26+6*(blv-1),bd=45*(1+.4*(blv-1));
    for(i=ents.length-1;i>=0;i--){
      e=ents[i];if(e.item||e.ng||(e.x-m[0])*R.dir<-12||e.x>camX+W+30||e.x<camX-30)continue;
      if(e.y+e.top<by+bh&&e.y+e.bot>by-bh){
        if(e.k==='shot'){ents.splice(i,1);continue}
        e.hp-=bd*dt;e.flash=.05;if(Math.random()<.3)part(1,e.x,e.y+(e.top+e.bot)/2,rnd(-200,200),rnd(-200,200),.3,2,'#7af0ff',0);
        if(e.hp<=0){kill(e);ents.splice(i,1)}
      }
    }
    if(boss&&boss.dead<=0&&(boss.x-m[0])*R.dir>-20&&Math.abs(boss.y-by)<bh+boss.hh)hitBoss(bd*1.3*dt);
  }
  if(R.rushT>0){
    for(i=ents.length-1;i>=0;i--){
      e=ents[i];if(e.item||e.ng||e.rh===R.rushId)continue;
      if(Math.abs(e.x-R.x)<e.hw+34&&e.y+e.top<R.y&&e.y+e.bot>R.y-88){
        if(e.k==='shot'){ents.splice(i,1);continue}
        e.rh=R.rushId;if(e.k==='shield'&&e.sh>0)shBreak(e);
        e.hp-=8+2*(plv()-1);e.flash=.08;impact(e.x,e.y+(e.top+e.bot)/2);
        if(e.hp<=0){kill(e);ents.splice(i,1)}
      }
    }
    if(boss&&boss.dead<=0&&R.rushBoss!==R.rushId&&Math.abs(boss.x-R.x)<boss.hw+34&&Math.abs(boss.y-(R.y-44))<boss.hh+44){R.rushBoss=R.rushId;hitBoss(24+6*(plv()-1));impact(boss.x-R.dir*40,R.y-44)}
  }
}

function updateBoss(dt){
  var b=boss;b.t+=dt;if(b.flash>0)b.flash-=dt;
  if(b.intro>0){                                           /* 登場：右からゆっくり進入 → BATTLE START */
    b.intro-=dt;var iu=Math.max(0,b.intro/INTRO);
    b.x=b.hx+300*iu*iu*(3-2*iu);b.y=BHOME[b.kind][1]+(b.kind===1||b.kind===4?0:Math.sin(b.t*1.5)*10);
    if(Math.random()<dt*5)shake(2.2,.2);
    if(Math.random()<dt*3)noise(0.18,0.12,300,80);
    if(b.intro<=0){banner('BATTLE START',1.5);sfx.start();shake(7,.35);flashT=.1}
    return;
  }
  if(b.dead>0){
    b.dead-=dt;if(b.kind!==1&&b.kind!==4)b.y+=40*dt;b.x+=20*dt;
    if(Math.random()<dt*14)boom(b.x+rnd(-60,60),b.y+rnd(-24,24),rnd(.8,1.5));
    if(b.dead<=0){boom(b.x,b.y,3);boom(b.x-40,b.y+10,2,true);boom(b.x+40,b.y-10,2,true);shake(12,.6);freeze=.06;for(var ci=0;ci<8;ci++)addChip(b.x+rnd(-40,40),b.y);boss=null;stageClear()}
    return;
  }
  if(b.kind===1){bossCrab(b,dt);return}
  if(b.kind===3){bossGolem(b,dt);return}
  if(b.kind===4){bossEmperor(b,dt);return}
  if(b.kind===2){bossCore(b,dt);return}
  var tx=camX+W-110,ty=176+Math.sin(b.t*1.15)*72,rate=5;
  if(b.swD>0){b.swD-=dt;tx=R.x+128;ty=GROUND-98;rate=3.2;if(b.swD<=0)b.swT=rnd(3.2,4.6)}   /* 突進：格闘が届く間合いまで降りてくる */
  else if(mode==='play'){b.swT-=dt;if(b.swT<=0){b.swD=1.8;tone('sawtooth',500,120,0.4,0.14)}}
  b.x+=(tx-b.x)*(1-Math.exp(-dt*rate));b.y+=(ty-b.y)*(1-Math.exp(-dt*4));
  if(mode!=='play')return;
  b.cd-=dt;b.mcd-=dt;
  if(b.cd<=0&&b.swD<=0&&b.x<camX+W-40){
    var sp=215;aim(b.x-62,b.y+19,sp,-.24);aim(b.x-62,b.y+19,sp,0);aim(b.x-62,b.y+19,sp,.24);
    b.cd=b.hp<24?1.05:1.6;tone('square',300,180,0.12,0.1);
  }
  if(b.mcd<=0){addMeteor(R.x+rnd(-60,60));addMeteor(R.x+rnd(120,240));b.mcd=4.2}
}

/* STAGE 2 ボス：多脚戦車。踏みつけの衝撃波／迫撃弾／突進 */
function bossCrab(b,dt){

  }

  if(r<.36){b.st='stomp';b.stT=.9;b.hop=.5;tone('sawtooth',200,90,0.3,0.14)}

/* STAGE 3 ボス：要塞コア。回る盾が弾を防ぐ／高低2種の掃射レーザー／全方位弾／増援 */
function bossCore(b,dt){
  var i,a,tx=camX+W-120,ty=168+Math.sin(b.t*1.2)*46,rate=5;
  if(b.swD>0){b.swD-=dt;tx=R.x+122;ty=GROUND-96;rate=3;if(b.swD<=0)b.swT=rnd(4,5.5)}
  else if(mode==='play'&&!b.lz){b.swT-=dt;if(b.swT<=0){b.swD=1.8;tone('sawtooth',500,120,0.4,0.14)}}
  b.x+=(tx-b.x)*(1-Math.exp(-dt*rate));b.y+=(ty-b.y)*(1-Math.exp(-dt*4));
  if(b.lz){

  else if(r<.78){for(i=0;i<10;i++){a=i/10*TAU+b.t;addShot(b.x,b.y,Math.cos(a)*165,Math.sin(a)*165)}b.stT=1.7;tone('square',300,180,0.12,0.1)}
  else{addDrone(b.x-40,188,0);addDrone(b.x-40,249,1);b.stT=2.4}

/* STAGE 4 ボス：岩の巨人。拳の叩きつけ（左右に衝撃波）／岩投げ／隕石 */
function bossGolem(b,dt){
  var i,tx=camX+W-130,ty=160+Math.sin(b.t*1.3)*22,rate=4,f=b.f;
  if(b.swD>0){b.swD-=dt;tx=R.x+124;ty=GROUND-96;rate=3;if(b.swD<=0)b.swT=rnd(4,5.5)}
  else if(mode==='play'&&!f){b.swT-=dt;if(b.swT<=0){b.swD=1.8;tone('sawtooth',500,120,0.4,0.14)}}
  b.x+=(tx-b.x)*(1-Math.exp(-dt*rate));b.y+=(ty-b.y)*(1-Math.exp(-dt*4));
  if(f){
    f.t+=dt;
    if(f.st==='aim'){f.x+=(R.x-f.x)*(1-Math.exp(-dt*5));f.y+=(64-f.y)*(1-Math.exp(-dt*6));if(f.t>.85){f.st='drop';f.vy=200}}
    else if(f.st==='drop'){
      f.vy+=3200*dt;f.y+=f.vy*dt;
      if(f.y>=GROUND-24){f.y=GROUND-24;f.st='rest';f.t=0;shake(10,.35);sfx.boom(1.3);puff(f.x,GROUND-4,12,'#e0b080',260,true);addWave(f.x-24,-300);addWave(f.x+24,300)}
    }
    else if(f.st==='rest'){if(f.t>.7){f.st='back';f.t=0}}
    else{f.x+=(b.x-64-f.x)*(1-Math.exp(-dt*6));f.y+=(b.y+26-f.y)*(1-Math.exp(-dt*6));if(f.t>.6)b.f=null}
  }
  if(mode!=='play')return;

  if(r<.45){b.f={x:b.x-64,y:b.y+26,t:0,st:'aim',vy:0};b.stT=1.2;tone('sawtooth',160,300,0.5,0.12)}
  else if(r<.78){for(i=0;i<3;i++)lob(b.x-30,b.y-20,R.x+(i-1)*80+R.vx*.4,1.0+i*.15);b.stT=1.6;tone('square',200,120,0.14,0.1)}
  else{addMeteor(R.x+rnd(-80,-20));addMeteor(R.x+rnd(40,120));addMeteor(R.x+rnd(160,260));b.stT=2.2}
  if(b.hp<b.max*.4)b.stT*=.7;
}
/* STAGE 5 最終ボス：第1形態＝地上（低い突進斬り／3way×2／踏みつけ）、耐久半分で第2形態＝飛行（ビット射撃／掃射レーザー／全方位弾／隕石） */
function empBit(b,i){var a=b.t*1.4+i*TAU/3;return [b.x+Math.cos(a)*84,b.y+Math.sin(a)*52-10]}
function empVolley(b){var sp=220;aim(b.x-40,b.y-40,sp,-.22);aim(b.x-40,b.y-40,sp,0);aim(b.x-40,b.y-40,sp,.22);tone('square',300,180,0.12,0.1)}

  var tx=camX+W-125,ty=150+Math.sin(b.t*1.3)*50,rate=5;
  if(b.swD>0){b.swD-=dt;tx=R.x+122;ty=GROUND-96;rate=3;if(b.swD<=0)b.swT=rnd(4,5.5)}
  else if(mode==='play'&&!b.lz){b.swT-=dt;if(b.swT<=0){b.swD=1.8;tone('sawtooth',500,120,0.4,0.14)}}
  b.x+=(tx-b.x)*(1-Math.exp(-dt*rate));b.y+=(ty-b.y)*(1-Math.exp(-dt*4));
  if(b.lz){

    if(b.lz.t>1.15)b.lz=null;

  r=Math.random();
  if(r<.4){b.lz={y:Math.random()<.5?GROUND-70:GROUND-24,t:0,on:false};b.stT=2.0;tone('square',900,900,0.6,0.06)}
  else if(r<.75){for(i=0;i<12;i++){a=i/12*TAU+b.t;addShot(b.x,b.y,Math.cos(a)*170,Math.sin(a)*170)}b.stT=1.6;tone('square',300,180,0.12,0.1)}
  else{addMeteor(R.x+rnd(-60,40));addMeteor(R.x+rnd(120,240));b.stT=2.2}
}

function update(dt){
  time+=dt;
  if(mode==='title')runDemo(dt);
  if(mode==='over')overT+=dt; else updateRobot(dt);
  if(mode!=='over')updateFunnels(dt);
  if(mode==='clear')clearT+=dt;
  if(bannerT>0)bannerT-=dt;
  for(var pq=plats.length-1;pq>=0;pq--){if(plats[pq].a<1)plats[pq].a=Math.min(1,plats[pq].a+dt/1.2);if(plats[pq].x1<camX-60)plats.splice(pq,1)}

  var tx=R.x-(R.dir>0?210:270);
  if(tx>camX&&!boss){var nc=camX+(tx-camX)*(1-Math.exp(-dt*7));bgX+=nc-camX;camX=nc}
  if(mode==='play'){dist=Math.max(dist,(R.x-stageX0)/20);spawn(dt)}
  if(boss)updateBoss(dt);

  var i,j,e,b,dead;
  for(i=bullets.length-1;i>=0;i--){
    b=bullets[i];b.life-=dt;
    if(b.k===1){                                           /* ホーミング：近い敵へ曲がる */
      var bd=420*420,tx2=0,ty2=0,found=false,d2;
      for(j=0;j<ents.length;j++){e=ents[j];if(!e.tg)continue;
        var ex=e.x-b.x,ey=e.y+(e.top+e.bot)/2-b.y;d2=ex*ex+ey*ey;if(d2<bd){bd=d2;tx2=ex;ty2=ey;found=true}}
      if(boss&&boss.dead<=0){d2=(boss.x-b.x)*(boss.x-b.x)+(boss.y-b.y)*(boss.y-b.y);if(d2<bd){tx2=boss.x-b.x;ty2=boss.y-b.y;found=true}}
      if(found){
        var ca=Math.atan2(b.vy,b.vx),da=Math.atan2(ty2,tx2)-ca;
        while(da>Math.PI)da-=TAU;while(da<-Math.PI)da+=TAU;
        ca+=Math.max(-7.5*dt,Math.min(7.5*dt,da));b.vx=Math.cos(ca)*520;b.vy=Math.sin(ca)*520;
      }
    }
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    dead=b.life<=0||b.x<camX-30||b.x>camX+W+30||b.y>GROUND-1||b.y<-30;
    if(b.k===4){                                             /* 月光斬：敵も盾も貫通する */
      for(j=ents.length-1;j>=0;j--){
        e=ents[j];if(e.item||e.ng||e.w4===b.id)continue;
        if(Math.abs(b.x-e.x)<e.hw+26&&e.y+e.top<b.y+74&&e.y+e.bot>b.y-74){
          if(e.k==='shot'){ents.splice(j,1);continue}
          e.w4=b.id;if(e.k==='shield'&&e.sh>0)shBreak(e);
          e.hp-=b.d;e.flash=.08;puff(e.x,e.y+(e.top+e.bot)/2,5,'#b4ff5a',200,false);
          if(e.hp<=0){kill(e);ents.splice(j,1)}else sfx.hit();
        }
      }
      if(boss&&boss.dead<=0&&!b.bh&&Math.abs(b.x-boss.x)<boss.hw+26&&Math.abs(b.y-boss.y)<boss.hh+74){b.bh=true;hitBoss(b.d*2.5);impact(boss.x-40,boss.y)}
      if(dead)bullets.splice(i,1);
      continue;
    }
    for(j=0;j<ents.length&&!dead;j++){
      e=ents[j];if(!e.tg)continue;
      if(Math.abs(b.x-e.x)<e.hw+9&&b.y>e.y+e.top-4&&b.y<e.y+e.bot+4){
        if(e.k==='shield'&&e.sh>0&&b.vx>0&&b.x<e.x+6){            /* 正面の弾は盾が弾く */
          dead=true;e.sh-=b.d*.2;e.shf=.1;tone('square',1800,1500,0.03,0.05);puff(b.x,b.y,2,'#7af0ff',120,false);if(e.sh<=0)shBreak(e);continue;
        }
        dead=true;e.hp-=b.d;e.flash=0.08;
        if(e.hp<=0){kill(e);ents.splice(j,1)}else{sfx.hit();puff(b.x,b.y,3,'#fff6d0',150,false)}
      }
    }
    if(!dead&&boss&&boss.dead<=0&&boss.kind===2){              /* 要塞コアの回る盾 */
      for(j=0;j<2;j++){var pa=boss.t*1.7+j*Math.PI,px2=boss.x+Math.cos(pa)*78-b.x,py2=boss.y+Math.sin(pa)*78-b.y;
        if(px2*px2+py2*py2<19*19){dead=true;tone('square',1800,1500,0.03,0.05);puff(b.x,b.y,2,'#7af0ff',120,false)}}
    }
    if(!dead&&boss&&boss.dead<=0&&Math.abs(b.x-boss.x)<boss.hw+9&&Math.abs(b.y-boss.y)<boss.hh+5){
      dead=true;hitBoss(b.d);sfx.hit();puff(b.x,b.y,3,'#fff6d0',170,false);
    }
    if(dead)bullets.splice(i,1);
  }
  if(mode!=='over')specialHits(dt);

  var pb=pbox(),vul=mode==='play'&&R.inv<=0&&R.dashT<=0&&!R.moon&&!(R.rushT>0),rm;
  for(i=ents.length-1;i>=0;i--){
    e=ents[i];e.t+=dt;if(e.flash>0)e.flash-=dt;rm=false;
    if(e.k==='drone'){
      e.x+=e.vx*dt;e.y=e.by+Math.sin(e.t*3+e.seed)*e.amp;
      if(e.cd!==null&&mode==='play'){e.cd-=dt;if(e.cd<=0&&e.x<camX+W-10&&e.x>R.x+70){aim(e.x-10,e.y,175+lvl()*8);e.cd=rnd(1.8,3)}}
    }else if(e.k==='walker'){
      e.x+=e.vx*dt;
      if(mode==='play'){e.cd-=dt;if(e.cd<=0&&e.x<camX+W-10&&e.x>R.x+60){addShot(e.x-38,GROUND-72,-235,0);e.cd=2.3;tone('square',260,200,0.08,0.08)}}
    }else if(e.k==='meteor'){
      e.x+=e.vx*dt;e.y+=e.vy*dt;e.rot+=dt*5;
      if(Math.random()<.7)part(2,e.x+rnd(-4,4),e.y+rnd(-4,4),rnd(-20,20),rnd(-20,20),rnd(.3,.6),rnd(4,8),'#2a2050',0);
      if(e.y>=GROUND-8){
        boom(e.x,GROUND-10,1.6);shake(8,.32);puff(e.x,GROUND-4,10,'#c9bdf8',220,true);
        if(vul&&Math.abs(R.x-e.x)<48&&R.y>GROUND-60){hurt(e.x);vul=false}
        rm=true;
      }
    }else if(e.k==='shot'){
      e.vy+=e.g*dt;e.x+=e.vx*dt;e.y+=e.vy*dt;
      if(e.y>GROUND-2){puff(e.x,GROUND-3,3,'#ff4f8b',90,true);if(e.g){booms.push({x:e.x,y:GROUND-8,t:0,max:.25,s:.6})}rm=true}
      else if(e.y<-20||e.x>camX+W+60)rm=true;
    }else if(e.k==='ice'){
      e.y+=e.vy*dt;e.vy+=500*dt;
      if(e.y>=GROUND-6){puff(e.x,GROUND-6,10,'#eefcff',230,true);booms.push({x:e.x,y:GROUND-10,t:0,max:.25,s:.6});noise(0.1,0.2,5000,1200);rm=true}
    }else if(e.k==='vent'){                                   /* 排熱口：予告 → 火柱 */
      var vp=e.t%2.6;e.top=vp>2.0?-150:0;
      if(vp>2.0&&Math.random()<.5)part(1,e.x+rnd(-8,8),GROUND-rnd(10,140),rnd(-40,40),-rnd(100,300),.3,2,'#ffb238',0);
    }else if(e.k==='gate'){                                   /* レーザーゲート：消えている間に通る */
      e.top=(e.t%2.2)>1.2?-340:0;
    }else if(e.k==='shield'){
      e.x+=e.vx*dt;if(e.shf>0)e.shf-=dt;
    }else if(e.k==='hopper'){
      if(e.air){
        e.vy+=G*.62*dt;e.x+=e.vx*dt;e.y+=e.vy*dt;
        if(e.y>=GROUND){e.y=GROUND;e.air=false;e.cd=rnd(.45,1);puff(e.x,GROUND-2,4,'#c9bdf8',100,true)}
      }else if(mode==='play'){e.cd-=dt;if(e.cd<=0&&e.x<camX+W+20){e.air=true;e.vy=-rnd(520,690);e.vx=(R.x>e.x?1:-1)*rnd(150,240)}}
    }else if(e.k==='turret'){
      if(mode==='play'){e.cd-=dt;if(e.cd<=0&&e.x<camX+W-10&&e.x>camX+20&&Math.abs(R.x-e.x)>70){lob(e.x-14,GROUND-82,R.x+R.vx*.35,1.15);e.cd=rnd(1.7,2.5);e.rc=.2;tone('square',200,120,0.1,0.09)}}
      if(e.rc>0)e.rc-=dt;
    }else if(e.k==='wave'){
      e.x+=e.vx*dt;if(Math.random()<.6)part(0,e.x,GROUND-4,rnd(-40,40),-rnd(40,140),.3,rnd(2,4),'#ffd24a',0);
      if(e.x>camX+W+90)rm=true;
    }else if(e.k==='chip'){
      var cdx=R.x-e.x,cdy=R.y-40-e.y,cd2=cdx*cdx+cdy*cdy;
      if(mode!=='over'&&cd2<120*120){var ck=Math.min(1,dt*10);e.x+=cdx*ck;e.y+=cdy*ck;e.vx=e.vy=0}
      else if(!e.fl){e.vy+=900*dt;e.x+=e.vx*dt;e.y+=e.vy*dt;if(e.y>GROUND-9){e.y=GROUND-9;e.vy*=-.45;e.vx*=.7}}
      if(mode!=='over'&&cd2<30*30){gainChip();rm=true}else if(e.t>9&&!e.fl)rm=true;
    }else if(e.k==='cap'){
      e.y=e.by+Math.sin(e.t*4)*4;
      if(mode!=='over'&&hitP(e,pb)){R.hp=Math.min(mhp(),R.hp+1);pts+=50;sfx.pick();puff(e.x,e.y,10,'#3fe0d0',200,false);rm=true}
    }
    if(!rm&&e.x<camX-110)rm=true;
    if(!rm&&!e.item&&vul&&hitP(e,pb)){hurt(e.x);vul=false;if(e.k==='shot')rm=true}
    if(rm)ents.splice(i,1);
  }
  if(boss&&boss.dead<=0&&!(boss.intro>0)&&vul&&pb.x1>boss.x-boss.hw&&pb.x0<boss.x+boss.hw&&pb.y1>boss.y-boss.hh&&pb.y0<boss.y+boss.hh){hurt(boss.x);vul=false}
  if(boss&&boss.lz&&boss.lz.on&&vul&&pb.y0<boss.lz.y+7&&pb.y1>boss.lz.y-7){hurt(R.x+40);vul=false}
  if(boss&&boss.f&&vul&&(boss.f.st==='drop'||(boss.f.st==='rest'&&boss.f.t<.12))&&Math.abs(R.x-boss.f.x)<34&&pb.y0<boss.f.y+26&&pb.y1>boss.f.y-30)hurt(boss.f.x);

  for(i=parts.length-1;i>=0;i--){
    var o=parts[i];o.life-=dt;if(o.life<=0){parts.splice(i,1);continue}
    o.vy+=o.g*dt;o.x+=o.vx*dt;o.y+=o.vy*dt;
    if(o.k===3&&o.y>GROUND-2){o.y=GROUND-2;o.vy*=-.4;o.vx*=.6}
  }
  for(i=booms.length-1;i>=0;i--){booms[i].t+=dt;if(booms[i].t>=booms[i].max)booms.splice(i,1)}
  for(i=ghosts.length-1;i>=0;i--){
    var gh=ghosts[i];gh.life-=dt;
    if(gh.life<=0)ghosts.splice(i,1);
  }
  if(R.beamT>0)shake(5,.1);
  if(shakeT>0)shakeT-=dt; if(flashT>0)flashT-=dt; if(warnT>0)warnT-=dt;
  meteorStreak.t-=dt;
  if(meteorStreak.t<=0){meteorStreak.t=rnd(2.5,7);meteorStreak.life=.6;meteorStreak.x=rnd(120,620);meteorStreak.y=rnd(10,120)}
  if(meteorStreak.life>0)meteorStreak.life-=dt;
  if(mode==='over'&&overT>0.9&&el.ovl.hidden)showOvl('GAME OVER','機体大破',el.ovM.textContent,'もういちど');
}

/* ================= 描画 ================= */
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function fsk(g,f){g.fillStyle=f;g.fill();g.stroke()}
function limb(g,x0,y0,x1,y1,x2,y2,col){
  g.lineCap='round';g.lineJoin='round';
  g.beginPath();g.moveTo(x0,y0);g.lineTo(x1,y1);g.lineTo(x2,y2);
  g.strokeStyle=INK;g.lineWidth=12;g.stroke();g.strokeStyle=col;g.lineWidth=8.5;g.stroke();
  g.strokeStyle=INK;g.lineWidth=1.6;g.lineCap='butt';
}

function drawDrone(g,e){
  var hit=e.flash>0;
  g.save();g.translate(e.x,e.y);
  if(!LOW){g.globalCompositeOperation='lighter';spr(g,'pink',0,0,30,.45);spr(g,'fire',6,13,9+Math.sin(e.t*40)*2,.8);g.globalCompositeOperation='source-over'}
  g.lineWidth=1.6;g.strokeStyle=INK;g.lineJoin='round';
  path(g,[[-22,-3],[-31,-13],[-15,-4]],true);fsk(g,'#6b4a9c');
  path(g,[[22,-3],[31,-13],[15,-4]],true);fsk(g,'#6b4a9c');
  rr(g,-24,-4,48,7.5,3.5);fsk(g,hit?'#fff':'#3a2a66');
  g.beginPath();g.arc(0,0,13,0,TAU);fsk(g,hit?'#fff':'#9079c8');
  g.beginPath();g.arc(0,0,12.2,.25,Math.PI-.25);g.fillStyle='rgba(18,15,43,.38)';g.fill();
  g.beginPath();g.arc(-2.5,-.5,5.6,0,TAU);fsk(g,'#ff4f8b');
  g.fillStyle='#fff';g.fillRect(-5.5,-3.5,2.6,2.6);
  g.restore();
}
function drawWalker(g,e){
  var s=Math.sin(e.t*6),c=Math.cos(e.t*6),hit=e.flash>0,bob=Math.abs(s)*2.5;
  var A=hit?'#fff':'#a8437c',B=hit?'#fff':'#6e2a5c',C='#3a2a66';
  g.save();g.translate(e.x,e.y);
  g.fillStyle='rgba(0,0,0,.4)';g.beginPath();g.ellipse(0,6,26,5,0,0,TAU);g.fill();
  limb(g,7,-52+bob,2-10*s,-26,8-15*s,-4-Math.max(0,c)*9,B);
  rr(g,-4-15*s,-7-Math.max(0,c)*9,22,8,3);fsk(g,B);
  g.translate(0,bob);
  g.lineWidth=1.6;g.strokeStyle=INK;g.lineJoin='round';
  rr(g,10,-96,12,34,3);fsk(g,C);
  g.globalCompositeOperation='lighter';spr(g,'fire',24,-80,7+Math.sin(e.t*33)*2,.7);g.globalCompositeOperation='source-over';
  path(g,[[-17,-50],[15,-50],[20,-84],[9,-102],[-14,-102],[-24,-80]],true);fsk(g,A);
  path(g,[[-17,-50],[15,-50],[17,-62],[-20,-62]],true);fsk(g,B);
  rr(g,-14,-92,13,13,3);fsk(g,C);
  g.globalCompositeOperation='lighter';spr(g,'pink',-8,-86,9,.9);g.globalCompositeOperation='source-over';
  rr(g,-15,-121,26,20,7);fsk(g,A);
  rr(g,-17,-115,15,6,3);fsk(g,'#ff4f8b');
  g.beginPath();g.moveTo(6,-121);g.lineTo(12,-131);g.stroke();
  rr(g,-40,-89,32,11,4);fsk(g,C);
  rr(g,-45,-87,7,7,2);fsk(g,B);
  g.beginPath();g.arc(-6,-83,7.5,0,TAU);fsk(g,B);
  g.translate(0,-bob);
  limb(g,-7,-52+bob,-14+10*s,-26,-6+15*s,-4-Math.max(0,-c)*9,A);
  rr(g,-18+15*s,-7-Math.max(0,-c)*9,22,8,3);fsk(g,A);
  g.restore();
}
function drawSpike(g,e){
  var pl=.55+.3*Math.sin(e.t*5),gr;
  g.save();g.translate(e.x,e.y);
  g.globalCompositeOperation='lighter';spr(g,'pink',0,-12,34,pl);g.globalCompositeOperation='source-over';
  g.lineWidth=1.4;g.strokeStyle=INK;g.lineJoin='round';
  if(!(gr=GC.spike)){gr=GC.spike=g.createLinearGradient(0,-34,0,2);gr.addColorStop(0,'#ffd0e2');gr.addColorStop(.4,'#ff4f8b');gr.addColorStop(1,'#5a1d6a');}
  path(g,[[-17,2],[-12,-20],[-6,2]],true);fsk(g,gr);
  path(g,[[5,2],[13,-23],[18,2]],true);fsk(g,gr);
  path(g,[[-8,2],[-1,-34],[9,2]],true);fsk(g,gr);
  path(g,[[-1,-34],[2,2],[9,2]],true);g.fillStyle='rgba(60,10,70,.35)';g.fill();
  g.restore();
}
function drawMeteor(g,e){
  var i,u=Math.atan2(e.vy,e.vx);
  var T=Math.max(0,(GROUND-8-e.y)/e.vy),a=.35+.35*Math.sin(time*26);          /* 落下点の警告 */
  g.strokeStyle='rgba(255,79,139,'+a.toFixed(2)+')';g.lineWidth=2;
  g.beginPath();g.ellipse(e.lx,GROUND+4,14+T*30,3+T*5,0,0,TAU);g.stroke();
  g.fillStyle='rgba(255,79,139,'+(a*.5).toFixed(2)+')';g.beginPath();g.ellipse(e.lx,GROUND+4,12,2.6,0,0,TAU);g.fill();
  g.globalCompositeOperation='lighter';
  for(i=LOW?3:7;i>=1;i--)spr(g,'fire',e.x-Math.cos(u)*i*14,e.y-Math.sin(u)*i*14,22-i*2.2,.5-i*.055);
  spr(g,'amber',e.x,e.y,34,.9);spr(g,'white',e.x,e.y,17,1);
  g.globalCompositeOperation='source-over';
  g.save();g.translate(e.x,e.y);g.rotate(e.rot);
  g.lineWidth=1.4;g.strokeStyle=INK;path(g,[[-10,-3],[-3,-10],[7,-8],[11,1],[5,10],[-6,8]],true);fsk(g,e.flash>0?'#fff':'#5a3a52');
  path(g,[[-3,-10],[7,-8],[2,-1]],true);g.fillStyle='#ffb238';g.fill();
  g.restore();
}
function drawShot(g,e){
  g.globalCompositeOperation='lighter';spr(g,'pink',e.x,e.y,13,1);g.globalCompositeOperation='source-over';
  g.fillStyle='#fff';g.beginPath();g.arc(e.x,e.y,3,0,TAU);g.fill();

function drawCap(g,e){
  g.save();g.translate(e.x,e.y);
  g.globalCompositeOperation='lighter';spr(g,'teal',0,0,24,.6+.3*Math.sin(e.t*8));g.globalCompositeOperation='source-over';

function drawShieldE(g,e){
  var s=Math.sin(e.t*5),hit=e.flash>0,A=hit?'#fff':'#5a78c4',B=hit?'#fff':'#2f3f7c';
  g.save();g.translate(e.x,e.y);
  g.fillStyle='rgba(0,0,0,.4)';g.beginPath();g.ellipse(0,6,24,5,0,0,TAU);g.fill();

  if(e.sh>0){
    g.globalCompositeOperation='lighter';spr(g,'teal',-28,-56,40,e.shf>0?1:.45);g.globalCompositeOperation='source-over';

    path(g,[[-30,-108],[-37,-56],[-30,-4],[-28,-56]],true);g.fillStyle='rgba(20,40,90,.35)';g.fill();
  }

}
function drawHopper(g,e){
  var hit=e.flash>0,k=e.air?9:0,sq=e.air?1.08:1-.14*Math.max(0,Math.min(1,1-e.cd*4));
  g.save();g.translate(e.x,e.y);
  limb(g,-8,-14,-17,-8+k*.4,-13,-2+k,'#6b4a9c');limb(g,8,-14,17,-8+k*.4,13,-2+k,'#6b4a9c');
  g.lineWidth=1.6;g.strokeStyle=INK;g.lineJoin='round';

function drawBg(){

function drawFg(){
  var g=fc,i,o,u,b;
  g.setTransform(S,0,0,S,(shx-camX)*S,shy*S);
  for(i=0;i<parts.length;i++){
    o=parts[i];u=o.life/o.max;
    if(o.k===0){g.globalAlpha=u*.85;g.fillStyle=o.col;g.beginPath();g.arc(o.x,o.y,o.r,0,TAU);g.fill()}
    else if(o.k===2){g.globalAlpha=u*.45;g.fillStyle=o.col;g.beginPath();g.arc(o.x,o.y,o.r*(1.9-u),0,TAU);g.fill()}
    else if(o.k===3){g.globalAlpha=Math.min(1,u*2);g.fillStyle=o.col;g.fillRect(o.x-o.r,o.y-o.r,o.r*2,o.r*2)}
  }
  g.globalAlpha=1;g.globalCompositeOperation='lighter';g.lineCap='round';
  for(i=0;i<parts.length;i++){
    o=parts[i];if(o.k!==1)continue;u=o.life/o.max;
    g.globalAlpha=u;g.strokeStyle=o.col;g.lineWidth=o.r;g.beginPath();g.moveTo(o.x,o.y);g.lineTo(o.x-o.vx*.035,o.y-o.vy*.035);g.stroke();
  }
  g.globalAlpha=1;
  for(i=0;i<bullets.length;i++){
    b=bullets[i];
    if(b.k===4){
      var bd4=b.vx>0?1:-1,fa4=Math.min(1,b.life*4);
      spr(g,'teal',b.x,b.y,84,.5*fa4);g.globalAlpha=fa4;
      g.strokeStyle='#b4ff5a';g.lineWidth=10;g.beginPath();g.arc(b.x-bd4*46,b.y,84,bd4>0?-1.1:Math.PI-1.1,bd4>0?1.1:Math.PI+1.1);g.stroke();
      g.strokeStyle='#fff';g.lineWidth=3.5;g.beginPath();g.arc(b.x-bd4*46,b.y,84,bd4>0?-.95:Math.PI-.95,bd4>0?.95:Math.PI+.95);g.stroke();g.globalAlpha=1;
    }
    else if(b.k===1){spr(g,'teal',b.x,b.y,11,1);spr(g,'teal',b.x-b.vx*.02,b.y-b.vy*.02,8,.55);spr(g,'teal',b.x-b.vx*.04,b.y-b.vy*.04,5,.3);spr(g,'white',b.x,b.y,4,1)}
    else if(b.k===3){var bd3=b.vx>0?1:-1;spr(g,'amber',b.x,b.y,30,.8);g.strokeStyle='#fff6d0';g.lineWidth=4;g.globalAlpha=Math.min(1,b.life*6);g.beginPath();g.arc(b.x-bd3*18,b.y,26,bd3>0?-1:Math.PI-1,bd3>0?1:Math.PI+1);g.stroke();g.globalAlpha=1}
    else{var bd2=b.vx>0?1:-1;if(b.big)spr(g,'white',b.x,b.y,13,.8);spr(g,'amber',b.x,b.y,b.big?22:16,.9);if(!LOW){spr(g,'amber',b.x-bd2*16,b.y,10,.5);spr(g,'amber',b.x-bd2*30,b.y,7,.3)}}
  }
  if(mode!=='over'){
    var mz,cu;
    if(R.beamT>0){                                         /* ギャラクシー砲 */
      mz=muzzle();var fa=Math.min(1,R.beamT/.15)*Math.min(1,(BEAM-R.beamT)/.06),len=760,x0=R.dir>0?mz[0]:mz[0]-len,hh=(30+Math.sin(time*70)*5)*(1+.22*(plv()-1)),gr;
      g.globalAlpha=fa;
      gr=g.createLinearGradient(0,mz[1]-hh*1.8,0,mz[1]+hh*1.8);
      gr.addColorStop(0,'rgba(255,106,213,0)');gr.addColorStop(.25,'rgba(255,106,213,.55)');gr.addColorStop(.42,'rgba(122,240,255,.9)');
      gr.addColorStop(.5,'#ffffff');gr.addColorStop(.58,'rgba(122,240,255,.9)');gr.addColorStop(.75,'rgba(255,106,213,.55)');gr.addColorStop(1,'rgba(255,106,213,0)');
      g.fillStyle=gr;g.fillRect(x0,mz[1]-hh*1.8,len,hh*3.6);
      g.fillStyle='#fff';g.fillRect(x0,mz[1]-hh*.28,len,hh*.56);
      g.strokeStyle='rgba(255,255,255,.75)';g.lineWidth=2;
      for(o=0;o<6;o++){var rx=mz[0]+R.dir*((time*1100+o*127)%len);g.beginPath();g.ellipse(rx,mz[1],7,hh*1.25,0,0,TAU);g.stroke()}
      spr(g,'white',mz[0]+R.dir*10,mz[1],70+Math.sin(time*60)*8,1);spr(g,'pink',mz[0]+R.dir*10,mz[1],110,.7);
      g.globalAlpha=1;
    }
    if(plv()>=4)spr(g,TYPE===1?'amber':TYPE===2?'white':'teal',R.x,R.y-46,54+Math.sin(time*8)*5,.24);   /* 最終形態のオーラ */
    if(R.rushT>0){spr(g,'teal',R.x,R.y-44,70,.55);spr(g,'white',R.x+R.dir*26,R.y-44,28,.8)}
    if(R.chg>0.22&&R.beamT<=0&&!R.moon&&!(R.rushT>0)){          /* ため */
      cu=Math.min(1,R.chg/CHG);mz=TYPE===2?muzzle():[R.x,R.y-46];
      spr(g,TYPE===1?'amber':'teal',mz[0],mz[1],(12+34*cu)*(R.chgFull?1+.18*Math.sin(time*40):1),.9);
      if(R.chgFull)spr(g,'white',mz[0],mz[1],16,1);
      g.strokeStyle=TYPE===1?'#ffd24a':'#7af0ff';g.lineWidth=2;g.globalAlpha=.8;
      g.beginPath();g.arc(mz[0],mz[1],46-30*cu,0,TAU);g.stroke();g.globalAlpha=1;
    }
    var mb=meleeBox();
    if(mb&&R.atk.k==='s'){                                 /* 斬撃の弧 */
      var sp2=Math.min(1,R.atk.t/0.2),sa=-2.0+2.7*sp2,scx=R.x+R.dir*8,scy=R.y-(R.crouch?32:58);
      g.strokeStyle='#b4ff5a';g.lineWidth=11;g.globalAlpha=.75;g.beginPath();
      if(R.dir>0)g.arc(scx,scy,70,sa-1.1,sa);else g.arc(scx,scy,70,Math.PI-sa,Math.PI-sa+1.1);
      g.stroke();g.strokeStyle='#fff';g.lineWidth=3.5;g.beginPath();
      if(R.dir>0)g.arc(scx,scy,70,sa-.7,sa);else g.arc(scx,scy,70,Math.PI-sa,Math.PI-sa+.7);
      g.stroke();g.globalAlpha=1;

    }
    if(mb&&R.atk.k!=='s'){                                                /* 打撃の軌跡 */

      spr(g,'white',fx,fy,kk?30:22,1);spr(g,'amber',fx-R.dir*14,fy,kk?46:34,.8);
      g.strokeStyle='#fff6d0';g.lineWidth=kk?5:3.5;g.globalAlpha=.85;g.beginPath();
      if(kk)g.arc(R.x+R.dir*18,fy+(R.crouch?-4:10),58,R.dir>0?-1.05:Math.PI-.25,R.dir>0?.25:Math.PI+1.05);
      else{g.moveTo(fx-R.dir*46,fy);g.lineTo(fx+R.dir*6,fy)}
      g.stroke();g.globalAlpha=1;
    }
    if(R.moon){                                            /* ムーンサルトの三日月 */
      var ma=spinAngle()*D2R*R.dir-Math.PI/2;
      g.strokeStyle='#ffd24a';g.lineWidth=7;g.globalAlpha=.8;g.beginPath();g.arc(R.x,R.y-42,52,ma-1.5,ma+.2);g.stroke();
      g.strokeStyle='#fff';g.lineWidth=2.5;g.beginPath();g.arc(R.x,R.y-42,52,ma-1.0,ma+.2);g.stroke();g.globalAlpha=1;
      spr(g,'amber',R.x,R.y-42,62,.35);
    }
  }
  if(R.recoil>0.3&&mode!=='over'&&TYPE!==1&&TYPE!==3){var m=muzzle();spr(g,'white',m[0]+R.dir*6,m[1],26*R.recoil,.9)}
  for(i=0;i<booms.length;i++){
    o=booms[i];u=o.t/o.max;
    if(o.s===-1){g.globalAlpha=1-u;g.strokeStyle='#fff6d0';g.lineWidth=4*(1-u)+1;g.beginPath();g.arc(o.x,o.y,20+70*u,0,TAU);g.stroke();spr(g,'white',o.x,o.y,60*(1-u)+10,1-u);g.globalAlpha=1;continue}
    if(o.s===0){g.globalCompositeOperation='source-over';g.globalAlpha=1-u;g.strokeStyle='#3fe0d0';g.lineWidth=3;g.beginPath();g.ellipse(o.x,o.y,8+46*u,3+9*u,0,0,TAU);g.stroke();g.globalAlpha=1;g.globalCompositeOperation='lighter';continue}
    var rad=34*o.s;
    if(u<.25)spr(g,'white',o.x,o.y,rad*(1.6+u*4),1-u*3);
    spr(g,'fire',o.x,o.y,rad*(1+u*1.6),(1-u)*.95);
    spr(g,'amber',o.x,o.y,rad*(.7+u*.9),(1-u));
    g.globalAlpha=(1-u)*.8;g.strokeStyle='#fff6d0';g.lineWidth=3.5*(1-u)+.5;
    g.beginPath();g.arc(o.x,o.y,rad*(.5+u*2.3),0,TAU);g.stroke();g.globalAlpha=1;
  }
  g.globalCompositeOperation='source-over';
  if(mode!=='over')drawFunnels(g);
  for(i=0;i<bullets.length;i++){
    b=bullets[i];if(b.k===1||b.k===3||b.k===4)continue;
    rr(g,b.x-(b.vx>0?16:4),b.y-(b.k===2?2.2:b.big?4:3),b.big?24:20,b.k===2?4.4:b.big?8:6,2.2);g.fillStyle=b.k===2?'#ff6ad5':'#ffb238';g.fill();
    rr(g,b.x-4,b.y-1.5,8,3,1.5);g.fillStyle='#fff6d0';g.fill();
  }

  g.setTransform(S,0,0,S,0,0);
  if((R.dashT>0||R.rushT>0)&&mode!=='over'){                  /* ダッシュの集中線 */
    g.globalCompositeOperation='lighter';g.strokeStyle='rgba(190,240,255,.32)';

    g.globalCompositeOperation='source-over';
  }
  if(flashT>0){g.fillStyle='rgba(255,60,110,'+(flashT/.18*.38).toFixed(2)+')';g.fillRect(0,0,W,H)}
  if(boss&&boss.lz){                                          /* 要塞コアの掃射レーザー：予告線→照射 */
    var lz=boss.lz;
    if(!lz.on){
      g.strokeStyle='rgba(255,79,139,'+(.35+.35*Math.sin(time*40)).toFixed(2)+')';g.lineWidth=2;g.setLineDash([10,8]);
      g.beginPath();g.moveTo(0,lz.y);g.lineTo(W,lz.y);g.stroke();g.setLineDash([]);
      g.fillStyle='#ff4f8b';g.font='900 15px ui-monospace,Menlo,Consolas,monospace';g.textAlign='left';g.fillText(lz.y>GROUND-50?'▲ JUMP':'▼ DOWN',14,lz.y-8);
    }else{
      g.globalCompositeOperation='lighter';
      var lg=g.createLinearGradient(0,lz.y-22,0,lz.y+22);lg.addColorStop(0,'rgba(255,79,139,0)');lg.addColorStop(.35,'rgba(255,79,139,.8)');lg.addColorStop(.5,'#fff');lg.addColorStop(.65,'rgba(255,79,139,.8)');lg.addColorStop(1,'rgba(255,79,139,0)');
      g.fillStyle=lg;g.fillRect(0,lz.y-22,W,44);g.fillStyle='#fff';g.fillRect(0,lz.y-3,W,6);

    g.font='900 26px ui-monospace,Menlo,Consolas,"Hiragino Kaku Gothic ProN",sans-serif';g.textAlign='center';
    g.lineWidth=5;g.strokeStyle=INK;g.strokeText(bannerTxt,W/2,124);g.fillStyle='#3fe0d0';g.fillText(bannerTxt,W/2,124);g.globalAlpha=1;
  }
  if(boss&&boss.intro>0){                                   /* 登場演出：上下の黒帯 */
    var lb=22*Math.min(1,(INTRO-boss.intro)/.4)*Math.min(1,boss.intro/.3);
    g.fillStyle='#04020d';g.fillRect(0,0,W,lb);g.fillRect(0,H-lb,W,lb);

    g.strokeText(BOSSN[boss.kind],W/2,32);g.fillStyle='#ffd27a';g.fillText(BOSSN[boss.kind],W/2,32);

function f1(v){return v.toFixed(1)}
function render(){
  if(shakeT>0){var m=shakeMag*(shakeT/shakeDur);shx=(Math.random()*2-1)*m;shy=(Math.random()*2-1)*m}else{shx=shy=0;shakeMag=0}
  drawBg();drawRobotLayer(bc);drawFg();

  var sc=score(),dm=Math.floor(dist)+stage*10000+loopN*100000,i,hk=R.hp+mhp()*10,lk=TYPE*10+plv();
  if(sc!==lastScore){lastScore=sc;el.score.textContent=mode==='title'?'BEST '+best:String(sc)}
  if(dm!==lastDist){lastDist=dm;el.dist.textContent=mode==='title'?'':'STAGE '+(stage+1)+'　'+Math.floor(dist)+'m'}
  if(lk!==lastLv){lastLv=lk;nmEl.textContent=TYPES[TYPE].n+'　POW '+(plv()>=4?'MAX':'Lv'+plv())}
  if(hk!==lastHp){lastHp=hk;var s='';for(i=0;i<mhp();i++)s+='<i'+(i<R.hp?' class="on"':'')+'></i>';el.hp.innerHTML=s}
  var mk=mode==='title'?0:(keys.up?1:0)|(keys.down?2:0)|(keys.left?4:0)|(keys.right?8:0);
  if(mk!==dpMask){dpMask=mk;dpad.className='dpad'+(mk&1?' press-u':'')+(mk&2?' press-d':'')+(mk&4?' press-l':'')+(mk&8?' press-r':'')}
  {
    var cgv=R.spCD>0?Math.max(0,1-R.spCD/2.2):Math.min(1,R.chg/CHG),cgc='cg'+(R.spCD>0?' cd':R.chgFull?' full':'');
    var cgw=Math.round(cgv*50);if(cgw!==lastCg){lastCg=cgw;cgB.style.width=(cgw*2)+'%'}
    if(cgEl.className!==cgc)cgEl.className=cgc;
  }
}

var cgEl=$('cg'),cgB=$('cgB'),nmEl=$('nm'),lastLv=-1,lastCg=-1;
var last=0,slowT=0,fms=16;
function loop(ts){
  var raw=(ts-last)/1000||0.016,dt=Math.min(0.05,raw);last=ts;
  if(!paused){
    if(freeze>0)freeze-=dt;
    else if(dt>0.021){update(dt/2);update(dt/2)}             /* コマ落ちしてもゲームの速さは落とさない */
    else update(dt);
    if(raw<0.2){                                             /* 重い端末では内部解像度を自動で下げる */
      fms+=(raw*1000-fms)*0.06;
      if(fms>21){slowT+=raw;if(slowT>1.6){slowT=0;fms=16;if(S>1.5)setScale(1.5);else if(S>1)setScale(1);else LOW=true}}
      else if(slowT>0)slowT=Math.max(0,slowT-raw*.5);
    }
  }
  render();
  requestAnimationFrame(loop);
}
fit();setType(TYPE);
el.ovM.textContent='SELECTでロボを選んで START\n全5ステージ・ボスを倒して機体を強化せよ';
el.score.textContent='BEST '+best;lastScore=0;lastDist=0;el.dist.textContent='';
render();
requestAnimationFrame(loop);
/* 検証用フック（自動テストから状態を読む／無敵化してボスを早出しする） */
window.__game={
  state:function(){return {mode:mode,paused:paused,hp:R.hp,dist:dist,pts:pts,x:R.x,camX:camX,ents:ents.map(function(e){return e.k}).join(','),boss:boss?Math.round(boss.hp):null,parts:parts.length,stage:stage,loop:loopN,pw:pw,lv:plv(),maxHp:maxHp,score:score()}},
  stage:function(n){stage=n;setStageLook();dist=0;stageX0=R.x;nextBoss=STG[n].boss},
  pow:function(n){pw=n},killBoss:function(){hitBoss(1e9)},hurtBoss:function(f){if(boss)hitBoss(boss.max*f)},add:function(k){({shield:addShield,hopper:addHopper,turret:addTurret,vent:addVent,gate:addGate,ice:addIcicle})[k](camX+(arguments[1]||W-140))},
  plats:function(){return plats.map(function(p){return [Math.round(p.x0-camX),Math.round(p.x1-camX),p.y]})},robo:function(){return {x:Math.round(R.x-camX),y:Math.round(R.y),ground:R.ground,plat:!!R.plat,intro:boss?boss.intro:null,bx:boss?Math.round(boss.x-camX):null}},
  cheat:function(bossAt,inv,hp){nextBoss=bossAt;R.inv=inv;if(hp)R.hp=hp},
  hold:function(t){freeze=t},scale:function(){return {S:S,LOW:LOW,fms:Math.round(fms)}},
  type:function(){return TYPE},atk:function(){return R.atk?R.atk.k:(R.moon?'moon':R.beamT>0?'beam':'')}
};
})();
