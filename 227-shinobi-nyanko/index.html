<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>しのびニャンコ ｜ おさかな大作戦</title>
<style>
  :root{
    --night:#141026;      /* 部屋の暗がり */
    --floor:#241d3a;      /* 床 */
    --floor2:#2b2244;
    --wall:#0d0a1a;       /* 壁・家具 */
    --lamp:#f5b95c;       /* ランプの光 */
    --fish:#7fe0e8;       /* おさかな */
    --danger:#ff5d7a;     /* 見つかった */
    --cream:#f6e6c9;      /* ニャンコ */
    --ink:#efe7ff;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%}
  body{
    background:
      radial-gradient(120% 80% at 50% 0%, #2a1f45 0%, var(--night) 60%, #0b0817 100%);
    color:var(--ink);
    font-family:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN","Yu Gothic","游ゴシック体",-apple-system,sans-serif;
    overflow:hidden;overscroll-behavior:none;touch-action:none;
  }
  /* ---- iOS 75/25 シェル ---- */
  #game-shell{position:fixed;inset:0;width:100%;height:100%;height:100dvh;
    display:grid;grid-template-rows:minmax(0,1fr) clamp(132px,25vh,210px);
    padding-top:env(safe-area-inset-top)}
  #game-stage{min-height:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:10px;overflow:hidden}
  #screen-wrap{position:relative;width:min(100%,calc((75dvh - env(safe-area-inset-top))*4/3));
    max-width:760px;aspect-ratio:4/3}
  #hud{width:min(100%,760px);padding:0 12px;display:flex;align-items:center;gap:8px;font-size:15px;line-height:1}
  #stage{font-weight:700;letter-spacing:.02em;white-space:nowrap}
  #stage small{opacity:.6;font-weight:400}
  #bar{flex:1;height:16px;border-radius:8px;background:#0d0a1a;overflow:hidden;position:relative;box-shadow:inset 0 0 0 1px #ffffff1a}
  #barfill{height:100%;width:100%;background:linear-gradient(90deg,#ff9f43,#ffd86b);transition:width .12s linear}
  #barfill.low{background:linear-gradient(90deg,#ff3d5f,#ff8a5c);animation:pulse .6s infinite alternate}
  @keyframes pulse{to{filter:brightness(1.45)}}
  #fishcount{white-space:nowrap;font-weight:700;color:var(--fish)}
  #screen{position:absolute;inset:0;border-radius:14px;overflow:hidden;box-shadow:0 18px 40px #0008, inset 0 0 0 1px #ffffff14}
  canvas{display:block;width:100%;height:100%;image-rendering:auto;background:var(--night);touch-action:none}
  #overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;text-align:center;padding:24px;background:#0b0817e6;backdrop-filter:blur(3px);
    pointer-events:none}
  #overlay button{pointer-events:auto}
  #overlay.hide{display:none}
  #overlay h1{font-size:clamp(22px,5.4vw,34px);letter-spacing:.04em;line-height:1.25}
  #overlay h1 .sub{display:block;font-size:.44em;opacity:.72;margin-top:8px;letter-spacing:.12em}
  #overlay p{font-size:clamp(12px,3.2vw,15px);line-height:1.85;opacity:.86;max-width:34em}
  #overlay .keys{font-size:12px;opacity:.6;line-height:1.9}
  button{
    font:inherit;font-weight:700;font-size:16px;color:#211636;
    background:linear-gradient(180deg,#ffd98a,#f5b95c);
    border:none;border-radius:999px;padding:13px 34px;cursor:pointer;
    box-shadow:0 6px 0 #b57f2e, 0 12px 24px #0007;
  }
  button:active{transform:translateY(4px);box-shadow:0 2px 0 #b57f2e,0 6px 14px #0007}
  button:focus-visible{outline:3px solid var(--fish);outline-offset:3px}
  #foot{width:min(100%,760px);padding:0 12px;display:flex;justify-content:space-between;align-items:center;font-size:12px;opacity:.55}
  .toast{position:absolute;left:50%;top:16%;transform:translateX(-50%);
    font-size:clamp(16px,4.6vw,24px);font-weight:700;letter-spacing:.08em;
    color:var(--danger);text-shadow:0 0 18px #ff5d7a88;pointer-events:none;opacity:0}
  @media (prefers-reduced-motion: reduce){#barfill.low{animation:none}}

  /* ---- iOS 仮想コントローラ（下25%） ---- */
  #control-deck{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:10px max(14px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom))

    border-top:1px solid #f5b95c2e;
    background:linear-gradient(180deg,#171029,#0b0817);overflow:hidden}
  .dpad{position:relative;width:min(38vw,140px);height:min(38vw,140px);flex-shrink:0;touch-action:none;
    background:

    border-radius:16px;box-shadow:inset 0 0 0 2px #6b5590,0 4px 0 #07050f}
  .dpad .arr{position:absolute;color:var(--ink);font-size:15px;opacity:.5;pointer-events:none}
  .dpad .arr.u{top:6%;left:50%;transform:translateX(-50%)}
  .dpad .arr.d{bottom:6%;left:50%;transform:translateX(-50%)}
  .dpad .arr.l{left:8%;top:50%;transform:translateY(-50%)}
  .dpad .arr.r{right:8%;top:50%;transform:translateY(-50%)}
  .dpad.press-u .arr.u,.dpad.press-d .arr.d,
  .dpad.press-l .arr.l,.dpad.press-r .arr.r{opacity:1;color:var(--lamp)}
  .dpad-nub{position:absolute;left:50%;top:50%;width:26%;height:26%;border-radius:50%;
    background:#1d1633;transform:translate(-50%,-50%);pointer-events:none;border:1px solid #6b5590}
  .action-controls{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:10px;flex:1}
  .game-btn{min-width:96px;min-height:82px;border-radius:50%;padding:8px 12px;
    color:#211636;background:linear-gradient(180deg,#ffd98a,#f5b95c);
    border:2px solid #b57f2e;box-shadow:0 5px 0 #7d5518,0 8px 18px #0007;
    font-size:15px;font-weight:700;line-height:1.1;touch-action:none;
    transition:transform .08s ease,opacity .08s ease}
  .game-btn small{display:block;margin-top:3px;font-size:10px;letter-spacing:.08em;opacity:.7}
  .game-btn:active,.game-btn.pressed{transform:scale(.93) translateY(3px);
    box-shadow:0 1px 0 #7d5518;background:linear-gradient(180deg,#ff9f43,#e07c2c)}
  .deck-note{font-size:10px;opacity:.45;letter-spacing:.04em;text-align:right;line-height:1.5}
</style>
</head>

      <button id="btn">はじめる</button>
    </div>

</div>

   操作の中では resume() と無音1サンプルだけ流す（iOSのunlock要件はこれで満たす） */
function ensureCtx(){
  if(!ac){ try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  return ac;
}
setTimeout(ensureCtx, 0);
function unlockAudio(){
  if(audioReady) return;
  const c = ensureCtx(); if(!c) return;
  try{
    if(c.state==="suspended") c.resume();
    const b=c.createBuffer(1,1,22050), src=c.createBufferSource();
    src.buffer=b; src.connect(c.destination); src.start(0);
    audioReady = true;
  }catch(e){}

    if(!ensureCtx()) return;
    if(ac.state==="suspended") ac.resume();
    const o=ac.createOscillator(), g=ac.createGain();
    o.type=type; o.frequency.setValueAtTime(freq, ac.currentTime);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, ac.currentTime+dur);
    g.gain.setValueAtTime(vol, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime+dur);
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime+dur+.02);
  }catch(e){}
}
const sfxFish  = ()=>{ beep(680,.10,"triangle",.18,980); setTimeout(()=>beep(880,.14,"triangle",.14,1180),80); };

/* ============ 状態 ============ */
const S = { TITLE:0, PLAY:1, CLEAR:2, OVER:3, ALLCLEAR:4 };
let state = S.TITLE;
let lv = 0, grid = [], items = [], humans = [], door = {x:0,y:0}, start = {x:0,y:0};
let cat = {x:0,y:0,vx:0,vy:0,face:-Math.PI/2,spd:0,step:0,hidden:false,flash:0};
let hunger = HUNGER_MAX, fishNeed = 0, fishGot = 0, grace = 0, shake = 0, elapsed = 0, totalFish = 0;
let last = 0, toastT = 0;

/* ============ 入力 ============ */

let touch = {on:false, ox:0, oy:0, dx:0, dy:0};
function tPos(e){ const r=cv.getBoundingClientRect(); const t=e.changedTouches?e.changedTouches[0]:e;
  return {x:(t.clientX-r.left)/r.width*CW, y:(t.clientY-r.top)/r.height*CH}; }
cv.addEventListener('touchstart', e=>{ e.preventDefault(); unlockAudio(); const p=tPos(e); touch={on:true,ox:p.x,oy:p.y,dx:0,dy:0}; }, {passive:false});
cv.addEventListener('touchmove',  e=>{ e.preventDefault(); if(!touch.on)return; const p=tPos(e); touch.dx=p.x-touch.ox; touch.dy=p.y-touch.oy; }, {passive:false});

const elDpad = document.getElementById('dpad');
const elDash = document.getElementById('cv-dash');
const pad = {on:false, x:0, y:0};
let dashHold = false;

function padSet(e){
  const r = elDpad.getBoundingClientRect();
  const t = e.changedTouches ? e.changedTouches[0] : e;
  const dx = (t.clientX - (r.left + r.width/2)) / (r.width/2);
  const dy = (t.clientY - (r.top  + r.height/2)) / (r.height/2);
  const l = Math.hypot(dx,dy);
  if(l < 0.2){ padClear(); return; }
  pad.on = true; pad.x = dx/l; pad.y = dy/l;
  elDpad.classList.toggle('press-u', pad.y < -0.38);
  elDpad.classList.toggle('press-d', pad.y >  0.38);
  elDpad.classList.toggle('press-l', pad.x < -0.38);
  elDpad.classList.toggle('press-r', pad.x >  0.38);
}
function padClear(){
  pad.on=false; pad.x=pad.y=0;
  elDpad.classList.remove('press-u','press-d','press-l','press-r');
}
elDpad.addEventListener('touchstart', e=>{ e.preventDefault(); unlockAudio(); padSet(e); }, {passive:false});
elDpad.addEventListener('touchmove',  e=>{ e.preventDefault(); padSet(e); }, {passive:false});

function dashOn(e){ if(e) e.preventDefault(); unlockAudio(); dashHold=true;  elDash.classList.add('pressed'); }
function dashOff(e){ if(e) e.preventDefault(); dashHold=false; elDash.classList.remove('pressed'); }

function readInput(){
  let ix=0, iy=0, mag=1;
  if(keys.arrowleft||keys.a) ix-=1;
  if(keys.arrowright||keys.d) ix+=1;
  if(keys.arrowup||keys.w) iy-=1;
  if(keys.arrowdown||keys.s) iy+=1;
  if(ix||iy){
    const l=Math.hypot(ix,iy); ix/=l; iy/=l;
    mag = (keys.shift) ? 1 : 0.45;
    return {x:ix,y:iy,mag};
  }
  if(pad.on){
    return {x:pad.x, y:pad.y, mag: dashHold ? 1 : 0.45};
  }
  if(touch.on){
    const l=Math.hypot(touch.dx,touch.dy);
    if(l>10){
      const dead=10, full=68;
      mag = Math.min(1, (l-dead)/(full-dead));
      if(dashHold) return {x:touch.dx/l, y:touch.dy/l, mag:1};
      return {x:touch.dx/l, y:touch.dy/l, mag:Math.max(.28,mag)};
    }
  }
  return {x:0,y:0,mag:0};
}

/* ============ ステージ構築 ============ */
function buildLevel(n){
  const L = LEVELS[n];
  TH = THEMES[n] || THEMES[0];
  grid = L.map.map(r => (r+"################").slice(0,W).split(''));
  while(grid.length<H) grid.push("################".split(''));
  items = []; fishNeed = 0; fishGot = 0;
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    const c = grid[y][x];
    if(c==='F'){ items.push({x:x*T+T/2,y:y*T+T/2,t:'fish',got:false,bob:Math.random()*6}); fishNeed++; grid[y][x]='.'; }
    if(c==='s'){ items.push({x:x*T+T/2,y:y*T+T/2,t:'snack',got:false,bob:Math.random()*6}); grid[y][x]='.'; }
    if(c==='D'){ door={x:x*T+T/2,y:y*T+T/2}; grid[y][x]='.'; }
    if(c==='C'){ start={x:x*T+T/2,y:y*T+T/2}; grid[y][x]='.'; }
  }
  humans = L.humans.map(h=>({
    path:h.path.map(p=>({x:p[0]*T+T/2, y:p[1]*T+T/2})),
    i:0, dir:1, x:h.path[0][0]*T+T/2, y:h.path[0][1]*T+T/2,
    sp:h.sp, range:h.range*T, half:0.62, ang:0, targetAng:0,
    sus:0, mode:'walk', timer:1+Math.random()*2, bob:Math.random()*10
  }));
  resetCat();
  elStage.textContent = `${n+1}/${LEVELS.length}　${L.name}`;
  updateHUD();
}
function resetCat(){
  cat.x=start.x; cat.y=start.y; cat.vx=cat.vy=0; cat.face=-Math.PI/2; cat.spd=0; cat.hidden=false;
  humans.forEach(h=>{ h.i=0; h.dir=1; h.x=h.path[0].x; h.y=h.path[0].y; h.sus=0; h.mode='walk'; h.timer=1+Math.random()*2; });
  grace = GRACE;
}
const isWall = (tx,ty) => tx<0||ty<0||tx>=W||ty>=H || grid[ty][tx]==='#';
const wallAtPx = (px,py) => isWall(Math.floor(px/T), Math.floor(py/T));
const tileChar = (px,py) => { const tx=Math.floor(px/T), ty=Math.floor(py/T);
  return (tx<0||ty<0||tx>=W||ty>=H)?'#':grid[ty][tx]; };

/* ============ 更新 ============ */
function update(dt){
  if(state!==S.PLAY) return;
  elapsed += dt;
  if(grace>0) grace -= dt;
  if(cat.flash>0) cat.flash -= dt;
  if(shake>0) shake = Math.max(0, shake-dt*3);
  if(toastT>0){ toastT-=dt; elToast.style.opacity = Math.min(1,toastT*2); }

  /* ネコ */
  const inp = readInput();
  const speed = SNEAK + (RUN-SNEAK)*Math.max(0,(inp.mag-0.45)/0.55);
  const vx = inp.mag>0 ? inp.x*speed : 0;
  const vy = inp.mag>0 ? inp.y*speed : 0;
  cat.spd = Math.hypot(vx,vy);
  if(cat.spd>4){ cat.face = Math.atan2(vy,vx); cat.step += cat.spd*dt*0.05; }

  const r = 12;
  let nx = cat.x + vx*dt;
  if(!wallAtPx(nx-r,cat.y-r+3)&&!wallAtPx(nx+r,cat.y-r+3)&&!wallAtPx(nx-r,cat.y+r)&&!wallAtPx(nx+r,cat.y+r)) cat.x=nx;
  let ny = cat.y + vy*dt;
  if(!wallAtPx(cat.x-r,ny-r+3)&&!wallAtPx(cat.x+r,ny-r+3)&&!wallAtPx(cat.x-r,ny+r)&&!wallAtPx(cat.x+r,ny+r)) cat.y=ny;
  cat.hidden = tileChar(cat.x,cat.y)==='h';

  /* おなか */
  hunger -= (cat.spd>SNEAK*1.15 ? DRAIN_RUN : DRAIN_WALK)*dt;
  if(hunger<=0){ hunger=0; gameOver(); return; }

  /* アイテム */
  for(const it of items){
    if(it.got) continue;
    if(Math.hypot(it.x-cat.x,it.y-cat.y) < 22){
      it.got = true;
      if(it.t==='fish'){ fishGot++; totalFish++; hunger=Math.min(HUNGER_MAX,hunger+FISH_FEED); sfxFish(); toast("いただき！","#7fe0e8"); }
      else { hunger=Math.min(HUNGER_MAX,hunger+SNACK_FEED); sfxSnack(); }
      updateHUD();
    }
  }

  /* 人間 */
  const stealth = 0.58 + 0.72*(cat.spd/RUN);
  for(const h of humans){
    h.bob += dt*6;
    h.timer -= dt;
    if(h.timer<=0){
      if(h.mode==='walk'){ h.mode = Math.random()<0.45 ? 'phone' : 'scan'; h.timer = 1.4+Math.random()*2.2; }
      else { h.mode='walk'; h.timer = 2.6+Math.random()*3.4; }
    }
    if(h.mode==='walk'){
      const tgt = h.path[h.i];
      const dx=tgt.x-h.x, dy=tgt.y-h.y, d=Math.hypot(dx,dy);
      if(d<3){
        h.i += h.dir;
        if(h.i>=h.path.length){ h.i=h.path.length-2>=0?h.path.length-2:0; h.dir=-1; }
        if(h.i<0){ h.i=Math.min(1,h.path.length-1); h.dir=1; }
      }else{
        h.x += dx/d*h.sp*dt; h.y += dy/d*h.sp*dt;
        h.targetAng = Math.atan2(dy,dx);
      }
    }else if(h.mode==='scan'){
      h.targetAng += dt*0.9;
    }
    /* 視線を向ける */
    let da = ((h.targetAng - h.ang + Math.PI*3)%(Math.PI*2)) - Math.PI;
    h.ang += da*Math.min(1, dt*5);

    /* 発見判定 */
    const range = h.range * (h.mode==='phone'?0.5:1) * stealth;
    const half  = h.half * (h.mode==='phone'?0.55:1);
    const dx=cat.x-h.x, dy=cat.y-h.y, dist=Math.hypot(dx,dy);
    let seen = false;
    if(grace<=0 && !cat.hidden && dist<range){
      const a = Math.atan2(dy,dx);
      let diff = Math.abs(((a-h.ang+Math.PI*3)%(Math.PI*2))-Math.PI);
      if(diff<half || dist<T*1.15) seen = los(h.x,h.y,cat.x,cat.y);
    }
    if(seen){
      h.sus += dt*(52 + 60*(1-dist/Math.max(1,range)));
      h.targetAng = Math.atan2(dy,dx);
      if(h.sus>45 && h.mode!=='walk'){ h.mode='walk'; h.timer=3; }
      if(h.sus>=100){ caught(); return; }
    }else{
      h.sus = Math.max(0, h.sus - dt*46);
    }
  }

  /* おうち */
  if(Math.hypot(door.x-cat.x, door.y-cat.y) < 25){
    if(fishGot>=fishNeed) clearStage();
    else if(toastT<=0) toast(`おさかな あと ${fishNeed-fishGot}`, "#ffd86b");
  }
  updateHUD();
}

function los(x0,y0,x1,y1){
  const dx=x1-x0, dy=y1-y0, d=Math.hypot(dx,dy), steps=Math.ceil(d/6);
  for(let i=1;i<steps;i++){
    const t=i/steps;
    if(wallAtPx(x0+dx*t, y0+dy*t)) return false;
  }
  return true;
}

function toast(msg,color){ elToast.textContent=msg; elToast.style.color=color||"#ff5d7a"; elToast.style.opacity=1; toastT=1.1; }

function caught(){
  sfxSpot(); shake=1; cat.flash=0.7;
  hunger = Math.max(0, hunger - CAUGHT_COST);
  toast("見つかった！","#ff5d7a");
  if(hunger<=0){ gameOver(); return; }
  resetCat();
}

function updateHUD(){
  elBar.style.width = (hunger/HUNGER_MAX*100).toFixed(1)+"%";
  elBar.classList.toggle('low', hunger < 30);
  elFish.textContent = `🐟 ${fishGot}/${fishNeed}`;
}

/* ============ 画面遷移 ============ */
function show(html, label){
  overlay.innerHTML = html + `<button id="btn">${label}</button>`;
  overlay.classList.remove('hide');
  document.getElementById('btn').onclick = primary;
}
function primary(){
  unlockAudio();
  if(state===S.TITLE || state===S.OVER || state===S.ALLCLEAR){
    if(state!==S.TITLE){ lv=0; totalFish=0; }
    hunger = HUNGER_MAX; elapsed = 0;
    buildLevel(lv); state=S.PLAY; overlay.classList.add('hide');
  }else if(state===S.CLEAR){
    lv++; buildLevel(lv); state=S.PLAY; overlay.classList.add('hide');
  }
}
function clearStage(){
  sfxClear();
  if(lv >= LEVELS.length-1){
    state = S.ALLCLEAR;
    elBest.textContent = `記録：${elapsed.toFixed(1)}秒 ／ おさかな ${totalFish}`;
    show(`<h1>おかえり、ニャンコ<span class="sub">ALL CLEAR</span></h1>
      <p>10の夜をぜんぶ抜けて、寝床にたどり着いた。<br>
      おさかな ${totalFish}匹、通しタイム ${elapsed.toFixed(1)}秒。<br>
      あしたの夜も、たぶんおなかは空く。</p>`, "もういちど");
  }else{
    state = S.CLEAR;
    const nx = LEVELS[lv+1];
    show(`<h1>ステージ ${lv+1} クリア<span class="sub">寝床にたどり着いた</span></h1>
      <p>おさかな ${fishNeed}匹、しっかり回収。おなかは ${Math.round(hunger)}％。<br>
      つぎは「${nx.name}」。${nx.note}。</p>`, "つぎの部屋へ");
  }
}
function gameOver(){
  sfxOver(); state=S.OVER;
  show(`<h1>おなかがぺこぺこ<span class="sub">GAME OVER</span></h1>
    <p>${LEVELS[lv].name} で力尽きた。おさかな ${totalFish}匹。<br>
    走るとバレにくい代わりに、おなかは倍速で減る。<br>
    かくれ場所（その場所ごとの物かげ）は視線を完全に切れる。</p>`, "もういちど");
}

/* ============ 描画 ============ */
function draw(){
  ctx.save();
  if(shake>0){ const s=shake*7; ctx.translate((Math.random()-.5)*s,(Math.random()-.5)*s); }

  /* 床・構築物（ステージごとに変わる） */
  ctx.fillStyle = TH.bg; ctx.fillRect(0,0,CW,CH);
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    if(grid[y][x]==='#') drawWallTile(x,y); else drawFloorTile(x,y);
  }
  /* かくれ場所 */
  for(let y=0;y<H;y++) for(let x=0;x<W;x++) if(grid[y][x]==='h') drawHide(x*T+T/2, y*T+T/2);

  /* 寝床 */
  drawDoor(door.x, door.y);

  /* 視界 */
  humans.forEach(drawCone);

  /* アイテム */
  for(const it of items){ if(!it.got) drawItem(it); }

  /* 人間 */
  humans.forEach(drawHuman);

  /* ネコ */
  drawCat();

  /* 暗がりのビネット */
  const g = ctx.createRadialGradient(CW/2,CH/2,CH*0.3, CW/2,CH/2,CH*0.86);
  g.addColorStop(0,"#00000000"); g.addColorStop(1,TH.vig);
  ctx.fillStyle=g; ctx.fillRect(0,0,CW,CH);

  if(grace>0 && state===S.PLAY){
    ctx.globalAlpha = Math.min(1,grace);
    ctx.fillStyle="#f6e6c9"; ctx.font="bold 17px system-ui"; ctx.textAlign="center";
    ctx.fillText("そーっと…", cat.x, cat.y-34);
    ctx.globalAlpha=1;
  }
  ctx.restore();
}

/* ---- 床：ステージごとの地面 ---- */
function drawFloorTile(x,y){
  const px=x*T, py=y*T, h=hsh(x,y);
  ctx.fillStyle = ((x+y)%2===0) ? TH.f1 : TH.f2;
  ctx.fillRect(px,py,T,T);
  switch(TH.floor){
    case 'rug':   /* リビング：中央にラグ */
      if(x>4&&x<11&&y>4&&y<9){ ctx.fillStyle="#ffffff08"; ctx.fillRect(px,py,T,T); }
      break;
    case 'wood':  /* 食卓：フローリング */
      ctx.fillStyle="#00000026"; ctx.fillRect(px,py+T-3,T,2);
      ctx.fillStyle="#ffffff08"; ctx.fillRect(px+(h%3)*13,py+4,2,T-8);
      break;
    case 'wet':   /* 魚市場：濡れたコンクリと水たまり */
      if(h%6===0){ ctx.fillStyle="#7fe0e81a"; ctx.beginPath();
        ctx.ellipse(px+T/2,py+T/2,13,7,0,0,7); ctx.fill(); }
      ctx.strokeStyle="#00000030"; ctx.lineWidth=1; ctx.strokeRect(px+.5,py+.5,T-1,T-1);
      break;
    case 'pave':  /* 商店街：石畳 */
      ctx.strokeStyle="#ffffff0a"; ctx.lineWidth=1;
      ctx.strokeRect(px+.5,py+.5,T/2-1,T-1); ctx.strokeRect(px+T/2+.5,py+.5,T/2-1,T-1);
      break;
    case 'lino':  /* 学校：リノリウムの目地 */
      ctx.strokeStyle="#ffffff0c"; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(px+T,py); ctx.lineTo(px+T,py+T);
      ctx.moveTo(px,py+T); ctx.lineTo(px+T,py+T); ctx.stroke();
      break;
    case 'plank': /* 港：木の桟橋 */
      ctx.fillStyle="#00000038"; ctx.fillRect(px,py+12,T,2); ctx.fillRect(px,py+26,T,2);
      ctx.fillStyle="#ffffff0a"; ctx.fillRect(px,py+14,T,1);
      if(h%9===0){ ctx.fillStyle="#00000055"; ctx.fillRect(px+6,py+18,3,3); }
      break;
    case 'deck':  /* 船：鉄板とリベット */
      ctx.strokeStyle="#ffffff0c"; ctx.lineWidth=1; ctx.strokeRect(px+2.5,py+2.5,T-5,T-5);
      ctx.fillStyle="#ffffff14";
      [6,T-7].forEach(a=>[6,T-7].forEach(b=>ctx.fillRect(px+a,py+b,2,2)));
      break;
    case 'aqua':  /* 水族館：水の揺らぎ */
      { const w=Math.sin((px*0.05+py*0.03)+performance.now()/1100);
        ctx.fillStyle=`rgba(127,224,232,${(0.05+0.045*w).toFixed(3)})`; ctx.fillRect(px,py,T,T); }
      break;
    case 'sand':  /* 砂漠：風紋 */
      ctx.strokeStyle="#ffffff0d"; ctx.lineWidth=1.5; ctx.beginPath();
      ctx.moveTo(px, py+9+(h%7));
      ctx.quadraticCurveTo(px+T/2, py+3+(h%9), px+T, py+11+(h%6));
      ctx.stroke();
      if(h%11===0){ ctx.fillStyle="#00000030"; ctx.beginPath();
        ctx.ellipse(px+T/2,py+T-8,7,3,0,0,7); ctx.fill(); }
      break;
  }
}

/* ---- 構築物：ステージごとに「置いてあるもの」を変える ---- */
function drawWallTile(x,y){
  const px=x*T, py=y*T, h=hsh(x,y);
  ctx.fillStyle = TH.w1; ctx.fillRect(px,py,T,T);
  switch(TH.wall){
    case 'counter': /* キッチン：調理台と引き出し */
      ctx.fillStyle="#ffffff16"; ctx.fillRect(px,py,T,4);
      ctx.strokeStyle="#ffffff10"; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(px+T/2,py+8); ctx.lineTo(px+T/2,py+T-5); ctx.stroke();
      ctx.fillStyle="#ffffff1c"; ctx.fillRect(px+8,py+15,7,2); ctx.fillRect(px+T-15,py+15,7,2);
      break;
    case 'sofa':    /* リビング：ソファと棚 */
      ctx.fillStyle="#ffffff12"; ctx.fillRect(px+2,py+5,T-4,T-9);
      ctx.strokeStyle="#00000055"; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(px+T/2,py+7); ctx.lineTo(px+T/2,py+T-7); ctx.stroke();
      ctx.fillStyle="#ffffff08"; ctx.fillRect(px+2,py+3,T-4,3);
      break;
    case 'table':   /* 食卓：テーブルクロスと木肌 */
      ctx.fillStyle="#ffffff10"; ctx.fillRect(px,py+2,T,T-4);
      ctx.fillStyle=TH.acc+"22"; ctx.fillRect(px,py+2,T,4);
      ctx.strokeStyle="#00000044"; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(px,py+T-6); ctx.lineTo(px+T,py+T-6); ctx.stroke();
      break;
    case 'crate':   /* 魚市場：氷の入った木箱 */
      ctx.fillStyle="#4a3a28"; ctx.fillRect(px+1,py+8,T-2,T-9);
      ctx.fillStyle="#00000044";
      ctx.fillRect(px+1,py+16,T-2,2); ctx.fillRect(px+1,py+27,T-2,2);
      ctx.fillStyle="#a6c2ca"; ctx.fillRect(px+1,py+2,T-2,8);
      ctx.fillStyle="#ffffff3d"; ctx.fillRect(px+3,py+3,T-8,2);
      if(h%3===0){ ctx.fillStyle="#7fe0e8aa"; ctx.beginPath();
        ctx.ellipse(px+T/2,py+6,7,3,0,0,7); ctx.fill();
        ctx.beginPath(); ctx.moveTo(px+T/2+6,py+6); ctx.lineTo(px+T/2+11,py+3);
        ctx.lineTo(px+T/2+11,py+9); ctx.closePath(); ctx.fill(); }
      break;
    case 'shop':    /* 商店街：シャッターと日よけ */
      ctx.fillStyle="#ffffff0e";
      for(let i=9;i<T-2;i+=5) ctx.fillRect(px+2,py+i,T-4,2);
      ctx.fillStyle=TH.acc+"55"; ctx.fillRect(px,py,T,7);
      ctx.fillStyle="#ffffff33";
      for(let i=0;i<T;i+=12) ctx.fillRect(px+i,py,6,7);
      break;
    case 'desk':    /* 学校：机とロッカー */
      ctx.fillStyle="#ffffff08"; ctx.fillRect(px+1,py+1,T-2,T-2);
      ctx.fillStyle="#c9a97a"; ctx.fillRect(px+4,py+11,T-8,5);
      ctx.fillStyle="#00000055"; ctx.fillRect(px+7,py+16,3,12); ctx.fillRect(px+T-10,py+16,3,12);
      ctx.fillStyle="#5a6480"; ctx.fillRect(px+9,py+24,T-18,8);
      break;
    case 'cargo':   /* 港：コンテナ */
      ctx.fillStyle = (h%3===0)?"#3d5a4a":(h%3===1)?"#54463a":"#3a4a5e";
      ctx.fillRect(px+1,py+3,T-2,T-6);
      ctx.fillStyle="#00000033";
      for(let i=4;i<T-2;i+=6) ctx.fillRect(px+i,py+3,2,T-6);
      ctx.fillStyle="#ffffff14"; ctx.fillRect(px+1,py+3,T-2,2);
      ctx.fillStyle=TH.acc+"44"; ctx.fillRect(px+1,py+T-9,T-2,2);
      break;
    case 'bulkhead':/* 船：隔壁とパイプ */
      ctx.fillStyle="#28323d"; ctx.fillRect(px+1,py+1,T-2,T-2);
      ctx.fillStyle="#ffffff10"; ctx.fillRect(px+1,py+1,T-2,3);
      ctx.fillStyle="#5a6a78"; ctx.fillRect(px+4,py+T-13,T-8,4);
      ctx.fillStyle="#ffffff22";
      [5,T-7].forEach(a=>[7,T-9].forEach(b=>ctx.fillRect(px+a,py+b,3,3)));
      if(h%4===0){ ctx.strokeStyle="#7fe0e844"; ctx.lineWidth=2;
        ctx.beginPath(); ctx.arc(px+T/2,py+T/2,8,0,7); ctx.stroke(); }
      break;
    case 'tank':    /* 水族館：ガラス水槽と魚影 */
      ctx.fillStyle="#0d3b4d"; ctx.fillRect(px+1,py+1,T-2,T-2);
      { const w=Math.sin(px*0.06+performance.now()/900);
        ctx.fillStyle=`rgba(127,224,232,${(0.10+0.06*w).toFixed(3)})`;
        ctx.fillRect(px+1,py+1,T-2,T-2); }
      ctx.fillStyle="#ffffff22"; ctx.fillRect(px+3,py+3,3,T-6);
      if(h%3!==0){ ctx.fillStyle="#04212caa";
        const fy=py+12+(h%14);
        ctx.beginPath(); ctx.ellipse(px+T/2,fy,8,4,0,0,7); ctx.fill();
        ctx.beginPath(); ctx.moveTo(px+T/2+7,fy); ctx.lineTo(px+T/2+13,fy-4);
        ctx.lineTo(px+T/2+13,fy+4); ctx.closePath(); ctx.fill(); }
      ctx.strokeStyle="#9fe8ff33"; ctx.lineWidth=1.5; ctx.strokeRect(px+1.5,py+1.5,T-3,T-3);
      break;
    case 'rock':    /* 砂漠：岩とサボテン */
      ctx.fillStyle="#2e2411"; ctx.beginPath();
      ctx.ellipse(px+T/2,py+T/2+3,T/2-1,T/2-3,0,0,7); ctx.fill();
      ctx.fillStyle="#3d3018"; ctx.beginPath();
      ctx.ellipse(px+T/2-4,py+T/2-2,T/2-7,T/2-9,0,0,7); ctx.fill();
      ctx.fillStyle="#00000044"; ctx.beginPath();
      ctx.ellipse(px+T/2,py+T-6,T/2-4,4,0,0,7); ctx.fill();
      if(h%5===0){
        const cx0=px+T/2, cy0=py+T-7;
        ctx.fillStyle="#3f6b46";
        ctx.fillRect(cx0-3,cy0-24,6,24);
        ctx.fillRect(cx0-10,cy0-15,7,4); ctx.fillRect(cx0-10,cy0-21,4,7);
        ctx.fillRect(cx0+3,cy0-18,7,4);  ctx.fillRect(cx0+6,cy0-24,4,7);
        ctx.fillStyle="#2f5236"; ctx.fillRect(cx0-1,cy0-24,2,24); }
      break;
  }
}

function drawHide(cx,cy){
  ctx.save(); ctx.translate(cx,cy); ctx.scale(GS,GS);
  ctx.fillStyle="#00000055"; ctx.beginPath(); ctx.ellipse(0,12,15,6,0,0,7); ctx.fill();
  switch(TH.hide){
    case 'crate':   /* 木箱の陰 */
      ctx.fillStyle="#5b452e"; ctx.fillRect(-14,-10,28,22);
      ctx.fillStyle="#3a2c1c"; ctx.fillRect(-14,-3,28,3); ctx.fillRect(-14,5,28,3);
      ctx.fillStyle="#74593c"; ctx.fillRect(-14,-13,28,5);
      ctx.fillStyle="#00000055"; ctx.fillRect(-4,-13,8,25);
      break;
    case 'awning':  /* 店先の日よけ */
      ctx.fillStyle="#7a3c4a"; ctx.beginPath();
      ctx.moveTo(-16,-6); ctx.lineTo(16,-6); ctx.lineTo(12,8); ctx.lineTo(-12,8); ctx.closePath(); ctx.fill();
      ctx.fillStyle="#e8e0d0";
      for(let i=-14;i<14;i+=9){ ctx.beginPath();
        ctx.moveTo(i,-6); ctx.lineTo(i+4,-6); ctx.lineTo(i+3,8); ctx.lineTo(i-1,8); ctx.closePath(); ctx.fill(); }
      ctx.fillStyle="#00000044"; ctx.fillRect(-12,8,24,4);
      break;
    case 'desk':    /* 机の下 */
      ctx.fillStyle="#c9a97a"; ctx.fillRect(-15,-8,30,6);
      ctx.fillStyle="#00000066"; ctx.fillRect(-13,-2,26,12);
      ctx.fillStyle="#7a6244"; ctx.fillRect(-13,-2,3,14); ctx.fillRect(10,-2,3,14);
      ctx.fillStyle="#5a6480"; ctx.fillRect(-6,2,12,8);
      break;
    case 'coral':   /* 水草のかげ */
      ctx.fillStyle="#2f7a6a";
      for(let i=0;i<5;i++){ const a=-Math.PI/2+(i-2)*0.42;
        ctx.save(); ctx.rotate(a);
        ctx.beginPath(); ctx.ellipse(0,-12,4,15,0,0,7); ctx.fill(); ctx.restore(); }
      ctx.fillStyle="#e0764a";
      ctx.beginPath(); ctx.ellipse(-7,4,5,4,0,0,7); ctx.fill();
      ctx.beginPath(); ctx.ellipse(6,6,4,3,0,0,7); ctx.fill();
      ctx.fillStyle="#3a2c1c"; ctx.fillRect(-10,8,20,5);
      break;
    case 'cactus':  /* 岩かげのサボテン */
      ctx.fillStyle="#4a3a22"; ctx.beginPath(); ctx.ellipse(2,7,15,8,0,0,7); ctx.fill();
      ctx.fillStyle="#3f6b46";
      ctx.fillRect(-4,-16,8,24);
      ctx.fillRect(-13,-8,9,6); ctx.fillRect(-13,-14,5,8);
      ctx.fillRect(4,-11,9,6);  ctx.fillRect(8,-17,5,8);
      ctx.fillStyle="#2f5236"; ctx.fillRect(-2,-16,2,24);
      break;
    default:        /* 観葉植物とダンボール */
      ctx.fillStyle="#3b6b4a";
      for(let i=0;i<5;i++){ const a=-Math.PI/2+(i-2)*0.5;
        ctx.save(); ctx.rotate(a);
        ctx.beginPath(); ctx.ellipse(0,-11,5,14,0,0,7); ctx.fill(); ctx.restore(); }
      ctx.fillStyle="#7a5136"; ctx.fillRect(-9,6,18,10);
      ctx.fillStyle="#5d3c28"; ctx.fillRect(-9,6,18,3);
  }
  ctx.restore();
}
function drawDoor(cx,cy){
  ctx.save(); ctx.translate(cx,cy); ctx.scale(GS,GS);
  const pulse = 0.5+0.5*Math.sin(performance.now()/420);
  const ready = fishGot>=fishNeed;
  const glow = TH.coneRGB || "245,185,92";
  ctx.fillStyle = ready ? `rgba(${glow},${0.16+0.14*pulse})` : `rgba(${glow},0.07)`;
  ctx.beginPath(); ctx.arc(0,0,ready?30+4*pulse:22,0,7); ctx.fill();
  ctx.fillStyle="#6b4f7a"; ctx.beginPath(); ctx.ellipse(0,4,17,12,0,0,7); ctx.fill();
  ctx.fillStyle="#8e6ba0"; ctx.beginPath(); ctx.ellipse(0,1,13,9,0,0,7); ctx.fill();
  ctx.fillStyle= ready?TH.acc:"#4a3a5e"; ctx.font="bold 13px system-ui"; ctx.textAlign="center";
  ctx.fillText("ねどこ",0,-16);
  ctx.restore();
}
function drawItem(it){
  const b = Math.sin(performance.now()/300 + it.bob)*2.5;
  ctx.save(); ctx.translate(it.x, it.y+b); ctx.scale(GS,GS);
  if(it.t==='fish'){
    ctx.fillStyle="#7fe0e8";
    ctx.beginPath(); ctx.ellipse(0,0,11,6,0,0,7); ctx.fill();
    ctx.beginPath(); ctx.moveTo(9,0); ctx.lineTo(16,-6); ctx.lineTo(16,6); ctx.closePath(); ctx.fill();
    ctx.fillStyle="#12303a"; ctx.beginPath(); ctx.arc(-5,-1.5,1.8,0,7); ctx.fill();
    ctx.strokeStyle="#ffffff44"; ctx.lineWidth=1; ctx.beginPath(); ctx.ellipse(0,0,11,6,0,0,7); ctx.stroke();
  }else{
    ctx.fillStyle="#ffd86b"; ctx.beginPath(); ctx.arc(0,0,6,0,7); ctx.fill();
    ctx.fillStyle="#c68b2c"; ctx.beginPath(); ctx.arc(-2,-2,1.6,0,7); ctx.fill(); ctx.beginPath(); ctx.arc(2.5,1.5,1.4,0,7); ctx.fill();
  }
  ctx.restore();
}
function drawCone(h){
  const alert = Math.min(1, h.sus/100);
  const range = h.range * (h.mode==='phone'?0.5:1);
  const half  = h.half  * (h.mode==='phone'?0.55:1);
  const N = 22;
  ctx.save(); ctx.beginPath(); ctx.moveTo(h.x,h.y);
  for(let i=0;i<=N;i++){
    const a = h.ang - half + (2*half)*(i/N);
    let d = range;
    for(let s=6; s<range; s+=6){
      if(wallAtPx(h.x+Math.cos(a)*s, h.y+Math.sin(a)*s)){ d=s; break; }
    }
    ctx.lineTo(h.x+Math.cos(a)*d, h.y+Math.sin(a)*d);
  }
  ctx.closePath();
  const g = ctx.createRadialGradient(h.x,h.y,4,h.x,h.y,range);
  const cone = TH.coneRGB || "245,185,92";
  const c1 = alert>0.05 ? `rgba(255,93,122,${0.16+0.28*alert})` : `rgba(${cone},0.20)`;
  const c2 = alert>0.05 ? `rgba(255,93,122,0)` : `rgba(${cone},0)`;
  g.addColorStop(0,c1); g.addColorStop(1,c2);
  ctx.fillStyle=g; ctx.fill();
  ctx.restore();
}
function drawHuman(h){
  const sway = Math.sin(h.bob)*(h.mode==='walk'?2:0.6);
  ctx.save(); ctx.translate(h.x,h.y); ctx.scale(GS,GS);
  ctx.fillStyle="#00000066"; ctx.beginPath(); ctx.ellipse(0,13,14,6,0,0,7); ctx.fill();
  /* 体 */
  ctx.rotate(h.ang+Math.PI/2);
  ctx.fillStyle=TH.hu; ctx.beginPath(); ctx.ellipse(sway*0.4,0,13,11,0,0,7); ctx.fill();
  if(TH.hat==='towel'||TH.hat==='cap'){   /* 市場の前掛け・作業着の胸当て */
    ctx.fillStyle="#ffffff1e"; ctx.fillRect(-6,-2,12,10);
  }
  /* 頭 */
  ctx.fillStyle="#e8c39a"; ctx.beginPath(); ctx.arc(0,-3,9,0,7); ctx.fill();
  ctx.fillStyle=TH.hair; ctx.beginPath(); ctx.arc(0,-3,9,Math.PI*0.05,Math.PI*0.95); ctx.fill();
  if(TH.hat==='towel'){                   /* 魚市場：ねじり鉢巻き */
    ctx.fillStyle="#e8eef0"; ctx.fillRect(-9,-7,18,4);
    ctx.fillStyle="#c9d3d6"; ctx.fillRect(6,-9,5,3);
  }else if(TH.hat==='cap'){               /* 港・船：帽子とつば */
    ctx.fillStyle="#20303f"; ctx.beginPath(); ctx.arc(0,-4,9.4,Math.PI,0); ctx.fill();
    ctx.fillStyle="#2c4256"; ctx.fillRect(-9,-13,18,4);
  }else if(TH.hat==='hood'){              /* 砂漠：かぶりもの */
    ctx.fillStyle="#d9c39a"; ctx.beginPath(); ctx.arc(0,-3,10.5,Math.PI*0.92,Math.PI*0.08); ctx.fill();
    ctx.fillStyle="#c2ad86"; ctx.fillRect(-11,-4,22,7);
  }
  /* 鼻先＝向き */
  ctx.fillStyle="#f2d3b0"; ctx.beginPath(); ctx.arc(0,-11,3.2,0,7); ctx.fill();
  ctx.restore();
  /* スマホ／気配 */
  if(h.mode==='phone'){
    ctx.fillStyle="#9fe8ff"; ctx.fillRect(h.x+9*GS,h.y+4*GS,6*GS,9*GS);
    ctx.fillStyle="#ffffff55"; ctx.fillRect(h.x+10*GS,h.y+5*GS,4*GS,3*GS);
  }
  if(h.sus>3){
    const w=26*GS, p=Math.min(1,h.sus/100);
    ctx.fillStyle="#00000088"; ctx.fillRect(h.x-w/2, h.y-24*GS, w, 5*GS);
    ctx.fillStyle= p>0.6? "#ff5d7a" : "#ffd86b"; ctx.fillRect(h.x-w/2, h.y-24*GS, w*p, 5*GS);
    if(p>0.6){ ctx.fillStyle="#ff5d7a"; ctx.font="bold 16px system-ui"; ctx.textAlign="center"; ctx.fillText("!", h.x, h.y-29*GS); }
  }
}
/* 進行方向を「下・上・横」の3ポーズに丸める。スプライトは回さないので仰向けにならない */
function catPose(){
  const deg = ((cat.face*180/Math.PI)%360+360)%360;
  if(deg>=45 && deg<135)  return {dir:'down', flip:1};
  if(deg>=225 && deg<315) return {dir:'up',   flip:1};
  return {dir:'side', flip:(deg<45||deg>=315)?1:-1};
}
function drawCat(){
  const moving = cat.spd>4;
  const gait = Math.sin(cat.step*2)*(moving?1:0);
  const bob  = Math.abs(gait)*1.5;
  const wag  = Math.sin(performance.now()/280)*(moving?0.85:0.45);
  const pose = catPose();
  const CREAM="#f6e6c9", TABBY="#d9c09a", DARK="#bda484", PINK="#e8a9b8";
  const eye = cat.hidden ? "#7fe0e8" : "#2e2440";

  ctx.save(); ctx.translate(cat.x, cat.y); ctx.scale(GS,GS);
  ctx.globalAlpha = cat.hidden ? 0.34 : (cat.flash>0 && Math.floor(cat.flash*14)%2 ? 0.35 : 1);
  ctx.fillStyle="#00000070"; ctx.beginPath(); ctx.ellipse(0,13,13,4.5,0,0,7); ctx.fill();
  ctx.scale(pose.flip,1);
  ctx.translate(0,-bob);
  ctx.lineCap="round";

  if(pose.dir==='side'){
    ctx.strokeStyle=TABBY; ctx.lineWidth=4.5;
    ctx.beginPath(); ctx.moveTo(-9,4); ctx.quadraticCurveTo(-20,2-6*wag, -17,-9-5*wag); ctx.stroke();
    ctx.fillStyle=DARK;
    ctx.beginPath(); ctx.ellipse(-6,11+gait*2,4,3.4,0,0,7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(5,11-gait*2,3.6,3.2,0,0,7); ctx.fill();
    ctx.fillStyle=CREAM; ctx.beginPath(); ctx.ellipse(-2,3,12,8.5,0,0,7); ctx.fill();
    ctx.fillStyle=TABBY;
    ctx.beginPath(); ctx.ellipse(-6,-2,3,2,0.5,0,7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0,-3,2.6,1.8,0.3,0,7); ctx.fill();
    ctx.fillStyle=CREAM;
    ctx.beginPath(); ctx.arc(8,-5,8,0,7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(14,-3,4.2,3.4,0,0,7); ctx.fill();
    ctx.beginPath(); ctx.moveTo(3,-10); ctx.lineTo(3.5,-18); ctx.lineTo(9,-12); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(9.5,-11); ctx.lineTo(13,-17); ctx.lineTo(14,-9); ctx.closePath(); ctx.fill();
    ctx.fillStyle=PINK;
    ctx.beginPath(); ctx.moveTo(4.6,-11); ctx.lineTo(4.9,-15.8); ctx.lineTo(8,-12.4); ctx.closePath(); ctx.fill();
    ctx.fillStyle=eye; ctx.beginPath(); ctx.ellipse(10.5,-6,2,2.5,0,0,7); ctx.fill();
    ctx.fillStyle=PINK; ctx.beginPath(); ctx.arc(16.6,-3.6,1.5,0,7); ctx.fill();
    ctx.strokeStyle="#ffffff70"; ctx.lineWidth=1;
    for(let i=-1;i<=1;i++){ ctx.beginPath(); ctx.moveTo(15,-3); ctx.lineTo(22,-5+i*3.2); ctx.stroke(); }
  }else if(pose.dir==='down'){
    ctx.strokeStyle=TABBY; ctx.lineWidth=4.5;
    ctx.beginPath(); ctx.moveTo(6,7); ctx.quadraticCurveTo(17,7+8*wag, 15,-3+6*wag); ctx.stroke();
    ctx.fillStyle=DARK;
    ctx.beginPath(); ctx.ellipse(-5.5,12+gait*1.6,3.4,3,0,0,7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(5.5,12-gait*1.6,3.4,3,0,0,7); ctx.fill();
    ctx.fillStyle=CREAM; ctx.beginPath(); ctx.ellipse(0,4,10.5,9.5,0,0,7); ctx.fill();
    ctx.fillStyle=CREAM; ctx.beginPath(); ctx.arc(0,-6,8.6,0,7); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-8.4,-9.5); ctx.lineTo(-6.5,-18); ctx.lineTo(-0.8,-12.5); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(8.4,-9.5); ctx.lineTo(6.5,-18); ctx.lineTo(0.8,-12.5); ctx.closePath(); ctx.fill();
    ctx.fillStyle=PINK;
    ctx.beginPath(); ctx.moveTo(-6.8,-11); ctx.lineTo(-6,-15.6); ctx.lineTo(-3,-12.6); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(6.8,-11); ctx.lineTo(6,-15.6); ctx.lineTo(3,-12.6); ctx.closePath(); ctx.fill();
    ctx.fillStyle=eye;
    ctx.beginPath(); ctx.ellipse(-3.4,-7,1.9,2.5,0,0,7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(3.4,-7,1.9,2.5,0,0,7); ctx.fill();
    ctx.fillStyle=PINK; ctx.beginPath(); ctx.arc(0,-3.4,1.5,0,7); ctx.fill();
    ctx.strokeStyle="#ffffff70"; ctx.lineWidth=1;
    [-1,1].forEach(s=>{ for(let i=-1;i<=1;i++){
      ctx.beginPath(); ctx.moveTo(s*5,-3); ctx.lineTo(s*13,-4.5+i*3); ctx.stroke(); }});
  }else{
    ctx.strokeStyle=TABBY; ctx.lineWidth=4.5;
    ctx.beginPath(); ctx.moveTo(4,9); ctx.quadraticCurveTo(15,15+6*wag, 12,23+4*wag); ctx.stroke();
    ctx.fillStyle=DARK;
    ctx.beginPath(); ctx.ellipse(-6.5,10+gait*1.6,3.2,2.8,0,0,7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(6.5,10-gait*1.6,3.2,2.8,0,0,7); ctx.fill();
    ctx.fillStyle=CREAM; ctx.beginPath(); ctx.ellipse(0,3,10.5,10,0,0,7); ctx.fill();
    ctx.fillStyle=TABBY;
    ctx.beginPath(); ctx.ellipse(0,-1,6,2.2,0,0,7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0,4,5,2,0,0,7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0,8.5,3.6,1.8,0,0,7); ctx.fill();
    ctx.fillStyle=CREAM; ctx.beginPath(); ctx.arc(0,-7,8.6,0,7); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-8.4,-10.5); ctx.lineTo(-6.5,-19); ctx.lineTo(-0.8,-13.5); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(8.4,-10.5); ctx.lineTo(6.5,-19); ctx.lineTo(0.8,-13.5); ctx.closePath(); ctx.fill();
    ctx.fillStyle=TABBY; ctx.beginPath(); ctx.ellipse(0,-9.5,5.5,2.2,0,0,7); ctx.fill();
    if(cat.hidden){ ctx.fillStyle="#7fe0e8";
      ctx.beginPath(); ctx.arc(-3.2,-11.5,1.2,0,7); ctx.fill();
      ctx.beginPath(); ctx.arc(3.2,-11.5,1.2,0,7); ctx.fill(); }
  }
  ctx.globalAlpha=1;
  ctx.restore();
}

/* ============ ループ ============ */
function loop(ts){
  const dt = Math.min(0.05, (ts-last)/1000 || 0); last = ts;
  update(dt);
  if(state!==S.TITLE) draw();
  requestAnimationFrame(loop);
}
buildLevel(0); draw();
btn.onclick = primary;
requestAnimationFrame(loop);
})();
</script>
