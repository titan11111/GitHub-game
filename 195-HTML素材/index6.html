<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOMB DEFUSER - 時限爆弾解除</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        
        body {
            background-color: #0a0a0a;
            color: #00ff41;
            font-family: 'Share Tech Mono', monospace;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .digital-font {
            font-family: 'Share Tech Mono', monospace;
            text-shadow: 0 0 10px rgba(0, 255, 65, 0.7);
        }

        .bomb-container {
            background: linear-gradient(145deg, #1a1a1a, #0d0d0d);
            border: 4px solid #333;
            box-shadow: 0 0 50px rgba(255, 0, 0, 0.2);
            position: relative;
        }

        .wire {
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            border-left: 10px solid rgba(0,0,0,0.3);
            border-right: 10px solid rgba(0,0,0,0.3);
        }

        .wire:hover {
            filter: brightness(1.3);
            transform: scaleX(1.02);
        }

        .wire.cut {
            opacity: 0.3;
            pointer-events: none;
        }

        .wire.cut::after {
            content: "";
            position: absolute;
            top: 0;
            left: 45%;
            width: 10%;
            height: 100%;
            background: #0a0a0a;
        }

        .shake {
            animation: shake 0.5s infinite;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 50;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .led { width: 12px; height: 12px; border-radius: 50%; transition: background 0.3s; }
        .led-off { background-color: #331111; }
        .led-red { background-color: #ff0000; box-shadow: 0 0 10px #ff0000; }
        .led-green { background-color: #00ff00; box-shadow: 0 0 10px #00ff00; }
    </style>
</head>
<body>

    <div id="game-container" class="bomb-container p-8 rounded-xl max-w-md w-full mx-4">
        <div class="flex justify-between items-center mb-6">
            <div class="flex items-center space-x-2">
                <div id="status-led" class="led led-red"></div>
                <span class="text-[10px] uppercase tracking-widest text-gray-500">System Ready</span>
            </div>
            <div class="text-red-500 text-xs font-bold uppercase tracking-widest">Model: VX-99 Pulse</div>
        </div>

        <div class="bg-black p-4 rounded-lg border-2 border-red-900 mb-8 text-center shadow-inner">
            <div id="timer" class="text-6xl digital-font text-red-600">00:30.00</div>
        </div>

        <div class="bg-gray-950 p-4 rounded border border-gray-800 mb-6 min-h-[100px] flex flex-col justify-center">
            <h3 class="text-[10px] text-gray-600 uppercase mb-2 border-b border-gray-800 pb-1">Intel Decryption</h3>
            <p id="clue-text" class="text-sm text-green-400 leading-relaxed italic">待機中... 「ミッション開始」を押してください。</p>
        </div>

        <div class="space-y-4 mb-8" id="wires-container">
            <div class="h-8 bg-gray-800 opacity-20 rounded-full"></div>
            <div class="h-8 bg-gray-800 opacity-20 rounded-full"></div>
            <div class="h-8 bg-gray-800 opacity-20 rounded-full"></div>
            <div class="h-8 bg-gray-800 opacity-20 rounded-full"></div>
        </div>

        <button onclick="startGame()" id="start-btn" class="w-full py-4 bg-red-900 hover:bg-red-800 text-white font-bold rounded shadow-lg transition duration-200 uppercase tracking-[0.3em] border-b-4 border-red-950 active:border-b-0 active:translate-y-1">
            START MISSION
        </button>
    </div>

    <div id="overlay" class="overlay">
        <h1 id="overlay-title" class="text-6xl font-black mb-4">MISSION FAILED</h1>
        <p id="overlay-msg" class="text-xl mb-8">爆発を阻止できませんでした。</p>
        <button onclick="resetGame()" class="px-10 py-3 bg-white text-black font-bold rounded-full hover:bg-gray-200 transition uppercase tracking-widest">Try Again</button>
    </div>

    <script>
        // Web Audio API Context
        let audioCtx;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // --- Sound Synthesis Functions ---
        function playBeep(freq = 880, duration = 0.05, type = 'square') {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playCutSound() {
            if (!audioCtx) return;
            const duration = 0.1;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + duration);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playExplosionSound() {
            if (!audioCtx) return;
            const bufferSize = audioCtx.sampleRate * 2;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(1000, audioCtx.currentTime);
            filter.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 1.5);
            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);
            noise.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);
            noise.start();
        }

        function playSuccessSound() {
            if (!audioCtx) return;
            const notes = [523.25, 659.25, 783.99, 1046.50];
            notes.forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime + i * 0.1);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime + i * 0.1);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.1 + 0.3);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(audioCtx.currentTime + i * 0.1);
                osc.stop(audioCtx.currentTime + i * 0.1 + 0.3);
            });
        }

        // --- Game Logic ---
        const COLORS = [
            { id: 'red', hex: '#ef4444', label: 'RED' },
            { id: 'blue', hex: '#3b82f6', label: 'BLUE' },
            { id: 'yellow', hex: '#fbbf24', label: 'YELLOW' },
            { id: 'green', hex: '#22c55e', label: 'GREEN' },
            { id: 'white', hex: '#f8fafc', label: 'WHITE' }
        ];

        let timeLeft = 30000;
        let timerInterval;
        let gameActive = false;
        let sequenceToCut = [];
        let cutIndex = 0;
        let currentClue = "";
        let lastBeepSec = -1;

        const timerDisplay = document.getElementById('timer');
        const clueDisplay = document.getElementById('clue-text');
        const wiresContainer = document.getElementById('wires-container');
        const startBtn = document.getElementById('start-btn');
        const overlay = document.getElementById('overlay');
        const statusLed = document.getElementById('status-led');

        function generatePuzzle() {
            const selectedColors = [...COLORS].sort(() => Math.random() - 0.5).slice(0, 4);
            const logicType = Math.floor(Math.random() * 3);
            let correctOrder = [];

            if (logicType === 0) {
                currentClue = "「ラベル名のアルファベット順 (A-Z)」に従って切断せよ。";
                correctOrder = [...selectedColors].sort((a, b) => a.label.localeCompare(b.label));
            } else if (logicType === 1) {
                currentClue = "「一番下」のワイヤーから順に、上へ向かって切断せよ。";
                correctOrder = [...selectedColors].reverse();
            } else {
                currentClue = "「1番目 → 3番目 → 2番目 → 4番目」の順に切断せよ。";
                correctOrder = [selectedColors[0], selectedColors[2], selectedColors[1], selectedColors[3]];
            }

            sequenceToCut = correctOrder.map(c => c.id);
            return selectedColors;
        }

        function renderWires(selectedColors) {
            wiresContainer.innerHTML = '';
            selectedColors.forEach((color, index) => {
                const wireDiv = document.createElement('div');
                wireDiv.className = 'wire h-8 rounded-full shadow-md flex items-center justify-center';
                wireDiv.style.backgroundColor = color.hex;
                wireDiv.dataset.id = color.id;
                wireDiv.innerHTML = `<span class="text-[10px] text-black font-black opacity-40 select-none">${color.label} LINE</span>`;
                wireDiv.onclick = () => cutWire(color.id, wireDiv);
                wiresContainer.appendChild(wireDiv);
            });
        }

        function startGame() {
            if (gameActive) return;
            initAudio(); // Audio context must be resumed on click
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            resetGameState();
            const puzzleWires = generatePuzzle();
            renderWires(puzzleWires);
            
            startBtn.style.display = 'none';
            gameActive = true;
            statusLed.classList.replace('led-red', 'led-green');
            
            const startTime = Date.now();
            const initialTime = timeLeft;

            timerInterval = setInterval(() => {
                const elapsed = Date.now() - startTime;
                timeLeft = initialTime - elapsed;

                const currentSec = Math.floor(timeLeft / 1000);
                
                // ぴこぴこ音の制御
                if (currentSec !== lastBeepSec && timeLeft > 0) {
                    playBeep(880, 0.05);
                    lastBeepSec = currentSec;
                }
                
                // 緊急時の高速ビープ
                if (timeLeft < 5000 && timeLeft > 0) {
                    if (Math.floor(timeLeft / 200) % 2 === 0) {
                        if (Math.floor((timeLeft + 200) / 200) !== Math.floor(timeLeft / 200)) {
                             // 高速ビープ用のロジックが必要だが、簡易的に
                        }
                    }
                }

                if (timeLeft <= 0) {
                    timeLeft = 0;
                    explode();
                }

                updateTimerDisplay();
                
                if (timeLeft < 5000) {
                    document.getElementById('game-container').classList.add('shake');
                    timerDisplay.style.color = '#ff0000';
                }
            }, 10);

            clueDisplay.innerText = "データ解析中...";
            setTimeout(() => {
                clueDisplay.innerText = "解析完了： " + currentClue;
                playBeep(1200, 0.1, 'sine');
            }, 600);
        }

        function cutWire(id, element) {
            if (!gameActive) return;
            playCutSound();
            
            if (id === sequenceToCut[cutIndex]) {
                element.classList.add('cut');
                cutIndex++;
                
                if (cutIndex === sequenceToCut.length) {
                    defused();
                } else {
                    playBeep(1500, 0.05, 'sine'); // 正解音（小）
                }
            } else {
                explode();
            }
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(timeLeft / 60000);
            const seconds = Math.floor((timeLeft % 60000) / 1000);
            const ms = Math.floor((timeLeft % 1000) / 10);
            
            timerDisplay.innerText = 
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}.${ms.toString().padStart(2, '0')}`;
        }

        function explode() {
            gameActive = false;
            clearInterval(timerInterval);
            playExplosionSound();
            document.getElementById('game-container').classList.remove('shake');
            document.body.style.backgroundColor = '#660000';
            showOverlay("MISSION FAILED", "爆弾が爆発しました。", "text-red-600");
        }

        function defused() {
            gameActive = false;
            clearInterval(timerInterval);
            playSuccessSound();
            document.getElementById('game-container').classList.remove('shake');
            statusLed.style.backgroundColor = '#00ffff';
            showOverlay("MISSION SUCCESS", "爆弾の解除に成功しました。", "text-green-500");
        }

        function showOverlay(title, msg, colorClass) {
            const titleEl = document.getElementById('overlay-title');
            titleEl.innerText = title;
            titleEl.className = `text-5xl md:text-6xl font-black mb-4 ${colorClass}`;
            document.getElementById('overlay-msg').innerText = msg;
            overlay.style.display = 'flex';
        }

        function resetGameState() {
            timeLeft = 30000;
            cutIndex = 0;
            lastBeepSec = -1;
            gameActive = false;
            clearInterval(timerInterval);
            document.getElementById('game-container').classList.remove('shake');
            document.body.style.backgroundColor = '#0a0a0a';
            timerDisplay.style.color = '';
            updateTimerDisplay();
        }

        function resetGame() {
            overlay.style.display = 'none';
            startBtn.style.display = 'block';
            clueDisplay.innerText = "待機中... 「ミッション開始」を押してください。";
            wiresContainer.innerHTML = `
                <div class="h-8 bg-gray-800 opacity-20 rounded-full"></div>
                <div class="h-8 bg-gray-800 opacity-20 rounded-full"></div>
                <div class="h-8 bg-gray-800 opacity-20 rounded-full"></div>
                <div class="h-8 bg-gray-800 opacity-20 rounded-full"></div>`;
            statusLed.className = 'led led-red';
            resetGameState();
        }

        updateTimerDisplay();
    </script>
</body>
</html>
