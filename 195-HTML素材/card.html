<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>名刺メーカー</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,700;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=DM+Mono:wght@400&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --page-bg:   #ede8df;
      --panel-bg:  #f5f1ea;
      --border:    #d6cfc3;
      --text:      #2a2520;
      --muted:     #9a9086;
      --accent:    #2c2c4a;
      --gold:      #b8965a;
    }

    html, body { height: 100%; }

    body {
      background: var(--page-bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-weight: 400;
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      padding: 1.2rem 2.8rem;
      border-bottom: 1px solid var(--border);
      background: var(--panel-bg);
      display: flex;
      align-items: baseline;
      gap: 1rem;
    }

    header h1 {
      font-family: 'Cormorant Garamond', 'Noto Serif JP', serif;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: .06em;
      color: var(--accent);
    }

    header p {
      font-size: .72rem;
      color: var(--muted);
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    /* ── Main layout ── */
    main {
      display: grid;
      grid-template-columns: 360px 1fr;
      overflow: hidden;
    }

    /* ── Form panel ── */
    .form-panel {
      background: var(--panel-bg);
      border-right: 1px solid var(--border);
      padding: 2.4rem 2.2rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .form-section-title {
      font-size: .65rem;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: .8rem;
      padding-bottom: .5rem;
      border-bottom: 1px solid var(--border);
    }

    .fields { display: flex; flex-direction: column; gap: 1.4rem; }

    .field { display: flex; flex-direction: column; gap: .4rem; }

    .field label {
      font-size: .7rem;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .field input {
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border);
      padding: .5rem 0;
      font-family: 'DM Sans', sans-serif;
      font-size: .95rem;
      color: var(--text);
      outline: none;
      transition: border-color .2s;
      width: 100%;
    }

    .field input:focus { border-color: var(--accent); }
    .field input::placeholder { color: var(--muted); font-style: italic; }

    /* Theme selector */
    .theme-selector { display: flex; flex-direction: column; gap: .8rem; }

    .theme-swatches {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: .6rem;
    }

    .swatch {
      border: 2px solid transparent;
      border-radius: 6px;
      padding: .55rem .4rem .45rem;
      cursor: pointer;
      text-align: center;
      font-size: .65rem;
      letter-spacing: .08em;
      font-weight: 500;
      transition: all .18s;
      display: flex;
      flex-direction: column;
      gap: .3rem;
      align-items: center;
    }

    .swatch:hover { border-color: var(--accent); }
    .swatch.active { border-color: var(--accent); }

    .swatch-dot {
      width: 28px;
      height: 18px;
      border-radius: 3px;
    }

    .swatch[data-theme="classic"] .swatch-dot { background: #fff; border: 1px solid #ddd; }
    .swatch[data-theme="noir"]    .swatch-dot { background: #1a1a2e; }
    .swatch[data-theme="terra"]   .swatch-dot { background: #2d1f14; }

    /* Action buttons */
    .actions { display: flex; gap: .8rem; }

    .btn {
      flex: 1;
      font-family: 'DM Sans', sans-serif;
      font-size: .75rem;
      font-weight: 500;
      letter-spacing: .1em;
      text-transform: uppercase;
      padding: .7rem 1rem;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: all .18s;
    }

    .btn:hover { border-color: var(--accent); color: var(--accent); }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .btn-primary:hover { background: #1a1a3a; border-color: #1a1a3a; color: #fff; }

    /* ── Preview panel ── */
    .preview-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
      gap: 2.4rem;
      background: var(--page-bg);
      position: relative;
      overflow: hidden;
    }

    .preview-panel::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle at 30% 40%, rgba(44,44,74,.06) 0%, transparent 60%),
                        radial-gradient(circle at 70% 70%, rgba(184,150,90,.08) 0%, transparent 50%);
      pointer-events: none;
    }

    /* ── Business Card ── */
    .card-wrap {
      perspective: 1200px;
      position: relative;
      z-index: 1;
    }

    .card {
      width: 480px;
      height: 290px;
      border-radius: 6px;
      position: relative;
      overflow: hidden;
      transition: transform .4s ease, box-shadow .4s ease;
      cursor: default;
    }

    .card:hover {
      transform: translateY(-6px) rotateX(4deg);
    }

    /* Gloss sweep animation */
    .card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,.12) 50%, transparent 60%);
      background-size: 200% 100%;
      background-position: 200% 0;
      transition: background-position .6s ease;
      pointer-events: none;
      z-index: 10;
    }

    .card:hover::after { background-position: -50% 0; }

    /* ── THEME: Classic ── */
    .card[data-theme="classic"] {
      background: #ffffff;
      box-shadow: 0 8px 32px rgba(0,0,0,.10), 0 2px 8px rgba(0,0,0,.06), 0 0 0 1px rgba(0,0,0,.04);
    }
    .card[data-theme="classic"] .card-accent { background: #2c2c4a; }
    .card[data-theme="classic"] .card-name   { color: #1a1a2e; }
    .card[data-theme="classic"] .card-title  { color: #6b6880; }
    .card[data-theme="classic"] .card-company{ color: #2c2c4a; }
    .card[data-theme="classic"] .card-divider{ background: #2c2c4a; opacity: .25; }
    .card[data-theme="classic"] .card-contact{ color: #5a5870; }
    .card[data-theme="classic"] .card-mono   { color: #5a5870; }
    .card[data-theme="classic"] .card-initial { background: #2c2c4a; color: #fff; }
    .card[data-theme="classic"]:hover {
      box-shadow: 0 20px 50px rgba(0,0,0,.15), 0 4px 16px rgba(0,0,0,.08);
    }

    /* ── THEME: Noir ── */
    .card[data-theme="noir"] {
      background: #12121e;
      box-shadow: 0 8px 32px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.3), inset 0 0 0 1px rgba(255,255,255,.06);
    }
    .card[data-theme="noir"] .card-accent  { background: #b8965a; }
    .card[data-theme="noir"] .card-name    { color: #f0ead8; }
    .card[data-theme="noir"] .card-title   { color: #b8965a; }
    .card[data-theme="noir"] .card-company { color: #c8c0b0; }
    .card[data-theme="noir"] .card-divider { background: #b8965a; opacity: .4; }
    .card[data-theme="noir"] .card-contact { color: #7a7268; }
    .card[data-theme="noir"] .card-mono    { color: #9a9080; }
    .card[data-theme="noir"] .card-initial { background: #b8965a; color: #12121e; }
    .card[data-theme="noir"]:hover {
      box-shadow: 0 20px 60px rgba(0,0,0,.7), 0 4px 20px rgba(184,150,90,.2);
    }

    /* ── THEME: Terra ── */
    .card[data-theme="terra"] {
      background: #2d1f14;
      box-shadow: 0 8px 32px rgba(45,31,20,.5), 0 2px 8px rgba(0,0,0,.2), inset 0 0 0 1px rgba(255,255,255,.05);
    }
    .card[data-theme="terra"] .card-accent  { background: #c8753a; }
    .card[data-theme="terra"] .card-name    { color: #f2e4d0; }
    .card[data-theme="terra"] .card-title   { color: #c8753a; }
    .card[data-theme="terra"] .card-company { color: #c0a888; }
    .card[data-theme="terra"] .card-divider { background: #c8753a; opacity: .35; }
    .card[data-theme="terra"] .card-contact { color: #7a6250; }
    .card[data-theme="terra"] .card-mono    { color: #9a8070; }
    .card[data-theme="terra"] .card-initial { background: #c8753a; color: #fff; }
    .card[data-theme="terra"]:hover {
      box-shadow: 0 20px 60px rgba(45,31,20,.7), 0 4px 20px rgba(200,117,58,.2);
    }

    /* Card inner layout */
    .card-inner {
      position: absolute;
      inset: 0;
      padding: 2.4rem 2.6rem;
      display: grid;
      grid-template-rows: 1fr auto;
    }

    .card-top { display: flex; justify-content: space-between; align-items: flex-start; }

    .card-identity { display: flex; flex-direction: column; gap: .35rem; }

    .card-initial {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.1rem;
      font-weight: 700;
      flex-shrink: 0;
      transition: opacity .3s;
    }

    .card-name {
      font-family: 'Cormorant Garamond', 'Noto Serif JP', serif;
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: .02em;
      line-height: 1.15;
      transition: opacity .3s;
      min-height: 1.9rem;
    }

    .card-name.empty { opacity: .2; font-style: italic; font-weight: 400; }

    .card-title {
      font-size: .72rem;
      letter-spacing: .18em;
      text-transform: uppercase;
      font-weight: 400;
      min-height: 1em;
      transition: opacity .3s;
    }

    .card-title.empty, .card-company.empty { opacity: .2; font-style: italic; text-transform: none; letter-spacing: 0; }

    .card-company {
      font-family: 'Cormorant Garamond', 'Noto Serif JP', serif;
      font-size: .88rem;
      font-style: italic;
      letter-spacing: .04em;
      min-height: 1em;
    }

    .card-bottom { display: flex; flex-direction: column; gap: .6rem; }

    .card-divider {
      height: 1px;
      width: 100%;
      margin-bottom: .2rem;
    }

    .card-contacts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: .25rem .8rem;
    }

    .card-mono {
      font-family: 'DM Mono', monospace;
      font-size: .62rem;
      letter-spacing: .04em;
      line-height: 1.6;
      min-height: .62rem;
    }

    .card-mono.empty { opacity: .15; font-style: italic; font-family: 'DM Sans', sans-serif; }

    /* Accent bar */
    .card-accent {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 3px;
    }

    /* Preview label */
    .preview-hint {
      font-size: .68rem;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ── Print styles ── */
    @media print {
      body { background: #fff; }
      header, .form-panel, .preview-hint { display: none; }
      main { grid-template-columns: 1fr; }
      .preview-panel {
        padding: 0;
        background: #fff;
        display: block;
      }
      .preview-panel::before { display: none; }
      .card-wrap { margin: 0 auto; }
      .card { transform: none !important; box-shadow: none !important; }
    }
  </style>
</head>
<body>

<header>
  <h1>名刺メーカー</h1>
  <p>Business Card Generator</p>
</header>

<main>
  <!-- ── Form ── -->
  <div class="form-panel">

    <div>
      <p class="form-section-title">基本情報</p>
      <div class="fields">
        <div class="field">
          <label>お名前</label>
          <input id="f-name"    type="text" placeholder="山田 太郎" oninput="update()">
        </div>
        <div class="field">
          <label>役職 / 肩書き</label>
          <input id="f-title"   type="text" placeholder="代表取締役 / Senior Manager" oninput="update()">
        </div>
        <div class="field">
          <label>会社名 / 組織名</label>
          <input id="f-company" type="text" placeholder="株式会社タイタンズ" oninput="update()">
        </div>
      </div>
    </div>

    <div>
      <p class="form-section-title">連絡先</p>
      <div class="fields">
        <div class="field">
          <label>メールアドレス</label>
          <input id="f-email"   type="email" placeholder="hello@example.com" oninput="update()">
        </div>
        <div class="field">
          <label>電話番号</label>
          <input id="f-phone"   type="tel" placeholder="090-0000-0000" oninput="update()">
        </div>
        <div class="field">
          <label>ウェブサイト</label>
          <input id="f-web"     type="text" placeholder="www.example.com" oninput="update()">
        </div>
      </div>
    </div>

    <div>
      <p class="form-section-title">デザインテーマ</p>
      <div class="theme-selector">
        <div class="theme-swatches">
          <div class="swatch active" data-theme="classic" onclick="setTheme('classic', this)">
            <div class="swatch-dot"></div>
            <span>Classic</span>
          </div>
          <div class="swatch" data-theme="noir" onclick="setTheme('noir', this)">
            <div class="swatch-dot"></div>
            <span>Noir</span>
          </div>
          <div class="swatch" data-theme="terra" onclick="setTheme('terra', this)">
            <div class="swatch-dot"></div>
            <span>Terra</span>
          </div>
        </div>
      </div>
    </div>

    <div class="actions">
      <button class="btn" onclick="clearForm()">クリア</button>
      <button class="btn btn-primary" onclick="printCard()">印刷 / 保存</button>
    </div>

  </div>

  <!-- ── Preview ── -->
  <div class="preview-panel">
    <div class="card-wrap">
      <div class="card" id="card" data-theme="classic">
        <div class="card-inner">
          <div class="card-top">
            <div class="card-identity">
              <div class="card-name empty" id="c-name">Your Name</div>
              <div class="card-title empty" id="c-title">Position</div>
              <div class="card-company empty" id="c-company">Company</div>
            </div>
            <div class="card-initial" id="c-initial">—</div>
          </div>
          <div class="card-bottom">
            <div class="card-divider"></div>
            <div class="card-contacts">
              <div class="card-mono empty" id="c-email">email</div>
              <div class="card-mono empty" id="c-phone">phone</div>
              <div class="card-mono empty" id="c-web">website</div>
            </div>
          </div>
        </div>
        <div class="card-accent"></div>
      </div>
    </div>
    <p class="preview-hint">ホバーでプレビューエフェクト</p>
  </div>
</main>

<script>
  let currentTheme = 'classic';

  function val(id) { return document.getElementById(id).value.trim(); }

  function setText(id, text, fallback) {
    const el = document.getElementById(id);
    if (text) {
      el.textContent = text;
      el.classList.remove('empty');
    } else {
      el.textContent = fallback;
      el.classList.add('empty');
    }
  }

  function update() {
    const name    = val('f-name');
    const title   = val('f-title');
    const company = val('f-company');
    const email   = val('f-email');
    const phone   = val('f-phone');
    const web     = val('f-web');

    setText('c-name',    name,    'Your Name');
    setText('c-title',   title,   'Position');
    setText('c-company', company, 'Company');
    setText('c-email',   email,   'email');
    setText('c-phone',   phone,   'phone');
    setText('c-web',     web,     'website');

    // Initial circle
    const init = document.getElementById('c-initial');
    if (name) {
      const parts = name.split(/[\s　]+/).filter(Boolean);
      if (parts.length >= 2) {
        init.textContent = parts[0][0] + parts[parts.length - 1][0];
      } else {
        init.textContent = name[0];
      }
      init.style.opacity = '1';
    } else {
      init.textContent = '—';
      init.style.opacity = '.3';
    }
  }

  function setTheme(theme, el) {
    document.getElementById('card').dataset.theme = theme;
    currentTheme = theme;
    document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
    el.classList.add('active');
  }

  function clearForm() {
    ['f-name','f-title','f-company','f-email','f-phone','f-web'].forEach(id => {
      document.getElementById(id).value = '';
    });
    update();
  }

  function printCard() {
    window.print();
  }

  update();
</script>
</body>
</html>
