<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Neon Street Brawl</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; user-select: none; touch-action: none; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; background: #090a12; color: #f5f7ff; font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", sans-serif; }
    #screen { position: fixed; inset: 0; width: 100%; height: 100%; height: -webkit-fill-available; }
    #gameCanvas { display: block; width: 100%; height: 100%; }
    #hud {
      position: fixed; inset: 10px 10px auto 10px; z-index: 3; pointer-events: none;
      display: grid; grid-template-columns: 1fr auto; gap: 8px;
      text-shadow: 0 2px 8px rgba(0,0,0,.65); font-weight: 700;
    }
    #bars { display: flex; flex-direction: column; gap: 5px; min-width: 220px; }
    .bar { height: 14px; border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.12); border-radius: 999px; overflow: hidden; }
    .fill { height: 100%; width: 100%; transform-origin: left center; }
    #hpFill { background: linear-gradient(90deg,#ff6a7d,#ff314f); }
    #spFill { background: linear-gradient(90deg,#ffe66f,#ff9f43); }
    #progressFill { background: linear-gradient(90deg,#78f0ff,#4ea1ff); }
    #meta { text-align: right; font-size: 14px; line-height: 1.35; white-space: pre-line; }
    #overlay {
      position: fixed; inset: 0; z-index: 6; display: grid; place-items: center;
      background: radial-gradient(circle at center, rgba(20,22,38,.8), rgba(8,8,12,.95));
      text-align: center; padding: 20px;
    }
    #panel {
      max-width: 680px; width: min(92vw, 680px); border: 1px solid rgba(255,255,255,.28);
      background: rgba(14,16,28,.84); padding: 20px 20px 14px; border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,.4);
    }
    #title { margin: 0 0 10px; font-size: clamp(28px, 5vw, 48px); letter-spacing: .04em; }
    #desc { margin: 0; line-height: 1.7; color: #d7e4ff; font-size: 15px; white-space: pre-line; }
    #startBtn {
      margin-top: 14px; border: none; border-radius: 999px; font-size: 18px; font-weight: 700;
      color: #091020; background: linear-gradient(90deg,#8dffea,#77d0ff); padding: 12px 28px;
    }
    #virtual-controls {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
      display: flex; justify-content: space-between; align-items: flex-end;
      gap: 14px; padding: 10px max(12px, env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      pointer-events: none;
    }
    .cluster { display: grid; gap: 8px; pointer-events: auto; }
    .dpad { grid-template-columns: repeat(3, 54px); grid-template-rows: repeat(3, 54px); }
    .act { grid-template-columns: repeat(3, 70px); }
    .ghost { visibility: hidden; }
    button.ctrl {
      border: 1px solid rgba(255,255,255,.35); border-radius: 14px;
      background: rgba(8,10,20,.42); color: #e8f6ff; font-weight: 700; font-size: 20px;
      backdrop-filter: blur(3px);
    }
    button.ctrl:active { transform: scale(.96); background: rgba(108,180,255,.45); }
    .act .ctrl { height: 70px; font-size: 18px; }
    .small { font-size: 11px; display: block; opacity: .8; margin-top: 2px; font-weight: 500; }
    #combo {
      position: fixed; right: 14px; top: 92px; z-index: 4; pointer-events: none;
      color: #fff4a8; font-size: clamp(24px, 5vw, 54px); font-weight: 900;
      text-shadow: 0 0 12px rgba(255,214,79,.85), 0 3px 0 #601d3a;
      transform-origin: right center; opacity: 0;
    }
    #combo.show { opacity: 1; animation: pop .18s ease-out; }
    @keyframes pop { from { transform: scale(.72) rotate(-4deg); } to { transform: scale(1) rotate(0); } }
    @media (min-width: 960px) { #virtual-controls { opacity: .35; } }
  </style>
</head>
<body>
  <div id="screen">
    <canvas id="gameCanvas"></canvas>
  </div>

  <div id="hud">
    <div id="bars">
      <div>HP</div>
      <div class="bar"><div class="fill" id="hpFill"></div></div>
      <div>必殺</div>
      <div class="bar"><div class="fill" id="spFill"></div></div>
      <div>ステージ進行</div>
      <div class="bar"><div class="fill" id="progressFill"></div></div>
    </div>
    <div id="meta"></div>
  </div>
  <div id="combo"></div>

  <div id="overlay">
    <div id="panel">
      <h1 id="title">NEON STREET BRAWL</h1>
      <p id="desc"></p>
      <button id="startBtn" type="button">スタート</button>
    </div>
  </div>

  <div id="virtual-controls">
    <div class="cluster dpad">
      <button class="ctrl ghost">·</button>
      <button class="ctrl" id="cv-up" type="button">↑</button>
      <button class="ctrl ghost">·</button>
      <button class="ctrl" id="cv-left" type="button">←</button>
      <button class="ctrl ghost">·</button>
      <button class="ctrl" id="cv-right" type="button">→</button>
      <button class="ctrl ghost">·</button>
      <button class="ctrl" id="cv-down" type="button">↓</button>
      <button class="ctrl ghost">·</button>
    </div>
    <div class="cluster act">
      <button class="ctrl" id="cv-special" type="button">BURST<span class="small">C</span></button>
      <button class="ctrl" id="cv-jump" type="button">DASH<span class="small">X</span></button>
      <button class="ctrl" id="cv-attack" type="button">ATTACK<span class="small">Z</span></button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const overlay = document.getElementById("overlay");
    const titleEl = document.getElementById("title");
    const descEl = document.getElementById("desc");
    const startBtn = document.getElementById("startBtn");
    const hpFill = document.getElementById("hpFill");
    const spFill = document.getElementById("spFill");
    const progressFill = document.getElementById("progressFill");
    const metaEl = document.getElementById("meta");
    const comboEl = document.getElementById("combo");

    let audioCtx = null;
    const key = {};
    let screenW = innerWidth;
    let screenH = innerHeight;
    let dpr = 1;
    let game = null;
    let lastTs = 0;

    const STAGES = [
      { name: "STAGE 1 / BACK ALLEY", bg1: "#101426", bg2: "#26376a", neon: "#58e6ff", accent: "#ff4f92", encounters: [{ x: 520, count: 4, hp: 24, speed: 78 }, { x: 1060, count: 5, hp: 30, speed: 88 }, { x: 1600, count: 6, hp: 34, speed: 96 }], width: 2100 },
      { name: "STAGE 2 / SUBWAY BLOCK", bg1: "#15142a", bg2: "#4b2263", neon: "#d46dff", accent: "#ffce5c", encounters: [{ x: 560, count: 5, hp: 34, speed: 96 }, { x: 1160, count: 6, hp: 40, speed: 104 }, { x: 1760, count: 7, hp: 45, speed: 112 }], width: 2280 },
      { name: "STAGE 3 / SKYLINE BRIDGE", bg1: "#0e1221", bg2: "#273f69", neon: "#7dffbe", accent: "#ff783f", encounters: [{ x: 640, count: 6, hp: 42, speed: 112 }, { x: 1360, count: 7, hp: 48, speed: 118 }, { x: 2020, count: 1, hp: 330, speed: 96, boss: true }], width: 2500 }
    ];
    const MAX_PARTICLES = /iPhone|iPad|Android/.test(navigator.userAgent) ? 90 : 190;
    const ENEMY_TYPES = [
      { kind: "rush", color: "#ff5f86", hp: 0, speed: 14, score: 110 },
      { kind: "guard", color: "#ffbd5f", hp: 18, speed: -8, score: 140 },
      { kind: "blade", color: "#b66cff", hp: -4, speed: 26, score: 130 }
    ];

    function unlockAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
    }
    function playTone(freq, ms, type = "square", vol = 0.04) {
      if (!audioCtx) return;
      const t = audioCtx.currentTime;
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type;
      o.frequency.value = freq;
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + ms / 1000);
      o.connect(g).connect(audioCtx.destination);
      o.start(t);
      o.stop(t + ms / 1000);
    }

    function resizeCanvas() {
      dpr = Math.min(devicePixelRatio || 1, 2);
      screenW = innerWidth;
      screenH = innerHeight;
      canvas.width = Math.floor(screenW * dpr);
      canvas.height = Math.floor(screenH * dpr);
      canvas.style.width = `${screenW}px`;
      canvas.style.height = `${screenH}px`;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function bindPointer(id, codes) {
      const el = document.getElementById(id);
      el.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        el.setPointerCapture(e.pointerId);
        codes.forEach((c) => (key[c] = true));
        unlockAudio();
      });
      el.addEventListener("pointerup", () => codes.forEach((c) => (key[c] = false)));
      el.addEventListener("pointercancel", () => codes.forEach((c) => (key[c] = false)));
    }

    function setupInput() {
      addEventListener("keydown", (e) => {
        key[e.code] = true;
        if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space", "KeyZ", "KeyX", "KeyC", "KeyA", "KeyS", "KeyD", "KeyW"].includes(e.code)) e.preventDefault();
        unlockAudio();
      }, { passive: false });
      addEventListener("keyup", (e) => { key[e.code] = false; });

      let lastTap = 0;
      document.addEventListener("touchstart", (e) => {
        const now = Date.now();
        if (now - lastTap < 300) e.preventDefault();
        lastTap = now;
      }, { passive: false });
      document.addEventListener("dblclick", (e) => e.preventDefault());
      document.addEventListener("contextmenu", (e) => e.preventDefault());

      bindPointer("cv-left", ["ArrowLeft", "KeyA"]);
      bindPointer("cv-right", ["ArrowRight", "KeyD"]);
      bindPointer("cv-up", ["ArrowUp", "KeyW"]);
      bindPointer("cv-down", ["ArrowDown", "KeyS"]);
      bindPointer("cv-attack", ["KeyZ", "Space"]);
      bindPointer("cv-jump", ["KeyX"]);
      bindPointer("cv-special", ["KeyC"]);
    }

    function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
    function rand(a, b) { return Math.random() * (b - a) + a; }
    function mmss(ms) {
      const total = Math.floor(ms / 1000);
      const m = Math.floor(total / 60).toString().padStart(2, "0");
      const s = (total % 60).toString().padStart(2, "0");
      return `${m}:${s}`;
    }

    function addSpark(x, y, color, count = 12, power = 1) {
      if (!game) return;
      for (let i = 0; i < count && game.particles.length < MAX_PARTICLES; i++) {
        const a = rand(-Math.PI, Math.PI);
        const s = rand(70, 260) * power;
        game.particles.push({
          x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s * 0.55,
          life: rand(0.22, 0.52), max: 0.52, size: rand(2, 7) * power, color
        });
      }
    }

    function addText(x, y, text, color = "#fff4a8") {
      game.floaters.push({ x, y, text, color, life: 0.7 });
    }

    function addShake(amount, time = 0.18) {
      game.shake = Math.max(game.shake, amount);
      game.shakeTime = Math.max(game.shakeTime, time);
    }

    function updateEffects(dt) {
      game.shakeTime = Math.max(0, game.shakeTime - dt);
      if (game.shakeTime <= 0) game.shake = 0;
      for (const p of game.particles) {
        p.life -= dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vx *= 0.92;
        p.vy *= 0.92;
      }
      game.particles = game.particles.filter((p) => p.life > 0);
      for (const f of game.floaters) {
        f.life -= dt;
        f.y -= 44 * dt;
      }
      game.floaters = game.floaters.filter((f) => f.life > 0);
      if (game.comboTimer > 0) game.comboTimer -= dt;
      else game.combo = 0;
    }

    function addCombo(x, y, gain = 1) {
      game.combo += gain;
      game.comboTimer = 2.2;
      game.superMeter = clamp(game.superMeter + 5 + game.combo * 0.35, 0, 100);
      if (game.combo >= 3) {
        comboEl.textContent = `${game.combo} HIT`;
        comboEl.classList.remove("show");
        void comboEl.offsetWidth;
        comboEl.classList.add("show");
      }
      addText(x, y - 38, `${game.combo}HIT`, game.combo >= 8 ? "#ffef6a" : "#dff8ff");
    }

    function resetGame() {
      game = {
        phase: "title",
        player: { x: 190, y: 330, hp: 120, maxHp: 120, facing: 1, attackTimer: 0, attackHitDone: false, attackStep: 0, chainTimer: 0, dodgeTimer: 0, hitTimer: 0, specialTimer: 0 },
        stageI: 0,
        stage: null,
        enemies: [],
        camX: 0,
        startedAt: 0,
        clearAt: 0,
        score: 0,
        superMeter: 35,
        combo: 0,
        comboTimer: 0,
        particles: [],
        floaters: [],
        shake: 0,
        shakeTime: 0
      };
      startStage(0, true);
      showOverlay("NEON STREET BRAWL: OVERDRIVE", "5分前後でクリア可能な3面ベルトスクロールです。\n移動: 矢印キー / WASD\n攻撃: Z / Space（連打で3段コンボ）\nダッシュ: X\n必殺: C（ゲージ消費）\n\n敵を浮かせるように殴り、コンボと必殺で3面ボスを倒してください。", "スタート");
    }

    function startStage(index, isInitial = false) {
      const spec = STAGES[index];
      game.stageI = index;
      game.stage = {
        ...spec,
        encounters: spec.encounters.map((e) => ({ ...e, done: false, active: false })),
        lockRight: null
      };
      game.enemies = [];
      game.player.x = 180;
      game.player.y = 330;
      if (!isInitial) game.player.hp = Math.min(game.player.maxHp, game.player.hp + 22);
      game.camX = 0;
    }

    function spawnEncounter(enc) {
      const midY = 330;
      for (let i = 0; i < enc.count; i++) {
        const isBoss = !!enc.boss;
        const archetype = isBoss ? { kind: "boss", color: "#ff8d43", hp: 0, speed: 0, score: 1500 } : ENEMY_TYPES[(i + game.stageI) % ENEMY_TYPES.length];
        const hp = isBoss ? enc.hp : Math.max(18, enc.hp + archetype.hp + rand(-4, 5));
        game.enemies.push({
          x: enc.x + rand(-95, 95),
          y: midY + rand(-70, 70),
          hp,
          maxHp: hp,
          speed: isBoss ? enc.speed : enc.speed + archetype.speed + rand(-8, 8),
          facing: -1,
          attackCD: rand(0.1, 0.8),
          hitTimer: 0,
          windup: 0,
          striking: false,
          dead: false,
          boss: isBoss,
          kind: archetype.kind,
          color: archetype.color,
          score: archetype.score
        });
      }
      enc.active = true;
      game.stage.lockRight = enc.x + 240;
      addShake(6, 0.16);
      addText(enc.x, 250, "DANGER", game.stage.accent);
    }

    function updateStageFlow() {
      const stage = game.stage;
      for (const enc of stage.encounters) {
        if (!enc.done && !enc.active && game.player.x > enc.x - 170) {
          spawnEncounter(enc);
          playTone(180, 130, "sawtooth", 0.06);
          break;
        }
      }

      for (const enc of stage.encounters) {
        if (enc.active) {
          const aliveHere = game.enemies.some((e) => !e.dead);
          if (!aliveHere) {
            enc.active = false;
            enc.done = true;
            game.stage.lockRight = null;
            game.score += enc.boss ? 1400 : 450;
            addSpark(enc.x, 290, game.stage.neon, 30, 1.15);
            addText(enc.x, 260, "AREA CLEAR", "#8dffea");
            playTone(510, 120, "triangle", 0.05);
            playTone(740, 130, "triangle", 0.04);
          }
        }
      }

      const allDone = stage.encounters.every((e) => e.done);
      if (allDone && game.player.x > stage.width - 140) {
        if (game.stageI < STAGES.length - 1) {
          startStage(game.stageI + 1);
          showOverlay(STAGES[game.stageI].name, "ステージ開始。コンボを切らさず、必殺ゲージを温存しながら右端へ進んでください。", "続行");
          game.phase = "paused";
        } else {
          game.phase = "clear";
          game.clearAt = performance.now();
          showOverlay("MISSION CLEAR", `クリアタイム: ${mmss(game.clearAt - game.startedAt)}\nSCORE: ${Math.floor(game.score)}\n\n5分以内クリアを狙うなら、ダッシュで間合い管理すると安定します。`, "リスタート");
        }
      }
    }

    function hurtPlayer(dmg) {
      if (game.player.hitTimer > 0 || game.player.dodgeTimer > 0) return;
      game.player.hp = Math.max(0, game.player.hp - dmg);
      game.player.hitTimer = 0.45;
      game.combo = 0;
      game.comboTimer = 0;
      comboEl.classList.remove("show");
      addShake(9, 0.2);
      addSpark(game.player.x, game.player.y - 26, "#ff5f86", 16, 0.9);
      addText(game.player.x, game.player.y - 52, `-${dmg}`, "#ff8ca1");
      playTone(130, 110, "square", 0.06);
      if (game.player.hp <= 0) {
        game.phase = "gameover";
        showOverlay("GAME OVER", "倒されました。もう一度挑戦しますか？", "リトライ");
      }
    }

    function playerAttack() {
      if (game.player.attackTimer > 0 || game.player.hitTimer > 0) return;
      if (game.player.chainTimer <= 0) game.player.attackStep = 0;
      else game.player.attackStep = (game.player.attackStep + 1) % 3;
      game.player.chainTimer = 0.58;
      game.player.attackTimer = game.player.attackStep === 2 ? 0.26 : 0.18;
      game.player.attackHitDone = false;
      playTone(360 + game.player.attackStep * 95, 70, "square", 0.05);
    }

    function playerSpecial() {
      const p = game.player;
      if (game.superMeter < 100 || p.specialTimer > 0 || p.hitTimer > 0) return;
      game.superMeter = 0;
      p.specialTimer = 0.42;
      addShake(18, 0.32);
      addSpark(p.x, p.y - 34, "#fff176", 62, 1.35);
      playTone(180, 160, "sawtooth", 0.08);
      playTone(760, 190, "triangle", 0.06);
      for (const e of game.enemies) {
        if (e.dead) continue;
        const dx = e.x - p.x;
        const dy = e.y - p.y;
        if (Math.abs(dx) < 220 && Math.abs(dy) < 105) {
          const dmg = e.boss ? 42 : 58;
          e.hp -= dmg;
          e.hitTimer = 0.5;
          e.x += Math.sign(dx || p.facing) * 70;
          addCombo(e.x, e.y, 2);
          addSpark(e.x, e.y - 26, "#fff176", 24, 1.2);
          addText(e.x, e.y - 70, "BURST", "#fff176");
          if (e.hp <= 0) {
            e.dead = true;
            game.score += e.score || 200;
          }
        }
      }
    }

    function updatePlayer(dt) {
      const p = game.player;
      p.attackTimer = Math.max(0, p.attackTimer - dt);
      p.chainTimer = Math.max(0, p.chainTimer - dt);
      p.dodgeTimer = Math.max(0, p.dodgeTimer - dt);
      p.hitTimer = Math.max(0, p.hitTimer - dt);
      p.specialTimer = Math.max(0, p.specialTimer - dt);

      let mx = 0;
      let my = 0;
      if (key.ArrowLeft || key.KeyA) mx -= 1;
      if (key.ArrowRight || key.KeyD) mx += 1;
      if (key.ArrowUp || key.KeyW) my -= 1;
      if (key.ArrowDown || key.KeyS) my += 1;

      if ((key.KeyX) && p.dodgeTimer <= 0 && p.attackTimer <= 0) {
        p.dodgeTimer = 0.22;
        playTone(620, 55, "triangle", 0.04);
      }

      if ((key.KeyZ || key.Space) && p.attackTimer <= 0) {
        playerAttack();
      }
      if (key.KeyC) {
        playerSpecial();
      }

      const len = Math.hypot(mx, my) || 1;
      mx /= len;
      my /= len;
      const spd = p.dodgeTimer > 0 ? 420 : 205;
      if (mx !== 0) p.facing = mx > 0 ? 1 : -1;

      p.x += mx * spd * dt;
      p.y += my * spd * dt * 0.65;
      p.y = clamp(p.y, 230, 440);
      p.x = clamp(p.x, 50, game.stage.width - 60);
      if (game.stage.lockRight != null) p.x = Math.min(p.x, game.stage.lockRight);

      if (p.attackTimer > 0 && !p.attackHitDone && p.attackTimer < 0.12) {
        p.attackHitDone = true;
        const reach = p.attackStep === 2 ? 86 : 64;
        const height = p.attackStep === 2 ? 48 : 38;
        const rx = p.x + p.facing * reach;
        for (const e of game.enemies) {
          if (e.dead) continue;
          const dx = e.x - rx;
          const dy = e.y - p.y;
          if (Math.abs(dx) < reach && Math.abs(dy) < height) {
            const dmg = p.attackStep === 2 ? (e.boss ? 24 : 34) : (e.boss ? 16 : 22);
            e.hp -= dmg;
            e.hitTimer = 0.24;
            e.x += p.facing * (p.attackStep === 2 ? 58 : 30);
            addShake(p.attackStep === 2 ? 10 : 5, 0.12);
            addSpark(e.x, e.y - 28, p.attackStep === 2 ? "#fff176" : game.stage.neon, p.attackStep === 2 ? 24 : 13, 1);
            addCombo(e.x, e.y);
            addText(e.x, e.y - 56, `${dmg}`, "#dff8ff");
            if (e.hp <= 0) {
              e.dead = true;
              game.score += e.boss ? 1600 : e.score;
              addSpark(e.x, e.y - 22, game.stage.accent, e.boss ? 54 : 26, e.boss ? 1.6 : 1);
              playTone(900, 70, "sawtooth", 0.05);
            } else {
              playTone(520, 45, "square", 0.03);
            }
          }
        }
      }
    }

    function updateEnemies(dt) {
      const p = game.player;
      for (const e of game.enemies) {
        if (e.dead) continue;
        e.hitTimer = Math.max(0, e.hitTimer - dt);
        e.attackCD -= dt;

        const dx = p.x - e.x;
        const dy = p.y - e.y;
        const dist = Math.hypot(dx, dy * 1.5);
        e.facing = dx >= 0 ? 1 : -1;
        e.windup = Math.max(0, e.windup - dt);

        if (e.hitTimer <= 0) {
          if (e.windup > 0) {
            continue;
          }
          if (e.striking) {
            const damage = e.boss ? 18 : e.kind === "guard" ? 12 : 9;
            hurtPlayer(damage);
            e.striking = false;
            e.attackCD = e.boss ? rand(0.9, 1.25) : rand(1.05, 1.6);
            continue;
          }
          const attackRange = e.boss ? 78 : e.kind === "blade" ? 66 : 54;
          if (dist > attackRange) {
            const nx = dx / (Math.hypot(dx, dy) || 1);
            const ny = dy / (Math.hypot(dx, dy) || 1);
            const flank = e.kind === "blade" ? Math.sin(performance.now() * 0.004 + e.x) * 28 : 0;
            e.x += nx * e.speed * dt;
            e.y += (ny * e.speed + flank) * dt * 0.6;
          } else if (e.attackCD <= 0) {
            e.windup = e.boss ? 0.22 : 0.14;
            e.striking = true;
          }
        }
      }
      game.enemies = game.enemies.filter((e) => !(e.dead && Math.random() < 0.06));
    }

    function drawBackground() {
      const st = game.stage;
      const g = ctx.createLinearGradient(0, 0, 0, screenH);
      g.addColorStop(0, st.bg2);
      g.addColorStop(1, st.bg1);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, screenW, screenH);

      const horizonY = 175;
      for (let i = 0; i < 12; i++) {
        const x = ((i * 380 - game.camX * 0.35) % (screenW + 200)) - 100;
        const w = 100 + (i % 3) * 34;
        const h = 120 + (i % 4) * 28;
        ctx.fillStyle = "rgba(120,140,255,0.16)";
        ctx.fillRect(x, horizonY - h, w, h);
        ctx.fillStyle = i % 2 ? st.neon : st.accent;
        ctx.globalAlpha = 0.28;
        ctx.fillRect(x + 12, horizonY - h + 28, w - 24, 3);
        ctx.globalAlpha = 1;
      }

      ctx.fillStyle = "rgba(14,16,28,0.95)";
      ctx.fillRect(0, 210, screenW, screenH - 210);
      const t = performance.now() * 0.001;
      for (let i = 0; i < 38; i++) {
        const sx = ((i * 157 - game.camX * (0.7 + (i % 3) * 0.1)) % (screenW + 240)) - 120;
        const sy = 60 + ((i * 43 + Math.sin(t + i) * 12) % 130);
        ctx.fillStyle = i % 3 ? "rgba(255,255,255,.18)" : `${st.neon}55`;
        ctx.fillRect(sx, sy, i % 4 === 0 ? 16 : 4, 2);
      }
      for (let i = 0; i < 28; i++) {
        const lx = ((i * 120 - game.camX) % 140) * 1.2;
        ctx.fillStyle = i % 2 ? "rgba(114,183,255,0.2)" : `${st.neon}44`;
        ctx.fillRect(lx, 312 + (i % 4) * 38, 68, 2);
      }
      const road = ctx.createLinearGradient(0, 250, 0, screenH);
      road.addColorStop(0, "rgba(255,255,255,.08)");
      road.addColorStop(1, "rgba(0,0,0,.32)");
      ctx.fillStyle = road;
      ctx.fillRect(0, 250, screenW, screenH - 250);
    }

    function drawEntity(x, y, w, h, color, facing, attacking, hurt, windup = 0, special = 0) {
      const sx = x - game.camX;
      ctx.save();
      ctx.translate(sx, y);
      if (hurt > 0) ctx.globalAlpha = 0.6 + Math.sin(performance.now() * 0.03) * 0.4;
      ctx.fillStyle = "rgba(0,0,0,0.3)";
      ctx.fillRect(-w * 0.5, h * 0.45, w, 10);
      if (special > 0) {
        ctx.strokeStyle = "rgba(255,241,118,.9)";
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.arc(0, -h * 0.18, 48 + Math.sin(performance.now() * 0.03) * 8, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.fillStyle = color;
      ctx.fillRect(-w * 0.45, -h * 0.6, w * 0.9, h);
      ctx.fillStyle = "rgba(255,255,255,.18)";
      ctx.fillRect(-w * 0.3, -h * 0.52, w * 0.18, h * 0.72);
      ctx.fillStyle = "#f3f7ff";
      ctx.fillRect((facing > 0 ? 8 : -14), -h * 0.42, 6, 6);
      if (windup > 0) {
        ctx.strokeStyle = "#ffef6a";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, -h * 0.72, 10 + Math.sin(performance.now() * 0.04) * 4, 0, Math.PI * 2);
        ctx.stroke();
      }
      if (attacking) {
        const grad = ctx.createLinearGradient(facing > 0 ? 18 : -72, 0, facing > 0 ? 84 : -18, 0);
        grad.addColorStop(0, "rgba(255,255,255,0)");
        grad.addColorStop(0.5, "rgba(153,238,255,0.95)");
        grad.addColorStop(1, "rgba(255,241,118,0)");
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.ellipse(facing > 0 ? 52 : -52, -h * 0.28, 46, 18, -0.2 * facing, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function drawWorld() {
      ctx.save();
      if (game.shake > 0) {
        ctx.translate(rand(-game.shake, game.shake), rand(-game.shake, game.shake));
      }
      drawBackground();
      const list = [
        ...game.enemies.map((e) => ({ type: "enemy", y: e.y, ref: e })),
        { type: "player", y: game.player.y, ref: game.player }
      ].sort((a, b) => a.y - b.y);

      for (const it of list) {
        if (it.type === "player") {
          drawEntity(game.player.x, game.player.y, 38, 64, "#56e9ff", game.player.facing, game.player.attackTimer > 0, game.player.hitTimer, 0, game.player.specialTimer);
        } else {
          const e = it.ref;
          drawEntity(e.x, e.y, e.boss ? 62 : 38, e.boss ? 96 : 64, e.color, e.facing, e.striking, e.hitTimer, e.windup);
          if (e.boss) {
            const x = e.x - game.camX - 30;
            ctx.fillStyle = "rgba(255,255,255,0.18)";
            ctx.fillRect(x, e.y - 72, 60, 5);
            ctx.fillStyle = "#ffc65c";
            ctx.fillRect(x, e.y - 72, 60 * (e.hp / e.maxHp), 5);
          }
        }
      }

      const st = game.stage;
      if (st.lockRight != null) {
        const gx = st.lockRight - game.camX;
        ctx.fillStyle = "rgba(255,122,154,0.5)";
        ctx.fillRect(gx, 200, 5, 260);
      }
      const allDone = st.encounters.every((e) => e.done);
      if (allDone) {
        const gx = st.width - 90 - game.camX;
        ctx.fillStyle = "rgba(140,255,220,0.45)";
        ctx.fillRect(gx, 220, 28, 240);
        ctx.fillStyle = "#d6fff7";
        ctx.font = "12px sans-serif";
        ctx.fillText("EXIT", gx - 2, 214);
      }
      drawEffects();
      ctx.restore();
    }

    function drawEffects() {
      for (const p of game.particles) {
        const a = clamp(p.life / p.max, 0, 1);
        ctx.save();
        ctx.globalAlpha = a;
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.arc(p.x - game.camX, p.y, p.size * a, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      for (const f of game.floaters) {
        ctx.save();
        ctx.globalAlpha = clamp(f.life / 0.7, 0, 1);
        ctx.fillStyle = f.color;
        ctx.font = "900 18px sans-serif";
        ctx.textAlign = "center";
        ctx.shadowColor = "rgba(0,0,0,.7)";
        ctx.shadowBlur = 6;
        ctx.fillText(f.text, f.x - game.camX, f.y);
        ctx.restore();
      }
    }

    function updateHUD(now) {
      hpFill.style.transform = `scaleX(${game.player.hp / game.player.maxHp})`;
      spFill.style.transform = `scaleX(${game.superMeter / 100})`;
      const done = game.stage.encounters.filter((e) => e.done).length;
      progressFill.style.transform = `scaleX(${done / game.stage.encounters.length})`;
      const elapsed = game.startedAt ? mmss(now - game.startedAt) : "00:00";
      metaEl.textContent = `${STAGES[game.stageI].name}\nTIME ${elapsed}\nSCORE ${Math.floor(game.score)}`;
      if (game.combo < 3) comboEl.classList.remove("show");
    }

    function showOverlay(title, desc, btn) {
      titleEl.textContent = title;
      descEl.textContent = desc;
      startBtn.textContent = btn;
      overlay.style.display = "grid";
    }

    function hideOverlay() {
      overlay.style.display = "none";
    }

    function frame(ts) {
      const dt = Math.min(0.033, (ts - lastTs) / 1000 || 0);
      lastTs = ts;

      if (game.phase === "playing") {
        updatePlayer(dt);
        updateEnemies(dt);
        updateStageFlow();
        updateEffects(dt);
        game.camX = clamp(game.player.x - screenW * 0.38, 0, game.stage.width - screenW);
      }
      drawWorld();
      updateHUD(ts);
      requestAnimationFrame(frame);
    }

    startBtn.addEventListener("click", () => {
      unlockAudio();
      if (game.phase === "title") {
        game.phase = "playing";
        game.startedAt = performance.now();
      } else if (game.phase === "paused") {
        game.phase = "playing";
      } else {
        resetGame();
        game.phase = "playing";
        game.startedAt = performance.now();
      }
      hideOverlay();
    });

    addEventListener("resize", resizeCanvas);
    document.addEventListener("pointerdown", unlockAudio, { once: true });
    setupInput();
    resizeCanvas();
    resetGame();
    requestAnimationFrame((ts) => { lastTs = ts; requestAnimationFrame(frame); });
  </script>
</body>
</html>
