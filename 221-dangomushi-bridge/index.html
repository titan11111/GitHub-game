<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ダンゴムシの谷渡り</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#12161d;color:#dfe5ee;
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;overscroll-behavior:none}
#app{height:100%;display:flex;flex-direction:column;align-items:center;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{width:100%;max-width:400px;padding:8px 14px 4px;display:flex;justify-content:space-between;align-items:baseline}
h1{font-size:15px;letter-spacing:.06em;font-weight:700;color:#e8eef8}
#phase{font-size:11px;color:#8d9ab0;letter-spacing:.08em}
#stage{position:relative;flex:1;display:flex;align-items:center;justify-content:center;width:100%}
canvas{display:block;max-width:100%;max-height:100%;image-rendering:auto}
footer{width:100%;max-width:400px;padding:6px 10px 12px}
#pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
button{border:0;border-radius:12px;padding:15px 0;font-size:19px;font-weight:700;
  background:#28303d;color:#cfd8e6;box-shadow:0 3px 0 #171d26;transition:transform .05s,background .12s}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #171d26;background:#333d4d}
button:disabled{opacity:.3}
#msg{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(10,13,18,.86);backdrop-filter:blur(3px);text-align:center;padding:24px;gap:14px}
#msg.on{display:flex}
#mt{font-size:26px;font-weight:800;letter-spacing:.04em}
#ms{font-size:13px;line-height:1.7;color:#a9b6c9;max-width:300px}
#again{background:#3d6ea8;color:#fff;padding:13px 30px;font-size:15px;border-radius:999px;box-shadow:0 3px 0 #24466b}
#hint{font-size:11px;color:#79879d;text-align:center;padding:5px 0 0;min-height:16px}
</style>
</head>
<body>
<div id="app">
  <header><h1>ダンゴムシの谷渡り</h1><span id="phase">のこり 14</span></header>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="msg"><div id="mt"></div><div id="ms"></div><button id="again">もう一度</button></div>
  </div>
  <footer>
    <div id="pad">
      <button id="bL">◀</button><button id="bR">▶</button><button id="bT">↻</button><button id="bD">⤓</button>
    </div>
    <div id="hint">短い辺が抜けて道になる。長い辺は壁のまま残る。</div>
  </footer>
</div>
<script>
const COLS=10, ROWS=13, TOTAL=18;
const TW=34, TD=20, BH=14, OX=10, OY=34;
const CW=COLS*TW+OX*2, CH=OY+ROWS*TD+BH+62;

const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
function fit(){const d=Math.min(window.devicePixelRatio||1,3);cv.width=CW*d;cv.height=CH*d;
  cv.style.width=CW+'px';cv.style.height=CH+'px';ctx.setTransform(d,0,0,d,0,0);}
fit(); addEventListener('resize',fit);

const SHAPES={
 I:{m:[[1,1,1,1]],            c:'#4FC3E8'},
 O:{m:[[1,1],[1,1]],          c:'#F2C14E'},
 T:{m:[[0,1,0],[1,1,1]],      c:'#B87FE0'},
 S:{m:[[0,1,1],[1,1,0]],      c:'#6FD08C'},
 Z:{m:[[1,1,0],[0,1,1]],      c:'#E8705F'},
 J:{m:[[1,0,0],[1,1,1]],      c:'#5B8DEF'},
 L:{m:[[0,0,1],[1,1,1]],      c:'#F09A4A'}};
const KEYS=Object.keys(SHAPES);

const BUG=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 80"><defs><linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#AEB9CB"/><stop offset="28%" stop-color="#7C889B"/><stop offset="62%" stop-color="#596373"/><stop offset="100%" stop-color="#333A47"/></linearGradient></defs><g stroke="#2B313C" stroke-width="3.2" stroke-linecap="round" fill="none"><path d="M30 27 L25 17"/><path d="M30 53 L25 63"/><path d="M40 24 L35 13"/><path d="M40 56 L35 67"/><path d="M50 22 L45 11"/><path d="M50 58 L45 69"/><path d="M60 21 L55 10"/><path d="M60 59 L55 70"/><path d="M70 22 L65 11"/><path d="M70 58 L65 69"/><path d="M80 23 L76 13"/><path d="M80 57 L76 67"/><path d="M89 25 L86 16"/><path d="M89 55 L86 64"/></g><rect x="16" y="25" width="24" height="30" rx="11" fill="url(#b)" stroke="#242A34" stroke-width="1.2"/><g stroke="#242A34" stroke-width="1.2"><rect x="34" y="22.5" width="12" height="35" rx="5.5" fill="url(#b)"/><rect x="44" y="21" width="12" height="38" rx="5.5" fill="url(#b)"/><rect x="54" y="20" width="12" height="40" rx="5.5" fill="url(#b)"/><rect x="64" y="20.5" width="12" height="39" rx="5.5" fill="url(#b)"/><rect x="74" y="21.5" width="12" height="37" rx="5.5" fill="url(#b)"/><rect x="83" y="23" width="11" height="34" rx="5.5" fill="url(#b)"/></g><rect x="92" y="26" width="17" height="28" rx="11.5" fill="url(#b)" stroke="#242A34" stroke-width="1.2"/><circle cx="101" cy="31.5" r="2.6" fill="#12161D"/><circle cx="101" cy="48.5" r="2.6" fill="#12161D"/><g stroke="#2B313C" stroke-width="2.6" stroke-linecap="round" fill="none"><path d="M107 32 Q118 27 123 20"/><path d="M107 48 Q118 53 123 60"/></g></svg>`;
const bugImg=new Image(); bugImg.src='data:image/svg+xml;utf8,'+encodeURIComponent(BUG);

let grid,opened,cur,pid,left,phase,bugs,bug,steps,tmr,pops,t0;

function reset(){
  grid=[...Array(ROWS)].map(()=>Array(COLS).fill(null));
  opened=[...Array(ROWS)].map(()=>Array(COLS).fill(false));
  pid=0; left=TOTAL; phase='build'; pops=[]; bugs=[]; bug=null; steps=0;
  document.getElementById('msg').classList.remove('on');
  setPad(true); spawn(); hint('短い辺が抜けて道になる。長い辺は壁のまま残る。');
}
function hdr(t){document.getElementById('phase').textContent=t;}
function hint(t){document.getElementById('hint').textContent=t;}
function setPad(on){['bL','bR','bT','bD'].forEach(i=>document.getElementById(i).disabled=!on);}

function spawn(){
  if(left<=0){ dissolve(); return; }
  const k=KEYS[(Math.random()*KEYS.length)|0];
  cur={m:SHAPES[k].m.map(r=>r.slice()), c:SHAPES[k].c, r:0, x:((COLS-SHAPES[k].m[0].length)/2)|0};
  left--; document.getElementById('phase').textContent='のこり '+(left+1);
  if(hit(cur.m,cur.r,cur.x)){ dissolve(); }
}
function hit(m,r,x){
  for(let i=0;i<m.length;i++)for(let j=0;j<m[i].length;j++){
    if(!m[i][j])continue; const R=r+i,C=x+j;
    if(C<0||C>=COLS||R>=ROWS)return true;
    if(R>=0&&grid[R][C])return true;
  } return false;
}
function lock(){
  pid++;
  for(let i=0;i<cur.m.length;i++)for(let j=0;j<cur.m[i].length;j++)
    if(cur.m[i][j]) grid[cur.r+i][cur.x+j]={c:cur.c,pid};
  blip(200,.05); spawn();
}
function step(){ if(!hit(cur.m,cur.r+1,cur.x)){cur.r++;} else lock(); }
function move(d){ if(phase!=='build')return; if(!hit(cur.m,cur.r,cur.x+d))cur.x+=d; }
function rot(){ if(phase!=='build')return;
  const m=cur.m, n=m[0].map((_,i)=>m.map(r=>r[i]).reverse());
  for(const k of [0,-1,1,-2,2]) if(!hit(n,cur.r,cur.x+k)){cur.m=n;cur.x+=k;blip(420,.03);return;}
}
function drop(){ if(phase!=='build')return; while(!hit(cur.m,cur.r+1,cur.x))cur.r++; lock(); }
function ghostRow(){ let r=cur.r; while(!hit(cur.m,r+1,cur.x))r++; return r; }

/* ── 短辺が抜ける ─────────────────────────── */
function dissolve(){
  phase='dissolve'; setPad(false); cur=null;
  const g={};
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const s=grid[r][c]; if(s)(g[s.pid]=g[s.pid]||[]).push({r,c});}
  const rm=[];
  for(const k in g){
    const cs=g[k], rs=cs.map(o=>o.r), xs=cs.map(o=>o.c);
    const r0=Math.min(...rs),r1=Math.max(...rs),c0=Math.min(...xs),c1=Math.max(...xs);
    const w=c1-c0+1,h=r1-r0+1;
    if(w===h) continue;                                        // 正方形＝短辺なし＝抜けない
    if(w<h) cs.forEach(o=>{if(o.r===r0||o.r===r1)rm.push(o);}); // 縦長→上下の短辺
    else    cs.forEach(o=>{if(o.c===c0||o.c===c1)rm.push(o);}); // 横長→左右の短辺
  }
  rm.forEach((o,i)=>{ const col=grid[o.r][o.c].c; grid[o.r][o.c]=null; opened[o.r][o.c]=true;
    pops.push({r:o.r,c:o.c,col,d:i*22}); });
  hdr('短辺が抜ける'); hint('短い辺が抜けた。ここが道になる。');
  t0=performance.now();
  setTimeout(startWalk, 700+rm.length*22);
}

/* ── ダンゴムシが渡る ─────────────────────── */
const DIRS=[[1,0],[0,1],[-1,0],[0,-1]]; // 右・下・左・上
function startWalk(){
  phase='walk';
  const entries=[]; for(let r=0;r<ROWS;r++) if(opened[r][0]) entries.push(r);
  if(!entries.length){ over(false,'橋に入口がない','左端に短辺の穴がひとつも開かなかった。<br>1列目に縦長ピースの端を残そう。'); return; }
  bugs=entries.slice(0,3); hdr('ダンゴムシ '+bugs.length+'匹'); hint('ダンゴムシが渡る。壁に当たると左右交互に曲がる。');
  next();
}
function next(){
  if(!bugs.length){ over(false,'全員おちた','濁流に流された。<br>短辺の穴が右まで繋がっていない。'); return; }
  const r=bugs.shift();
  bug={r,c:0,d:0,turn:1,fall:0,alive:true}; steps=0; hdr('のこり '+(bugs.length+1)+'匹');
  blip(660,.05);
}
function walk(){
  if(!bug) return;
  if(bug.fall>0){ bug.fall++; if(bug.fall>14){ next(); } return; }
  if(++steps>140){ bug.fall=1; return; }
  const [dx,dy]=DIRS[bug.d];
  const nc=bug.c+dx, nr=bug.r+dy;
  if(nc>=COLS){ over(true,'わたりきった！','ダンゴムシは対岸へ着いた。<br>短辺の穴が右まで繋がっていた。'); return; }
  if(nc<0||nr<0||nr>=ROWS){ bug.fall=1; blip(150,.2); return; }   // 橋の外＝落下
  if(grid[nr][nc]){                                                // 壁＝交替性転向
    bug.d=(bug.d+(bug.turn>0?1:3))%4; bug.turn*=-1; blip(330,.03); return;
  }
  if(!opened[nr][nc]){ bug.c=nc; bug.r=nr; bug.fall=1; blip(150,.2); return; } // 橋が無い＝落下
  bug.c=nc; bug.r=nr;
}
function over(win,t,s){
  phase='over'; bug=null;
  document.getElementById('mt').textContent=t;
  document.getElementById('mt').style.color=win?'#7BD88F':'#E8705F';
  document.getElementById('ms').innerHTML=s;
  document.getElementById('msg').classList.add('on');
  blip(win?880:110,.35);
}

/* ── 描画 ─────────────────────────────────── */
function shade(hex,f){const n=parseInt(hex.slice(1),16);
  const r=Math.max(0,Math.min(255,((n>>16)&255)*f))|0,g=Math.max(0,Math.min(255,((n>>8)&255)*f))|0,b=Math.max(0,Math.min(255,(n&255)*f))|0;
  return`rgb(${r},${g},${b})`;}
function box(c,r,col,a=1,lift=0){
  const x=OX+c*TW, y=OY+r*TD-lift;
  ctx.globalAlpha=a;
  ctx.fillStyle=shade(col,.45); ctx.fillRect(x,y+TD-1,TW,BH);          // 前面
  ctx.fillStyle=shade(col,.30); ctx.fillRect(x,y+TD+BH-4,TW,4);        // 底の影
  ctx.fillStyle=col; ctx.fillRect(x,y,TW,TD);                          // 天面
  ctx.fillStyle='rgba(255,255,255,.16)'; ctx.fillRect(x,y,TW,4);
  ctx.strokeStyle='rgba(10,14,20,.55)'; ctx.lineWidth=1; ctx.strokeRect(x+.5,y+.5,TW-1,TD-1);
  ctx.globalAlpha=1;
}
function plank(c,r){
  const x=OX+c*TW, y=OY+r*TD;
  ctx.fillStyle='#0d1219'; ctx.fillRect(x,y,TW,TD);                      // 抜けた穴の暗がり
  ctx.fillStyle='#d9ccab'; ctx.fillRect(x+2,y+3,TW-4,TD-5);              // 通れる床
  ctx.fillStyle='rgba(0,0,0,.30)'; ctx.fillRect(x+2,y+3,TW-4,3);         // 上端の影＝へこみ
  ctx.strokeStyle='rgba(255,255,255,.12)'; ctx.strokeRect(x+2.5,y+3.5,TW-5,TD-6);
}
function voidCell(c,r){
  const x=OX+c*TW, y=OY+r*TD;
  ctx.fillStyle='rgba(4,8,13,.72)'; ctx.fillRect(x,y,TW,TD);
  ctx.strokeStyle='rgba(255,255,255,.05)'; ctx.strokeRect(x+.5,y+.5,TW-1,TD-1);
}
function draw(ts){
  ctx.clearRect(0,0,CW,CH);
  // 谷と濁流
  const g=ctx.createLinearGradient(0,0,0,CH);
  g.addColorStop(0,'#171d27'); g.addColorStop(.6,'#101620'); g.addColorStop(1,'#0a1017');
  ctx.fillStyle=g; ctx.fillRect(0,0,CW,CH);
  const rv=OY+ROWS*TD+BH+6;
  ctx.fillStyle='#123040'; ctx.fillRect(0,rv,CW,CH-rv);
  for(let i=0;i<7;i++){ ctx.strokeStyle='rgba(150,220,255,'+(.06+i*.02)+')'; ctx.lineWidth=2; ctx.beginPath();
    for(let x=0;x<=CW;x+=8){ const y=rv+8+i*7+Math.sin((x*.05)+ts*.004+i)*3.2; x?ctx.lineTo(x,y):ctx.moveTo(x,y);} ctx.stroke(); }
  // 縄
  ctx.strokeStyle='#6b5638'; ctx.lineWidth=4; ctx.beginPath();
  ctx.moveTo(0,OY+ROWS*TD+BH); ctx.quadraticCurveTo(CW/2,OY+ROWS*TD+BH+7,CW,OY+ROWS*TD+BH); ctx.stroke();
  // 崖
  ctx.fillStyle='#202934'; ctx.fillRect(0,OY-8,OX,CH-OY+8); ctx.fillRect(CW-OX,OY-8,OX,CH-OY+8);

  // 盤面：床を先に全面 → その上にブロックを奥から手前へ
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(grid[r][c])continue;
    opened[r][c]? plank(c,r) : voidCell(c,r);
  }
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++) if(grid[r][c]) box(c,r,grid[r][c].c);
    if(phase==='walk'&&bug&&bug.r===r) drawBug(ts);
  }
  // 落下ピース＋着地ゴースト
  if(phase==='build'&&cur){
    const gr=ghostRow();
    for(let i=0;i<cur.m.length;i++)for(let j=0;j<cur.m[i].length;j++) if(cur.m[i][j]){
      const x=OX+(cur.x+j)*TW, y=OY+(gr+i)*TD;
      ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.setLineDash([4,3]); ctx.lineWidth=1.5;
      ctx.strokeRect(x+2.5,y+2.5,TW-5,TD-5); ctx.setLineDash([]);
    }
    for(let i=0;i<cur.m.length;i++)for(let j=0;j<cur.m[i].length;j++) if(cur.m[i][j]) box(cur.x+j,cur.r+i,cur.c);
  }
  // 短辺が抜ける演出
  if(phase==='dissolve'){ const e=performance.now()-t0;
    pops.forEach(p=>{ const t=e-p.d; if(t<0){box(p.c,p.r,p.col);return;} if(t>420)return;
      const k=t/420; box(p.c,p.r,p.col,1-k,k*38); }); }
  requestAnimationFrame(draw);
}
function drawBug(ts){
  if(!bugImg.complete) return;
  const x=OX+bug.c*TW+TW/2, y=OY+bug.r*TD+TD/2+(bug.fall?bug.fall*bug.fall*1.15:0);
  const a=bug.fall?1-bug.fall/14:1;
  ctx.save(); ctx.globalAlpha=Math.max(0,a); ctx.translate(x,y);
  ctx.fillStyle='rgba(255,214,140,.28)'; ctx.beginPath(); ctx.arc(0,0,17,0,7); ctx.fill();
  ctx.rotate(bug.fall? ts*.012 : bug.d*Math.PI/2);
  const w=34,h=w*80/128;
  ctx.shadowColor='rgba(0,0,0,.75)'; ctx.shadowBlur=6; ctx.shadowOffsetY=2;
  ctx.drawImage(bugImg,-w/2,-h/2,w,h); ctx.restore();
}

/* ── 音・入力 ─────────────────────────────── */
let ac=null;
function blip(f,v){ if(!ac)return; const o=ac.createOscillator(),g=ac.createGain();
  o.type='square'; o.frequency.value=f; g.gain.value=v; o.connect(g); g.connect(ac.destination);
  o.start(); g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.16); o.stop(ac.currentTime+.17); }
function unlock(){ if(ac)return; try{ac=new (window.AudioContext||window.webkitAudioContext)();
  if(ac.state==='suspended')ac.resume();}catch(e){} }
['touchstart','mousedown','keydown'].forEach(e=>addEventListener(e,unlock,{once:true}));

function tapBtn(id,fn){ const el=document.getElementById(id); let done=false;
  el.addEventListener('touchstart',e=>{e.preventDefault();done=true;fn();},{passive:false});
  el.addEventListener('click',()=>{if(done){done=false;return;}fn();}); }
tapBtn('bL',()=>move(-1)); tapBtn('bR',()=>move(1)); tapBtn('bT',rot); tapBtn('bD',drop);
tapBtn('again',reset);
addEventListener('keydown',e=>{const k=e.key;
  if(k==='ArrowLeft')move(-1); else if(k==='ArrowRight')move(1);
  else if(k==='ArrowUp'||k===' ')rot(); else if(k==='ArrowDown')drop(); else return; e.preventDefault();});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});

let acc=0,last=0;
function loop(ts){ const dt=ts-last; last=ts;
  if(phase==='build'){ acc+=dt; if(acc>620){acc=0;step();} }
  else if(phase==='walk'){ acc+=dt; if(acc>125){acc=0;walk();} }
  requestAnimationFrame(loop);
}
reset(); requestAnimationFrame(draw); requestAnimationFrame(loop);
</script>
</body>
</html>
