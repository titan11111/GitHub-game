<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#05070b">
  <title>STARLINE INVADERS</title>
  <style>
    :root {
      --ink: #05070b;
      --panel: #101723;
      --cyan: #55e6ff;
      --lime: #b8f34a;
      --orange: #ff9d3d;
      --white: #eef8ff;
    }
    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      user-select: none;
      touch-action: none;
    }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: var(--ink);
    }
    body {
      display: grid;
      place-items: center;
      color: var(--white);
    }
    #cabinet {
      position: fixed;
      inset: 0;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      place-items: center;
      padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right))
        max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
      background:
        linear-gradient(rgba(85, 230, 255, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(85, 230, 255, .025) 1px, transparent 1px),
        radial-gradient(ellipse at 50% 35%, #13243a 0%, #070b12 45%, #030406 100%);
      background-size: 16px 16px, 16px 16px, auto;
    }
    #screen-shell {
      position: relative;
      align-self: stretch;
      display: grid;
      place-items: center;
      min-height: 0;
      width: 100%;
    }
    canvas {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #05070b;
      border: 2px solid #26374c;
      box-shadow: 0 0 0 3px #080b10, 0 0 30px rgba(85, 230, 255, .14);
    }
    #controls {
      width: min(520px, 100%);
      display: grid;
      grid-template-columns: 1fr 1fr 1.25fr;
      gap: 10px;
      padding-top: 10px;
    }
    .control {
      position: relative;
      min-height: clamp(60px, 12vh, 86px);
      border: 2px solid #33465c;
      border-bottom-width: 6px;
      border-radius: 10px;
      background: linear-gradient(#182334, #0b111b);
      color: var(--cyan);
      font: 900 22px/1 monospace;
      letter-spacing: .08em;
      box-shadow: inset 0 1px rgba(255,255,255,.08), 0 4px 14px rgba(0,0,0,.35);
    }
    .control::after {
      content: attr(data-label);
      display: block;
      margin-top: 7px;
      color: #8095aa;
      font-size: 9px;
      letter-spacing: .18em;
    }
    .control.pressed, .control:active {
      transform: translateY(3px);
      border-bottom-width: 3px;
      background: #203148;
      color: var(--white);
    }
    #fire {
      color: var(--orange);
      border-color: #754c2a;
      background: linear-gradient(#3c291a, #17100c);
    }
    @media (hover: hover) and (pointer: fine) {
      .control:hover { filter: brightness(1.2); }
    }
  </style>
</head>
<body>
  <main id="cabinet" aria-label="スターライン・インベーダー">
    <div id="screen-shell">
      <canvas id="game" width="320" height="400" aria-label="ゲーム画面"></canvas>
    </div>
    <div id="controls" aria-label="ゲーム操作">
      <button class="control" id="left" type="button" data-label="MOVE">◀</button>
      <button class="control" id="right" type="button" data-label="MOVE">▶</button>
      <button class="control" id="fire" type="button" data-label="FIRE">●</button>
    </div>
  </main>
  <script src="game.js"></script>
</body>
</html>
