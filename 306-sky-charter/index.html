<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>SKY CHARTER ─ 空の貸切便</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --deep:#0c1118; --panel:rgba(16,22,31,.80); --line:rgba(214,224,236,.22);
  --titan:#8a96a6; --chrome:#e6ecf2; --ink:#e9eef3; --signal:#ffa31a; --ok:#62e3b5; --warn:#ff5a4f;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --deep:#0c1118; } }
:root[data-theme="dark"]{ --deep:#0c1118; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); height:100%; }
body{ height:100%; margin:0; overflow:hidden; background:var(--deep); color:var(--ink);
  font-family:"Zen Kaku Gothic New",system-ui,sans-serif; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
*,*::before,*::after{ box-sizing:border-box; }
#c{ position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
.num{ font-family:"Chakra Petch",system-ui,sans-serif; font-variant-numeric:tabular-nums; }
.chrome{ background:linear-gradient(180deg,#ffffff 0%,#d3dbe4 34%,#6c7887 50%,#e3e9f0 60%,#98a4b2 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent; }
.hidden{ display:none !important; }

/* ---------- screens ---------- */
.screen{ position:fixed; inset:0; z-index:20; overflow-y:auto; touch-action:pan-y;
  padding:calc(env(safe-area-inset-top,0px) + 20px) 18px calc(env(safe-area-inset-bottom,0px) + 24px);
  display:flex; flex-direction:column; align-items:center; }
.panel{ width:min(560px,100%); background:var(--panel); border:1px solid var(--line);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22), 0 20px 60px rgba(0,0,0,.45);
  border-radius:4px; padding:22px 20px; }
.btn{ appearance:none; border:0; cursor:pointer; font:700 16px/1 "Zen Kaku Gothic New",sans-serif; color:#161c24;
  padding:15px 22px; border-radius:3px; min-height:48px;
  background:linear-gradient(180deg,#f7f9fb 0%,#c8d0d9 46%,#8f9aa7 50%,#cdd5de 78%,#aab4c0 100%);
  box-shadow:inset 0 1px 0 #fff, inset 0 -2px 0 rgba(0,0,0,.25), 0 6px 16px rgba(0,0,0,.35); }
.btn:active{ transform:translateY(1px); filter:brightness(.92); }
.btn.ghost{ background:transparent; color:var(--chrome); border:1px solid var(--line); box-shadow:none; }
.btn:focus-visible,.row:focus-visible,.mini:focus-visible{ outline:2px solid var(--signal); outline-offset:3px; }

/* title */
#title{ justify-content:flex-end; padding-bottom:calc(env(safe-area-inset-bottom,0px) + 8vh); background:linear-gradient(180deg,transparent 40%,rgba(8,11,16,.75)); }
#title h1{ margin:0; font:700 clamp(54px,15vw,150px)/.86 "Chakra Petch",sans-serif; letter-spacing:-.02em; text-align:center;
  filter:drop-shadow(0 3px 0 rgba(0,0,0,.5)); }
#title .sub{ margin:14px 0 30px; font-weight:700; letter-spacing:.3em; color:var(--titan); text-align:center; font-size:14px; }
#title .btn{ min-width:240px; font-size:18px; }
#title .hint{ margin-top:14px; color:var(--titan); font-size:12px; }

/* select */
#select h2,#brief h2,#result h2,#pause h2{ margin:0 0 4px; font:900 26px/1.2 "Zen Kaku Gothic New",sans-serif; }
.lead{ color:var(--titan); font-size:13px; margin:0 0 16px; }
.rows{ display:flex; flex-direction:column; gap:6px; }
.row{ display:grid; grid-template-columns:52px 1fr auto; align-items:center; gap:12px; text-align:left;
  background:rgba(255,255,255,.035); border:1px solid transparent; border-radius:3px; padding:10px 12px; color:var(--ink); cursor:pointer; font:inherit; }
.row:hover{ border-color:var(--line); background:rgba(255,255,255,.07); }
.row .n{ font:700 34px/1 "Chakra Petch",sans-serif; }
.row b{ display:block; font-size:16px; }
.row small{ color:var(--titan); font-size:12px; }
.row .st{ font-size:15px; letter-spacing:2px; color:var(--signal); white-space:nowrap; }
.row .st i{ color:rgba(255,255,255,.18); font-style:normal; }
.row.locked{ opacity:.38; cursor:not-allowed; }
.tier{ margin:14px 0 4px; font-size:12px; font-weight:700; color:var(--titan); }

/* brief */
.quote{ font-size:18px; font-weight:700; line-height:1.7; margin:14px 0; padding-left:14px; border-left:3px solid var(--signal); }
.client{ color:var(--titan); font-size:13px; }
.obj{ background:rgba(255,163,26,.08); border:1px solid rgba(255,163,26,.35); border-radius:3px; padding:12px 14px; line-height:1.7; font-size:14px; }
.keys{ margin-top:14px; font-size:12px; line-height:1.9; color:var(--titan); }
.keys kbd{ font:700 11px "Chakra Petch",sans-serif; color:var(--ink); border:1px solid var(--line); border-radius:2px; padding:1px 5px; }
.acts{ display:flex; gap:10px; margin-top:18px; flex-wrap:wrap; }
.acts .btn{ flex:1 1 140px; }

/* result */
#result .big{ font:900 40px/1.1 "Zen Kaku Gothic New",sans-serif; margin:4px 0; }
#r-stars{ font-size:40px; letter-spacing:6px; color:var(--signal); margin:6px 0 10px; }
#r-stars i{ color:rgba(255,255,255,.15); font-style:normal; }
.stats{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:6px; }
.stats div{ border:1px solid var(--line); border-radius:3px; padding:10px; }
.stats span{ display:block; font-size:11px; color:var(--titan); }
.stats b{ font:700 22px "Chakra Petch",sans-serif; }
.crit{ font-size:12px; color:var(--titan); line-height:1.8; margin-top:10px; }

/* ---------- HUD ---------- */
#hud{ position:fixed; inset:0; z-index:10; pointer-events:none; }
#hud-tl{ position:absolute; left:14px; top:calc(env(safe-area-inset-top,0px) + 12px); max-width:min(62vw,420px); }
#h-stage{ font:700 12px "Chakra Petch",sans-serif; color:var(--signal); letter-spacing:.08em; }
#h-obj{ font-weight:900; font-size:clamp(14px,3.8vw,18px); line-height:1.4; text-shadow:0 2px 8px rgba(0,0,0,.7); margin-top:2px; }
#hud-tr{ position:absolute; right:12px; top:calc(env(safe-area-inset-top,0px) + 10px); text-align:right; }
#h-time{ font:700 30px/1 "Chakra Petch",sans-serif; text-shadow:0 2px 8px rgba(0,0,0,.6); }
#h-time.low{ color:var(--warn); }
.hbtns{ display:flex; gap:6px; justify-content:flex-end; margin-top:8px; pointer-events:auto; }
.mini{ appearance:none; border:1px solid var(--line); background:rgba(12,17,24,.6); color:var(--chrome); border-radius:3px;
  font:700 12px "Chakra Petch",sans-serif; min-width:44px; height:36px; padding:0 10px; cursor:pointer; }
#hud-wind{ position:absolute; right:14px; top:calc(env(safe-area-inset-top,0px) + 100px); display:flex; align-items:center; gap:6px;
  font:700 12px "Chakra Petch",sans-serif; color:var(--chrome); }
#wind-arrow{ width:26px; height:26px; transition:transform .2s; }
#hud-bottom{ position:absolute; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom,0px) + 14px); width:min(560px,94vw); }
body.touch #hud-bottom{ bottom:auto; top:calc(env(safe-area-inset-top,0px) + 96px); width:min(228px,58vw); left:12px; transform:none; }
#g-vs.warn{ color:var(--warn); }

/* 目標マーカー（画面外でも方向と距離が分かる） */
#tmark{ position:absolute; left:0; top:0; width:44px; display:none; flex-direction:column; align-items:center;
  filter:drop-shadow(0 2px 6px rgba(0,0,0,.8)); will-change:transform; }
#tmark svg{ display:block; }
#tmark span{ margin-top:-2px; font:700 12px "Chakra Petch",sans-serif; color:#ffd79a; text-shadow:0 1px 4px #000; }
#tmark.near svg{ opacity:.5; }
.gauges{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
body.touch .gauges{ grid-template-columns:repeat(2,1fr); }
.g{ flex:1; background:rgba(12,17,24,.55); border:1px solid var(--line); border-radius:3px; padding:5px 8px; }
.g span{ display:block; font:700 10px "Chakra Petch",sans-serif; color:var(--titan); letter-spacing:.1em; }
.g b{ font:700 20px/1.1 "Chakra Petch",sans-serif; }
.bars{ margin-top:6px; display:flex; flex-direction:column; gap:4px; }
.bar{ position:relative; height:18px; background:rgba(12,17,24,.55); border:1px solid var(--line); border-radius:2px; overflow:hidden; }
.bar i{ position:absolute; left:0; top:0; bottom:0; width:0; background:linear-gradient(180deg,#f4f7fa,#9ba7b5); }
.bar.prog i{ background:linear-gradient(180deg,#ffd08a,#ff9500); }
.bar.danger i{ background:linear-gradient(180deg,#ff9a92,#e0342a); }
.bar label{ position:absolute; left:8px; top:0; line-height:16px; font-size:11px; font-weight:700; color:#10151c; z-index:1; mix-blend-mode:normal; text-shadow:0 0 3px rgba(255,255,255,.7); }
#msg{ position:absolute; left:50%; top:34%; transform:translate(-50%,-50%); font-weight:900; font-size:clamp(20px,5.4vw,34px);
  text-align:center; text-shadow:0 3px 14px rgba(0,0,0,.8); opacity:0; transition:opacity .25s; white-space:nowrap; }
#msg.show{ opacity:1; }
#flash{ position:fixed; inset:0; pointer-events:none; z-index:15; opacity:0; transition:opacity .35s; }

/* touch */
#touch{ position:absolute; inset:0; pointer-events:none; display:none; }
body.touch #touch{ display:block; }
#stick{ position:absolute; left:calc(env(safe-area-inset-left,0px) + 14px); bottom:calc(env(safe-area-inset-bottom,0px) + 20px); width:min(126px,32vw); height:min(126px,32vw); border-radius:50%;
  background:radial-gradient(circle,rgba(230,236,242,.10),rgba(230,236,242,.03) 70%); border:1px solid var(--line); pointer-events:auto; touch-action:none; }
#knob{ position:absolute; left:50%; top:50%; width:54px; height:54px; margin:-27px 0 0 -27px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff,#aeb8c4 45%,#5e6978); box-shadow:0 4px 12px rgba(0,0,0,.5); }
#tbtns{ position:absolute; right:calc(env(safe-area-inset-right,0px) + 10px); bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
  display:grid; grid-template-columns:60px 60px 74px; grid-template-rows:62px 62px; gap:7px; pointer-events:auto; }
#tbtns button{ touch-action:none; -webkit-user-select:none; user-select:none; border:1px solid var(--line); border-radius:50%; color:#161c24; font:700 20px "Chakra Petch",sans-serif;
  background:radial-gradient(circle at 35% 30%,#fbfdff,#b9c3ce 55%,#7a8593); box-shadow:0 4px 12px rgba(0,0,0,.45); }
#tbtns button.on{ filter:brightness(.8); }
#t-up{ grid-column:1; grid-row:1; } #t-dn{ grid-column:1; grid-row:2; }
#t-lf{ grid-column:2; grid-row:1; } #t-rt{ grid-column:2; grid-row:2; }
#t-act{ grid-column:3; grid-row:1 / span 2; border-radius:37px !important; font-size:13px !important;
  background:radial-gradient(circle at 35% 25%,#ffe3b3,#ffa31a 55%,#b86a00) !important; }
@media (prefers-reduced-motion: reduce){ #msg,#flash,#wind-arrow{ transition:none; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="flash"></div>
<div id="err" style="display:none;position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:99;background:#3a1210;border:1px solid #ff5a4f;color:#ffd9d6;font:12px/1.6 monospace;padding:10px 12px;border-radius:3px;white-space:pre-wrap;user-select:text;-webkit-user-select:text"></div>

<div id="hud" class="hidden">
  <div id="hud-tl"><div id="h-stage"></div><div id="h-obj"></div></div>
  <div id="hud-tr">
    <div id="h-time" class="num">0:00</div>
    <div class="hbtns"><button id="b-cam" class="mini" aria-label="カメラ切替">CAM</button><button id="b-pause" class="mini" aria-label="一時停止">Ⅱ</button></div>
  </div>
  <div id="hud-wind"><svg id="wind-arrow" viewBox="0 0 24 24"><path d="M12 2 L18 12 L13.5 11 L13.5 22 L10.5 22 L10.5 11 L6 12 Z" fill="#e6ecf2"/></svg><span id="h-wind">0</span></div>
  <div id="hud-bottom">
    <div class="gauges">
      <div class="g"><span>対地高度 m</span><b id="g-alt">0</b></div>
      <div class="g"><span>速度 km/h</span><b id="g-spd">0</b></div>
      <div class="g"><span>昇降 m/s</span><b id="g-vs" class="num">0.0</b></div>
      <div class="g"><span>目標まで m</span><b id="g-dist">–</b></div>
    </div>
    <div class="bars">
      <div class="bar" id="bar-hull"><label>機体</label><i></i></div>
      <div class="bar" id="bar-extra"><label></label><i></i></div>
      <div class="bar prog" id="bar-prog"><label></label><i></i></div>
    </div>
  </div>
  <div id="tmark"><svg viewBox="0 0 24 24" width="30" height="30"><path d="M12 2.5 L21.5 20.5 L12 16.2 L2.5 20.5 Z" fill="#ffa31a" stroke="rgba(0,0,0,.55)" stroke-width="1.2"/></svg><span id="tmark-d" class="num"></span></div>
  <div id="msg"></div>
  <div id="touch">
    <div id="stick"><div id="knob"></div></div>
    <div id="tbtns"><button id="t-up" aria-label="上昇">▲</button><button id="t-dn" aria-label="下降">▼</button><button id="t-lf" aria-label="左へ横移動">◀</button><button id="t-rt" aria-label="右へ横移動">▶</button><button id="t-act">ACTION</button></div>
  </div>
</div>

<section id="title" class="screen">
  <h1 class="chrome">SKY<br>CHARTER</h1>
  <p class="sub">空の貸切便 ─ 10件の依頼</p>
  <button class="btn" id="b-start">依頼リストを開く</button>
  <p class="hint">機体には重さがあります。止まるには早めに引き起こす<br>音が出ます。右上の CAM で視点、Ⅱ で一時停止</p>
</section>

<section id="select" class="screen hidden">
  <div class="panel">
    <h2>今日の依頼</h2>
    <p class="lead">上から順に難しくなるよ。クリアすると次の依頼が届く</p>
    <div class="rows" id="rows"></div>
    <div class="acts"><button class="btn ghost" id="b-back">タイトルへ</button></div>
  </div>
</section>

<section id="brief" class="screen hidden" style="justify-content:flex-end">
  <div class="panel">
    <div class="client" id="bf-no"></div>
    <h2 id="bf-title"></h2>
    <div class="quote" id="bf-quote"></div>
    <div class="client" id="bf-client"></div>
    <div class="obj" id="bf-obj" style="margin-top:12px"></div>
    <div class="keys" id="bf-keys"></div>
    <div class="acts"><button class="btn ghost" id="bf-back">依頼リスト</button><button class="btn" id="bf-go">離陸する</button></div>
  </div>
</section>

<section id="pause" class="screen hidden" style="justify-content:center">
  <div class="panel">
    <h2>一時停止</h2>
    <p class="lead" id="p-obj"></p>
    <div class="acts"><button class="btn" id="p-resume">再開</button><button class="btn ghost" id="p-retry">やり直す</button><button class="btn ghost" id="p-list">依頼リスト</button></div>
    <div class="acts"><button class="btn ghost" id="p-sound">サウンド：オン</button></div>
  </div>
</section>

<section id="result" class="screen hidden" style="justify-content:center">
  <div class="panel">
    <div class="client" id="r-no"></div>
    <div class="big" id="r-head"></div>
    <p class="lead" id="r-why"></p>
    <div id="r-stars"></div>
    <div class="stats">
      <div><span>タイム</span><b id="r-time"></b></div>
      <div><span>機体</span><b id="r-hull"></b></div>
      <div><span id="r-xl">目標</span><b id="r-x"></b></div>
    </div>
    <div class="crit" id="r-crit"></div>
    <div class="acts"><button class="btn ghost" id="r-list">依頼リスト</button><button class="btn ghost" id="r-retry">もう一度</button><button class="btn" id="r-next">次の依頼</button></div>
  </div>
</section>

<script>
function __showErr(m){var e=document.getElementById('err');if(!e)return;e.style.display='block';e.textContent+=(e.textContent?'\n':'')+'エラー: '+m;}
window.addEventListener('error',function(ev){__showErr((ev.message||'不明なエラー')+(ev.lineno?' (行 '+ev.lineno+')':''));});
window.addEventListener('unhandledrejection',function(ev){__showErr(String(ev.reason));});
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
function __boot(){
(function(){
'use strict';
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,v)=>{const t=clamp((v-a)/(b-a),0,1);return t*t*(3-2*t);};
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function vnoise(x,z){return Math.sin(x*0.021+Math.cos(z*0.017)*1.3)*Math.cos(z*0.019-Math.sin(x*0.013))*0.5+Math.sin((x+z)*0.043)*0.25;}
const fmt=t=>{t=Math.max(0,t);const m=Math.floor(t/60),s=Math.floor(t%60);return m+':'+String(s).padStart(2,'0');};
const isTouch=('ontouchstart' in window)||matchMedia('(pointer:coarse)').matches;
if(isTouch) document.body.classList.add('touch');

/* ---------- save ---------- */
const SAVE_KEY='skycharter_v1';
let save={unlocked:1,stars:{},best:{}};
try{const s=localStorage.getItem(SAVE_KEY);if(s)save=Object.assign(save,JSON.parse(s));}catch(e){}
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}}

/* ---------- renderer ---------- */
let renderer;try{renderer=new THREE.WebGLRenderer({canvas:$('#c'),antialias:!isTouch,powerPreference:'high-performance'});}catch(e){__showErr('この端末/ブラウザでは3D表示（WebGL）が使えません：'+e.message);throw e;}
const PR_CAP=Math.min(window.devicePixelRatio||1,isTouch?1.5:2);
let pxRatio=PR_CAP;renderer.setPixelRatio(pxRatio);
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.08;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=isTouch?THREE.PCFShadowMap:THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(60,1,0.5,4000);
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.fov=w<h?78:60;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();

const pmrem=new THREE.PMREMGenerator(renderer);
const skyVS='varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}';
const skyFS='uniform vec3 top;uniform vec3 bot;varying vec3 vP;void main(){float h=normalize(vP).y;gl_FragColor=vec4(mix(bot,top,smoothstep(-0.05,0.55,h)),1.);}';
const envCache={};
function buildEnv(key,top,bot,panel){
  if(envCache[key])return envCache[key];
  const s=new THREE.Scene();
  const geo=new THREE.SphereGeometry(100,32,16);
  const mat=new THREE.ShaderMaterial({side:THREE.BackSide,uniforms:{top:{value:new THREE.Color(top)},bot:{value:new THREE.Color(bot)}},vertexShader:skyVS,fragmentShader:skyFS});
  s.add(new THREE.Mesh(geo,mat));
  const pg=new THREE.PlaneGeometry(1,1);
  const add=(c,w,h,x,y,z)=>{const m=new THREE.Mesh(pg,new THREE.MeshBasicMaterial({color:c,side:THREE.DoubleSide}));m.scale.set(w,h,1);m.position.set(x,y,z);m.lookAt(0,0,0);s.add(m);};
  add(panel,70,14,0,55,-70); add(0xffffff,16,70,85,15,10); add(panel,50,8,-70,30,50); add(0x222831,200,40,0,-60,0);
  const t=pmrem.fromScene(s,0.03).texture;
  envCache[key]=t;return t;
}
const skyMat=new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,uniforms:{top:{value:new THREE.Color()},bot:{value:new THREE.Color()}},vertexShader:skyVS,fragmentShader:skyFS});
const sky=new THREE.Mesh(new THREE.SphereGeometry(2500,32,16),skyMat);sky.renderOrder=-1;scene.add(sky);
const hemi=new THREE.HemisphereLight(0xffffff,0x333333,1);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,2);sun.castShadow=true;sun.shadow.mapSize.set(isTouch?1024:2048,isTouch?1024:2048);
const sc=sun.shadow.camera;sc.left=-110;sc.right=110;sc.top=110;sc.bottom=-110;sc.near=10;sc.far=600;sun.shadow.bias=-0.0004;sun.shadow.normalBias=0.9;
scene.add(sun);scene.add(sun.target);
const sunOff=new THREE.Vector3(120,220,80);

/* ---------- textures ---------- */

  for(let y=0;y<16;y++)for(let x=0;x<8;x++){const lit=r();if(night)g.fillStyle=lit<0.42?`hsl(${34+r()*18},90%,${58+r()*22}%)`:'#0e141d';else g.fillStyle=lit<0.5?'#9fb4cb':'#6d8097';g.fillRect(x*16+2,y*16+3,12,10);}
  g.fillStyle=night?'#000':'rgba(255,255,255,.08)';for(let y=0;y<16;y++)g.fillRect(0,y*16,w,1);});}

const world={group:null,colliders:[],flats:[],water:null,hraw:()=>0,movers:[],night:false,matCache:{},fx:[]};
function disposeTree(o){o.traverse(n=>{if(n.geometry)n.geometry.dispose();const ms=n.material?(Array.isArray(n.material)?n.material:[n.material]):[];ms.forEach(m=>{if(m.userData&&m.userData.shared)return;if(m.map&&!(m.map.userData&&m.map.userData.shared))m.map.dispose();m.dispose();});});}
function clearWorld(){
  if(world.group){scene.remove(world.group);disposeTree(world.group);}
  world.group=new THREE.Group();scene.add(world.group);
  world.colliders=[];world.flats=[];world.water=null;world.hraw=()=>0;world.movers=[];world.matCache={};world.fx=[];world.night=false;
}
function terrainH(x,z){let h=world.hraw(x,z);for(const f of world.flats){const d=Math.hypot(x-f.x,z-f.z);if(d<f.r)return f.y;if(d<f.r+f.b){const s=smooth(0,1,(d-f.r)/f.b);h=f.y+(h-f.y)*s;}}return h;}
function flat(x,z,r,y,b){const yy=(y===undefined)?world.hraw(x,z):y;world.flats.push({x,z,r,b:b||22,y:yy});return yy;}
function makeTerrain(colorFn){
  const size=1500,seg=190;const geo=new THREE.PlaneGeometry(size,size,seg,seg);geo.rotateX(-Math.PI/2);
  const pos=geo.attributes.position;const col=new Float32Array(pos.count*3);const c=new THREE.Color();
  for(let i=0;i<pos.count;i++){const x=pos.getX(i),z=pos.getZ(i);const y=terrainH(x,z);pos.setY(i,y);colorFn(x,z,y,c);col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b;}
  geo.setAttribute('color',new THREE.BufferAttribute(col,3));geo.computeVertexNormals();
  const m=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({vertexColors:true,flatShading:true,metalness:0.12,roughness:0.9}));
  m.receiveShadow=true;world.group.add(m);return m;
}
function makeWater(level,color){const m=new THREE.Mesh(new THREE.PlaneGeometry(4000,4000),new THREE.MeshStandardMaterial({color:color||0x1f4a66,metalness:0.9,roughness:0.1,transparent:true,opacity:0.9}));
  m.rotation.x=-Math.PI/2;m.position.y=level;m.receiveShadow=true;world.group.add(m);world.water=level;return m;}
function bMat(w,h){
  const key=Math.round(w/4)+'_'+Math.round(h/8);if(world.matCache[key])return world.matCache[key];
  const t=(world.night?winTexN:winTexD).clone();t.needsUpdate=true;t.userData={};t.repeat.set(Math.max(1,w/26),Math.max(1,h/52));
  const m=new THREE.MeshStandardMaterial({map:t,color:world.night?0x55606e:0xc9d1db,metalness:0.78,roughness:0.26});
  if(world.night){m.emissive=new THREE.Color(0xffffff);m.emissiveMap=t;m.emissiveIntensity=1.15;}
  world.matCache[key]=m;return m;
}
const lightGeo=new THREE.SphereGeometry(0.28,8,6);
function addBuilding(x,z,w,d,h,o){
  o=o||{};const base=(o.base!==undefined)?o.base:terrainH(x,z)-1;const mat=o.mat||bMat(w,h);
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),[mat,mat,M.roof,M.roof,mat,mat]);
  m.position.set(x,base+h/2,z);m.castShadow=true;m.receiveShadow=true;world.group.add(m);
  const top=base+h;world.colliders.push({x0:x-w/2,x1:x+w/2,z0:z-d/2,z1:z+d/2,base,top});
  if(h>55&&!o.noAntenna){const a=new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.3,9,6),M.gun);a.position.set(x+w*0.3,top+4.5,z-d*0.3);world.group.add(a);
    const l=new THREE.Mesh(lightGeo,M.red);l.position.set(x+w*0.3,top+9.2,z-d*0.3);world.group.add(l);}
  if(!o.noRoof&&w>12){const u=new THREE.Mesh(new THREE.BoxGeometry(w*0.25,2.2,d*0.2),M.gun);u.position.set(x-w*0.22,top+1.1,z+d*0.25);u.castShadow=true;world.group.add(u);}
  return top;

function addPad(x,z,y,r){

function addTrees(n,seed,test){
  const r=rng(seed);const geo=new THREE.ConeGeometry(2.6,9,6);geo.translate(0,4.5,0);
  const mesh=new THREE.InstancedMesh(geo,M.tree,n);const d=new THREE.Object3D();let c=0,tries=0;
  while(c<n&&tries<n*10){tries++;const x=(r()-0.5)*900,z=(r()-0.5)*900;const y=terrainH(x,z);if(!test(x,z,y))continue;

function buildCity(o){

/* particles */
class PFX{
  constructor(n,size,color,additive,opacity){this.n=n;this.p=[];this.geo=new THREE.BufferGeometry();this.pos=new Float32Array(n*3);this.col=new Float32Array(n*3);
    for(let i=0;i<n;i++){this.pos[i*3+1]=-9999;this.p.push({life:0,max:1,x:0,y:0,z:0,vx:0,vy:0,vz:0});}
    this.geo.setAttribute('position',new THREE.BufferAttribute(this.pos,3));this.geo.setAttribute('color',new THREE.BufferAttribute(this.col,3));
    this.mat=new THREE.PointsMaterial({size,map:dotTex,vertexColors:true,transparent:true,opacity:opacity||1,depthWrite:false,blending:additive?THREE.AdditiveBlending:THREE.NormalBlending});
    this.base=new THREE.Color(color);this.additive=additive;this.grav=0;this.pts=new THREE.Points(this.geo,this.mat);this.pts.frustumCulled=false;world.group.add(this.pts);this.i=0;world.fx.push(this);}
  spawn(x,y,z,vx,vy,vz,life){const q=this.p[this.i];this.i=(this.i+1)%this.n;q.x=x;q.y=y;q.z=z;q.vx=vx;q.vy=vy;q.vz=vz;q.life=life;q.max=life;}
  update(dt){for(let i=0;i<this.n;i++){const q=this.p[i];if(q.life<=0){this.pos[i*3+1]=-9999;continue;}q.life-=dt;q.vy-=this.grav*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.z+=q.vz*dt;
    this.pos[i*3]=q.x;this.pos[i*3+1]=q.y;this.pos[i*3+2]=q.z;const a=this.additive?Math.max(0,q.life/q.max):1;this.col[i*3]=this.base.r*a;this.col[i*3+1]=this.base.g*a;this.col[i*3+2]=this.base.b*a;}
    this.geo.attributes.position.needsUpdate=true;this.geo.attributes.color.needsUpdate=true;}
}
function makeRope(){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(6),3));const l=new THREE.Line(g,ropeMat);l.frustumCulled=false;l.visible=false;world.group.add(l);
  l.set=(a,b)=>{const p=g.attributes.position.array;p[0]=a.x;p[1]=a.y;p[2]=a.z;p[3]=b.x;p[4]=b.y;p[5]=b.z;g.attributes.position.needsUpdate=true;};return l;}

/* 対地マーカー: 真下の位置と「いま降下したら着く場所」を地面に描く。
   3Dヘリで一番分からないのが自分の対地位置なので、常時出す。 */
const markMat=c=>new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:0.6,depthWrite:false,side:THREE.DoubleSide});
const padRing=new THREE.Mesh(new THREE.RingGeometry(2.1,2.6,40),markMat(0x9fe8ff));padRing.rotation.x=-Math.PI/2;padRing.visible=false;scene.add(padRing);
const tdRing=new THREE.Mesh(new THREE.RingGeometry(3.2,3.9,32),markMat(0xffa31a));tdRing.rotation.x=-Math.PI/2;tdRing.material.opacity=0.85;tdRing.visible=false;scene.add(tdRing);

function groundY(x,z){const gi=groundInfo(x,z,heli.pos.y-SKID);return(world.water!==null&&!gi.plat)?Math.max(gi.h,world.water):gi.h;}
function updateGroundMarks(){
  if(state.mode!=='play'&&state.mode!=='ending'){padRing.visible=tdRing.visible=dropLine.visible=false;return;}
  const p=heli.pos,g0=groundY(p.x,p.z),agl=Math.max(0,state.agl);
  padRing.visible=true;padRing.position.set(p.x,g0+0.2,p.z);
  const sc=1+Math.min(agl,140)*0.015;padRing.scale.set(sc,sc,1);
  const tf=clamp(Math.sqrt(2*agl/GRAV),0,4.5);
  const tx=p.x+heli.vel.x*tf,tz=p.z+heli.vel.z*tf;
  tdRing.visible=agl>3.5&&Math.hypot(heli.vel.x,heli.vel.z)>1.2;
  if(tdRing.visible){tdRing.position.set(tx,groundY(tx,tz)+0.26,tz);const s2=1+Math.min(agl,140)*0.01;tdRing.scale.set(s2,s2,1);}
  dropLine.visible=agl>4;
  if(dropLine.visible){dropLine.position.set(p.x,g0+agl*0.5,p.z);dropLine.scale.set(1,agl,1);}
}

const keys={};
const touch={x:0,y:0,up:false,dn:false,lf:false,rt:false};
const input={fwd:0,turn:0,strafe:0,vert:0};
let actionQueued=false;
addEventListener('keydown',e=>{
  if(state.mode==='play'&&(e.code==='Space'||e.code.startsWith('Arrow')))e.preventDefault();
  if(e.repeat){keys[e.code]=true;return;}
  keys[e.code]=true;
  if(state.mode==='play'){if(e.code==='KeyF'||e.code==='Enter')actionQueued=true;if(e.code==='KeyC')cycleCam();if(e.code==='KeyP'||e.code==='Escape')pauseGame();}
  else if(state.mode==='paused'&&(e.code==='KeyP'||e.code==='Escape'))resumeGame();
});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
function readInput(){
  const k=keys;
  let f=(k.KeyW?1:0)-(k.KeyS?1:0),t=(k.KeyD?1:0)-(k.KeyA?1:0),s=(k.KeyE||k.ArrowRight?1:0)-(k.KeyQ||k.ArrowLeft?1:0),v=(k.Space||k.ArrowUp?1:0)-(k.ShiftLeft||k.ShiftRight||k.ArrowDown?1:0);
  if(Math.abs(touch.y)>0.08)f=-touch.y;if(Math.abs(touch.x)>0.08)t=touch.x;
  if(touch.up)v=1;if(touch.dn)v=-1;
  if(touch.lf)s=-1;if(touch.rt)s=1;
  if(state.autoLift>0&&v===0)v=1;
  input.fwd=clamp(f,-1,1);input.turn=clamp(t,-1,1);input.strafe=clamp(s,-1,1);input.vert=clamp(v,-1,1);
}
(function setupTouch(){
  const st=$('#stick'),kn=$('#knob');let id=null;
  const move=e=>{const r=st.getBoundingClientRect();let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);const R=r.width/2-14;const d=Math.hypot(dx,dy);if(d>R){dx=dx/d*R;dy=dy/d*R;}
    kn.style.transform=`translate(${dx}px,${dy}px)`;touch.x=dx/R;touch.y=dy/R;};
  st.addEventListener('pointerdown',e=>{id=e.pointerId;st.setPointerCapture(id);move(e);e.preventDefault();});
  st.addEventListener('pointermove',e=>{if(e.pointerId===id)move(e);});
  const end=e=>{if(e.pointerId!==id)return;id=null;kn.style.transform='';touch.x=touch.y=0;};
  st.addEventListener('pointerup',end);st.addEventListener('pointercancel',end);
  const hold=(el,key)=>{el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);touch[key]=true;el.classList.add('on');e.preventDefault();});
    const off=()=>{touch[key]=false;el.classList.remove('on');};el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off);};
  hold($('#t-up'),'up');hold($('#t-dn'),'dn');hold($('#t-lf'),'lf');hold($('#t-rt'),'rt');
  $('#t-act').addEventListener('pointerdown',e=>{actionQueued=true;e.preventDefault();});
})();

let AC=null,master=null,rotorGain=null,rotorLfo=null,rotorFilter=null,soundOn=true;
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=0.7;master.connect(AC.destination);
    const len=AC.sampleRate*2,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);let last=0;for(let i=0;i<len;i++){const w=Math.random()*2-1;last=(last+0.02*w)/1.02;d[i]=last*3.5;}
    const src=AC.createBufferSource();src.buffer=buf;src.loop=true;
    rotorFilter=AC.createBiquadFilter();rotorFilter.type='lowpass';rotorFilter.frequency.value=520;
    const chop=AC.createGain();chop.gain.value=0.55;rotorLfo=AC.createOscillator();rotorLfo.frequency.value=13;const lg=AC.createGain();lg.gain.value=0.5;rotorLfo.connect(lg);lg.connect(chop.gain);
    rotorGain=AC.createGain();rotorGain.gain.value=0;src.connect(rotorFilter);rotorFilter.connect(chop);chop.connect(rotorGain);rotorGain.connect(master);
    src.start();rotorLfo.start();window._noiseBuf=buf;

}
function beep(f,d,type,v){if(!AC||!soundOn)return;const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.value=f;const t=AC.currentTime;g.gain.setValueAtTime(v||0.08,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+0.02);}
function noise(d,f,v){if(!AC||!soundOn||!window._noiseBuf)return;const s=AC.createBufferSource();s.buffer=window._noiseBuf;const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=f;const g=AC.createGain();const t=AC.currentTime;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);s.connect(fl);fl.connect(g);g.connect(master);s.start(t);s.stop(t+d+0.05);}
const sfx={ok(){beep(880,0.1,'square',0.07);setTimeout(()=>beep(1320,0.14,'square',0.07),90);},hit(){noise(0.5,900,0.9);},tick(){beep(660,0.05,'sine',0.05);},thunder(){noise(2.2,260,1.2);},win(){[660,880,1100,1320].forEach((f,i)=>setTimeout(()=>beep(f,0.18,'triangle',0.09),i*110));},fail(){[440,330,220].forEach((f,i)=>setTimeout(()=>beep(f,0.25,'sawtooth',0.06),i*160));},splash(){noise(0.7,1800,0.5);}};

/* ---------- game state ---------- */
const state={mode:'title',idx:0,mission:null,t:0,hull:100,onGround:false,plat:null,dmgCool:0,shake:0,camMode:0,wind:new THREE.Vector3(),agl:0,endTimer:0,result:null,flashT:0};
const prev=new THREE.Vector3();
const fwdV=y=>({x:Math.sin(y),z:Math.cos(y)});
const rightV=y=>({x:-Math.cos(y),z:Math.sin(y)});

function inFoot(c,x,z,m){if(c.mover){const L=c.mover.local(x,z);x=L.x;z=L.z;}return x>c.x0-m&&x<c.x1+m&&z>c.z0-m&&z<c.z1+m;}
const cTop=c=>c.mover?c.mover.y+c.topL:c.top;
const cBase=c=>c.mover?c.mover.y+c.baseL:c.base;
function groundInfo(x,z,yb){let h=terrainH(x,z),plat=null;for(const c of world.colliders){const top=cTop(c);if(top>h&&yb>cBase(c)-0.5&&inFoot(c,x,z,1.0)){h=top;plat=c;}}return{h,plat};}
function platVel(){const c=state.plat;return(c&&c.mover)?{x:c.mover.vx,z:c.mover.vz}:{x:0,z:0};}
function relSpeed(){const pv=platVel();return Math.hypot(heli.vel.x-pv.x,heli.vel.z-pv.z);}

function showMsg(t,d){const m=$('#msg');m.textContent=t;m.classList.add('show');clearTimeout(showMsg._t);showMsg._t=setTimeout(()=>m.classList.remove('show'),(d||1.6)*1000);}
function flash(c,t){const f=$('#flash');f.style.transition='none';f.style.background=c;f.style.opacity='1';requestAnimationFrame(()=>{f.style.transition='opacity '+(t||0.45)+'s';f.style.opacity='0';});}
function damage(v,why){
  if(state.mode!=='play'||state.dmgCool>0||v<=0)return;state.dmgCool=0.45;state.hull=Math.max(0,state.hull-v);state.shake=0.6;flash('rgba(255,60,50,.35)');sfx.hit();
  if(state.mission.onDamage)state.mission.onDamage(v);
  if(state.hull<=0)fail('機体が大破した');else showMsg(why+'  −'+Math.round(v));
}

function landedIn(z){
  if(!state.onGround||relSpeed()>2.4)return false;
  if(z.mover){if(!state.plat||state.plat.mover!==z.mover)return false;const L=z.mover.local(heli.pos.x,heli.pos.z);return Math.hypot(L.x-z.lx,L.z-z.lz)<z.r;}
  return Math.hypot(heli.pos.x-z.x,heli.pos.z-z.z)<z.r&&Math.abs(heli.pos.y-SKID-z.y)<1.6;

function holdLand(ms,zone,need,dt){if(landedIn(zone)){ms.hold+=dt;if(ms.hold>=need)return true;}else ms.hold=Math.max(0,ms.hold-dt*2);return false;}

/* ---------- physics（推力・重量・風の力で動かす） ----------
   旧実装は「入力＝速度」を直接代入していたため、重力も慣性も無く、
   風は速度の目標値に足すだけで機体を押していなかった。
   ここでは ①ローター推力(スプールアップあり) ②重力 ③対気速度に比例する抗力
   の3つの力で加速度を作る。風は②③を通して間接的に機体を押す。 */
const GRAV=9.81;            // 重力加速度
const MAX_TILT=0.56;        // ディスク最大傾き rad（約32°）
const BRAKE_TILT=0.70;      // 引き起こし（減速）時だけ許す傾き
const TILT_LAG=3.2;         // 姿勢の追従速度。小さいほど機体が重い
const SPOOL=1.3;            // ローター推力の立ち上がり（離陸の「よいしょ」）
const ACC_F=11.5,ACC_B=6.5,ACC_S=7.0;  // 操縦が要求する水平加速度
const DRAG_L=0.30,DRAG_Q=0.0030;       // 水平抗力（線形＋2乗）。低速で効かせて微調整を可能にする
const TRANS_LIFT=0.245;     // 並進揚力：速度が乗ると抗力が減り、巡航は約30m/sまで伸びる
const VDRAG_L=0.22,VDRAG_Q=0.016;      // 垂直抗力
const VCLIMB=5.6;           // コレクティブの余剰推力
const IDLE_RPM=0.72;        // 接地アイドル（推力<重量なので浮かない）
const SINK_LIMIT=-12.0;     // 全域の降下速度上限（落下死の保険）
const SOFT_SINK=-5.0;       // コレクティブを下げて接地へ向かうときの降下率上限
function physics(dt){
  const ms=state.mission;const f=fwdV(heli.yaw),r=rightV(heli.yaw);
  const pv=platVel();
  // --- 対気速度（風との相対速度）。これが抗力と風見鶏の源 ---
  const ax0=heli.vel.x-state.wind.x, az0=heli.vel.z-state.wind.z;
  const ay0=heli.vel.y-(state.onGround?0:state.wind.y);
  const air=Math.hypot(ax0,az0);
  // --- ヨー：テールローターの効き＋横滑りで機首が風上へ向く ---
  heli.yawVel+=(-input.turn*1.7-heli.yawVel)*Math.min(1,4*dt);
  if(!state.onGround){const side=ax0*r.x+az0*r.z;heli.yawVel+=-side*0.014*dt;}
  heli.yaw+=heli.yawVel*dt;
  // --- ローター推力（スプールアップ＝機体の重さ） ---
  const tilt0=Math.hypot(heli.pitch,heli.roll);
  const trim=1+0.6*(1/Math.max(0.72,Math.cos(tilt0))-1);  // バンク時の揚力損を6割だけ自動補正
  const hold=(!state.onGround&&input.vert===0)?-clamp(heli.vel.y,-7,7)*0.055:0; // 中立は高度を保つ
  const want=(state.onGround&&input.vert<=0.02)?IDLE_RPM
            :trim+hold+input.vert*(VCLIMB/GRAV)*(ms.climbMul||1);
  heli.rpm+=(want-heli.rpm)*Math.min(1,SPOOL*dt);
  // --- ディスクの傾き：操縦の指令に遅れて追従し、これが水平加速度になる ---
  const brake=(input.fwd<0&&(heli.vel.x*f.x+heli.vel.z*f.z)>2)?BRAKE_TILT:MAX_TILT;
  const cmdP=state.onGround?0:clamp((input.fwd>=0?input.fwd*ACC_F:input.fwd*ACC_B)/GRAV,-brake,MAX_TILT);
  const cmdR=state.onGround?0:clamp(input.strafe*ACC_S/GRAV,-MAX_TILT,MAX_TILT);
  heli.pitch+=(cmdP-heli.pitch)*Math.min(1,TILT_LAG*dt);
  heli.roll+=(cmdR-heli.roll)*Math.min(1,TILT_LAG*dt);
  const tilt=Math.hypot(heli.pitch,heli.roll);
  // --- 地面効果：接地直前は推力が増して浮く（着陸のクッション） ---
  const ge=1+0.22*smooth(12,0.5,state.agl);
  const thrust=GRAV*heli.rpm*ge;
  // --- 加速度の合成 ---
  const cl=Math.max(0.03,DRAG_L-TRANS_LIFT*clamp((air-4)/18,0,1));
  const dq=cl+DRAG_Q*air;
  let axx=thrust*Math.sin(heli.pitch)*f.x+thrust*Math.sin(heli.roll)*r.x-ax0*dq;
  let azz=thrust*Math.sin(heli.pitch)*f.z+thrust*Math.sin(heli.roll)*r.z-az0*dq;
  let ayy=thrust*Math.cos(tilt)-GRAV-ay0*(VDRAG_L+VDRAG_Q*Math.abs(ay0));
  if(state.onGround&&heli.rpm<1.0){
    // 接地中で推力が重量に届かないあいだは機体が地面に貼りついている
    const k=Math.min(1,8*dt);
    heli.vel.x+=(pv.x-heli.vel.x)*k;heli.vel.z+=(pv.z-heli.vel.z)*k;
    if(heli.vel.y<0)heli.vel.y=0;
    axx=azz=0;ayy=Math.max(0,ayy);
    heli.yawVel*=0.5;
  }
  heli.vel.x+=axx*dt;heli.vel.z+=azz*dt;heli.vel.y+=ayy*dt;
  if(heli.vel.y<SINK_LIMIT)heli.vel.y=SINK_LIMIT;
  if(state.agl<10&&input.vert<0&&heli.vel.y<SOFT_SINK)heli.vel.y=SOFT_SINK;
  prev.copy(heli.pos);
  if(state.carried)heli.pos.y+=heli.vel.y*dt;else heli.pos.addScaledVector(heli.vel,dt);
  const p=heli.pos;
  // side collisions
  for(const c of world.colliders){const top=cTop(c);
    if(p.y-SKID<top-0.8&&p.y+1.4>cBase(c)&&inFoot(c,p.x,p.z,1.0)){
      if(!inFoot(c,prev.x,prev.z,1.0)){const hs=Math.hypot(heli.vel.x-(c.mover?c.mover.vx:0),heli.vel.z-(c.mover?c.mover.vz:0));p.x=prev.x;p.z=prev.z;heli.vel.x*=-0.3;heli.vel.z*=-0.3;if(hs>2.5)damage(hs*2.1,'衝突');}
      else p.y=top+SKID;}}
  // bounds
  const B=430;if(Math.abs(p.x)>B||Math.abs(p.z)>B){p.x=clamp(p.x,-B,B);p.z=clamp(p.z,-B,B);heli.vel.x*=0.5;heli.vel.z*=0.5;if(!physics._w||state.t-physics._w>2){physics._w=state.t;showMsg('エリアの外には出られない');}}
  if(p.y>380){p.y=380;if(heli.vel.y>0)heli.vel.y=0;}
  // water
  const gi=groundInfo(p.x,p.z,p.y-SKID);
  if(world.water!==null&&!gi.plat&&gi.h<world.water&&p.y-SKID<world.water+0.15){if(state.mode==='play'){sfx.splash();fail('着水してしまった');}p.y=world.water+SKID-0.6;heli.vel.set(0,0,0);return;}
  state.onGround=false;state.plat=null;
  if(p.y-SKID<=gi.h+0.03){
    const pvv=gi.plat&&gi.plat.mover?gi.plat.mover:null;
    const hs=Math.hypot(heli.vel.x-(pvv?pvv.vx:0),heli.vel.z-(pvv?pvv.vz:0));
    if(heli.vel.y<-7.2)damage((-heli.vel.y-7.2)*9+8,'ハードランディング');
    else if(hs>10)damage(hs*1.4,'接地');
    p.y=gi.h+SKID;if(heli.vel.y<0)heli.vel.y=0;state.onGround=true;state.plat=gi.plat;
  }
  state.agl=p.y-SKID-(world.water!==null&&!gi.plat?Math.max(gi.h,world.water):gi.h);
  // 突風のあおり：風の変化量だけ姿勢と視界を揺らす
  const pw=physics._pw||(physics._pw=new THREE.Vector3());
  const dw=Math.hypot(state.wind.x-pw.x,state.wind.z-pw.z)+Math.abs(state.wind.y-pw.y);
  pw.copy(state.wind);
  if(!state.onGround&&dw>0.004){
    heli.roll+=(Math.random()-0.5)*dw*0.9;heli.pitch+=(Math.random()-0.5)*dw*0.6;
    if(dw>0.05)state.shake=Math.max(state.shake,Math.min(0.35,dw*2.2));
  }
}
function carryOnMovers(dt,t){
  let carry=null;state.carried=false;
  if(state.onGround&&state.plat&&state.plat.mover){const mv=state.plat.mover;carry={mv,L:mv.local(heli.pos.x,heli.pos.z),yaw0:mv.yaw,dy:heli.pos.y-mv.y};}
  for(const mv of world.movers)mv.update(t,dt);
  if(carry){const w=carry.mv.world(carry.L.x,carry.L.z);heli.pos.x=w.x;heli.pos.z=w.z;heli.pos.y=carry.mv.y+carry.dy;heli.yaw+=carry.mv.yaw-carry.yaw0;state.carried=input.vert<=0.05;}
}

/* ---------- wind ---------- */
function updateWind(t){
  const w=state.mission.wind||{x:0,z:0,gust:0,vert:0,rot:0};
  const a=(w.rot||0)*t;const bx=w.x*Math.cos(a)-w.z*Math.sin(a),bz=w.x*Math.sin(a)+w.z*Math.cos(a);
  const g=w.gust||0;
  state.wind.set(bx+g*Math.sin(t*0.71)*Math.sin(t*1.93+1),(w.vert||0)*Math.sin(t*1.3)*Math.sin(t*0.47+2),bz+g*Math.cos(t*0.63+0.5)*Math.sin(t*1.51));
}

/* ---------- camera ---------- */
const camPos=new THREE.Vector3(0,30,-40),want=new THREE.Vector3(),look=new THREE.Vector3();
function cycleCam(){state.camMode=(state.camMode+1)%3;showMsg(['追従カメラ','引きカメラ','真上カメラ'][state.camMode],1);}
function updateCamera(dt){
  const p=heli.pos,f=fwdV(heli.yaw);
  if(state.camMode===0){want.set(p.x-f.x*17,p.y+6.5,p.z-f.z*17);look.set(p.x+f.x*6,p.y+1.2,p.z+f.z*6);}
  else if(state.camMode===1){want.set(p.x-f.x*36,p.y+16,p.z-f.z*36);look.set(p.x+f.x*10,p.y,p.z+f.z*10);}
  else{want.set(p.x-f.x*0.5,p.y+52,p.z-f.z*0.5);look.copy(p);}
  const gh=groundInfo(want.x,want.z,want.y).h+2.5;if(want.y<gh)want.y=gh;
  camPos.lerp(want,1-Math.exp(-dt*4.5));camera.position.copy(camPos);
  if(state.camMode===2)camera.up.set(f.x,0,f.z);else camera.up.set(0,1,0);
  camera.lookAt(look);
  if(state.shake>0){state.shake-=dt;const s=state.shake*0.8;camera.position.x+=(Math.random()-0.5)*s;camera.position.y+=(Math.random()-0.5)*s;}
}

/* 1 河川敷 */
{title:'河川敷まで頼む',client:'釣り好きの社長',quote:'河川敷まで頼む。夕マズメに間に合わせたいんだ。',tier:'基本操作',

/* ---------- flow ---------- */
function screen(id){['title','select','brief','pause','result'].forEach(s=>$('#'+s).classList.toggle('hidden',s!==id));}
function renderRows(){
  const el=$('#rows');el.innerHTML='';let lastTier='';
  STAGES.forEach((s,i)=>{
    if(s.tier!==lastTier){lastTier=s.tier;const t=document.createElement('div');t.className='tier';t.textContent=s.tier;el.appendChild(t);}
    const locked=i+1>save.unlocked;const st=save.stars[i]||0;
    const b=document.createElement('button');b.className='row'+(locked?' locked':'');b.disabled=locked;
    b.innerHTML=`<span class="n chrome">${i+1}</span><span><b></b><small></small></span><span class="st">${'★'.repeat(st)}<i>${'★'.repeat(3-st)}</i></span>`;
    b.querySelector('b').textContent=locked?'─ まだ届いていない依頼 ─':s.title;b.querySelector('small').textContent=locked?'前の依頼をクリアすると届く':s.client+'より'+(save.best[i]?'　ベスト '+fmt(save.best[i]):'');
    if(!locked)b.addEventListener('click',()=>openStage(i));el.appendChild(b);
  });
}
function openStage(i){

  for(const mv of world.movers)mv.update(0,0);
  const gi=groundInfo(heli.pos.x,heli.pos.z,999);heli.pos.y=gi.h+SKID;heli.vel.set(0,0,0);heli.yawVel=0;heli.pitch=heli.roll=0;heli.rpm=IDLE_RPM;state.agl=0;
  state.t=0;state.hull=100;state.onGround=true;state.plat=gi.plat;state.dmgCool=0;state.shake=0;state.agl=0;actionQueued=false;
  ms.hold=ms.hold||0;updateWind(0);

    :'<kbd>W</kbd><kbd>S</kbd> 前後　<kbd>A</kbd><kbd>D</kbd> 旋回　<kbd>Q</kbd><kbd>E</kbd> 横移動　<kbd>Space</kbd>/<kbd>↑</kbd> 上昇　<kbd>Shift</kbd>/<kbd>↓</kbd> 下降<br><kbd>F</kbd> アクション　<kbd>C</kbd> カメラ切替　<kbd>P</kbd> 一時停止<br>機体は重い。止まるときは早めに引き起こす。青い輪＝真下／橙の輪＝いま降りたら着く場所／橙の矢印＝目標の方向と距離';

function go(){initAudio();state.autoLift=2.0;state.mode='play';screen(null);$('#hud').classList.remove('hidden');$('#h-stage').textContent=`FLIGHT ${String(state.idx+1).padStart(2,'0')} ─ ${STAGES[state.idx].client}`;showMsg('離陸！ 操作開始',2);sfx.ok();}
function pauseGame(){if(state.mode!=='play')return;state.mode='paused';$('#p-obj').textContent=state.mission.objective();screen('pause');}
function resumeGame(){if(state.mode!=='paused')return;state.mode='play';screen(null);}
function win(){if(state.mode!=='play')return;endStage(true,'');}
function fail(why){if(state.mode!=='play')return;endStage(false,why);}
function endStage(ok,why){
  state.mode='ending';state.endTimer=ok?1.2:1.4;state.result={ok,why};
  if(ok){sfx.win();showMsg('ミッション完了！',2);}else{sfx.fail();showMsg(why,2);heli.vel.set(0,0,0);}

function showResult(){
  const s=STAGES[state.idx],ms=state.mission,{ok,why}=state.result;
  const quality=ms.score?ms.score():state.hull;
  let stars=0;const c1=ok,c2=ok&&state.t<=s.par,c3=ok&&quality>=80;if(c1)stars++;if(c2)stars++;if(c3)stars++;
  if(ok){save.stars[state.idx]=Math.max(save.stars[state.idx]||0,stars);if(!save.best[state.idx]||state.t<save.best[state.idx])save.best[state.idx]=Math.round(state.t);save.unlocked=Math.max(save.unlocked,Math.min(10,state.idx+2));persist();}

  $('#r-head').textContent=ok?'依頼完了':'依頼失敗';$('#r-head').className='big'+(ok?' chrome':'');
  $('#r-why').textContent=ok?(s.client+'「ありがとう、助かったよ」'):why;
  $('#r-stars').innerHTML='★'.repeat(stars)+'<i>'+'★'.repeat(3-stars)+'</i>';
  $('#r-time').textContent=fmt(state.t);$('#r-hull').textContent=Math.round(state.hull)+'%';
  $('#r-xl').textContent=ms.extra?ms.extra.label:'目標タイム';$('#r-x').textContent=ms.extra?Math.round(ms.extra.value*100)+'%':fmt(s.par);
  $('#r-crit').innerHTML=`${c1?'★':'☆'} 依頼をこなす<br>${c2?'★':'☆'} ${fmt(s.par)} 以内に終える<br>${c3?'★':'☆'} ${ms.extra?'機体と'+ms.extra.label+'を':'機体を'}80%以上保つ`;
  const hasNext=ok&&state.idx<9;$('#r-next').classList.toggle('hidden',!hasNext);
  $('#r-next').textContent='次の依頼';$('#hud').classList.add('hidden');screen('result');state.mode='result';
}

const openList=()=>{if(state.mode!=='title')return;initAudio();renderRows();state.mode='select';screen('select');};
$('#b-start').addEventListener('click',openList);
$('#b-back').addEventListener('click',()=>{state.mode='title';screen('title');});
$('#bf-back').addEventListener('click',()=>{buildShowroom();renderRows();state.mode='select';screen('select');});
$('#bf-go').addEventListener('click',()=>{if(state.mode==='brief')go();});
$('#b-pause').addEventListener('click',pauseGame);
$('#b-cam').addEventListener('click',cycleCam);
$('#p-resume').addEventListener('click',resumeGame);
$('#p-retry').addEventListener('click',()=>openStage(state.idx));
$('#p-list').addEventListener('click',()=>{buildShowroom();renderRows();state.mode='select';$('#hud').classList.add('hidden');screen('select');});
$('#p-sound').addEventListener('click',()=>{soundOn=!soundOn;$('#p-sound').textContent='サウンド：'+(soundOn?'オン':'オフ');if(master)master.gain.value=soundOn?0.7:0;});
$('#r-retry').addEventListener('click',()=>openStage(state.idx));
$('#r-next').addEventListener('click',()=>openStage(state.idx+1));
$('#r-list').addEventListener('click',()=>{buildShowroom();renderRows();state.mode='select';screen('select');});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseGame();});

/* ---------- HUD ---------- */
const hud={alt:$('#g-alt'),spd:$('#g-spd'),vs:$('#g-vs'),dist:$('#g-dist'),time:$('#h-time'),obj:$('#h-obj'),wind:$('#h-wind'),arrow:$('#wind-arrow'),
  hull:$('#bar-hull'),extra:$('#bar-extra'),prog:$('#bar-prog')};
const tmark=$('#tmark'),tmarkA=tmark.querySelector('svg'),tmarkD=$('#tmark-d'),_tp=new THREE.Vector3();
/* 目標マーカー: 画面内なら目標の上に、画面外なら縁に寄せて方向を指す */
function updateTargetMark(){
  const tg=state.mission&&state.mission.target;
  if(state.mode!=='play'||!tg){if(tmark.style.display!=='none')tmark.style.display='none';return;}
  _tp.set(tg.x,tg.y+8,tg.z).project(camera);
  const W=innerWidth,H=innerHeight,m=42,cx=W/2,cy=H/2;
  const behind=_tp.z>1;
  let sx=(_tp.x*0.5+0.5)*W,sy=(-_tp.y*0.5+0.5)*H;
  if(behind){sx=W-sx;sy=H-sy;}
  let off=behind||sx<m||sx>W-m||sy<m||sy>H-m,ang=0;
  if(off){
    let dx=sx-cx,dy=sy-cy;if(!dx&&!dy)dy=1;
    const k=Math.min((cx-m)/Math.max(1e-3,Math.abs(dx)),(cy-m)/Math.max(1e-3,Math.abs(dy)));
    sx=cx+dx*k;sy=cy+dy*k;ang=Math.atan2(dy,dx)*180/Math.PI-90;
  }
  tmark.style.display='flex';
  tmark.style.transform='translate('+(sx-22).toFixed(0)+'px,'+(sy-30).toFixed(0)+'px)';
  tmarkA.style.transform='rotate('+ang.toFixed(0)+'deg)';
  tmark.classList.toggle('near',!off&&Math.hypot(tg.x-heli.pos.x,tg.z-heli.pos.z)<22);
  tmarkD.textContent=Math.round(Math.hypot(tg.x-heli.pos.x,tg.z-heli.pos.z))+'m';
}
let hudFrame=0;
function setBar(el,v,label){el.querySelector('i').style.width=(clamp(v,0,1)*100).toFixed(1)+'%';if(label!==undefined)el.querySelector('label').textContent=label;}
function updateHUD(){
  if(++hudFrame%3)return;const ms=state.mission,s=STAGES[state.idx];
  hud.alt.textContent=Math.max(0,Math.round(state.agl));hud.spd.textContent=Math.round(Math.hypot(heli.vel.x,heli.vel.z)*3.6);
  const vy=heli.vel.y;hud.vs.textContent=(vy>=0?'+':'')+vy.toFixed(1);hud.vs.classList.toggle('warn',vy<-5);
  hud.dist.textContent=ms.target?Math.round(Math.hypot(ms.target.x-heli.pos.x,ms.target.z-heli.pos.z)):'–';
  const left=s.time-state.t;hud.time.textContent=fmt(left);hud.time.classList.toggle('low',left<20);
  hud.obj.textContent=ms.objective();
  setBar(hud.hull,state.hull/100,'機体 '+Math.round(state.hull)+'%');hud.hull.classList.toggle('danger',state.hull<35);
  if(ms.extra){hud.extra.classList.remove('hidden');setBar(hud.extra,ms.extra.value,ms.extra.label+' '+Math.round(ms.extra.value*100)+'%');hud.extra.classList.toggle('danger',ms.extra.value<0.35);}else hud.extra.classList.add('hidden');
  if(ms.progress!==undefined&&ms.progress>=0&&(ms.progress>0.001||ms.progLabel)){hud.prog.classList.remove('hidden');setBar(hud.prog,ms.progress,ms.progLabel||'');}else hud.prog.classList.add('hidden');
  const w=state.wind,f=fwdV(heli.yaw),r=rightV(heli.yaw);const lz=w.x*f.x+w.z*f.z,lx=w.x*r.x+w.z*r.z;const sp=Math.hypot(w.x,w.z);
  hud.wind.textContent=sp.toFixed(1)+' m/s'+(sp>6?' 強風':'');hud.arrow.style.transform=`rotate(${Math.atan2(lx,lz)*180/Math.PI}deg)`;
}

/* ---------- main loop ---------- */
let last=performance.now();
/* 自動解像度調整: 端末が追いつかないときだけ描画解像度を下げる。
   19 RAF/秒しか出ない端末があったため、固定値ではなく実測で合わせる。 */
let prAcc=0,prN=0;
function autoRes(dt){
  prAcc+=dt;prN++;if(prN<45)return;
  const fps=prN/prAcc;prAcc=0;prN=0;
  if(fps<50&&pxRatio>0.8){pxRatio=Math.max(0.8,pxRatio-0.2);renderer.setPixelRatio(pxRatio);resize();}
  else if(fps>58&&pxRatio<PR_CAP){pxRatio=Math.min(PR_CAP,pxRatio+0.25);renderer.setPixelRatio(pxRatio);resize();}
}
function frame(now){
  requestAnimationFrame(frame);
  let dt=Math.min(0.05,(now-last)/1000);last=now;
  autoRes(dt);
  const mode=state.mode;
  M.blink.emissiveIntensity=1+Math.max(0,Math.sin(now*0.006))*2.5;
  M.red.emissiveIntensity=(Math.floor(now/700)%2)?3:0.4;
  if(mode==='play'||mode==='ending'){
    if(mode==='play'){state.t+=dt;state.autoLift=Math.max(0,(state.autoLift||0)-dt);if(state.t>STAGES[state.idx].time){fail('時間切れ');}readInput();}
    else{input.fwd=input.turn=input.strafe=0;input.vert=state.result.ok?0:-1;state.endTimer-=dt;}
    state.dmgCool=Math.max(0,state.dmgCool-dt);
    updateWind(state.t);
    carryOnMovers(dt,state.t);
    if(state.mode==='play'||(state.mode==='ending'&&!state.result.ok))physics(dt);
    if(state.mode==='play')state.mission.update(dt);else actionQueued=false;
    for(const fx of world.fx)fx.update(dt);
    // guide
    const tg=state.mission.target;
    if(tg&&state.mode==='play'){beam.visible=true;beam.position.set(tg.x,tg.y+350,tg.z);arrow.visible=true;arrow.position.set(heli.pos.x,heli.pos.y+4.2,heli.pos.z);arrow.lookAt(tg.x,heli.pos.y+4.2,tg.z);}
    else{beam.visible=arrow.visible=false;}
    updateGroundMarks();
    updateCamera(dt);
    if(state.mode==='play'){updateHUD();updateTargetMark();}else tmark.style.display='none';
    if(rotorGain&&AC){const th=0.10+heli.rpm*0.20+Math.abs(heli.pitch)*0.10;rotorGain.gain.setTargetAtTime(soundOn?th:0,AC.currentTime,0.09);rotorLfo.frequency.setTargetAtTime(9+heli.rpm*5.5+Math.abs(heli.pitch)*4,AC.currentTime,0.15);}
    if(state.mode==='ending'&&state.endTimer<=0)showResult();
  }else if(mode==='brief'||mode==='paused'||mode==='result'){
    for(const mv of world.movers)if(mode==='brief'){mv.update(state.t,0);}
    if(mode==='brief'){updateWind(0);const f=fwdV(heli.yaw);const a=now*0.00015;want.set(heli.pos.x-Math.sin(heli.yaw+a)*26,heli.pos.y+9,heli.pos.z-Math.cos(heli.yaw+a)*26);camPos.lerp(want,1-Math.exp(-dt*2));camera.position.copy(camPos);camera.up.set(0,1,0);camera.lookAt(heli.pos.x+f.x*4,heli.pos.y+1,heli.pos.z+f.z*4);}
    if(rotorGain&&AC)rotorGain.gain.setTargetAtTime(mode==='brief'&&soundOn?0.1:0,AC.currentTime,0.2);
  }else{
    if(!showroom)buildShowroom();
    showroom.a+=dt*0.25;heli.yaw=showroom.a*0.6;heli.pos.y=3.2+Math.sin(now*0.0012)*0.25;
    const R=isTouch?19:15;camera.position.set(Math.sin(showroom.a)*R,5.5+Math.sin(showroom.a*0.7)*1.5,Math.cos(showroom.a)*R);camera.up.set(0,1,0);camera.lookAt(0,3.4,0);
    if(rotorGain&&AC)rotorGain.gain.setTargetAtTime(0,AC.currentTime,0.2);
  }
  // heli visuals
  heliMesh.position.copy(heli.pos);heliMesh.rotation.set(heli.pitch,heli.yaw,heli.roll,'YXZ');
  const spin=(mode==='title'||mode==='select')?8:(mode==='play'||mode==='ending')?10+heli.rpm*24:16;
  heliMesh.userData.rot.rotation.y+=spin*dt;heliMesh.userData.tr.rotation.x+=spin*2*dt;
  sky.position.copy(camera.position);
  const focus=heli.pos;sun.position.copy(focus).add(sunOff);sun.target.position.copy(focus);
  renderer.render(scene,camera);
}
buildShowroom();
requestAnimationFrame(frame);
})();
}
