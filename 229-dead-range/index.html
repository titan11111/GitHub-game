<canvas id="g"></canvas>

<div class="pad">

<script>
"use strict";
/* ============================================================
   DEAD RANGE ─ ゾンビ狙撃
   単一HTML / 依存ゼロ / Canvas 2D + Web Audio + Vibration API
   ============================================================ */

const cvs = document.getElementById('g');
const ctx = cvs.getContext('2d');
let W = 0, H = 0, DPR = 1;

function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cvs.width = W * DPR; cvs.height = H * DPR;
  cvs.style.width = W + 'px'; cvs.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

/* ---------- 音（Web Audio・その場合成／音声ファイルは1本も使わない） ----------
   設計:
   1. 全ての音は master → destination を通す。銃声だけ「廃墟の残響」と
      「向かいのビルからの返り」へ送り、夜の街の広さを出す
   2. ゾンビの声はフォルマント合成（帯域3本）で母音を作る。単なる低音のブーンではなく
      「喉から出ている」音にする
   3. ゾンビの声は距離で音量と高域が変わり、左右へ振れる。姿が見えなくても
      「どこに何体いるか」が音だけで分かる                                        */
let AC = null;
function ac(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }

function noiseBuf(sec, pw){
  const a = ac(); const n = Math.floor(a.sampleRate*sec);
  const b = a.createBuffer(1,n,a.sampleRate); const d = b.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/n, pw===undefined?2.2:pw);
  return b;
}
/* 廃墟の残響。ノイズ×指数減衰のインパルス応答をその場で作る（音源ファイル不要） */
function irBuf(sec, decay){
  const a = ac(); const n = Math.floor(a.sampleRate*sec);
  const b = a.createBuffer(2,n,a.sampleRate);
  for(let c=0;c<2;c++){
    const d = b.getChannelData(c);
    for(let i=0;i<n;i++){
      const t = i/n;
      const pre = t < .014 ? t/.014 : 1;      // 立ち上がりを遅らせる＝壁が遠い＝広い
      d[i] = (Math.random()*2-1) * pre * Math.pow(1-t, decay);
    }
  }
  return b;
}

let MASTER=null, REV=null, ECHO=null;
function bus(){
  const a = ac(); if(!a) return null;
  if(!MASTER){
    // DynamicsCompressor は実測で -13dB も持っていかれ、音全体が痩せた（測定値: ピーク 0.898→0.205）。
    // リミッターに頼らず、銃声そのものを 0.75 前後へ収めて重なりの余地を残す
    MASTER = a.createGain(); MASTER.gain.value = .72; MASTER.connect(a.destination);

    // 残響（廃墟の壁）
    REV = a.createConvolver(); REV.buffer = irBuf(2.1, 3.0);
    const rg = a.createGain(); rg.gain.value = .50;
    REV.connect(rg); rg.connect(MASTER);

    // 返り（向かいのビル）。0.27秒遅れて高域が削れた複製が2〜3回返る
    ECHO = a.createGain(); ECHO.gain.value = 1;
    const dl = a.createDelay(1.0); dl.delayTime.value = .27;
    const fb = a.createGain(); fb.gain.value = .34;
    const lp = a.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 820;
    const eg = a.createGain(); eg.gain.value = .42;
    ECHO.connect(dl); dl.connect(lp); lp.connect(fb); fb.connect(dl);
    lp.connect(eg); eg.connect(MASTER);
  }
  return MASTER;
}
/* node を dry / 残響 / 返り の3系統へ配る */
function out(node, dry, wet, echo){
  const a = ac(), m = bus(); if(!m) return;
  const g = a.createGain(); g.gain.value = dry; node.connect(g); g.connect(m);
  if(wet && REV){  const w = a.createGain(); w.gain.value = wet;  node.connect(w); w.connect(REV); }
  if(echo && ECHO){const e = a.createGain(); e.gain.value = echo; node.connect(e); e.connect(ECHO); }
}
/* 左右の定位。古い iOS Safari に無い場合は素通し */
function panner(v){
  const a = ac();
  if(!a.createStereoPanner) return null;
  const p = a.createStereoPanner(); p.pan.value = Math.max(-1, Math.min(1, v)); return p;
}

/* ---- 銃声: ①撃発のクラック ②銃身から抜ける圧 ③腹に来る低音 ＋ 街の返り ---- */
function shot(){
  const a = ac(); if(!a) return; const t = a.currentTime;

  // ① クラック（0.05秒）。ここが無いと「布を叩く音」になる
  const c = a.createBufferSource(); c.buffer = noiseBuf(.05, 1.1);
  const cf = a.createBiquadFilter(); cf.type='highpass'; cf.frequency.value = 1900;
  const cg = a.createGain();
  cg.gain.setValueAtTime(.60,t); cg.gain.exponentialRampToValueAtTime(.001,t+.048);
  c.connect(cf); cf.connect(cg); out(cg,1,.35,.55); c.start(t); c.stop(t+.06);

  // ② ボディ。広い帯域を一気に閉じると「破裂して抜ける」形になる
  const s = a.createBufferSource(); s.buffer = noiseBuf(.32);
  const f = a.createBiquadFilter(); f.type='lowpass';
  f.frequency.setValueAtTime(3400,t); f.frequency.exponentialRampToValueAtTime(170,t+.28);
  const g = a.createGain();
  g.gain.setValueAtTime(.48,t); g.gain.exponentialRampToValueAtTime(.001,t+.32);
  s.connect(f); f.connect(g); out(g,1,.75,.85); s.start(t); s.stop(t+.33);

  // ③ 腹に来る低音
  const o = a.createOscillator(); o.type='sine';
  o.frequency.setValueAtTime(145,t); o.frequency.exponentialRampToValueAtTime(33,t+.20);
  const g2 = a.createGain();
  g2.gain.setValueAtTime(.42,t); g2.gain.exponentialRampToValueAtTime(.001,t+.24);
  o.connect(g2); out(g2,1,.20,.18); o.start(t); o.stop(t+.25);
}

function click(freq, dur, vol, type){
  const a = ac(); if(!a) return; const t = a.currentTime;
  const o = a.createOscillator(); o.type = type||'square'; o.frequency.setValueAtTime(freq,t);
  const g = a.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g); out(g,1,.10,0); o.start(t); o.stop(t+dur+.02);
}

/* ---- 金属音: ボルト操作・装填。短いノイズ＋高い倍音で「鉄が擦れて噛む」 ---- */
function metal(freq, dur, vol){
  const a = ac(); if(!a) return; const t = a.currentTime;
  const s = a.createBufferSource(); s.buffer = noiseBuf(dur, 1.5);
  const f = a.createBiquadFilter(); f.type='bandpass'; f.frequency.value = freq; f.Q.value = 2.2;
  const g = a.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.connect(f); f.connect(g); out(g,1,.22,0); s.start(t); s.stop(t+dur+.02);
  const o = a.createOscillator(); o.type='square'; o.frequency.setValueAtTime(freq*1.5,t);
  const g2 = a.createGain(); g2.gain.setValueAtTime(vol*.34,t); g2.gain.exponentialRampToValueAtTime(.001,t+dur*.6);
  o.connect(g2); out(g2,1,.14,0); o.start(t); o.stop(t+dur);
}

/* ---- ゾンビの唸り: フォルマント合成 ----
   母音は「共鳴する3つの帯域」で決まる。声帯（鋸波）＋かすれ（ノイズ）を
   バンドパス3本に通すと、低音のブーンではなく「うぅ／おぉ」に聞こえる       */
const VOWEL = [[560,830,2400],[440,1000,2250],[320,860,2200],[640,1180,2300]];  // あ・お・う・え
function groan(z){
  const a = ac(); if(!a) return; const t = a.currentTime;

  // 距離で音量と高域、横位置で左右が決まる。姿が見えなくても群れの居場所が分かる
  let vol = .22, pan = 0, cut = 2600;
  if(z){
    const near = Math.max(0, Math.min(1, 1 - (z.d - REACH) / 900));
    vol = .07 + near*.30;
    pan = (z.x - S.camX) / 900;
    cut = 460 + near*2400;                    // 遠いほど高域が減る＝距離が出る
  }
  const V  = VOWEL[(Math.random()*VOWEL.length)|0];
  const f0 = 58 + Math.random()*40;
  const dur = .55 + Math.random()*.35;

  // 声帯
  const o = a.createOscillator(); o.type='sawtooth';
  o.frequency.setValueAtTime(f0,t);
  o.frequency.linearRampToValueAtTime(f0*.68, t+dur);
  // 声が震える（生きていない喉）
  const lfo = a.createOscillator(); lfo.type='sine'; lfo.frequency.value = 4.5 + Math.random()*3;
  const lg = a.createGain(); lg.gain.value = f0*.07;
  lfo.connect(lg); lg.connect(o.frequency);
  // かすれ
  const n = a.createBufferSource(); n.buffer = noiseBuf(dur, .6);
  const ng = a.createGain(); ng.gain.value = .12;
  n.connect(ng);

  const mix = a.createGain(); mix.gain.value = 1;
  o.connect(mix); ng.connect(mix);

  // フォルマント3本
  const amp = [1, .55, .22];
  const sum = a.createGain(); sum.gain.value = 1;
  for(let i=0;i<3;i++){
    const bp = a.createBiquadFilter(); bp.type='bandpass';
    bp.frequency.value = V[i] * (.9 + Math.random()*.2); bp.Q.value = 7;
    const bg = a.createGain(); bg.gain.value = amp[i];
    mix.connect(bp); bp.connect(bg); bg.connect(sum);
  }
  const lp = a.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = cut;
  const g = a.createGain();
  g.gain.setValueAtTime(.0001,t);
  g.gain.linearRampToValueAtTime(vol, t+.12);
  g.gain.setValueAtTime(vol, t+dur*.55);
  g.gain.exponentialRampToValueAtTime(.001, t+dur);

  sum.connect(lp); lp.connect(g);
  const p = panner(pan);
  if(p){ g.connect(p); out(p, 1, .30, 0); } else out(g, 1, .30, 0);

  o.start(t); lfo.start(t); n.start(t);
  o.stop(t+dur+.05); lfo.stop(t+dur+.05); n.stop(t+dur+.05);
}

/* ---- 着弾: 頭は潰れる音、胴は鈍く重い音 ---- */
function impact(head, z){
  const a = ac(); if(!a) return; const t = a.currentTime;
  const pan = z ? (z.x - S.camX)/900 : 0;
  const dur = head ? .26 : .18;
  const s = a.createBufferSource(); s.buffer = noiseBuf(dur, head ? 1.4 : 2.6);
  const f = a.createBiquadFilter(); f.type = head ? 'bandpass' : 'lowpass';
  f.frequency.setValueAtTime(head ? 900 : 700, t);
  f.frequency.exponentialRampToValueAtTime(head ? 180 : 120, t+dur);
  if(head) f.Q.value = 1.1;
  const g = a.createGain();
  g.gain.setValueAtTime(head ? .34 : .22, t); g.gain.exponentialRampToValueAtTime(.001, t+dur);
  s.connect(f); f.connect(g);
  const p = panner(pan);
  if(p){ g.connect(p); out(p,1,.35,0); } else out(g,1,.35,0);
  s.start(t); s.stop(t+dur+.02);

  const o = a.createOscillator(); o.type='sine';
  o.frequency.setValueAtTime(head ? 210 : 130, t);
  o.frequency.exponentialRampToValueAtTime(head ? 44 : 38, t+dur);
  const g2 = a.createGain();
  g2.gain.setValueAtTime(head ? .26 : .18, t); g2.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g2); out(g2,1,.18,0); o.start(t); o.stop(t+dur+.02);
}
/* ---- 倒れた体が地面に落ちる ---- */
function bodyFall(z){
  const a = ac(); if(!a) return; const t = a.currentTime + .16;
  const pan = z ? (z.x - S.camX)/900 : 0;
  const s = a.createBufferSource(); s.buffer = noiseBuf(.30, 3.0);
  const f = a.createBiquadFilter(); f.type='lowpass'; f.frequency.value = 300;
  const g = a.createGain(); g.gain.setValueAtTime(.20,t); g.gain.exponentialRampToValueAtTime(.001,t+.30);
  s.connect(f); f.connect(g);
  const p = panner(pan);
  if(p){ g.connect(p); out(p,1,.40,0); } else out(g,1,.40,0);
  s.start(t); s.stop(t+.32);
}

/* ---- 肥大体の溜め: 低い唸りがせり上がる。「来る」という予告 ---- */
function growl(z){
  const a = ac(); if(!a) return; const t = a.currentTime;
  const pan = z ? (z.x - S.camX)/900 : 0;
  const o = a.createOscillator(); o.type='sawtooth';
  o.frequency.setValueAtTime(36,t); o.frequency.exponentialRampToValueAtTime(98,t+.46);
  const f = a.createBiquadFilter(); f.type='lowpass';
  f.frequency.setValueAtTime(190,t); f.frequency.linearRampToValueAtTime(940,t+.46);
  const g = a.createGain();
  g.gain.setValueAtTime(.001,t);
  g.gain.linearRampToValueAtTime(.32,t+.40); g.gain.exponentialRampToValueAtTime(.001,t+.55);
  o.connect(f); f.connect(g);
  const p = panner(pan);
  if(p){ g.connect(p); out(p,1,.40,0); } else out(g,1,.40,0);
  o.start(t); o.stop(t+.57);
}
/* ---- 突進の号砲 ---- */
function roar(z){
  const a = ac(); if(!a) return; const t = a.currentTime;
  const pan = z ? (z.x - S.camX)/900 : 0;
  const nz = a.createBufferSource(); nz.buffer = noiseBuf(.55, 1.2);
  const f = a.createBiquadFilter(); f.type='bandpass'; f.frequency.value = 520; f.Q.value = 1.1;
  const g = a.createGain(); g.gain.setValueAtTime(.34,t); g.gain.exponentialRampToValueAtTime(.001,t+.55);
  nz.connect(f); f.connect(g);
  const o = a.createOscillator(); o.type='square';
  o.frequency.setValueAtTime(124,t); o.frequency.exponentialRampToValueAtTime(50,t+.40);
  const g2 = a.createGain(); g2.gain.setValueAtTime(.22,t); g2.gain.exponentialRampToValueAtTime(.001,t+.45);
  o.connect(g2);
  const p = panner(pan);
  if(p){ g.connect(p); g2.connect(p); out(p,1,.50,.18); }
  else  { out(g,1,.50,.18); out(g2,1,.50,.18); }
  nz.start(t); nz.stop(t+.57); o.start(t); o.stop(t+.47);
}
function buzz(ms){ navigator.vibrate && navigator.vibrate(ms||28); }
function heart(){
  const a = ac(); if(!a) return; const t = a.currentTime;
  const o = a.createOscillator(); o.type='sine';
  o.frequency.setValueAtTime(60,t); o.frequency.exponentialRampToValueAtTime(30,t+.13);
  const g = a.createGain(); g.gain.setValueAtTime(.0015,t);
  g.gain.linearRampToValueAtTime(.20,t+.02); g.gain.exponentialRampToValueAtTime(.001,t+.17);
  o.connect(g); out(g,1,0,0); o.start(t); o.stop(t+.19);
}
function surgeSting(){
  const a = ac(); if(!a) return; const t = a.currentTime;
  const s = a.createBufferSource(); s.buffer = noiseBuf(1.0);
  const f = a.createBiquadFilter(); f.type='lowpass';
  f.frequency.setValueAtTime(90,t); f.frequency.linearRampToValueAtTime(240,t+.6);
  const g = a.createGain(); g.gain.setValueAtTime(.34,t); g.gain.exponentialRampToValueAtTime(.001,t+1.0);
  s.connect(f); f.connect(g); out(g,1,.45,0); s.start(t); s.stop(t+1.02);
}
function calmSting(){
  const a = ac(); if(!a) return; const t = a.currentTime;
  const o = a.createOscillator(); o.type='sine';
  o.frequency.setValueAtTime(180,t); o.frequency.exponentialRampToValueAtTime(96,t+.7);
  const g = a.createGain(); g.gain.setValueAtTime(.10,t); g.gain.exponentialRampToValueAtTime(.001,t+.75);
  o.connect(g); out(g,1,.35,0); o.start(t); o.stop(t+.77);
}

/* ---------- 定数 ---------- */
const FOCAL_HIP = 430, FOCAL_ZOOM = 1180;
const CAMH = 118, ZH = 172;
const MAG = 5, RELOAD_MS = 1600, CYCLE_MS = 620;
const FAR = 1400, REACH = 95;
const TOUCH = window.matchMedia && window.matchMedia('(pointer:coarse)').matches;

/* 群れのリズム（潮）: 静寂 → 突進 → 進行 を行き来させる */
const TIDE = {
  calm : {mul:.52, min:2.4, max:4.2, label:'静まった',   col:'#5f7f8c'},
  march: {mul:1.0, min:3.0, max:5.4, label:'',           col:'#6f8a6b'},
  surge: {mul:1.85, min:1.5, max:2.6, label:'走り出した', col:'#e0644a'}
};
const TIDE_NAME = {calm:'静寂', march:'進行', surge:'突進'};

/* ---------- 状態 ---------- */
let S, keys = {};

function newGame(){
  S = {
    mode:'title', t:0, wave:0, score:0, best: S ? S.best : 0, combo:0, bestCombo:0,
    lives:3, ammo:MAG, reloading:0, cycle:0,
    zombies:[], parts:[], pending:0, spawnT:0,
    camX:0, camY:0, aimX:0, aimY:0, zoom:0, zoomWant:false,
    steady:false, breath:1, sway:0,
    // 呼吸の連動: holdQ=息止めの効き具合(0→1) / gasp=息切れの残り / amp=現在の手ブレ振幅
    holdQ:0, gasp:0, amp:10, hb:0,
    // 群れのリズム
    tide:'march', tideT:2.4, tideMul:1, surgeFlash:0,
    flash:0, hurt:0, recoil:0, shake:0, ejectT:0,
    banner:'', bannerT:0, hits:0, shots:0,
    spawnN:0, invDebt:0
  };
}
newGame();

function startWave(n){
  S.wave = n;
  S.pending = 4 + n * 2;
  S.spawnT = 0;
  S.banner = 'WAVE ' + n;
  S.bannerT = 2.2;
  S.tide = 'march'; S.tideMul = 1;
  S.tideT = 2.6 + Math.random()*1.6;
}

/* 潮の切り替え。突進の後は必ず緩み、静寂の後は突進が来やすい＝波が立つ */
function nextTide(){
  const r = Math.random(), w = S.wave;
  let n;
  if(S.tide === 'surge')      n = (r < .58 ? 'calm'  : 'march');
  else if(S.tide === 'calm')  n = (r < .66 ? 'surge' : 'march');
  else                        n = (r < Math.min(.66, .28 + w*.05) ? 'surge' : 'calm');
  S.tide = n;
  const T = TIDE[n];
  S.tideT = T.min + Math.random()*(T.max - T.min);
  if(n === 'surge'){
    S.banner = '群れが' + T.label; S.bannerT = 1.5;
    S.surgeFlash = 1; S.shake = Math.max(S.shake, .8);
    surgeSting(); buzz(60);
    // 唸りは群れの実体から鳴らす。左右にばらけて「囲まれている」が音で出る
    S.zombies.filter(z=>z.alive).sort((a,b)=>a.d-b.d).slice(0,3).forEach(groan);
  } else if(n === 'calm'){
    S.banner = T.label; S.bannerT = 1.1;
    S.surgeFlash = 0; calmSting();
  }
}

const TYPES = {
  // lg=個体突進の倍率 / sw=歩幅 / hu=猫背の深さ / ar=腕の前方リーチ
  walker:{hp:2, sp:26, w:46, col:'#3f5638', cloth:'#212a1c', lg:2.05, sw:1.00, hu:.055, ar:.95, name:'歩行体'},
  runner:{hp:1, sp:58, w:36, col:'#5f6b28', cloth:'#2b2917', lg:2.70, sw:1.55, hu:.115, ar:.30, name:'走行体'},
  brute :{hp:4, sp:17, w:72, col:'#2d5045', cloth:'#1a2922', lg:1.35, sw:.72, hu:.085, ar:1.15, name:'巨躯体'},
  // 肥大体: 基礎速度は全種で最も遅いが、溜めのあと lg=7.0 で走行体を超える速度になる
  bloater:{hp:5, sp:12, w:88, col:'#8c4a9e', cloth:'#8e2436', lg:7.0, sw:.58, hu:.055, ar:1.05, name:'肥大体'}
};

function spawn(){
  const r = Math.random();
  let k = 'walker';
  if(S.wave >= 2 && r < .3) k = 'runner';
  if(S.wave >= 3 && r > .86) k = 'brute';
  // 出現比率は乱数ではなく通し番号で数える。運で偏らない
  S.spawnN++;
  // 7体に1体は「肥大体」。種別ごと差し替えるので反転種にはしない（固有の赤紫を潰さないため）
  const fat = (S.spawnN % 7 === 0);
  let inv = (S.spawnN % 3 === 0);
  // 21体目は両方に当たる。そこで落ちた反転種は「借り」として次の非肥大体へ繰り越す。
  // これで 肥大体 1/7 と 反転種 1/3 の両方が長期的に厳密に成立する
  if(fat && inv){ S.invDebt++; inv = false; }
  else if(!fat && !inv && S.invDebt > 0){ inv = true; S.invDebt--; }
  if(fat) k = 'bloater';
  const T = TYPES[k];
  S.zombies.push({
    k, hp:T.hp, maxhp:T.hp,
    // 反転種: 色が反転し、左右に蛇行して近づく（狙いを外させる個体）
    inv, wa: inv ? 210 + Math.random()*130 : 0,
    wf: inv ? 1.05 + Math.random()*.75 : 0,
    x:(Math.random()*2-1) * 900,
    d:FAR + Math.random()*260,
    sp:T.sp * (1 + (S.wave-1)*.11) * (.85 + Math.random()*.35),
    ph:Math.random()*6.28, alive:true, hitT:0, dead:0, drift:(Math.random()*2-1)*8,
    // 個体差: 引きずる脚 / 首の傾き / 服のはためき / 突進タイマー
    seed:Math.random()*100,
    limp:(Math.random()<.55?1:-1)*(.25+Math.random()*.55),
    tilt:(Math.random()*2-1)*.20,
    tatter:Math.random()*6.28,
    lungeT:1.2+Math.random()*3.2, lunge:1, lungeLeft:0, tell:0
  });
  if(Math.random() < .5) groan(S.zombies[S.zombies.length-1]);
}

/* ---------- 入力 ---------- */
function setAim(cx, cy){
  S.aimX = Math.max(-1, Math.min(1, (cx / W) * 2 - 1));
  S.aimY = Math.max(-1, Math.min(1, (cy / H) * 2 - 1));
}
cvs.addEventListener('pointermove', e => { if(e.pointerType!=='touch' || e.buttons || e.isPrimary) setAim(e.clientX, e.clientY); });
cvs.addEventListener('pointerdown', e => {
  ac() && AC.state === 'suspended' && AC.resume();
  setAim(e.clientX, e.clientY);
  if(S.mode === 'title' || S.mode === 'over'){ begin(); return; }
  if(e.pointerType !== 'touch'){ if(e.button === 2) S.zoomWant = true; else fire(); }
});
cvs.addEventListener('pointerup', e => { if(e.button === 2) S.zoomWant = false; });
cvs.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if(e.code === 'Space'){ e.preventDefault(); if(S.mode!=='play') begin(); else fire(); }
  if(e.code === 'KeyR') reload();
  if(e.code === 'ShiftLeft' || e.code === 'ShiftRight') S.steady = true;
  if(e.code === 'KeyZ') S.zoomWant = !S.zoomWant;
});
window.addEventListener('keyup', e => {
  keys[e.code] = false;

});

const bind = (id, dn, up) => {
  const el = document.getElementById(id);
  el.addEventListener('pointerdown', e => { e.preventDefault(); ac() && AC.state==='suspended' && AC.resume(); dn(el); });
  if(up) el.addEventListener('pointerup', e => { e.preventDefault(); up(el); });
  el.addEventListener('pointercancel', e => { up && up(el); });
};
bind('bFire', () => { if(S.mode==='play') fire(); else begin(); });
bind('bReload', () => reload());
bind('bZoom', el => { S.zoomWant = !S.zoomWant; el.classList.toggle('on', S.zoomWant); });
bind('bSteady', el => { S.steady = true; el.classList.add('on'); },
                el => { S.steady = false; el.classList.remove('on'); });

function begin(){ const b = S.best; newGame(); S.best = b; S.mode='play'; startWave(1); }

/* ---------- 射撃 ---------- */
function fire(){
  if(S.mode !== 'play' || S.cycle > 0 || S.reloading > 0) return;
  if(S.ammo <= 0){ metal(320,.10,.26); reload(); return; }
  S.ammo--; S.shots++; S.cycle = CYCLE_MS;
  S.flash = 1; S.recoil = 1; S.shake = 1;
  S.ejectT = .30;
  shot(); buzz(34);

  const px = W/2, py = H/2;
  let target = null, headshot = false;
  for(const z of S.zombies){
    if(!z.alive) continue;
    const b = project(z);
    if(!b) continue;
    if(px > b.x - b.w/2 && px < b.x + b.w/2 && py > b.top && py < b.base){
      if(!target || z.d < target.d){ target = z; headshot = py < b.top + b.h * .21; }
    }
  }
  if(!target){
    S.combo = 0;
    for(let i=0;i<7;i++) S.parts.push({x:px+(Math.random()*20-10), y:py+(Math.random()*20-10),
      vx:(Math.random()*2-1)*40, vy:-Math.random()*60, life:.5, c:'#6b6250', r:2});
    return;
  }
  S.hits++;
  const dmg = headshot ? 99 : 1;
  target.hp -= dmg; target.hitT = .22;
  const b = project(target);
  for(let i=0;i<(headshot?22:12);i++) S.parts.push({
    x:px+(Math.random()*14-7), y:py+(Math.random()*14-7),
    vx:(Math.random()*2-1)*130, vy:-Math.random()*160-20,
    life:.55+Math.random()*.35, c: headshot?'#7fbf5a':'#5c8a3f', r:1+Math.random()*2.4
  });
  if(target.hp <= 0){
    target.alive = false; target.dead = .55;
    S.combo++; S.bestCombo = Math.max(S.bestCombo, S.combo);
    const base = headshot ? 300 : 100;
    const dBonus = Math.round(target.d / 10);
    target.pts = (base + dBonus) * Math.min(5, S.combo);
    target.head = headshot;
    S.score += target.pts;
    impact(headshot, target); bodyFall(target);
  } else {
    S.combo = Math.max(0, S.combo);
    impact(false, target);
  }
}
function reload(){
  if(S.mode!=='play' || S.reloading > 0 || S.ammo === MAG) return;
  S.reloading = RELOAD_MS; metal(280,.16,.30); setTimeout(()=>metal(190,.14,.22), 190);
}

/* ---------- 銃の投影（一人称の前縮み） ----------
   世界は f/z の透視で描いているのに、銃だけ真横向きの平面図だったため
   「奥を狙っている」感じが出なかった。そこで銃もローカル3D
   （X=銃の右 / Y=銃の下 / Z=銃口方向＝奥）で組み立て、断面ごとに f/z で縮めて
   画面へ落とす。銃口ほど小さく・銃床ほど大きくなり、軸が照準へ収束する。 */
const GUN = {
  f:1150,          // 銃専用の焦点距離。世界の focal() より望遠にして前縮みを穏やかにする
  zN:300, zF:700,  // 手前（銃床）と奥（銃口）の距離。比 2.3 倍ぶんだけ銃口が細くなる
  cant:.20,        // 銃のロール（傾け）
  // 据え位置は「画面中心からの割合」で持つ。縦長でも横長でも同じ構図に落ちる
  nx:.30, ny:.36,  // 手前端（銃床）＝画面右下へ逃がす
  fx:.145,fy:.075, // 奥端（銃口）＝照準のすぐ右下。標的を隠さない
  tnx:.40, tny:.26, tfx:.22, tfy:.06   // 縦持ち（スマホ）用
};
let GX=0, GY=0, GK=1, GDZ=0, GPT=0, GRL=0, GAX0=0, GAY0=0, GAX1=0, GAY1=0;

/* 銃の姿勢を毎フレーム決める。照準は画面中央に固定なので、揺れは銃だけが受ける */
function gunSetup(){
  const amp = S.amp || 0;
  const rl  = S.reloading > 0 ? Math.sin((1 - S.reloading/RELOAD_MS) * Math.PI) : 0;
  const swx = S.sway*.42 + Math.sin(S.t*1.15)*amp*.16 + (Math.random()*2-1)*S.shake*3.2;
  const swy = Math.sin(S.t*1.6+.8)*amp*.42 + Math.sin(S.t*.83)*amp*.22 + (Math.random()*2-1)*S.shake*3.2;
  GK  = Math.max(.40, Math.min(.78, Math.min(W,H)/912));
  GX  = W/2 + swx;                       // 銃身の軸が収束する先＝照準（画面中心）
  GY  = H/2 + swy + rl*44*GK;
  // 画面比率で決めた据え位置を、その地点の縮尺で割ってローカルのずれへ戻す
  const por = (H > W * 1.15);            // 縦持ち
  const sN = GUN.f/GUN.zN*GK, sF = GUN.f/GUN.zF*GK;
  GAX0 = W*(por?GUN.tnx:GUN.nx)/sN;  GAY0 = H*(por?GUN.tny:GUN.ny)/sN;
  GAX1 = W*(por?GUN.tfx:GUN.fx)/sF;  GAY1 = H*(por?GUN.tfy:GUN.fy)/sF;
  GDZ = -S.recoil*66 - rl*24;   // 反動で銃が手前へ下がる＝全体が大きくなる
  GPT = -S.recoil*22 - rl*16;   // 銃口が跳ね上がる（支点は肩＝u:0）
  GRL = GUN.cant + rl*.22;
}
/* u:0=銃床 1=銃口 / x,y:その断面内の位置 → 画面座標と、その地点の縮尺 */
function gp(u, x, y){
  const z  = GUN.zN + (GUN.zF - GUN.zN)*u + GDZ;
  const ax = GAX0 + (GAX1 - GAX0)*u;
  const ay = GAY0 + (GAY1 - GAY0)*u + GPT*u;
  const s  = GUN.f / Math.max(70, z) * GK;
  const c  = Math.cos(GRL), sn = Math.sin(GRL);
  return [ GX + (ax + x*c - y*sn)*s, GY + (ay + x*sn + y*c)*s, s ];
}
function gpoly(pts, col){
  ctx.fillStyle = col; ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath(); ctx.fill();
}
/* 奥へ伸びる箱。視点は銃の左上後方にあるので、見えるのは左側面と上面だけ */
function gbox(u0,u1,x0,x1,y0,y1,cTop,cSide,cCap){
  gpoly([gp(u0,x0,y0),gp(u1,x0,y0),gp(u1,x0,y1),gp(u0,x0,y1)], cSide);
  gpoly([gp(u0,x0,y0),gp(u1,x0,y0),gp(u1,x1,y0),gp(u0,x1,y0)], cTop);
  if(cCap) gpoly([gp(u0,x0,y0),gp(u0,x1,y0),gp(u0,x1,y1),gp(u0,x0,y1)], cCap);
}
/* 稜線: 箱の左上の角を u に沿ってなぞる */
function gedge(u0,u1,x,y,col,wd,al){
  const a = gp(u0,x,y), b = gp(u1,x,y);
  ctx.globalAlpha = al; ctx.strokeStyle = col; ctx.lineWidth = wd; ctx.lineCap = 'butt';
  ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
}
function ejectShell(){
  gunSetup();
  const p = gp(.40, 15, -8);            // 排莢口は機関部の右側面
  for(let i=0;i<2;i++) S.parts.push({
    x:p[0], y:p[1], vx:110+Math.random()*100, vy:-200-Math.random()*100,
    life:.95, c:'#c9a44e', r:3
  });
  metal(2600,.09,.13); setTimeout(()=>metal(2100,.07,.07), 210);
}

/* ---------- 投影 ---------- */
function focal(){ return FOCAL_HIP + (FOCAL_ZOOM - FOCAL_HIP) * S.zoom; }
function horizonY(){ return H * .44 - S.camY * (focal() / FOCAL_HIP) * .9 + S.recoil * 26; }
function project(z){
  if(z.d < 30) return null;
  const f = focal();
  const x = W/2 + (z.x - S.camX) * f / z.d;
  const base = horizonY() + (CAMH * f) / z.d;
  const h = (ZH * f) / z.d;
  const w = (TYPES[z.k].w * f) / z.d;
  return { x, base, top: base - h, h, w };
}

/* ---------- ループ ---------- */
let last = performance.now();
function loop(now){
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function update(dt){
  S.t += dt;
  S.zoom += ((S.zoomWant ? 1 : 0) - S.zoom) * Math.min(1, dt * 9);
  S.flash = Math.max(0, S.flash - dt * 7);
  S.recoil = Math.max(0, S.recoil - dt * 4.2);
  S.shake = Math.max(0, S.shake - dt * 3.4);
  S.hurt = Math.max(0, S.hurt - dt * 1.6);
  S.bannerT = Math.max(0, S.bannerT - dt);
  if(S.cycle > 0){ S.cycle -= dt*1000; if(S.cycle <= 0) metal(760,.13,.22); }
  if(S.reloading > 0){ S.reloading -= dt*1000; if(S.reloading <= 0){ S.ammo = MAG; metal(520,.15,.26); } }

  // ---- 呼吸と手ブレ（銃・照準・HUDが同じ amp を共有する） ----
  const canHold = S.steady && S.breath > 0;
  S.breath += (canHold ? -dt*.42 : dt*.30);
  S.breath = Math.max(0, Math.min(1, S.breath));

  // 息止めは瞬時に効かない。0.35秒かけて銃が「落ち着いていく」
  S.holdQ += ((canHold ? 1 : 0) - S.holdQ) * Math.min(1, dt * (canHold ? 4.6 : 6.5));

  // 息切れ: 使い切ると溜まり、ゆっくりしか抜けない（罰が瞬間で消えないようにする）
  if(S.breath <= .002 && S.steady) S.gasp = Math.min(1, S.gasp + dt*1.5);
  else                             S.gasp = Math.max(0, S.gasp - dt*.42);

  const amp = (10 + S.zoom * 26) * (1 - S.holdQ*.88) * (1 + S.gasp*1.30);
  S.amp = amp;
  S.sway = Math.sin(S.t*1.6)*amp + Math.sin(S.t*.83+1.2)*amp*.55;

  // 心音: 息が尽きかけている間だけ鳴る。速さが残量に連動する
  S.hb -= dt;
  if(S.mode === 'play' && (S.gasp > .12 || (canHold && S.breath < .34)) && S.hb <= 0){
    heart(); S.hb = .30 + S.breath*.42;
  }

  // 照準パン
  const range = 940;
  const tx = S.aimX * range + S.sway;
  const ty = S.aimY * 90 + Math.sin(S.t*1.15)*amp*.14;
  const k = Math.min(1, dt * (S.zoom > .5 ? 6 : 11));
  S.camX += (tx - S.camX) * k;
  S.camY += (ty - S.camY) * k;

  if(S.mode !== 'play') return;

  // 薬莢排出
  if(S.ejectT > 0){ S.ejectT -= dt; if(S.ejectT <= 0) ejectShell(); }

  // ---- 群れのリズム（潮）----
  S.tideT -= dt;
  if(S.tideT <= 0) nextTide();
  const tideTarget = TIDE[S.tide].mul;
  // 加速は急に、減速はやや緩く。「急に走り出す」恐怖を優先する
  S.tideMul += (tideTarget - S.tideMul) * Math.min(1, dt * (tideTarget > S.tideMul ? 5.5 : 2.6));
  S.surgeFlash = Math.max(0, S.surgeFlash - dt*.85);

  // 出現
  if(S.pending > 0){
    S.spawnT -= dt;
    if(S.spawnT <= 0){ spawn(); S.pending--; S.spawnT = Math.max(.5, 1.9 - S.wave*.12) * (.6+Math.random()*.8); }
  }

  // ゾンビ更新
  for(const z of S.zombies){
    if(!z.alive){ z.dead -= dt; continue; }
    const T = TYPES[z.k];

    // 個体の突進: 群れ全体の潮とは別に、一体ずつ不意に踏み込む
    if(z.tell > 0){
      // 肥大体の溜め。ほぼ止まって体が沈む。ここが撃ち抜くための猶予 0.5 秒
      z.tell -= dt;
      z.lunge += (.12 - z.lunge) * Math.min(1, dt*7);
      if(z.tell <= 0){ z.lungeLeft = 1.25 + Math.random()*.55; roar(z); buzz(70); }
    } else if(z.lungeLeft > 0){
      z.lungeLeft -= dt;
      z.lunge += (T.lg - z.lunge) * Math.min(1, dt*(z.k==='bloater' ? 14 : 8));
      if(z.lungeLeft <= 0) z.lungeT = (z.k==='runner' ? 1.1 : z.k==='bloater' ? 3.2 : 2.4) + Math.random()*3.2;
    } else {
      z.lunge += (1 - z.lunge) * Math.min(1, dt*(z.k==='bloater' ? 5.0 : 2.4));
      z.lungeT -= dt;
      if(z.lungeT <= 0){
        // 肥大体だけは「予告してから」来る。理不尽にしないための溜め
        if(z.k === 'bloater'){ z.tell = .50; growl(z); }
        else {
          z.lungeLeft = .40 + Math.random()*.70;
          if(Math.random() < .55) groan(z);
        }
      }
    }

    z.d -= z.sp * z.lunge * S.tideMul * dt;
    z.x += Math.sin(S.t*1.4 + z.ph) * z.drift * dt * 6;
    // 蛇行: 反転種は左右へ振れながら寄ってくる。近いほど振れ幅が詰まって当てにくい
    if(z.inv) z.x += Math.cos(S.t * z.wf + z.ph) * z.wa * dt;
    z.hitT = Math.max(0, z.hitT - dt);
    if(z.d <= REACH){
      z.alive = false; z.dead = .01;
      S.lives--; S.hurt = 1; S.combo = 0; S.shake = 1.4;
      click(90,.4,.3,'sawtooth'); buzz();
      if(S.lives <= 0){
        S.mode = 'over'; S.best = Math.max(S.best, S.score);
        S.banner = ''; click(70,.9,.3,'sawtooth');
      }
    }
  }
  S.zombies = S.zombies.filter(z => z.alive || z.dead > 0);

  // 粒子
  for(const p of S.parts){ p.life -= dt; p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 300*dt; }
  S.parts = S.parts.filter(p => p.life > 0);

  // ウェーブ進行
  if(S.mode === 'play' && S.pending === 0 && S.zombies.length === 0){
    S.score += 250 + S.wave * 50;
    startWave(S.wave + 1);
  }
}

/* ---------- 描画 ---------- */
function draw(){
  const hz = horizonY();
  const sx = (Math.random()*2-1) * S.shake * 5;
  const sy = (Math.random()*2-1) * S.shake * 5;
  ctx.save(); ctx.translate(sx, sy);

  // 空
  const sky = ctx.createLinearGradient(0,0,0,hz);
  sky.addColorStop(0,'#0a0f14'); sky.addColorStop(.55,'#121a1c'); sky.addColorStop(1,'#262b22');
  ctx.fillStyle = sky; ctx.fillRect(-10,-10,W+20,hz+10);

  // 月
  const mx = W*.76 - S.camX*.06, my = hz - H*.26;
  ctx.globalAlpha=.9; ctx.fillStyle='#c9d3b0'; ctx.beginPath(); ctx.arc(mx,my,26,0,6.29); ctx.fill();
  ctx.fillStyle='#0f1418'; ctx.beginPath(); ctx.arc(mx+10,my-7,23,0,6.29); ctx.fill(); ctx.globalAlpha=1;

  // 遠景の廃墟
  ctx.fillStyle = '#0d1310';
  for(let i=0;i<26;i++){
    const s = ((i*257 % 1000)/1000*2-1)*1500;
    const bx = W/2 + (s - S.camX*.35) * .6;
    const bw = 40 + (i*37 % 70), bh = 30 + (i*53 % 90);
    ctx.fillRect(bx, hz-bh, bw, bh+4);
  }

  // 地面
  const gr = ctx.createLinearGradient(0,hz,0,H);
  gr.addColorStop(0,'#1d2418'); gr.addColorStop(1,'#0a0c07');
  ctx.fillStyle = gr; ctx.fillRect(-10,hz,W+20,H-hz+10);

  // 地面の距離ライン
  ctx.strokeStyle = 'rgba(120,150,110,.10)'; ctx.lineWidth = 1;
  for(let d=200; d<=FAR; d+=200){
    const y = hz + (CAMH*focal())/d;
    if(y > H) continue;
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
  }

  // ゾンビ（遠い順）
  const list = S.zombies.slice().sort((a,b)=>b.d-a.d);
  for(const z of list) drawZombie(z);

  // 粒子
  for(const p of S.parts){
    ctx.globalAlpha = Math.max(0, p.life*1.6);
    ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, p.r, p.r);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  drawWeapon();
  drawScope();
  drawHUD();

  if(S.flash > 0){
    ctx.fillStyle = `rgba(255,236,190,${S.flash*.42})`;
    ctx.fillRect(0,0,W,H);
  }
  if(S.hurt > 0){
    const g = ctx.createRadialGradient(W/2,H/2,H*.2,W/2,H/2,H*.75);
    g.addColorStop(0,'rgba(150,20,20,0)'); g.addColorStop(1,`rgba(150,20,20,${S.hurt*.55})`);
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  }
  // 群れが走り出した瞬間の赤い脈動
  if(S.surgeFlash > .01){
    const a = S.surgeFlash * (.17 + Math.sin(S.t*11)*.09);
    const g = ctx.createRadialGradient(W/2,H/2,H*.52,W/2,H/2,H*.95);
    g.addColorStop(0,'rgba(180,52,26,0)'); g.addColorStop(1,`rgba(180,52,26,${Math.max(0,a)})`);
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  }
  // 静寂のあいだは冷たい靄が下りる
  if(S.mode === 'play' && S.tide === 'calm'){
    const a = Math.min(.30, Math.max(0, 1 - S.tideMul) * .46);
    ctx.fillStyle = `rgba(6,14,22,${a})`;
    ctx.fillRect(0,0,W,H);
    const vg = ctx.createRadialGradient(W/2,H/2,H*.30,W/2,H/2,H*.9);
    vg.addColorStop(0,'rgba(10,22,30,0)'); vg.addColorStop(1,`rgba(10,22,30,${a*1.5})`);
    ctx.fillStyle = vg; ctx.fillRect(0,0,W,H);
  }

  if(S.mode === 'title') drawTitle();
  if(S.mode === 'over') drawOver();
}

function drawZombie(z){
  const b = project(z); if(!b) return;
  if(b.x < -260 || b.x > W+260) return;
  const T = TYPES[z.k];
  const h = b.h, w = b.w;
  const dying = !z.alive;
  const near = h > 40, fine = h > 88;
  const g = S.t * (z.sp * z.lunge / 26) * 3.1 + z.ph;
  const danger = Math.max(0, Math.min(1, 1 - (z.d - REACH) / 460));

  ctx.save();
  ctx.translate(b.x, b.base);

  if(dying){
    const p = 1 - Math.max(0, z.dead)/.55;
    ctx.translate(0, p*h*.10);
    ctx.rotate(p * 1.4 * (z.limp > 0 ? 1 : -1));
    ctx.globalAlpha = Math.max(0, z.dead/.55);
  }
  const ga = ctx.globalAlpha;

  // 影
  ctx.globalAlpha = ga*.5; ctx.fillStyle = '#040603';
  ctx.beginPath(); ctx.ellipse(0, 1, w*.66, h*.040, 0, 0, 6.29); ctx.fill();
  ctx.globalAlpha = ga;

  // 肥大体の溜め: 足元の赤い輪が広がる。音を切っていても「来る」が分かる
  const tell = Math.max(0, Math.min(1, (z.tell||0)/.50));
  if(tell > 0){
    ctx.globalAlpha = ga*(.22 + .55*(1-tell));
    ctx.strokeStyle = '#ff3a55'; ctx.lineWidth = Math.max(1.2, w*.055);
    ctx.beginPath();
    ctx.ellipse(0, 1, w*(.62 + .55*(1-tell)), h*.048*(1 + (1-tell)*.5), 0, 0, 6.29);
    ctx.stroke();
    ctx.globalAlpha = ga;
  }

  if(!dying) ctx.rotate(z.tilt * (z.k === 'runner' ? 1.5 : 1));

  const hit   = z.hitT > 0;
  const invc  = c => '#' + c.slice(1).match(/../g).map(v => (255 - parseInt(v,16)).toString(16).padStart(2,'0')).join('');
  const skin  = hit ? '#f4faea' : (z.inv ? invc(T.col)   : T.col);
  const cloth = hit ? '#eef6e0' : (z.inv ? invc(T.cloth) : T.cloth);
  const rimc  = hit ? '#ffffff' : (z.inv ? '#6f5279' : '#8fae86');

  // 上下動。引きずる脚のぶんだけ不均等に跳ねる
  const bob = Math.abs(Math.sin(g)) * h * .020 * (1 + Math.abs(z.limp)*.8);
  ctx.translate(0, -bob);
  // 溜めで沈み込む → 解放した瞬間に伸び上がる
  if(tell > 0){ ctx.translate(0, h*.09*tell); ctx.scale(1 + .07*tell, 1 - .12*tell); }

  // 頭の高さは全タイプ共通（ヘッドショット判定 top+.21h と一致させる）
  const hipY = -h*.50, shY = -h*.795, hr = h*.072;
  const lean = Math.sin(S.t*.7 + z.ph) * w*.035 + (z.k === 'runner' ? w*.10 : 0);

  const limb = (x0,y0,x1,y1,wd,c) => {
    ctx.strokeStyle = c; ctx.lineWidth = Math.max(.8, wd); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();
  };
  const leg = (ax, ph, amp, c) => {
    const sn = Math.sin(ph) * T.sw * amp;
    limb(ax, hipY, ax + sn*w*.20, hipY*.46, w*.215, c);
    limb(ax + sn*w*.20, hipY*.46, ax + sn*w*.34, -Math.max(0, sn)*h*.055, w*.175, c);
  };
  const arm = (ax, ph, back, c) => {
    const sn = Math.sin(ph), dir = ax > 0 ? 1 : -1;
    const ex = ax + dir*w*.34*(back ? -.55 : 1), ey = shY + h*.15 + sn*h*.022;
    // 手は体の前へ回り込む。奥行きのぶん手が大きく見える＝掴みかかっている
    const hx = ax - dir*w*.045*T.ar*(back ? -5.0 : 1) + sn*w*.05;
    const hy = shY + h*.295*(back ? .45 : 1) + sn*h*.035;
    limb(ax, shY + h*.02, ex, ey, w*.195, c);
    limb(ex, ey, hx, hy, w*.165, skin);          // 前腕は素肌＝手までつながって見える
    ctx.fillStyle = skin;
    ctx.beginPath(); ctx.ellipse(hx, hy, w*.115, w*.095, dir*.4, 0, 6.29); ctx.fill();
    if(near){                                     // 指
      ctx.strokeStyle = skin; ctx.lineWidth = Math.max(.8, w*.038); ctx.lineCap='round';
      for(let i=0;i<3;i++){
        ctx.beginPath(); ctx.moveTo(hx, hy);
        ctx.lineTo(hx + dir*w*.05 + (i-1)*w*.07, hy + w*.16);
        ctx.stroke();
      }
    }
  };
  const back = (z.k === 'runner');   // 走行体は腕を後ろへ振る

  // 奥の脚・腕
  leg(-w*.21, g + Math.PI, 1 - Math.max(0, z.limp)*.55, cloth);
  arm(-w*.34 + lean, g + Math.PI, back, cloth);

  // 胴（台形）＋ 猫背の肩
  if(near){
    const tg = ctx.createLinearGradient(0, shY, 0, hipY + h*.05);
    tg.addColorStop(0, cloth); tg.addColorStop(1, '#0c110c');
    ctx.fillStyle = tg;
  } else ctx.fillStyle = cloth;
  ctx.beginPath();
  ctx.moveTo(-w*.27, hipY + h*.05);
  ctx.lineTo(-w*.40 + lean, shY + h*.03);
  ctx.lineTo( w*.40 + lean, shY + h*.03);
  ctx.lineTo( w*.27, hipY + h*.05);
  ctx.closePath(); ctx.fill();
  const shr = w*(.145 + T.hu*1.6);
  ctx.fillStyle = cloth;
  ctx.beginPath(); ctx.arc(-w*.34 + lean, shY + h*.02, shr, 0, 6.29); ctx.fill();
  ctx.beginPath(); ctx.arc( w*.34 + lean, shY + h*.02, shr, 0, 6.29); ctx.fill();

  // 手前の脚・腕
  leg(w*.21, g, 1 + Math.max(0, -z.limp)*.15, cloth);
  arm(w*.34 + lean, g, back, cloth);

  // ---- 頭 ----
  const hx0 = lean*1.25 + Math.sin(g*.5)*w*.035;
  const hy0 = shY - hr*1.00;
  limb(hx0, hy0 + hr*.70, lean, shY + h*.02, w*.13, skin);   // 首
  ctx.fillStyle = skin;
  ctx.beginPath(); ctx.ellipse(hx0, hy0, hr*.90, hr, z.tilt*1.8, 0, 6.29); ctx.fill();

  if(near){
    // 開いた顎
    ctx.fillStyle = '#140d0a';
    ctx.beginPath();
    ctx.ellipse(hx0, hy0 + hr*.46, hr*.30, hr*.30*(1 + Math.sin(g*.9)*.30), 0, 0, 6.29);
    ctx.fill();
    if(!dying){
      ctx.fillStyle = '#ff5133';
      const er = Math.max(.8, hr*.125);
      ctx.beginPath(); ctx.arc(hx0 - hr*.35, hy0 - hr*.10, er, 0, 6.29); ctx.fill();
      ctx.beginPath(); ctx.arc(hx0 + hr*.31, hy0 - hr*.10, er, 0, 6.29); ctx.fill();
      ctx.globalAlpha = ga * .26 * (.35 + danger*.90);       // 近いほど眼が燃える
      ctx.beginPath(); ctx.arc(hx0 - hr*.35, hy0 - hr*.10, er*2.8, 0, 6.29); ctx.fill();
      ctx.beginPath(); ctx.arc(hx0 + hr*.31, hy0 - hr*.10, er*2.8, 0, 6.29); ctx.fill();
      ctx.globalAlpha = ga;
    }
  }

  // ---- ぼろ布 ----
  if(fine){
    ctx.strokeStyle = cloth; ctx.lineWidth = Math.max(1, w*.055); ctx.lineCap = 'round';
    for(let i=0;i<4;i++){
      const tx = -w*.26 + i*w*.175;
      const fl = Math.sin(S.t*2.4 + i*1.7 + z.tatter) * w*.07;
      ctx.beginPath();
      ctx.moveTo(tx, hipY + h*.03);
      ctx.lineTo(tx + fl, hipY + h*.03 + h*.075);
      ctx.stroke();
    }
  }

  // ---- 血痕 ----
  if(fine && !hit){
    const sd = n => (Math.sin(z.seed*13.7 + n*7.31) + 1)/2;
    ctx.globalAlpha = ga*.5; ctx.fillStyle = '#3f1611';
    for(let i=0;i<3;i++){
      ctx.beginPath();
      ctx.ellipse(-w*.20 + sd(i)*w*.40, shY + h*.07 + sd(i+3)*h*.22,
                  w*.10*(.6 + sd(i+6)*.8), h*.026, sd(i+9)*2, 0, 6.29);
      ctx.fill();
    }
    ctx.globalAlpha = ga;
  }

  // ---- 月明かりの縁（月は右上にある）----
  if(near && !hit && !dying){
    ctx.strokeStyle = rimc; ctx.globalAlpha = ga*.20;
    ctx.lineWidth = Math.max(1, w*.038); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(hx0, hy0, hr*.95, -1.15, .45); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(w*.38 + lean, shY - h*.01);
    ctx.lineTo(w*.30, shY + h*.13); ctx.stroke();
    ctx.globalAlpha = ga;
  }

  // ---- 接近警告 ----
  // ---- 得点表示 ----
  if(dying && z.pts){
    ctx.globalAlpha = Math.max(0, z.dead/.55);
    ctx.fillStyle = z.head ? '#ffe27a' : '#b8d8a0';
    ctx.font = `bold ${Math.max(13, h*.14)}px "Courier New",monospace`;
    ctx.textAlign = 'center';
    ctx.fillText((z.head ? 'HEAD +' : '+') + z.pts, 0, -h*1.05 - (1 - z.dead/.55)*26);
  }
  ctx.restore();
}

function drawWeapon(){
  const vis = Math.pow(1 - S.zoom, .85);        // スコープを覗くと消える
  if(vis < .015) return;
  gunSetup();

  const cyc  = S.cycle > 0 ? 1 - S.cycle/CYCLE_MS : 1;
  const bolt = S.cycle > 0 ? (cyc < .45 ? cyc/.45 : 1 - (cyc - .45)/.55) : 0;

  // 面の役割で色を分ける。視点は銃の左上後方なので「上面＝月明かり／左側面＝影」
  const TOP='#43574a', TOP2='#33453a', SIDE='#0b100c', SIDE2='#131a14',
        D='#05080600'.slice(0,7), CAP='#1b241c', R='#b6d3ac';

  ctx.save();
  ctx.globalAlpha = vis;
  ctx.lineJoin = 'round';

  // ==== 奥（銃口）から手前（銃床）へ塗り重ねる ====

  // ---- 銃身 ----
  gbox(.70,.965, -7,7, -8,8, TOP, SIDE);

  // ---- マズルブレーキ（いちばん奥＝いちばん小さい）----
  gbox(.955,1.00, -11,11, -12,12, TOP, SIDE);
  { const m = gp(1.00,0,0);
    ctx.fillStyle = '#050906';
    ctx.beginPath(); ctx.ellipse(m[0],m[1], 7*m[2], 7*m[2], GRL, 0, 6.29); ctx.fill(); }

  // ---- バイポッド ----
  { const top = gp(.755,-3,13), la = gp(.72,-22,46), lb = gp(.79,10,50);
    ctx.strokeStyle = SIDE2; ctx.lineWidth = Math.max(1.5, 4.5*top[2]); ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(top[0],top[1]); ctx.lineTo(la[0],la[1]); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(top[0],top[1]); ctx.lineTo(lb[0],lb[1]); ctx.stroke(); }

  // ---- ハンドガード ----
  gbox(.455,.705, -13,13, -15,15, TOP, SIDE);
  { ctx.fillStyle = D;                                    // 放熱スリット（奥ほど詰まって見える）
    for(let i=0;i<5;i++){
      const u0 = .48 + i*.042, u1 = u0 + .022;
      gpoly([gp(u0,-13.2,-10),gp(u1,-13.2,-10),gp(u1,-13.2,8),gp(u0,-13.2,8)], '#050906');
    } }

  // ---- 左手＋前腕（ハンドガードを握る）----
  { const h = gp(.575,-2,11), s = h[2];
    ctx.strokeStyle='#161c15'; ctx.lineWidth = 26*s; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(h[0],h[1]); ctx.lineTo(h[0]-58*s, h[1]+152*s); ctx.stroke();
    ctx.fillStyle='#1c231b';
    ctx.beginPath(); ctx.ellipse(h[0],h[1], 20*s, 15*s, GRL-.25, 0, 6.29); ctx.fill();
    ctx.fillStyle='#0f150f';
    for(let i=0;i<4;i++){
      ctx.beginPath(); ctx.ellipse(h[0]-14*s+i*8*s, h[1]-7*s, 4*s, 7.5*s, GRL-.2, 0, 6.29); ctx.fill(); } }

  // ---- スコープ ----
  gbox(.275,.315, -5,5, -28,-17, TOP2, SIDE);                   // 前マウント
  gbox(.475,.515, -5,5, -28,-17, TOP2, SIDE);                   // 後マウント
  gbox(.255,.545, -8,8, -41,-28, TOP, SIDE);                   // 本体
  gbox(.235,.275, -10,10, -44,-25, TOP, SIDE2);                 // 対物側
  gbox(.545,.585, -10,10, -44,-26, TOP, SIDE2, CAP);              // 接眼側（手前の端面が見える）
  { const ey = gp(.545,0,-35);                            // 接眼レンズ
    ctx.fillStyle='#0b120d';
    ctx.beginPath(); ctx.ellipse(ey[0],ey[1], 8*ey[2], 8*ey[2], GRL, 0, 6.29); ctx.fill();
    ctx.fillStyle='rgba(126,190,158,.30)';
    ctx.beginPath(); ctx.ellipse(ey[0]-2*ey[2],ey[1]-2.5*ey[2], 3.4*ey[2], 3.4*ey[2], GRL, 0, 6.29); ctx.fill(); }
  gbox(.375,.425, -6,6, -50,-41, TOP2, SIDE);                   // 調整ダイヤル

  // ---- レシーバー ----
  gbox(.215,.455, -15,15, -27,17, TOP, SIDE);
  gpoly([gp(.30,15.2,-25),gp(.42,15.2,-25),gp(.42,15.2,-15),gp(.30,15.2,-15)], '#05080a');  // 排莢口（右側面）

  // ---- ボルトハンドル（射撃後に前後する）----
  { const a = gp(.415 - bolt*.075, 14, -18), b = gp(.415 - bolt*.075, 30, -30);
    ctx.strokeStyle = TOP; ctx.lineWidth = Math.max(1.6, 6*a[2]); ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
    ctx.fillStyle = TOP; ctx.beginPath(); ctx.arc(b[0],b[1], 6*a[2], 0, 6.29); ctx.fill(); }

  // ---- マガジン ----
  gbox(.335,.445, -11,11, 17,58, TOP2, SIDE, CAP);

  // ---- トリガーガード ----
  { const a = gp(.245,-9,20), b = gp(.315,-9,44), c = gp(.335,-9,26);
    ctx.strokeStyle = SIDE2; ctx.lineWidth = Math.max(1.6, 5*a[2]); ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.quadraticCurveTo(b[0],b[1],c[0],c[1]); ctx.stroke(); }

  // ---- グリップ ----
  gbox(.215,.295, -10,10, 17,62, TOP2, SIDE, CAP);

  // ---- 右手（グリップを握る）----
  { const h = gp(.255,-6,36), s = h[2];
    ctx.strokeStyle='#161c15'; ctx.lineWidth = 24*s; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(h[0],h[1]); ctx.lineTo(h[0]+46*s, h[1]+130*s); ctx.stroke();
    ctx.fillStyle='#1c231b';
    ctx.beginPath(); ctx.ellipse(h[0],h[1], 18*s, 14*s, GRL+.3, 0, 6.29); ctx.fill();
    ctx.fillStyle='#0f150f';
    for(let i=0;i<3;i++){
      ctx.beginPath(); ctx.ellipse(h[0]-9*s+i*7*s, h[1]-8*s, 3.6*s, 7*s, GRL+.35, 0, 6.29); ctx.fill(); } }

  // ---- 銃床（いちばん手前＝いちばん大きい）----
  gbox(.00,.225, -14,14, -29,25, TOP2, SIDE, CAP);
  gbox(.055,.185, -12,12, -37,-27, TOP2, SIDE);                 // チークピース

  // ---- 月明かりの稜線（上面の左稜を奥までなぞる）----
  gedge(.00,.225, -14,-29, R, 2.4, vis*.80);              // 銃床
  gedge(.215,.455, -15,-27, R, 2.2, vis*.80);             // レシーバー
  gedge(.455,.705, -13,-15, R, 2.0, vis*.70);             // ハンドガード
  gedge(.70,1.00, -7,-8,   R, 1.9, vis*.66);              // 銃身〜銃口
  gedge(.235,.585, -8,-41, R, 2.0, vis*.72);              // スコープ
  ctx.globalAlpha = vis;

  // ---- マズルフラッシュ（奥で光る＝小さく、しかし鋭い）----
  if(S.flash > .04){
    const f = S.flash, m = gp(1.00,0,0), s = m[2];
    ctx.globalAlpha = vis * f;
    const fg = ctx.createRadialGradient(m[0],m[1],0,m[0],m[1],64*s*f);
    fg.addColorStop(0,  'rgba(255,247,216,.95)');
    fg.addColorStop(.32,'rgba(255,178,74,.50)');
    fg.addColorStop(1,  'rgba(255,120,40,0)');
    ctx.fillStyle = fg;
    ctx.beginPath(); ctx.arc(m[0],m[1],64*s*f,0,6.29); ctx.fill();
    ctx.fillStyle = 'rgba(255,240,196,.92)';
    ctx.beginPath();
    ctx.moveTo(m[0], m[1]-17*s*f); ctx.lineTo(m[0]+40*s*f, m[1]);
    ctx.lineTo(m[0], m[1]+17*s*f); ctx.lineTo(m[0]-40*s*f, m[1]);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = vis;
  }

  ctx.restore();
}

function drawScope(){
  if(S.zoom < .04) return;
  const a = S.zoom;
  const R = Math.min(W,H) * .43;
  ctx.save();
  ctx.globalAlpha = a;
  // 外側マスク
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.rect(0,0,W,H);
  ctx.arc(W/2, H/2, R, 0, 6.29, true);
  ctx.fill('evenodd');
  // 縁
  ctx.strokeStyle = '#0e150f'; ctx.lineWidth = 14;
  ctx.beginPath(); ctx.arc(W/2,H/2,R+6,0,6.29); ctx.stroke();
  // 目盛り
  ctx.strokeStyle = 'rgba(150,190,140,.5)'; ctx.lineWidth = 1;
  for(let i=-5;i<=5;i++){
    if(i===0) continue;
    const o = i * R/6;
    ctx.beginPath(); ctx.moveTo(W/2+o, H/2-6); ctx.lineTo(W/2+o, H/2+6); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W/2-6, H/2+o); ctx.lineTo(W/2+6, H/2+o); ctx.stroke();
  }
  ctx.restore();
}

function drawHUD(){
  const cx = W/2, cy = H/2;
  // 照準
  const gap = 9 + (1-S.zoom)*7 + S.recoil*22;
  ctx.strokeStyle = S.zoom>.5 ? 'rgba(190,225,175,.85)' : 'rgba(160,200,150,.6)';
  ctx.lineWidth = S.zoom>.5 ? 1 : 2;
  ctx.beginPath();
  ctx.moveTo(cx-gap-16,cy); ctx.lineTo(cx-gap,cy);
  ctx.moveTo(cx+gap,cy); ctx.lineTo(cx+gap+16,cy);
  ctx.moveTo(cx,cy-gap-16); ctx.lineTo(cx,cy-gap);
  ctx.moveTo(cx,cy+gap); ctx.lineTo(cx,cy+gap+16);
  ctx.stroke();
  ctx.fillStyle='rgba(210,90,60,.9)'; ctx.fillRect(cx-1,cy-1,2,2);

  if(S.mode === 'title') return;

  const pad = 16, top = 18 + (window.innerHeight > 700 ? 8 : 0);
  ctx.textAlign = 'left';
  ctx.fillStyle = '#dbe8cf';
  ctx.font = 'bold 26px "Courier New",monospace';
  ctx.fillText(String(S.score).padStart(6,'0'), pad, top+22);
  ctx.font = '12px "Courier New",monospace'; ctx.fillStyle = '#6f8a6b';
  ctx.fillText('WAVE ' + S.wave + '　残り ' + (S.pending + S.zombies.filter(z=>z.alive).length), pad, top+42);
  // 群れのリズム（潮）
  ctx.fillStyle = TIDE[S.tide].col;
  ctx.font = (S.tide === 'surge' ? 'bold ' : '') + '12px "Courier New",monospace';
  ctx.fillText('群れ ' + TIDE_NAME[S.tide] + '  ×' + S.tideMul.toFixed(2), pad, top+61);
  if(S.combo > 1){
    ctx.fillStyle = '#ffe27a'; ctx.font = 'bold 14px "Courier New",monospace';
    ctx.fillText(S.combo + ' 連続 ×' + Math.min(5,S.combo), pad, top+81);
  }

  // ライフ
  ctx.textAlign = 'right';
  for(let i=0;i<3;i++){
    ctx.fillStyle = i < S.lives ? '#c4442f' : '#2a2320';
    ctx.fillRect(W - pad - i*18 - 12, top+6, 12, 12);
  }

  // 弾
  const by = top + 34;
  for(let i=0;i<MAG;i++){
    const on = i < S.ammo && S.reloading <= 0;
    ctx.fillStyle = on ? '#d9c27a' : '#2c2a22';
    ctx.fillRect(W - pad - i*11 - 7, by, 6, 15);
  }
  if(S.reloading > 0){
    const p = 1 - S.reloading/RELOAD_MS;
    ctx.fillStyle = '#6f8a6b'; ctx.font = '12px "Courier New",monospace';
    ctx.fillText('装填中', W - pad, by + 32);
    ctx.fillStyle = '#3a4a38'; ctx.fillRect(W - pad - 90, by + 38, 90, 4);
    ctx.fillStyle = '#9fc39a'; ctx.fillRect(W - pad - 90, by + 38, 90*p, 4);
  } else if(S.ammo === 0){
    ctx.fillStyle = '#c4442f'; ctx.font = 'bold 12px "Courier New",monospace';
    ctx.fillText('空　装填せよ', W - pad, by + 32);
  }

  // ---- 呼吸ゲージ ＋ 安定度（連動を目で見えるようにする）----
  const bw = 136, bx = W/2 - bw/2, byy = H - (TOUCH ? 132 : 42);
  const holding = S.holdQ > .30;
  ctx.fillStyle = 'rgba(18,24,18,.75)'; ctx.fillRect(bx-1, byy-1, bw+2, 8);
  ctx.fillStyle = S.gasp > .05 ? '#c4442f' : (holding ? '#dff3d8' : (S.breath < .3 ? '#c9a24a' : '#7ea877'));
  ctx.fillRect(bx, byy, bw*S.breath, 6);
  if(S.gasp > .01){                                  // 息切れの焼け残り
    ctx.fillStyle = 'rgba(196,68,47,.60)';
    ctx.fillRect(bx, byy, bw*S.gasp, 6);
  }
  // 安定度: amp が小さいほど伸びる ＝ 息止めの効果がそのまま棒になる
  const stab = Math.max(0, 1 - Math.min(1, S.amp/58));
  ctx.fillStyle = 'rgba(18,24,18,.75)'; ctx.fillRect(bx-1, byy+9, bw+2, 5);
  ctx.fillStyle = holding ? '#9fe08a' : '#4e6a52';
  ctx.fillRect(bx, byy+10, bw*stab, 3);

  ctx.textAlign='center'; ctx.font='10px "Courier New",monospace';
  ctx.fillStyle = S.gasp > .05 ? '#c4442f' : (holding ? '#9fc39a' : '#4e6350');
  ctx.fillText(S.gasp > .05 ? '息切れ' : (holding ? '息を止めている' : '呼吸'), W/2, byy - 7);

  if(S.bannerT > 0 && S.banner){
    ctx.globalAlpha = Math.min(1, S.bannerT);
    ctx.textAlign='center'; ctx.fillStyle='#dbe8cf';
    ctx.font='bold 38px "Courier New",monospace';
    ctx.fillText(S.banner, W/2, H*.28);
    ctx.globalAlpha = 1;
  }
}

function drawTitle(){
  ctx.fillStyle='rgba(4,7,5,.78)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.fillStyle='#c4442f'; ctx.font=`bold ${Math.min(72,W*.15)}px "Courier New",monospace`;
  ctx.fillText('DEAD RANGE', W/2, H*.36);
  ctx.fillStyle='#8aa984'; ctx.font='15px "Courier New",monospace';
  ctx.fillText('ゾンビ狙撃', W/2, H*.36+30);
  ctx.fillStyle='#6f8a6b'; ctx.font='13px "Courier New",monospace';
  const lines = [
    '照準を合わせて撃つ。頭を撃てば一撃。',
    'スコープで寄せると手ブレは3.6倍に増える。',
    '息を止めれば銃は静まる。ただし切らせば倍返し。',
    '群れは突然走り出す。弾は5発。'
  ];
  lines.forEach((l,i)=>ctx.fillText(l, W/2, H*.52 + i*24));
  ctx.fillStyle = Math.sin(S.t*3)>0 ? '#dbe8cf' : '#55705a';
  ctx.font='bold 16px "Courier New",monospace';
  ctx.fillText('画面をタップ／クリックで開始', W/2, H*.72);
}

function drawOver(){
  ctx.fillStyle='rgba(4,7,5,.82)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.fillStyle='#c4442f'; ctx.font=`bold ${Math.min(56,W*.12)}px "Courier New",monospace`;
  ctx.fillText('制圧された', W/2, H*.32);
  ctx.fillStyle='#dbe8cf'; ctx.font='bold 30px "Courier New",monospace';
  ctx.fillText(String(S.score).padStart(6,'0'), W/2, H*.44);
  ctx.fillStyle='#6f8a6b'; ctx.font='13px "Courier New",monospace';
  const acc = S.shots ? Math.round(S.hits/S.shots*100) : 0;
  ctx.fillText(`WAVE ${S.wave}　命中率 ${acc}%　最大連続 ${S.bestCombo}`, W/2, H*.44+26);
  ctx.fillText('最高得点 ' + String(S.best).padStart(6,'0'), W/2, H*.44+48);
  ctx.fillStyle = Math.sin(S.t*3)>0 ? '#dbe8cf' : '#55705a';
  ctx.font='bold 16px "Courier New",monospace';
  ctx.fillText('タップ／クリックでもう一度', W/2, H*.68);
}
</script>
