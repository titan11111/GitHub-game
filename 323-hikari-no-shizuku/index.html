<style>
/* Layout: handheld-style column. Playfield (8:7, SFC ratio) on top, controller below. */
:root{
  --bg:#0e1230; --ink:#f4f7ff; --panel:#1a2150; --line:#3c4690;
  --lime:#8bf06a; --slime:#3fb7ff; --slime-dk:#14305f; --hot:#ff9a4a;
  --pa:#e5484d; --pb:#f5c542; --px:#4a8cf5; --py:#4cc26a;
  --u:2px; --k:1; color-scheme:dark;
}
html,body{height:100%;overscroll-behavior:none;overflow:hidden;position:relative}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'DotGothic16','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
  box-sizing:border-box; padding-block:10px; -webkit-tap-highlight-color:transparent; touch-action:manipulation;
  padding-top:max(10px,env(safe-area-inset-top,0px)); padding-bottom:0;
  min-height:100dvh;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex; flex-direction:column; align-items:center; gap:10px;
  overflow-x:hidden; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
}
#stage{
  position:relative; flex:none; width:min(100%,760px,calc((100vh - 24px) * 8 / 7)); width:min(100%,760px,calc((100dvh - 24px) * 8 / 7)); aspect-ratio:8/7;
  border:3px solid var(--line); border-radius:10px; overflow:hidden; background:#000;
  box-shadow:0 0 0 3px #090c22,0 10px 30px #0008;
}
#cv{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;outline:none}
.ov{
  position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; gap:calc(var(--u)*6); padding:calc(var(--u)*8); box-sizing:border-box;
  background:linear-gradient(#0a183ad9,#0a2a2ad9);
}
.ov[hidden]{display:none}
.ov{pointer-events:none}
.ov button,.ov canvas,.ov a{pointer-events:auto}
.ttl{
  font-size:calc(var(--u)*17); line-height:1.12; letter-spacing:.04em; color:#fff;
  text-shadow:calc(var(--u)*1.5) calc(var(--u)*1.5) 0 var(--slime-dk),0 0 calc(var(--u)*8) var(--slime);
}
.sub{font-size:calc(var(--u)*7.5);color:var(--lime);letter-spacing:.12em}
.skills{display:flex;flex-wrap:wrap;gap:calc(var(--u)*3);justify-content:center;max-width:calc(var(--u)*220);margin:0;padding:0;list-style:none}
.skills li{
  font-size:calc(var(--u)*6.6); padding:calc(var(--u)*1.6) calc(var(--u)*4); border-radius:calc(var(--u)*8);
  background:#ffffff14; border:1px solid #ffffff38;
}
.tiny{font-size:calc(var(--u)*6);opacity:.75}
.res{font-size:calc(var(--u)*8);line-height:1.7}
button.big{
  font:inherit; font-size:calc(var(--u)*10); color:#0b1b10; background:var(--lime); border:0;
  border-radius:calc(var(--u)*6); padding:calc(var(--u)*4) calc(var(--u)*16);
  box-shadow:0 calc(var(--u)*2) 0 #3e9a3a; cursor:pointer;
}
button.big.alt{background:#2a2f6a;color:#d8e0ff;font-size:calc(var(--u)*7.5);padding:calc(var(--u)*3) calc(var(--u)*8);margin-top:calc(var(--u)*2)}
div.stsel{display:flex;flex-wrap:wrap;gap:calc(var(--u)*2);justify-content:center;max-width:calc(var(--u)*236);margin-top:calc(var(--u)*2)}
div.stsel button.big.alt{font-size:calc(var(--u)*6.5);padding:calc(var(--u)*2.5) calc(var(--u)*5);margin-top:0}
button.big:active{transform:translateY(calc(var(--u)*1))}
button.big:focus-visible,.pill:focus-visible{outline:2px solid #fff;outline-offset:2px}
@keyframes blink{50%{opacity:.25}}
.blink{animation:blink 1.1s steps(2) infinite}
@media (prefers-reduced-motion:reduce){.blink{animation:none}}
#hint{
  position:absolute; left:calc(var(--u)*8); right:calc(var(--u)*8); bottom:calc(var(--u)*6);
  padding:calc(var(--u)*4) calc(var(--u)*6); background:#0b1030c8; border:calc(var(--u)*1) solid var(--lime);
  border-radius:calc(var(--u)*4); font-size:calc(var(--u)*8); line-height:1.4; pointer-events:none;
}
#hint[hidden]{display:none}
#banner{
  position:absolute; left:0; right:0; top:28%; text-align:center; pointer-events:none;
  font-size:calc(var(--u)*14); color:#fff; letter-spacing:.06em; opacity:0; transition:opacity .35s;
  text-shadow:calc(var(--u)*1.5) calc(var(--u)*1.5) 0 #14305f,0 0 calc(var(--u)*6) #000;
}
#banner.show{opacity:1}
#story{position:absolute;left:6%;right:6%;top:13%;text-align:center;pointer-events:none;font-size:calc(var(--u)*6.4);line-height:1.5;color:#fff;opacity:0;transition:opacity .5s;
  padding:calc(var(--u)*2) calc(var(--u)*4);border-radius:calc(var(--u)*5);background:#0a1a3acc;text-shadow:0 0 calc(var(--u)*3) #000}
#story.show{opacity:1}
#springCv{width:calc(var(--u)*40);height:calc(var(--u)*22.2);image-rendering:pixelated}
#clearOv{gap:calc(var(--u)*3);padding:calc(var(--u)*4)}
#clearOv .res{font-size:calc(var(--u)*6.6);line-height:1.5}
#clearOv .ttl{font-size:calc(var(--u)*12)!important}
#clearStory{font-size:calc(var(--u)*6.6);line-height:1.5;color:#bff4ff}
#banner small{display:block;font-size:calc(var(--u)*7);color:var(--lime);letter-spacing:.14em}

/* Controller: every size scales with --k so it always fits the phone width */
/* ---- controller: titans-ui FC deck (fc-ios-controller.css) + this game's overrides ---- */
/* the grey shell grows into the space under the screen, so the handheld reads as one body
   and the controls get as big as the phone allows */
#pad.fc-control-deck{
  flex:1 1 auto; height:auto; min-height:min(36dvh,250px); max-height:48dvh; width:100%; max-width:640px; margin-top:auto;
  border-radius:16px 16px 0 0; flex-direction:column; align-items:stretch; justify-content:center;
  gap:clamp(6px,2vw,14px);
  padding-top:clamp(8px,2.4vw,16px); padding-bottom:max(10px,env(safe-area-inset-bottom,10px));
}
.fc-sysrow{display:flex;justify-content:center;align-items:center;gap:clamp(5px,2vw,12px);flex:0 0 auto;position:relative;z-index:3}
.fc-maindeck{display:flex;align-items:center;justify-content:space-between;gap:clamp(4px,1.5vw,10px);flex:1 1 auto;min-height:0;position:relative;z-index:2}
.fc-deck-left{flex:0 0 auto}
.fc-dpad-wrap{width:min(37vw,26dvh,176px);height:min(37vw,26dvh,176px);min-width:112px;min-height:112px}
#dpad{transition:transform .06s}
#dpad i.u,#dpad i.l,#dpad i.r,#dpad i.d{
  position:absolute; z-index:2; display:flex; align-items:center; justify-content:center;
  font-style:normal; font-size:clamp(11px,3vw,15px); color:#8e8e8e; text-shadow:0 1px 0 #0009;
  pointer-events:none; background:none; border:0;
}
#dpad i.u{left:32%;top:1%;width:36%;height:22%}
#dpad i.d{left:32%;bottom:1%;width:36%;height:22%}
#dpad i.l{left:1%;top:32%;width:22%;height:36%}
#dpad i.r{right:1%;top:32%;width:22%;height:36%}
#dpad i.u.on,#dpad i.d.on,#dpad i.l.on,#dpad i.r.on{color:#fff}
#dpad i.c{display:none}

.fc-deck-center{gap:clamp(5px,1.6vw,9px)}
.fc-sysbtn{font-family:inherit;font-size:clamp(10px,2.8vw,13px);width:clamp(68px,19vw,92px);height:clamp(34px,9vw,42px);letter-spacing:0}
.fc-sysbtn.on{transform:translateY(2px);box-shadow:0 0 0 #111,inset 0 2px 4px #00000073}
.fc-sysbtn[hidden]{display:none}

#btns.fc-deck-right{gap:clamp(3px,1.4vw,9px);touch-action:none;flex:0 0 auto;align-items:center;justify-content:flex-end;min-width:0}
.fc-turbo{display:flex;flex-direction:column;justify-content:center;gap:clamp(6px,2vw,11px)}
.fc-tbtn{
  position:relative; width:clamp(44px,11.5vw,58px); height:clamp(32px,8.5vw,40px); padding:0; border-radius:9px;
  border:2px solid #00000059; background:linear-gradient(180deg,#6e6e6e,#3d3d3d);
  box-shadow:0 4px 0 #171717,inset 0 1px 0 #ffffff33; color:#f2f2f2;
  display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1;
  font-family:inherit; font-size:clamp(12px,3.4vw,15px);
}
#bX{border-top-color:#6fb4ff}
#bY{border-top-color:#79dd86}
.fc-ab{width:min(37vw,26dvh,176px);height:min(37vw,26dvh,176px);min-width:112px;min-height:112px;flex:0 0 auto}
.fc-abbtn{font-family:inherit;color:#fff}
.fc-abbtn i{font-family:inherit;font-size:clamp(15px,4.4vw,19px);color:#ffffffd9;flex-direction:column}
.fb small{font-size:clamp(8px,2.3vw,10px);opacity:.95;margin-top:1px;display:block}
#btns .fb{pointer-events:none;transition:transform .05s,box-shadow .05s,filter .05s}   /* the deck picks the nearest button, so fingers can roll across */
.fb.on{transform:translateY(3px) scale(.94);filter:brightness(1.3)}
.fb::after{content:'';position:absolute;inset:-3px;border-radius:inherit;border:3px solid #fff;opacity:0;pointer-events:none}
.fb.rip::after{animation:rip .3s ease-out}
@keyframes rip{from{transform:scale(.85);opacity:.8}to{transform:scale(1.5);opacity:0}}
button{-webkit-tap-highlight-color:transparent}
#keys{display:none;width:min(100%,760px);font-size:13px;line-height:1.7;color:#b7c0ff;text-align:center}
@media (hover:hover) and (pointer:fine){
  #pad,#pills{display:none}
  #keys{display:block}
}

/* ---- scene overlays: title / prologue / ending ---- */
#title{background:linear-gradient(#06102e55,#06182a88)}
.tlogo{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*2)}
.tlogo .ttl{font-size:calc(var(--u)*26);line-height:1.02;letter-spacing:.06em}
.tlogo .sub{font-size:calc(var(--u)*7);color:#bff4ff;letter-spacing:.18em;text-shadow:0 calc(var(--u)*1) 0 #0b1030}
.menu{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*3);margin-top:calc(var(--u)*2)}
.menu button.big{min-width:calc(var(--u)*78)}
.menu button.sel{outline:calc(var(--u)*1.5) solid #fff;outline-offset:calc(var(--u)*1.5)}
.menu button.big.alt.sel{background:#3a4290;color:#fff}
#saveInfo{color:#bff4ff}
.pages{font-size:calc(var(--u)*8);line-height:1.8;max-width:calc(var(--u)*212);min-height:calc(var(--u)*46);
  display:block;text-align:center}
.pages b{color:#bff4ff;font-weight:normal}
#introOv,#endOv{background:linear-gradient(#04081fdd,#06142add);gap:calc(var(--u)*5)}
#introOv .tiny,#endOv .tiny{letter-spacing:.1em}
#endOv .ttl{font-size:calc(var(--u)*15)}
#endCv{width:calc(var(--u)*86);height:calc(var(--u)*48);image-rendering:pixelated}
.ovbtns{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*2.5)}
</style>

<body>


<div id="stage">
  <canvas id="cv" width="256" height="224" tabindex="0"></canvas>
  <div id="banner"></div>
  <div id="story"></div>
  <div id="hint" hidden></div>

  <div id="title" class="ov">
    <div class="tlogo">
      <div class="ttl">ひかりの<br>しずく</div>
      <div class="sub">ぷるぷる スライム だいぼうけん</div>
    </div>
    <ul class="skills">
      <li>しみこむ</li><li>ふわり</li><li>ぱくっ</li><li>のっとり</li><li>ぶんれつ</li>
    </ul>
    <div class="menu">
      <button id="startBtn" class="big sel">はじめから</button>
      <button id="contBtn" class="big alt" hidden>つづきから</button>
    </div>
    <div id="saveInfo" class="tiny" hidden></div>
    <div id="tclr" class="tiny" style="color:#ffec6a" hidden>★ ALL CLEAR ★</div>
    <div class="tiny blink">TAP / Z キー でもOK</div>
  </div>

  <div id="introOv" class="ov" hidden>
    <div class="sub">PROLOGUE</div>
    <div id="introTxt" class="pages"></div>
    <div class="tiny blink" id="introNext">タップ ／ Z で つぎへ</div>
    <button id="skipBtn" class="big alt">スキップ</button>
  </div>

  <div id="endOv" class="ov" hidden>
    <div class="sub" id="endSub">ENDING</div>
    <div id="endTxt" class="pages"></div>
    <canvas id="endCv" width="72" height="40" hidden></canvas>
    <div class="res" id="endRes" hidden></div>
    <div class="tiny blink" id="endNext">タップ ／ Z で つぎへ</div>
    <button id="endBtn" class="big" hidden>タイトルへ</button>
  </div>

  <div id="pauseOv" class="ov" hidden>
    <div class="ttl" style="font-size:calc(var(--u)*13)">ポーズ中</div>
    <button id="resumeBtn" class="big">つづける</button>
  </div>

  <div id="clearOv" class="ov" hidden>
    <div class="sub" id="clearSub">STAGE 1 CLEAR</div>
    <div class="ttl" id="clearTtl" style="font-size:calc(var(--u)*14)">ひみつの庭を<br>ぬけだした！</div>
    <canvas id="springCv" width="72" height="40"></canvas>
    <div id="clearStory"></div>
    <div class="res" id="clearRes"></div>
    <button id="nextBtn" class="big">つぎの ステージへ</button>
    <button id="againBtn" class="big alt">もういちど</button>
  </div>

  <div id="overOv" class="ov" hidden>
    <div class="ttl" style="font-size:calc(var(--u)*14)">ゲームオーバー</div>
    <div class="tiny">ぱしゃっ…でも、スライムは しぶとい！</div>
    <div class="menu ovbtns">
      <button id="contOvBtn" class="big sel">つづきから</button>
      <button id="restartBtn" class="big alt">はじめから</button>
    </div>
    <div class="tiny" id="overInfo"></div>
  </div>
</div>

<div id="pad" class="fc-control-deck">
  <div class="fc-sysrow">
    <button class="fc-sysbtn" id="bS" hidden>かわる</button>
    <button class="fc-sysbtn" id="bM">おと ON</button>
    <button class="fc-sysbtn" id="bH">ふるえ ON</button>
    <button class="fc-sysbtn" id="bP">ポーズ</button>
  </div>
  <div class="fc-maindeck">
    <div class="fc-deck-left">
      <div class="fc-dpad-wrap" id="dpadWrap">
        <div id="dpad" class="fc-dpad" aria-label="十字キー" data-up="0" data-down="0" data-left="0" data-right="0">
          <i class="fc-dpad-v"></i><i class="fc-dpad-h"></i><i class="fc-dpad-c"></i>
          <i class="u">▲</i><i class="l">◀</i><i class="r">▶</i><i class="d">▼</i><i class="c"></i>
        </div>
      </div>
    </div>
    <div class="fc-deck-right" id="btns">
      <div class="fc-turbo">
        <button class="fc-tbtn fb" id="bX">X<small>ふわり</small></button>
        <button class="fc-tbtn fb" id="bY">Y<small>ぶんれつ</small></button>
      </div>
      <div class="fc-ab">
        <button class="fc-abbtn fc-abbtn-b fb" id="bB"><i>B<small>ぱくっ</small></i></button>
        <button class="fc-abbtn fc-abbtn-a fb" id="bA"><i>A<small>ジャンプ</small></i></button>
      </div>
    </div>
  </div>
</div>
<div id="keys">←→ うごく ／ Z ジャンプ ／ X ぱくっ・のっとり ／ C ふわり ／ V ぶんれつ・合体 ／ Tab かわる ／ ↓ ながおしで しみこむ ／ P ポーズ ／ M おと</div>

<script>
'use strict';
/* ===== core: constants, helpers, input, audio, blob art ===== */
const W=256,H=224,T=16;
const cv=document.getElementById('cv'),cx=cv.getContext('2d');
cx.imageSmoothingEnabled=false;
const rnd=(a,b)=>a+Math.random()*(b-a), rint=(a,b)=>Math.floor(rnd(a,b+.999));
const clamp=(v,a,b)=>v<a?a:v>b?b:v, sgn=v=>v>0?1:v<0?-1:0, lerp=(a,b,t)=>a+(b-a)*t;
function hash(a,b){let h=Math.imul(a|0,374761393)^Math.imul(b|0,668265263);h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296;}
let camx=0,camy=0,shake=0,hitstop=0;
function R(x,y,w,h,c){cx.fillStyle=c;cx.fillRect(Math.round(x-camx),Math.round(y-camy),w,h);}
function RS(x,y,w,h,c){cx.fillStyle=c;cx.fillRect(Math.round(x),Math.round(y),w,h);}
function ov(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}

/* ---- input ---- */
const K={l:0,r:0,u:0,d:0,a:0,b:0,x:0,y:0,s:0,p:0}, KP=Object.assign({},K);
const PR={};                                   // latched taps so a very quick touch is never missed
const hit=k=>(K[k]&&!KP[k])||PR[k];
const KEYMAP={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',ArrowUp:'u',KeyW:'u',ArrowDown:'d',KeyS:'d',
  Space:'a',KeyZ:'a',KeyK:'a',KeyX:'b',KeyJ:'b',KeyC:'x',KeyL:'x',KeyV:'y',KeyI:'y',
  Tab:'s',ShiftLeft:'s',ShiftRight:'s',KeyQ:'s',KeyP:'p',Escape:'p'};
addEventListener('keydown',e=>{
  const k=KEYMAP[e.code];
  if(k){K[k]=1;if(!e.repeat)PR[k]=1;e.preventDefault();audioInit();}
  if(e.code==='KeyM'&&!e.repeat)toggleMute();
});
addEventListener('keyup',e=>{const k=KEYMAP[e.code];if(k){K[k]=0;e.preventDefault();}});
addEventListener('blur',()=>{for(const k in K)K[k]=0;});

/* ---- audio ---- */
let AC=null,master=null,muted=false;
function audioInit(){
  try{
    if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
      AC=new C();master=AC.createGain();master.gain.value=.5;master.connect(AC.destination);}
    if(AC.state!=='running')AC.resume();
    if(!AC._u){AC._u=1;try{const b=AC.createBuffer(1,1,22050),s=AC.createBufferSource();s.buffer=b;s.connect(AC.destination);s.start(0);}catch(e){}}   // silent blip: iOS needs a sound started inside the gesture
  }catch(e){AC=null;}
}
function tone(f,d,type,vol,slide,t0){
  if(!AC||muted)return;
  const t=t0||AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
  g.gain.setValueAtTime(vol||.1,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.03);
}
let nbuf=null;
function noise(d,vol,t0){
  if(!AC||muted)return;
  if(!nbuf){nbuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const a=nbuf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;}
  const t=t0||AC.currentTime,s=AC.createBufferSource(),g=AC.createGain();
  s.buffer=nbuf;g.gain.setValueAtTime(vol||.1,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(g);g.connect(master);s.start(t);s.stop(t+d+.02);
}
const now=()=>AC?AC.currentTime:0;
const SFX={
  jump:()=>{tone(250,.15,'sine',.1,320);tone(540,.09,'triangle',.035,-160,now()+.05);},
  stomp:()=>{tone(240,.09,'square',.1,-140);},
  absorb:()=>{tone(520,.08,'triangle',.13,420);tone(820,.1,'triangle',.11,300,now()+.07);},
  whiff:()=>noise(.07,.04),
  drop:()=>{tone(988,.05,'square',.05);tone(1319,.1,'square',.05,0,now()+.05);},
  hurt:()=>{tone(220,.32,'sawtooth',.1,-160);noise(.12,.06);},

const MUSIC={title:'audio/over-the-clover.m4a',field:'audio/jump-before-you-land.m4a'};
const MVOL={title:.62,field:.5};
let mEl={},mKey='',mWant='',mFade=1;
function mMake(k){
  if(mEl[k])return mEl[k];
  const a=new Audio();a.loop=true;a.preload='auto';a.volume=0;mEl[k]=a;
  a.addEventListener('error',()=>{mEl[k]=null;});                 // a missing file must never stop the game
  // fetched whole, then played from memory: no media stream is left half-open, and the loop seam is clean
  fetch(MUSIC[k]).then(r=>r.ok?r.blob():null).then(b=>{if(b&&mEl[k])a.src=URL.createObjectURL(b);}).catch(()=>{});
  return a;
}
function musicPlay(k){
  if(!MUSIC[k])return;
  mMake(k);
  if(mWant===k&&mKey===k)return;
  mWant=k;
  if(mKey&&mKey!==k)mFade=1; else {mFade=0;mSwap();}
}
function mSwap(){
  const prev=mKey?mEl[mKey]:null;if(prev){try{prev.pause();prev.currentTime=0;}catch(e){}}
  mKey=mWant;const a=mKey?mEl[mKey]:null;
  if(a&&!muted){a.volume=0;const pr=a.play();if(pr&&pr.catch)pr.catch(()=>{});}
}
function musicPause(){const a=mKey?mEl[mKey]:null;if(a){try{a.pause();}catch(e){}}mWant='';}
function musicResume(){const a=mKey?mEl[mKey]:null;if(a&&!muted&&mWant===mKey){const pr=a.play();if(pr&&pr.catch)pr.catch(()=>{});}}
function musicStop(){musicPause();const a=mKey?mEl[mKey]:null;if(a){try{a.currentTime=0;}catch(e){}}mKey='';}
function musicUpd(){                                              // 60Hz crossfade, no timers
  const a=mKey?mEl[mKey]:null;
  if(mWant!==mKey){ if(mFade>0){mFade-=.08;if(a)a.volume=Math.max(0,(MVOL[mKey]||.5)*mFade);} if(mFade<=0)mSwap(); return; }
  if(!a)return;
  const tgt=muted?0:(MVOL[mKey]||.5);
  if(Math.abs(a.volume-tgt)>.01)a.volume=clamp(a.volume+(tgt>a.volume?.03:-.08),0,1);
  else if(a.volume!==tgt)a.volume=tgt;
  if(!muted&&a.paused&&mWant===mKey&&AC){const pr=a.play();if(pr&&pr.catch)pr.catch(()=>{});}
}
setInterval(()=>{
  if(!AC||!bgm||muted||AC.state!=='running')return;
  const spb=60/bgm.bpm/2;
  if(bgmNext<AC.currentTime-.2)bgmNext=AC.currentTime+.05;
  while(bgmNext<AC.currentTime+.3){
    const bar=Math.floor(bgmStep/8)%bgm.mel.length,i=bgmStep%8,m=bgm.mel[bar][i];
    if(m)tone(M2F(m),spb*.9,bgm.mt,bgm.mv,0,bgmNext);
    if(i%4===0){const b=bgm.bass[bar];tone(M2F(b+(i===4?7:0)),spb*3.6,'triangle',.09,0,bgmNext);}
    if(i%2===1)noise(.03,.012,bgmNext);
    bgmNext+=spb;bgmStep++;
  }
},60);

function drawBlobS(X,Y,w,h,pal,o){
  o=o||{};w=Math.max(4,Math.round(w));
  const dhy=clamp(o.dhy||0,-.3,.3);h=Math.max(3,Math.round(h*(1+dhy*.9)));   // the head's height lags behind the feet
  const top=Math.round(Y)-h,sp=[],lean=o.lean||0,tt=o.t||0,DK='#10244a',prevA=cx.globalAlpha;
  const P=(x,y,a,b,c)=>{cx.fillStyle=c;cx.fillRect(x,y,a,b);};
  const sh=r=>Math.round(lean*Math.pow(1-(clamp(r,0,h-1)+.5)/h,1.4));   // jelly lean: the top lags behind the feet
  const dbx=clamp(o.dbx||0,-.3,.3),dhx=clamp(o.dhx||0,-.3,.3),fs=clamp(o.fs||0,-.6,.6),pull=clamp(o.pull||0,0,1);
  for(let r=0;r<h;r++){const t=(r+.5)/h;let v=(w/2)*Math.sqrt(1-Math.pow(1-t,2.4));
    if(dbx||dhx){const wH=Math.pow(clamp(1-t/.5,0,1),1.2),wB=Math.exp(-Math.pow((t-.62)/.2,2));v*=1+dbx*wB+dhx*wH;}
    if(pull){if(t>.5&&t<.78)v*=1-pull*.16;}
    if(r>=h-2&&w>=8){v+=(r===h-1?3:1.6)*fs+(pull?pull*(r===h-1?1.6:.8):0);}
    sp.push(Math.min(v,w*.78));}
  for(let r=-1;r<=h;r++){
    const hw=(r<0?sp[0]:r>=h?sp[h-1]:sp[r])+1,s=sh(r),l=Math.round(X-hw+s),rr=Math.round(X+hw+s);
    P(l,top+r,Math.max(1,rr-l),1,pal.o);
  }
  for(let r=0;r<h;r++){
    const hw=sp[r],s=sh(r),l=Math.round(X-hw+s),rr=Math.round(X+hw+s);
    P(l,top+r,Math.max(1,rr-l),1,r>h*.74?pal.s:pal.b);
    if(w>=9&&h>=8&&r>=h*.3&&r<h*.74&&rr-l>3)P(rr-1,top+r,1,1,pal.s);   // rim shade on the right
  }
  if(pal.d&&w>=10&&h>=8){   // deep jelly core + dark contact patch, a bright rim stays on the left
    cx.globalAlpha=prevA*(o.solid?1:.88);
    const r0=Math.round(h*.6),r1=h-2,rim=w>=14?2:1;
    for(let r=r0;r<r1;r++){const hw=sp[r]-rim-.5,s=sh(r),l=Math.round(X-hw+s+1),rr=Math.round(X+hw+s);if(rr-l>=2)P(l,top+r,rr-l,1,pal.d);}
    cx.globalAlpha=prevA;
    for(const r of[h-2,h-1]){const hw=sp[r],s=sh(r),l=Math.round(X-hw+s),rr=Math.round(X+hw+s);if(rr-l>=3)P(l,top+r,rr-l,1,r===h-1?pal.g:pal.s);}
    for(let r=Math.round(h*.2);r<Math.round(h*.58);r++){const hw=sp[r],s=sh(r);P(Math.round(X-hw+s),top+r,1,1,pal.l);}   // lit left rim
  }
  if(h>=7){
    const hr=Math.round(h*.2),hx=Math.round(X-w*.3+sh(hr));
    P(hx,top+hr,Math.max(2,Math.round(w*.2)),1,pal.l);
    P(hx-1,top+hr+1,1,Math.max(1,Math.round(h*.16)),pal.l);
    if(w>=10&&h>=9)P(Math.round(X+w*.26+sh(h-3)),top+h-3,1,1,pal.l);
  }
  if(w>=11&&h>=9&&o.bub!==false){   // a couple of lazy bubbles inside; they trail the body when it accelerates
    const bo=clamp(o.bo||0,-4,4),bx=clamp(o.bxo||0,-3,3);
    for(let k=0;k<2;k++){const p=(((tt*.45)+k*47)%90)/90;
      if(p<.85){cx.globalAlpha=prevA*(1-p);
        P(Math.round(X+sh(h*.7)+bx+Math.sin(tt*.06+X*.1+k*2.1)*w*.2*(k?-1:1)),Math.round(top+h*.86-p*h*.3+bo),1,1,pal.l);cx.globalAlpha=prevA;}}
  }
  if(o.tuft!==undefined&&w>=9){   // the ahoge: lags behind motion, droops when rising, flies up when falling
    const len=o.tl||3,bend=o.tuft,bx=Math.round(X+sh(0)+1),pts=[];
    for(let i=0;i<len;i++)pts.push([bx+Math.round(bend*Math.pow(i/Math.max(1,len-1),1.6)),top-1-i]);
    for(const p of pts)P(p[0]-1,p[1],3,1,pal.o);
    P(pts[len-1][0]-1,top-len-1,3,1,pal.o);
    for(const p of pts)P(p[0],p[1],1,1,pal.b);
    P(pts[len-1][0],pts[len-1][1],1,1,pal.l);
  }
  if(o.eyes!==false&&h>=6&&w>=6){
    const big=w>=10&&h>=9,eh=big?4:3,ex=w>=14?3:2;
    const lk=o.look||[0,0],d=o.dir||0,mxs=w>=14?2:1;
    const ey=Math.max(top+1,top+Math.round(h*.40)+lk[1]);
    const fx=Math.round(X+sh(ey-top)+clamp(d*Math.round(w*.09)+lk[0],-mxs,mxs));
    const xl=fx-ex-1,xr=fx+ex;   // two 2px-wide eyes, symmetric around fx with an odd gap in between
    let expr=o.expr||'norm';
    if(o.blink&&(expr==='norm'||expr==='sad'||expr==='wow'))expr='blink';
    const eye=(x,side)=>{
      if(expr==='blink'||expr==='sleep'){P(x,ey+eh-2,2,1,DK);return;}
      if(expr==='happy'||expr==='chew'){const q=side<0?x-1:x;P(q,ey+1,1,1,DK);P(q+1,ey,1,1,DK);P(q+2,ey+1,1,1,DK);return;}
      if(expr==='hurt'){
        if(side<0){P(x,ey,1,1,DK);P(x+1,ey+1,1,1,DK);P(x,ey+2,1,1,DK);}
        else{P(x+1,ey,1,1,DK);P(x,ey+1,1,1,DK);P(x+1,ey+2,1,1,DK);}
        return;
      }
      if(expr==='wow'){P(x,ey-1,2,eh+1,DK);P(x,ey-1,1,2,'#fff');return;}
      P(x,ey,2,eh,DK);P(x,ey,1,1,'#fff');if(big)P(x+1,ey+eh-1,1,1,'#3a6ad0');
    };
    eye(xl,-1);eye(xr,1);
    if(expr==='sad'){P(xl,ey-1,1,1,DK);P(xl+1,ey-2,1,1,DK);P(xr+1,ey-1,1,1,DK);P(xr,ey-2,1,1,DK);}
    if(w>=9&&expr!=='hurt'){
      cx.globalAlpha=(expr==='happy'||expr==='chew')?.95:.5;
      P(xl-1,ey+eh-1,1,1,'#ff8fb0');P(xr+2,ey+eh-1,1,1,'#ff8fb0');cx.globalAlpha=1;
    }
    const my=Math.min(ey+eh,top+h-2),mo=o.mouth===undefined?1:o.mouth;
    if(mo===1){P(fx-1,my,1,1,DK);P(fx+1,my,1,1,DK);P(fx,my+1,1,1,DK);}
    else if(mo===2){if(big){P(fx-1,my,3,2,DK);P(fx,my+1,1,1,'#ff7a9a');}else{P(fx-1,my,3,1,DK);P(fx,my+1,1,1,'#ff7a9a');}}
    else if(mo===3){P(fx,my,1,big?2:1,DK);}
    else if(mo===4){P(fx,my,1,1,DK);P(fx-1,my+1,1,1,DK);P(fx+1,my+1,1,1,DK);}
    if(o.sweat)P(Math.round(X+sh(1)+w/2),top+1+((tt>>3)%4),1,2,'#d8f4ff');
  }
}

let NC=165,NR=14,GY=11,ARENA_X=148;
let M=new Uint8Array(NC*NR);
let SIGNL=[],STARTX=2*16,STARTY=11*16-11;
// 0 air 1 ground 2 stone 3 soil(seep) 4 grate(seep) 5 cracked 6 thorn 7 hot stone 8 seed 9 leaf(one-way) 10 vine 11 plate 12 gate 13 sign
const SOLID=[0,1,1,1,1,1,0,1,0,0,0,0,1,0];
const tileAt=(tx,ty)=>(tx<0||tx>=NC)?2:(ty<0||ty>=NR)?0:M[ty*NC+tx];
const solidAt=(tx,ty)=>SOLID[tileAt(tx,ty)]===1;
const isSeep=(tx,ty)=>{const t=tileAt(tx,ty);return t===3||t===4;};
function setT(x,y,t){if(x>=0&&x<NC&&y>=0&&y<NR)M[y*NC+x]=t;}
function fillT(x0,y0,x1,y1,t){for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)setT(x,y,t);}
function groundT(x0,x1,soil){for(let x=x0;x<=x1;x++){setT(x,11,soil?3:1);setT(x,12,soil?3:1);setT(x,13,1);}}
function blockedBox(x,y,w,h){
  const x0=Math.floor(x/T),x1=Math.floor((x+w-.01)/T),y0=Math.floor(y/T),y1=Math.floor((y+h-.01)/T);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++)if(solidAt(tx,ty))return true;
  return false;
}

/* ===== enemies, absorb, possess, items, puzzle, boss ===== */
const EDEF={bat:{w:12,h:8},ant:{w:12,h:8},bee:{w:12,h:9},lady:{w:14,h:11},beetle:{w:22,h:15},fish:{w:10,h:9},frog:{w:12,h:9},jelly:{w:12,h:12},angler:{w:20,h:13},turret:{w:14,h:12}};
function mkE(t,tx,row){
  const d=EDEF[t];
  return{t,w:d.w,h:d.h,x:tx*T+(T-d.w)/2,y:(t==='bee'||t==='bat'||t==='jelly'||t==='angler')?row*T:(row+1)*T-d.h,vx:0,vy:0,dir:-1,onG:false,state:'walk',timer:0,
    anim:rint(0,60),cool:0,x0:tx*T,y0:row*T,range:40,hitX:0,dead:false,charge:0,hcool:0};
}
function spawnEnemies(){E=ESPEC.map(s=>{const e=mkE(s[0],s[1],s[2]);if(s[3]==='gold')e.gold=true;if(s[3]==='p'){e.p=1;e.col=1;}if(e.t==='fish'||e.t==='frog')e.timer=rint(30,150);if(e.t==='turret')e.cool=60;return e;});}
function gravMove(e){e.vy=G.stage===4?Math.min(e.vy+.09,2):G.stage===5?Math.min(e.vy+.12,3):Math.min(e.vy+.26,5);moveBody(e);}
function groundAhead(e){const t=tileAt(Math.floor((e.x+(e.dir>0?e.w+2:-2))/T),Math.floor((e.y+e.h+2)/T));return SOLID[t]===1||t===9;}
function heal(n){if(G.mass>=5)addDrops(3);else G.mass=Math.min(5,G.mass+n);}
function addDrops(n){const b=Math.floor(G.drops/50);G.drops+=n;if(Math.floor(G.drops/50)>b){G.lives++;sfx('oneup');}}

function updE(e){
  e.anim++;if(e.cool>0)e.cool--;if(e.alert>0)e.alert--;if(e.acd>0)e.acd--;if(e.fl>0)e.fl--;
  if(e.q>0)e.q--;
  if(e.t!=='beetle'&&e.t!=='bat'&&e.state==='walk'&&!(e.acd>0)&&pl.mode==='norm'&&!(G.stage===3&&e.t==='ant'&&!e.gold)){   // "!" when it spots you
    const dx=pl.x+pl.w/2-(e.x+e.w/2);
    if(Math.abs(dx)<72&&Math.abs(pl.y-e.y)<30&&sgn(dx)===e.dir){e.alert=28;e.acd=320;sfx('alert');}
  }
  if(e.t==='lady'&&e.state==='walk'&&e.anim%280===((e.x|0)%97)+1)e.fl=30;   // stretches its wings now and then
  switch(e.state){
    case 'abs':{
      const tx=pl.x+pl.w/2-e.w/2,ty=pl.y+pl.h/2-e.h/2;e.x+=(tx-e.x)*.3;e.y+=(ty-e.y)*.3;
      spawn(e.x+e.w/2,e.y+e.h/2,rnd(-.3,.3),rnd(-.3,.3),10,'#a6ecff',1,0);
      if(--e.timer<=0){e.dead=true;heal(1);if(e.gold)foundSecret('ant',e.x+6,e.y+4);sfx('absorb');pl.sqx=1.3;pl.sqy=.82;emote(pl,'chew',44);haptic(12);fxRing(pl.x+6,pl.y+6,'#a6ecff',15);burst(pl.x+6,pl.y+6,8,['#a6ecff','#fff'],1,20,0);}
      return;}
    case 'host':hostUpdate(e);return;
    case 'stun':e.vx=0;gravMove(e);if(--e.timer<=0)e.state='walk';return;
    case 'dizzy':e.vx=0;gravMove(e);if(--e.timer<=0)e.state='walk';return;
  }
  const walk=sp=>{e.vx=e.dir*sp;gravMove(e);if(e.hitX||(e.onG&&!groundAhead(e)))e.dir*=-1;};
  if(e.t==='fish'){updFish(e);return;}
  if(e.t==='jelly'){updJelly(e);return;}
  if(e.t==='angler'){updAngler(e);return;}
  if(e.t==='turret'){if(e.cool>0)e.cool--;updTurret(e);return;}
  if(e.t==='frog'){updFrog(e);return;}
  if(e.t==='ant'){
    if(G.stage===3&&!e.gold&&antAI(e))return;
    let sp=.45;
    if(e.gold){   // the golden ant bolts when you get close
      const dx=pl.x+pl.w/2-(e.x+e.w/2);
      if(Math.abs(dx)<84&&Math.abs(pl.y-e.y)<40&&pl.mode!=='dead'){e.dir=dx>0?-1:1;sp=(e.onG&&!groundAhead(e))?0:1.12;if(e.anim%5===0)spawn(e.x+6,e.y+3,rnd(-.2,.2),-.3,18,'#ffec6a',1,0);}
      else{sp=.3;if(e.anim%14===0)spawn(e.x+rnd(0,12),e.y+rnd(0,6),0,-.2,18,'#fff6b0',1,0);}}
    walk(sp);}
  else if(e.t==='lady')walk(.3);
  else if(e.t==='bat')updBat(e);
  else if(e.t==='bee'){e.x+=e.dir*.55;e.y=e.y0+Math.sin(e.anim*.07)*12;if(Math.abs(e.x-e.x0)>e.range)e.dir*=-1;}
  else if(e.t==='beetle'){
    const dx=pl.x+pl.w/2-(e.x+e.w/2);
    if(e.state==='charge'){e.vx=e.dir*2.1;gravMove(e);
      if(e.anim%3===0)spawn(e.x+e.w/2-e.dir*11,e.y+e.h,-e.dir*.5,-.3,16,'#e6d2b2',1,.02);
      if(--e.timer<=0||e.hitX){e.state='rest';e.timer=55;shake=Math.max(shake,e.hitX?4:2);if(e.hitX)burst(e.x+e.w/2+e.dir*11,e.y+6,8,['#fff','#ffec6a'],1.4,18,.06);}}
    else if(e.state==='wind'){e.vx=0;gravMove(e);   // winds up: paws the ground and snorts before the charge
      if(e.anim%3===0)spawn(e.x+e.w/2+e.dir*9,e.y+e.h-1,-e.dir*.9,-.9,16,'#e6d2b2',1,.05);
      if(e.anim%5===0)spawn(e.x+e.w/2+e.dir*11,e.y+5,e.dir*.5,-.35,14,'#fff',1,-.01);
      if(--e.timer<=0){e.state='charge';e.timer=55;sfx('charge');}}
    else if(e.state==='rest'){e.vx=0;gravMove(e);if(--e.timer<=0)e.state='walk';}
    else{walk(.3);
      if(e.onG&&e.anim%32===0)spawn(e.x+e.w/2-e.dir*6,e.y+e.h,rnd(-.3,.3),-.3,12,'#e6d2b2',1,0);
      if(e.cool<=0&&pl.mode==='norm'&&Math.abs(dx)<110&&Math.abs(pl.y+pl.h-(e.y+e.h))<26){e.dir=sgn(dx)||e.dir;e.state='wind';e.timer=26;e.cool=100;sfx('snort');}}
  }
}

function crumble(tx,ty){
  const st=[[tx,ty]];let n=0;
  while(st.length&&n<24){const p=st.pop();if(tileAt(p[0],p[1])!==5)continue;
    setT(p[0],p[1],0);n++;burst(p[0]*T+8,p[1]*T+8,7,['#c4ad8e','#8a755d','#e6d2b2'],1.6,26,.12);
    st.push([p[0],p[1]-1],[p[0],p[1]+1],[p[0]+1,p[1]],[p[0]-1,p[1]]);}
  if(n){sfx('brk');shake=6;hitstop=Math.max(hitstop,2);haptic(22);}
}
function hostUpdate(e){
  const mx=(K.r?1:0)-(K.l?1:0);G.hostT--;e.hcool--;if(mx)e.dir=mx;
  if(e.t==='lady'&&G.stage===4&&e.charge>0){   // pufferfish: inflated ram
    e.charge--;e.vx=e.dir*3;e.vy=0;
    const tx=Math.floor((e.x+(e.dir>0?e.w+3:-3))/T);
    for(let ty=Math.floor(e.y/T);ty<=Math.floor((e.y+e.h-1)/T);ty++)if(tileAt(tx,ty)===5)crumble(tx,ty);
    moveBody(e);
    for(const o of E){if(o===e||o.dead||o.state==='host')continue;
      if((o.t==='ant'||o.t==='bee'||o.t==='jelly')&&ov(e,o)){o.dead=true;sfx('stomp');burst(o.x+6,o.y+4,8,['#ffd23f','#ff7a2a','#fff'],1.5,22,.1);addDrops(2);}}
    if(e.hitX){e.charge=0;shake=3;sfx('bhit');}
    if(G.t%3===0)spawn(e.x+e.w/2-e.dir*8,e.y+e.h/2,0,-.2,14,'#e8fcff',1,0);
  }else if(e.t==='lady'){
    if(G.stage===4&&hit('b')&&e.hcool<=0){e.charge=26;e.hcool=50;sfx('charge');}
    e.vx=lerp(e.vx,mx*1.5,.15);e.vy=Math.min(e.vy+.1,2.2);

    moveBody(e);if(e.y<0){e.y=0;e.vy=0;}
  }else{

      for(let ty=Math.floor(e.y/T);ty<=Math.floor((e.y+e.h-1)/T);ty++)if(tileAt(tx,ty)===5)crumble(tx,ty);
      e.vy=Math.min(e.vy+.26,5);moveBody(e);
      for(const o of E){if(o===e||o.dead||o.state==='host')continue;
        if((o.t==='ant'||o.t==='bee')&&ov(e,o)){o.dead=true;sfx('stomp');burst(o.x+6,o.y+4,8,['#ffd23f','#ff7a2a','#fff'],1.5,22,.1);addDrops(2);}
        else if(o.t==='lady'&&ov(e,o)&&o.state!=='stun'){o.state='stun';o.timer=100;sfx('stomp');}}
      if(e.hitX){e.charge=0;shake=3;sfx('bhit');}
      if(G.t%3===0)spawn(e.x+e.w/2-e.dir*10,e.y+e.h,0,-.2,14,'#e6d2b2',1,0);
    }else{

    }
  }
  pl.x=e.x+e.w/2-pl.w/2;pl.y=e.y+e.h/2-pl.h/2;

function collectItems(){

/* ---- enemy art (origin bottom-centre, y up is negative) ---- */
function xf(e,flip,fn,ox,oy){
  cx.save();cx.translate(Math.round(e.x+e.w/2-camx+(ox||0)),Math.round(e.y+(flip?0:e.h)-camy+(oy||0)));cx.scale(e.dir||1,flip?-1:1);fn();cx.restore();

function lr(x,y,w,h,c){cx.fillStyle=c;cx.fillRect(x,y,w,h);}
/* ---- river-bank ants: notice -> investigate the last place they saw you -> search ("?") -> give up and go home.
   Sight needs a clear line along the ground (no seeing through walls) and the slime must be on the surface; a landing thud nearby makes them look over. ---- */
function antLine(e,px){const a=Math.floor(Math.min(e.x+e.w/2,px)/T),b=Math.floor(Math.max(e.x+e.w/2,px)/T),r=Math.floor((e.y+3)/T);
  for(let tx=a;tx<=b;tx++)if(solidAt(tx,r))return false;return true;}
function antSees(e){const dx=pl.x+pl.w/2-(e.x+e.w/2);
  return pl.mode==='norm'&&Math.abs(dx)<84&&Math.abs(pl.y-e.y)<28&&antLine(e,pl.x+pl.w/2)&&(e.ai&&e.ai!=='patrol'||sgn(dx)===e.dir);}
function antGo(e,tx,sp){const dx=tx-(e.x+e.w/2);e.dir=sgn(dx)||e.dir;
  if(Math.abs(dx)<5)return true;
  if(e.onG&&!groundAhead(e)){e.vx=0;gravMove(e);return true;}
  e.vx=e.dir*sp;gravMove(e);return !!e.hitX;}
function antAI(e){
  const ai=e.ai||'patrol',see=antSees(e);
  if(e.state!=='walk')return false;
  if(ai==='patrol'){
    if(e.noise!==undefined){e.ai='go';e.tx=e.noise;e.noise=undefined;e.q=40;e.dir=sgn(e.tx-(e.x+e.w/2))||e.dir;return true;}   // "?": what was that thud?
    if(see&&!(e.acd>0)){e.ai='go';e.tx=pl.x+pl.w/2;e.alert=28;e.acd=240;e.q=0;sfx('alert');return true;}                   // "!"
    return false;}
  if(see){if(ai!=='go'){e.alert=28;sfx('alert');}e.ai='go';e.tx=pl.x+pl.w/2;e.q=0;}
  if(e.ai==='go'){if(antGo(e,e.tx,.72)){e.ai='search';e.timer=84;e.q=84;e.vx=0;}return true;}
  if(e.ai==='search'){e.vx=0;gravMove(e);if(e.timer%28===0)e.dir*=-1;if(--e.timer<=0){e.ai='back';e.q=0;}return true;}   // looks both ways under a "?"
  if(e.ai==='back'){if(antGo(e,e.x0+8,.4)){e.ai='patrol';e.acd=90;e.vx=0;}return true;}
  return false;}

    if(Math.abs(e.x+e.w/2-x)<96&&Math.abs(e.y+e.h-y)<26&&antLine(e,x))e.noise=x;}}

      if(r1<.016||r2<.016)c=o.crack;else if((r1<.028||r2<.028)&&hash(x,y)>.55)c=o.crack2;
      f(x,y,1,1,c);}

      const x=Math.floor(hash(k,seed+41)*252)+2,y=Math.floor(hash(k,seed+43)*252)+2,t=k%o.kinds.length,cc=o.kinds[t];

  }
  if(!(G.giant>0))return;

  if(G.t%8===0)spawn(pl.x+rnd(-4,16),pl.y+rnd(-8,10),rnd(-.3,.3),-.5,18,'#bff4f0',1,0);
}

/* natural twinkle: every star keeps its own slow period, its own floor and its own range,

function drawStarsNat(t,boost){
  for(const s of SCST){
    const v=s.base+Math.sin(t*s.sp+s.ph)*s.amp+(boost||0);
    if(v<.2)continue;
    const warm=s.hue>.82;
    const c=v>1.0?'#ffffff':v>.76?(warm?'#fff3d8':'#eaf3ff'):v>.5?(warm?'#d8c9a8':'#b9cdf0'):'#7f93c4';
    RS(s.x,s.y,1,1,c);

  // camera

  // context hints

  let h='';
  if(pl.mode==='cloud')h='X おしっぱなしで あめ ／ A で しずくに もどる';
  else if(pl.mode==='host')h=pl.host&&pl.host.t==='lady'?'A おしっぱなしで はばたき（とべる！）／ Y で ぬけだす':'B で たいあたり ／ A で ジャンプ ／ Y で ぬけだす';
  else if(pl.mode==='seep'||(ch&&ch.mode==='seep'))h='←→↑↓ で つちの なかを すすむ ／ A か うえで ぽんっ ／ つちの したが あいてたら ↓ で ぬける';
  else if(G.msgT>0){G.msgT--;h='ふわりは オレンジの「ひだまりの いし」の うえで X ボタン！';}
  else if(pl.onG&&onHot()&&ctl==='p')h='ひだまりの いし！ X で「ふわり」くもになる';
  else if(G.stage===2&&ITEMS.some(i=>i.gc&&!i.got&&Math.abs(i.x-(pl.x+6))<44&&Math.abs(i.y-(pl.y+6))<34))h='ひかりくも！ B「ぱくっ」で たべると しばらく あたりが ひかる';
  else if(G.giant>0&&pl.mode==='norm')h='ジャイアント！ てきを ふみつぶす・ひびわれた かべも くだく・かわも わたれる（じかんぎれに ちゅうい）';
  else if(G.near>=0)h=SIGNL[G.near].t;
  else if(GATE&&!GATE.open&&pl.x>GATE.zx0&&pl.x<GATE.zx1&&pl.y>GATE.zy0&&pl.y<GATE.zy1)h=puzzleHint();
  else if(ch&&GATE&&!GATE.open)h='「かわる」で ちびと いれかえ ／ Y を ちかくで おすと がったい';

  else if(G.stage===4&&boss&&boss.hp>0&&boss.state!=='dying')h=boss.state==='dizzy'?'いまだ！ ふらふらの あたまを うえから ふめ！':(G.bossHintT>0?(G.bossHintT--,'ゆかの あかい ひょうじは タコの あしが でる ばしょ！ ずっしん つっこんで くるのを よけて かべに ぶつけろ'):'');

  else if(boss&&boss.hp>0&&boss.state!=='dying')h=boss.state==='stuck'?'いまだ！ あたまを ふめ！':'かまが かたに ささった あと、あたまを ふめ！ ／ ありは ぱくっ で かいふく ／ ↓ で しみこめば よけられる';
  if(!h&&G.stage===2&&G.glow<=0&&pl.mode==='norm'&&pl.y>19*T&&!G.arena)h='くらい… ひかりくもを ぱくっ で あたりを てらそう';

function dyingStep(){

    if(d.t>16){d.vy=Math.min(d.vy+.12,4);d.y+=d.vy;const r0=d.rot;d.rot+=.13*d.d;if(Math.floor(d.rot/Math.PI)!==Math.floor(r0/Math.PI))sfx('spinT');}}

  }

function step(){
  if(G.state==='play'&&hitstop>0){hitstop--;shake*=.93;return;}   // freeze-frame on big hits (input stays latched)
  G.t++;
  musicUpd();
  if(G.state==='title'){

  if(boss&&boss.hp>0){
    RS(W/2-26,8,52,7,'#14305f');RS(W/2-25,9,50,5,'#3a0f1a');RS(W/2-25,9,Math.round(50*boss.hp/(boss.hpMax||5)),5,'#ff5a6a');
    const nn=boss.hpMax||5;for(let i=1;i<nn;i++)RS(W/2-25+Math.round(i*50/nn),9,1,5,'#14305f');}
}
function render(){
  if(G.state==='title'||G.state==='intro'){renderScene(0);return;}
  if(G.state==='ending'){renderScene(Math.min(5,1+G.page*2));return;}
  cx.clearRect(0,0,W,H);
  const sx=camx,sy=camy;
  if(shake>.5){camx+=rnd(-1,1)*shake*.5;camy+=rnd(-1,1)*shake*.5;}
  const cv=G.stage===2;
  drawBG(G.t);if(!cv)drawShafts(G.t);drawTiles(G.t);if(G.stage===3)drawWaterfalls(G.t);if(G.stage===4)drawCurrents(G.t);drawDecor();if(cv)drawCaveDecor(G.t);drawWorldObjs(G.t,G.near);if(!cv)drawSecrets(G.t);drawHotIcons(G.t);drawPlateArrows(G.t);drawButterflies();drawTrail();
  if(!cv)for(const it of ITEMS)if(!it.got&&it.x>camx-10&&it.x<camx+W+10){if(it.sec)drawSecretGem(it);else drawItem(it);}
  else for(const it of ITEMS)if(!it.got&&!it.gc&&!it.sec&&it.x>camx-10&&it.x<camx+W+10&&it.y>camy-10&&it.y<camy+H+10)drawItem(it);
  for(const e of E)if(e.x>camx-40&&e.x<camx+W+40)drawE(e);
  drawBoss();drawGoal();drawSpring();drawChibi();drawPlayerG();drawJellyFX();drawPT();
  if(cv){drawDark();drawEmissive(G.t);}
  camx=sx;camy=sy;
  if(G.stage===3)drawJungleFront(G.t);else if(G.stage===4)drawSeaFront(G.t);else if(G.stage===5)drawSpaceFront(G.t);
  drawMotes();drawHUD();
  const sw=el('bS');if(sw.hidden!==!ch)sw.hidden=!ch;
}
let last=0,acc=0;
function frame(t){
  requestAnimationFrame(frame);
  if(!last)last=t;
  let dt=t-last;last=t;if(dt>100)dt=100;acc+=dt;
  const p0=PERF.on?performance.now():0;let n=0;
  while(acc>=16.667){step();acc-=16.667;n++;}
  if(n>0||!PERF.drawn){render();PERF.drawn=1;}
  if(PERF.on)perfTick(dt,performance.now()-p0,n);
}
/* ---- iOS hardening + optional perf meter (open the page with #perf at the end of the URL) ---- */
const PERF={on:/perf/.test(location.hash||''),buf:[],dts:[],drawn:0,n:0,box:null};
function perfTick(dt,ms,steps){
  if(!PERF.box){const d=document.createElement('div');d.style.cssText='position:fixed;left:4px;top:4px;z-index:99;font:11px/1.3 monospace;color:#8bf06a;background:#000a;padding:2px 5px;border-radius:4px;pointer-events:none;white-space:pre';document.body.appendChild(d);PERF.box=d;}
  PERF.buf.push(ms);PERF.dts.push(dt);if(PERF.buf.length>300){PERF.buf.shift();PERF.dts.shift();}
  if(++PERF.n%30===0){const s=PERF.buf.slice().sort((a,b)=>a-b),avg=s.reduce((a,b)=>a+b,0)/s.length,dts=PERF.dts.reduce((a,b)=>a+b,0)/PERF.dts.length;
    PERF.box.textContent='rAF '+(1000/dts).toFixed(0)+'Hz  work avg '+avg.toFixed(2)+'ms  p95 '+s[Math.floor(s.length*.95)].toFixed(2)+'  max '+s[s.length-1].toFixed(1);}
}
function clearInputs(){   // a finger that was lifted while the page was away never sends pointerup: drop everything that might be stuck
  for(const k in K)K[k]=0;for(const k in PR)PR[k]=0;
  dpId=null;dpPrev=0;dp.style.transform='';for(const k in arms)arms[k].classList.remove('on');
  dp.dataset.up=dp.dataset.down=dp.dataset.left=dp.dataset.right='0';dp.classList.remove('pressed');
  for(const id in fbp)delete fbp[id];for(const k in FB)FB[k].classList.remove('on');
  for(const id of['bS','bP'])el(id).classList.remove('on');
}
function pauseNow(){if(G.state==='play'){G.state='pause';el('pauseOv').hidden=false;musicPause();}clearInputs();}


/* ---- controls ---- */
function bindBtn(id,key){
  const b=el(id);
  const on=e=>{e.preventDefault();K[key]=1;PR[key]=1;b.classList.add('on');audioInit();sfx('tick');haptic(8);try{b.setPointerCapture(e.pointerId);}catch(_){}};
  const off=()=>{K[key]=0;b.classList.remove('on');};
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);
  b.addEventListener('lostpointercapture',off);b.addEventListener('contextmenu',e=>e.preventDefault());
}
[['bS','s'],['bP','p']].forEach(p=>bindBtn(p[0],p[1]));
/* face buttons: one container tracks every finger, picks the NEAREST button (no dead gaps) and lets a rolling thumb slide A→B */
const FB={a:el('bA'),b:el('bB'),x:el('bX'),y:el('bY')},fbp={};
let fbR=null;
function fbMeasure(){   // measured once per layout change, not once per touch move
  fbR={};for(const k in FB){const r=FB[k].getBoundingClientRect();fbR[k]={cx:r.left+r.width/2,cy:r.top+r.height/2,r:Math.max(r.width,r.height)*.5+18};}
}
function fbNear(px,py){
  if(!fbR)fbMeasure();
  let best=null,bd=1e9;
  for(const k in fbR){const o=fbR[k],d=Math.hypot(px-o.cx,py-o.cy);if(d<bd){bd=d;best=k;}}
  return best&&bd<=fbR[best].r?best:null;
}
function fbSync(){
  for(const k in FB){
    let on=0;for(const id in fbp)if(fbp[id]===k)on=1;
    const b=FB[k];
    if(on&&!b.classList.contains('on')){K[k]=1;PR[k]=1;b.classList.add('on');b.classList.remove('rip');void b.offsetWidth;b.classList.add('rip');sfx('tick');haptic(12);}
    else if(!on&&b.classList.contains('on')){K[k]=0;b.classList.remove('on');}
  }
}
const btnBox=el('btns');
btnBox.addEventListener('pointerdown',e=>{e.preventDefault();fbMeasure();audioInit();try{btnBox.setPointerCapture(e.pointerId);}catch(_){}fbp[e.pointerId]=fbNear(e.clientX,e.clientY);fbSync();});
btnBox.addEventListener('pointermove',e=>{if(e.pointerId in fbp){fbp[e.pointerId]=fbNear(e.clientX,e.clientY);fbSync();}});
const fbEnd=e=>{delete fbp[e.pointerId];fbSync();};
btnBox.addEventListener('pointerup',fbEnd);btnBox.addEventListener('pointercancel',fbEnd);btnBox.addEventListener('lostpointercapture',fbEnd);
btnBox.addEventListener('contextmenu',e=>e.preventDefault());
el('bH').addEventListener('click',()=>{hapOn=!hapOn;el('bH').textContent=hapOn?'ふるえ ON':'ふるえ OFF';if(hapOn)haptic(25);});
el('bM').addEventListener('click',()=>{audioInit();toggleMute();});
const dp=el('dpad'),arms={l:dp.querySelector('.l'),r:dp.querySelector('.r'),u:dp.querySelector('.u'),d:dp.querySelector('.d')};
let dpId=null,dpPrev=0;
let dpRect=null;
function dpMeasure(){dpRect=dp.getBoundingClientRect();}
function dpSet(e){
  if(!dpRect)dpMeasure();
  const r=dpRect,x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5,ax=Math.abs(x),ay=Math.abs(y);
  const on=.115,off=.055;                       // hysteresis: a thumb drifting toward the centre no longer drops the input
  const ck=(v,held)=>v>(held?off:on);
  K.l=(ck(-x,K.l)&&ax>=ay*(K.l?.45:.55))?1:0;K.r=(ck(x,K.r)&&ax>=ay*(K.r?.45:.55))?1:0;
  K.u=(ck(-y,K.u)&&ay>=ax*(K.u?.45:.55))?1:0;K.d=(ck(y,K.d)&&ay>=ax*(K.d?.45:.55))?1:0;
  for(const k in arms)arms[k].classList.toggle('on',!!K[k]);
  dp.dataset.up=K.u?'1':'0';dp.dataset.down=K.d?'1':'0';dp.dataset.left=K.l?'1':'0';dp.dataset.right=K.r?'1':'0';
  dp.classList.toggle('pressed',!!(K.l||K.r||K.u||K.d));
  const code=K.l+2*K.r+4*K.u+8*K.d;
  if(code!==dpPrev){
    if(code)haptic(6);
    dpPrev=code;
    dp.style.transform=code?'perspective(240px) rotateX('+(-clamp(y,-.5,.5)*16).toFixed(1)+'deg) rotateY('+(clamp(x,-.5,.5)*16).toFixed(1)+'deg)':'';
  }
}
function dpEnd(e){
  if(e.pointerId!==dpId)return;dpId=null;dpPrev=0;K.l=K.r=K.u=K.d=0;dp.style.transform='';for(const k in arms)arms[k].classList.remove('on');
  dp.dataset.up=dp.dataset.down=dp.dataset.left=dp.dataset.right='0';dp.classList.remove('pressed');
}
dp.addEventListener('pointerdown',e=>{e.preventDefault();dpMeasure();dpId=e.pointerId;try{dp.setPointerCapture(e.pointerId);}catch(_){}audioInit();dpSet(e);});
dp.addEventListener('pointermove',e=>{if(e.pointerId===dpId)dpSet(e);});
dp.addEventListener('pointerup',dpEnd);dp.addEventListener('pointercancel',dpEnd);dp.addEventListener('lostpointercapture',dpEnd);
dp.addEventListener('contextmenu',e=>e.preventDefault());

el('startBtn').addEventListener('click',()=>{audioInit();saveClear();introStart();});
el('contBtn').addEventListener('click',()=>{audioInit();const sv=saveGet();if(!sv){introStart();return;}
  G.total=sv.total||0;G.secTotal=sv.sec||0;G.runT=sv.runT||0;G.lives=3;startGame(sv.stage,true);});
el('skipBtn').addEventListener('click',()=>{audioInit();el('introOv').hidden=true;beginRun(1);});
el('endBtn').addEventListener('click',()=>{audioInit();toTitle();});
stageEl.addEventListener('click',e=>{
  if(e.target.closest&&e.target.closest('button'))return;
  audioInit();
  if(G.state==='title')menuGo();
  else if(G.state==='intro')introNext();
  else if(G.state==='ending')endNext();
});
el('resumeBtn').addEventListener('click',()=>{if(G.state==='pause'){G.state='play';el('pauseOv').hidden=true;musicResume();}clearInputs();});
el('againBtn').addEventListener('click',()=>startGame(G.stage,true));
el('nextBtn').addEventListener('click',()=>nextStage());
el('contOvBtn').addEventListener('click',()=>{el('overOv').hidden=true;G.lives=3;startFrom(G.cp);G.state='play';musicPlay('field');});
el('restartBtn').addEventListener('click',()=>{el('overOv').hidden=true;saveClear();beginRun(1);});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseNow();else{clearInputs();audioInit();wakeReq();}});
window.addEventListener('pagehide',pauseNow);window.addEventListener('blur',pauseNow);
window.addEventListener('orientationchange',clearInputs);
// iOS: audio is only unlocked by touchend/click (not pointerdown), and Safari can leave the context 'interrupted'
for(const ev of['touchend','click','keydown'])document.addEventListener(ev,()=>audioInit(),{passive:true});
// no pinch / double-tap zoom, no rubber-band scrolling under the controller
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('touchmove',e=>{if(e.target.closest&&e.target.closest('#stage,#pad,#btns,#dpad,.ov'))e.preventDefault();},{passive:false});
// keep the screen awake while playing (iOS 16.4+, Chrome); harmless where unsupported
let wakeLock=null;function wakeReq(){try{if(navigator.wakeLock&&!document.hidden&&G.state==='play'&&!wakeLock)navigator.wakeLock.request('screen').then(l=>{wakeLock=l;l.addEventListener('release',()=>{wakeLock=null;});}).catch(()=>{});}catch(e){}}
document.addEventListener('pointerdown',wakeReq,{passive:true});

if(document.fonts&&document.fonts.load)document.fonts.load('12px DotGothic16').catch(()=>{});
makeTiles();makeBG();makeCave();makeJungle();makeSea();makeSpace();useTheme(1);resetRun();toTitle();
requestAnimationFrame(frame);
</script>
