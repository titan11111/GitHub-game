const lerp=(a,b,t)=>a+(b-a)*t;
function lsGet(k,d){try{const v=localStorage.getItem(KEY+k);return v===null?d:JSON.parse(v)}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(KEY+k,JSON.stringify(v))}catch(e){}}

/* ============ 音（BGMは既存の4曲を再利用） ============ */
const TRACKS=['The_Longest_Standoff.mp3','Calculated_Strike.mp3','Hard_Target_Lock.mp3','Against_the_Iron_Hour.mp3','Against_the_Iron_Hour.mp3'];
let bgm=null,bgmSrc='',AC=null,acted=false;
function unlock(){
  acted=true;
  try{
    if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C();}
    if(AC&&AC.state==='suspended')AC.resume();
  }catch(e){AC=null}
}
function playBgm(i){
  if(!acted)return;
  try{
    if(!bgm){bgm=new Audio();bgm.loop=true;bgm.volume=.6}
    const s=TRACKS[i];
    if(bgmSrc!==s){bgm.src=s;bgmSrc=s}
    bgm.muted=muted;
    const p=bgm.play();if(p&&p.catch)p.catch(()=>{});
  }catch(e){}
}
function beep(f,d,type,v,slide){
  if(muted||!AC)return;
  try{
    const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'square';o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.linearRampToValueAtTime(f+slide,t+d);
    g.gain.setValueAtTime(v||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);
  }catch(e){}
}
function applyMute(){
  document.getElementById('mute').textContent=muted?'🔇':'🔊';
  if(bgm)bgm.muted=muted;
}

/* ============ 声（Web Audioの合成ボイス。音声ファイルなし＝容量増ゼロ） ============ */
const VOICE={

  tome    :{f:300,type:'triangle',v:.09,d:.11,gap:.09,lp:1900,col:'#b85a68'},
  hajime  :{f:185,type:'square',  v:.035,d:.07,gap:.06,lp:1300,col:'#4f7a52'},
  kunoichi:{f:560,type:'sine',    v:.09,d:.06,gap:.07,lp:3200,col:'#7a5fbf'},
  sasuke  :{f:780,type:'triangle',v:.07,d:.12,gap:.1, lp:3400,col:'#d98a35'},
  kid     :{f:660,type:'triangle',v:.08,d:.085,gap:.07,lp:3000,col:'#4aa0d8'}
};
const SEMI=[0,2,4,7,9,-3,-5];
let voiceAt={};
function voice(who,text,o){
  o=o||{};
  if(muted||!AC||!acted)return;
  const p=VOICE[who];if(!p)return;
  if(AC.currentTime<(voiceAt[who]||0))return;            // 同じ人の声が重ならないように
  const chars=[...text].filter(ch=>!/[\s、。…！？!?♪〜「」]/.test(ch)).slice(0,9);
  if(!chars.length)return;
  const q=/[？?]/.test(text),ex=/[！!]/.test(text),sp=o.speed||1,pm=o.pitch||1;
  let t=AC.currentTime+.02;
  chars.forEach((ch,i)=>{
    const last=i===chars.length-1;
    const semi=SEMI[ch.charCodeAt(0)%7]+(q&&last?5:0)+(ex&&last?3:0)-(i/chars.length)*(q?0:2);
    const f=p.f*pm*Math.pow(2,semi/12),d=p.d/sp;
    try{
      const og=AC.createOscillator(),g=AC.createGain(),lp=AC.createBiquadFilter();
      og.type=p.type;og.frequency.setValueAtTime(f,t);og.frequency.linearRampToValueAtTime(f*(1+(ex?.06:-.04)),t+d);
      lp.type='lowpass';lp.frequency.value=p.lp;
      const v=p.v*(ex&&last?1.5:1);
      g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);
      og.connect(lp);lp.connect(g);g.connect(AC.destination);og.start(t);og.stop(t+d+.02);
    }catch(e){}
    t+=(d+p.gap/sp);
  });
  voiceAt[who]=t;
}
function caw(){   // カラスの「カァ」
  if(muted||!AC||!acted)return;
  try{
    const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain(),lp=AC.createBiquadFilter();
    o.type='sawtooth';o.frequency.setValueAtTime(520,t);o.frequency.exponentialRampToValueAtTime(300,t+.22);
    lp.type='bandpass';lp.frequency.value=1100;lp.Q.value=1.2;
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.09,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.26);
    o.connect(lp);lp.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.28);
  }catch(e){}
}
function slurp(){   // お茶を啜る「ずずっ」
  if(muted||!AC||!acted)return;
  try{
    const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
    o.type='sawtooth';o.frequency.setValueAtTime(90,t);o.frequency.linearRampToValueAtTime(190,t+.5);
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.05,t+.05);g.gain.linearRampToValueAtTime(.02,t+.3);g.gain.exponentialRampToValueAtTime(.0001,t+.55);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.6);
  }catch(e){}
}

function mkSpr(rows,pal){
  const w=Math.max(...rows.map(r=>r.length)),h=rows.length;
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;
  const g=cv.getContext('2d');
  rows.forEach((r,y)=>{for(let x=0;x<r.length;x++){const ch=r[x];if(ch!=='.'&&pal[ch]){g.fillStyle=pal[ch];g.fillRect(x,y,1,1)}}});
  cv._def={rows:rows,pal:pal};
  return cv;
}

  c.drawImage(img,-img.width*sc/2,-img.height*sc*(sy||1),img.width*sc,img.height*sc*(sy||1));c.restore();
}

/* ============ 周回で変わる爺さんたちの色（1周クリアごとに色相をずらす） ============ */
const LAP_HUE=[0,140,260,45,200];

WHO.forEach(n=>{BASE[n]=SPR[n]._def;BASE_COL[n]=VOICE[n].col});
function shiftHex(hex,deg){
  const r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn;
  let h=0,s=0;
  if(d>0){s=d/(1-Math.abs(2*l-1));h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;h*=60;if(h<0)h+=360}
  h=(h+deg)%360;
  if(l>.12&&l<.88)s=Math.max(s,.5);                 // 灰色っぽい服でも色が変わったとわかるように
  const a=s*Math.min(l,1-l),f=n=>{const k=(n+h/30)%12;return l-a*Math.max(-1,Math.min(k-3,9-k,1))};
  const x=v=>Math.round(v*255).toString(16).padStart(2,'0');
  return '#'+x(f(0))+x(f(8))+x(f(4));
}
let tinted=-1;
function applyLap(){
  if(tinted===lap)return;tinted=lap;
  const deg=LAP_HUE[lap%LAP_HUE.length];
  for(const n of WHO){

    SPR[n]=mkSpr(BASE[n].rows,pal);
    VOICE[n].col=deg?shiftHex(BASE_COL[n],deg):BASE_COL[n];
  }
}
const pcol=(n,k)=>SPR[n]._def.pal[k];               // いまの周回の服の色

/* ============ 柿の木（フラットなベクター調。画像ファイルなし） ============
   モデル=富有柿の原木（岐阜県瑞穂市居倉・1820年頃植栽・市天然記念物）。端正な丸い樹冠で、実は最大5つ。 */
const TY0=108,TH=392;                      // 木の画像領域＝世界座標 y=108〜500（幅は画面いっぱい）
const TRUNK='#866240',TRUNK_D='#6e4f32',LEAF_C=['#8a8f3c','#a3a54a','#cbc474'];
const T={cx:247,top:292,bot:490,w0:12,w1:27,lean:0,bend:2,leafN:13,
 limbs:[[243,342,205,320,160,296,9,3],[252,336,292,316,336,296,9,3],[246,312,232,266,222,226,8,3],[250,306,272,262,292,224,8,3],[247,298,246,256,250,208,7,3]],
 crown:[[168,286,46],[328,286,46],[214,228,50],[286,228,50],[247,190,46],[247,262,40]]};
let treeImg=null;
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function flatLeaf(g,x,y,len,ang,col){
  const w=len*.42;
  g.save();g.translate(x,y);g.rotate(ang);g.fillStyle=col;g.beginPath();
  g.moveTo(0,0);g.bezierCurveTo(len*.25,-w,len*.7,-w*.9,len,0);g.bezierCurveTo(len*.7,w*.9,len*.25,w,0,0);g.fill();g.restore();
}
function flatKaki(){
  const cv=document.createElement('canvas');cv.width=32;cv.height=30;const g=cv.getContext('2d');g.scale(1.34,1.34);
  g.fillStyle='#c97435';g.beginPath();                         // 実（上が平ら・下がやや四角い）
  g.moveTo(2,12);g.bezierCurveTo(1,6,6,4.5,12,4.5);g.bezierCurveTo(18,4.5,23,6,22,12);
  g.bezierCurveTo(22,18,17,21.5,12,21.5);g.bezierCurveTo(7,21.5,2,18,2,12);g.fill();
  g.fillStyle='rgba(255,210,140,.28)';g.beginPath();g.ellipse(7.5,10,2.2,3.4,-.5,0,7);g.fill();
  g.fillStyle='#5c8040';g.beginPath();                          // ヘタ（4枚）
  g.moveTo(12,7.5);g.lineTo(5,4.5);g.lineTo(8.5,8.5);g.lineTo(4,10.5);g.lineTo(10,10);g.lineTo(11,14);
  g.lineTo(13.5,10.5);g.lineTo(19.5,12);g.lineTo(15.5,8);g.lineTo(20,5);g.closePath();g.fill();
  g.fillStyle='#8a6a48';g.fillRect(11.2,0,1.6,6.2);              // 枝とつなぐ軸
  g.beginPath();g.ellipse(12,7.6,2,1.2,0,0,7);g.fill();
  return cv;
}
function buildTree(ks){
  const SC=2,R=rng(319);
  const cv=document.createElement('canvas');cv.width=W*SC;cv.height=TH*SC;
  const g=cv.getContext('2d');g.scale(SC,SC);g.translate(0,-TY0);
  const nearKaki=(x,y,r)=>ks.some(k=>Math.hypot(k.x-x,k.y-(y+4))<r||Math.hypot(k.x-x,k.y-8-y)<r);
  const tc=t=>T.cx+T.lean*(1-t)+T.bend*Math.sin(t*3.1);           // t:0=幹の上端 1=根もと
  const tw=t=>lerp(T.w0,T.w1,Math.pow(t,1.7))+(t>.93?(t-.93)*70:0);
  const tx=y=>{const t=clamp((y-T.top)/(T.bot-T.top),0,1);return[tc(t),tw(t)]};
  // 枝のリスト（太枝のみ。実は太枝の真下に短い柄でつく）
  const limbs=T.limbs.slice();
  const leafAt=(x,y,n)=>{for(let i=0;i<n;i++){
    const a=-1.9+R()*3.8,len=22+R()*12;
    flatLeaf(g,x,y,len,a,LEAF_C[Math.floor(R()*3)])}};
  // 1) 奥の葉（樹冠まわりに散らす）
  for(const c of T.crown){
    const n=Math.round(c[2]/7*(T.leafN/7));
    for(let i=0;i<n;i++){
      const a=R()*6.283,d=Math.sqrt(R())*c[2],x=c[0]+Math.cos(a)*d,y=c[1]+Math.sin(a)*d*.85;
      if(nearKaki(x,y,34))continue;
      flatLeaf(g,x,y,24+R()*16,R()*6.283,LEAF_C[Math.floor(R()*3)]);
    }
  }
  // 2) 幹（先細りの多角形＋根もとのすそ広がり）
  g.fillStyle=TRUNK;g.beginPath();
  const N=40,Lp=[],Rp=[];
  for(let i=0;i<=N;i++){const t=i/N,y=lerp(T.top,T.bot,t),c=tc(t),w=tw(t);Lp.push([c-w,y]);Rp.push([c+w,y])}
  g.moveTo(Lp[0][0],Lp[0][1]);for(const p of Lp)g.lineTo(p[0],p[1]);
  const bx=tc(1),bw=tw(1);
  g.lineTo(bx-bw-6,T.bot+3);g.quadraticCurveTo(bx-bw*.4,T.bot-3,bx,T.bot+5);g.quadraticCurveTo(bx+bw*.5,T.bot-2,bx+bw+8,T.bot+3);
  for(let i=N;i>=0;i--)g.lineTo(Rp[i][0],Rp[i][1]);g.closePath();g.fill();
  {
    g.fillStyle=TRUNK_D;g.beginPath();                              // 幹の陰（右側）
    for(let i=0;i<=N;i++){const t=i/N;g.lineTo(tc(t)+tw(t)*.45,lerp(T.top,T.bot,t))}
    for(let i=N;i>=0;i--){const t=i/N;g.lineTo(tc(t)+tw(t),lerp(T.top,T.bot,t))}
    g.closePath();g.fill();
  }
  // 3) 枝（先細り）
  g.fillStyle=TRUNK;
  const bez=(L,t)=>{const u=1-t;return[u*u*L[0]+2*u*t*L[2]+t*t*L[4],u*u*L[1]+2*u*t*L[3]+t*t*L[5]]};
  for(const L of limbs){
    const a=[],b=[];
    for(let i=0;i<=16;i++){
      const t=i/16,p=bez(L,t),q=bez(L,Math.min(1,t+.02)),p0=bez(L,Math.max(0,t-.02));
      const dx=q[0]-p0[0],dy=q[1]-p0[1],d=Math.hypot(dx,dy)||1,w=lerp(L[6],L[7],t)/2;
      a.push([p[0]-dy/d*w,p[1]+dx/d*w]);b.push([p[0]+dy/d*w,p[1]-dx/d*w]);
    }
    g.beginPath();g.moveTo(a[0][0],a[0][1]);for(const p of a)g.lineTo(p[0],p[1]);for(let i=b.length-1;i>=0;i--)g.lineTo(b[i][0],b[i][1]);g.closePath();g.fill();
  }
  // 4) 枝先の葉（太枝の先に2〜4枚。実のヘタの近くは避ける）
  for(const L of T.limbs){const e=bez(L,1);leafAt(e[0],e[1],2+Math.floor(R()*2+T.leafN/6))}
  // 実ごとに、いちばん近い太枝の点から短い柄を下ろし、同じ新梢の葉を2〜3枚つける（柿は新梢の葉のつけ根に実がつく）
  for(const k of ks){
    let best=null,bd=1e9;
    for(const L of T.limbs)for(let i=0;i<=60;i++){const q=bez(L,i/60),d=Math.hypot(q[0]-k.x,q[1]-(k.y-24));if(d<bd){bd=d;best=q}}
    const px=best[0],py=best[1],ex=k.x,ey=k.y-16;
    g.fillStyle=TRUNK;g.beginPath();g.moveTo(px-2,py);g.quadraticCurveTo((px+ex)/2-2,(py+ey)/2-2,ex-1.1,ey);g.lineTo(ex+1.1,ey);g.quadraticCurveTo((px+ex)/2+2,(py+ey)/2-2,px+2,py);g.closePath();g.fill();
    const s=k.x<T.cx?-1:1;
    flatLeaf(g,px,py-1,28,s>0?-.35:-2.8,LEAF_C[1]);
    flatLeaf(g,px,py-1,24,s>0?-1.1:-2.05,LEAF_C[0]);
    flatLeaf(g,px,py-1,22,s>0?-.0:-3.1,LEAF_C[2]);
  }
  // 5) 根もとの落ち葉
  for(let i=0;i<8;i++)flatLeaf(g,T.cx-70+R()*140,T.bot+2+R()*12,16,R()*6.283,['#b8541c','#d9822b','#cbc474'][i%3]);
  treeImg=cv;
}
function drawTreeImg(c){
  if(!treeImg)return;
  c.drawImage(treeImg,0,TY0,W,TH);
  // ひらひら落ちる葉
  for(let i=0;i<5;i++){
    const x=(60+i*67+Math.sin(clock*.9+i*2)*22+clock*(5+i))%W,y=(clock*(13+i*2)+i*97)%330+120;
    flatLeaf(c,x,y,13,clock*1.3+i,i%2?'#cbc474':'#d9822b');
  }
}

/* ============ 敵 ============ */
function makeEnemy(name,st){
  if(name==='grandpa')return mkGrandpa(st);
  if(name==='tome')return mkTome(st.tomeRate||1);
  if(name==='hajime')return mkHajime();
  if(name==='kunoichi')return mkKunoichi();
  return mkSasuke();
}
function crowFlying(){return crow.mode==='fly'}

function mkGrandpa(st){
  return{type:'grandpa',x:170,dir:1,state:'walk',t:0,cd:2.2,a:-50,L:77,
    update(dt){
      const al=world.alert>0,sp=(al?80:34);
      this.t+=dt;
      const hx=this.x+this.dir*6,hy=FEET-34;
      if(this.state==='walk'){
        this.a=-50+Math.sin(clock*7)*10;
        if(al&&crowFlying()){
          const d=crow.x-this.x;this.dir=Math.sign(d)||this.dir;
          if(Math.abs(d)>6)this.x+=this.dir*sp*dt;
        }else{
          this.x+=this.dir*sp*dt;
          if(this.x>260){this.x=260;this.dir=-1}
          if(this.x<110){this.x=110;this.dir=1}
        }
        this.cd-=dt;
        const near=crowFlying()&&Math.hypot(crow.x-hx,crow.y-hy)<this.L+st.trig*(al?1.4:1);
        if(near||this.cd<=0){
          this.state='wind';this.t=0;
          if(crowFlying())this.dir=Math.sign(crow.x-this.x)||this.dir;
          beep(170,.18,'sawtooth',.05,-60);
          voice('grandpa',pick(['せいっ！','とりゃっ！','そこじゃっ！']),{speed:1.2});
        }
      }else if(this.state==='wind'){
        const w=st.wind*(al?.65:1);
        this.a=lerp(-50,125,clamp(this.t/w,0,1));
        if(this.t>=w){this.state='swing';this.t=0;beep(420,.12,'triangle',.05,-250)}
      }else if(this.state==='swing'){
        const dur=.28;
        this.a=lerp(125,-25,clamp(this.t/dur,0,1));
        if(crowFlying()){
          const dx=(crow.x-hx)*this.dir,dy=-(crow.y-hy);
          const r=Math.hypot(dx,dy),ang=Math.atan2(dy,dx)*180/Math.PI;
          if(r<this.L+6&&ang<=132&&ang>=this.a-6)hitCrow('竹箒でバシッ！');
        }
        if(this.t>=dur){this.state='rest';this.t=0}
      }else{
        if(this.t>=.9){this.state='walk';this.t=0;this.cd=2.8}
      }
    },
    draw(c){
      const x=this.x,f=FEET,d=this.dir;
      const bob=this.state==='walk'?(Math.floor(clock*5)%2):0;
      put(c,SPR.grandpa,x,f-bob,3,d<0);
      // 竹箒
      const px=x+d*6,py=f-34,rad=this.a*Math.PI/180;
      const ex=px+Math.cos(rad)*this.L*d,ey=py-Math.sin(rad)*this.L;
      c.strokeStyle='#8a6a3a';c.lineWidth=3;c.beginPath();c.moveTo(px,py);c.lineTo(lerp(px,ex,.72),lerp(py,ey,.72));c.stroke();
      c.strokeStyle='#c9a35a';c.lineWidth=9;c.beginPath();c.moveTo(lerp(px,ex,.72),lerp(py,ey,.72));c.lineTo(ex,ey);c.stroke();
      if(this.state==='wind'){bang(c,x,f-72)}
      // セリフ
      if(world.speechT>0&&this.state==='walk')bubble(c,x,f-80,STAGES[stage].say,VOICE.grandpa.col);
    }};
}

function mkTome(rate){
  const HX=44,HY=438;     // 目の位置
  // 視線ごとの視野（ang=度, half=半角, rng=届く距離）。left/sipは何も見ていない＝隙
  const POSE={
    right:{ang:-32,half:26,rng:330,sweep:9,w:5,min:1.6,max:2.8},   // 柿の木を見張る（木は約-43〜-21°。ゆっくり首をふって端から端まで）
    up   :{ang:-84,half:30,rng:430,w:2,min:1.0,max:1.7},
    left :{ang:180,half:0, rng:0,  w:2,min:.7,max:1.3},
    sip  :{ang:0,  half:0, rng:0,  w:2,min:1.3,max:2.0}
  };
  const pickPose=cur=>{
    const ks=Object.keys(POSE).filter(k=>k!==cur);let tot=0;ks.forEach(k=>tot+=POSE[k].w);
    let r=Math.random()*tot;for(const k of ks){r-=POSE[k].w;if(r<=0)return k}return ks[0];
  };
  const angOf=P=>P.ang+(P.sweep?Math.sin(clock*1.3)*P.sweep:0);
  return{type:'tome',x:44,pose:'right',pt:1.6,meter:0,wasSip:false,
    update(dt){
      this.pt-=dt;
      if(this.pt<=0){
        this.pose=pickPose(this.pose);const P=POSE[this.pose];this.pt=P.min+Math.random()*(P.max-P.min);
        if(this.pose==='sip')slurp();
        else if(this.pose==='left'&&Math.random()<.5)voice('tome','ふんふん',{pitch:.9});
      }
      const P=POSE[this.pose];let seen=false,near=0;
      const visible=crow&&(crow.mode==='fly'||(crow.mode==='perch'&&this.pose==='up'));
      if(P.rng&&visible){
        const dx=crow.x-HX,dy=crow.y-HY,dist=Math.hypot(dx,dy);
        let da=Math.abs(Math.atan2(dy,dx)*180/Math.PI-angOf(P));if(da>180)da=360-da;
        if(dist<P.rng&&da<P.half){seen=true;near=1-dist/P.rng}
      }
      this.seen=seen;
      if(seen)this.meter=Math.min(1,this.meter+rate*(1+near*.7)*dt);
      else this.meter=Math.max(0,this.meter-.8*dt);
      if(this.meter>=1&&world.alert<=0){
        world.alert=4;this.meter=.55;
        say('tome',pick(['あっ！カラスじゃ！','おったぞ！カラスじゃ！','こりゃ！柿どろぼう！']),this.x+22,478-74,1.5,{speed:1.25,pitch:1.1});
        beep(1000,.2,'square',.05,300);
      }
    },
    draw(c){
      const x=this.x,f=478,P=POSE[this.pose];
      // 視野（見ている間だけ）
      if(P.rng&&(phase==='aim'||phase==='fly')){
        const pa=angOf(P),a0=(pa-P.half)*Math.PI/180,a1=(pa+P.half)*Math.PI/180;
        const gr=c.createRadialGradient(HX,HY,10,HX,HY,P.rng);
        const hot=Math.max(this.meter,this.seen?.35:0);
        gr.addColorStop(0,'rgba(255,248,190,'+(.42+.3*hot)+')');gr.addColorStop(1,'rgba(255,248,190,.05)');
        c.fillStyle=gr;c.beginPath();c.moveTo(HX,HY);c.arc(HX,HY,P.rng,a0,a1);c.closePath();c.fill();
        c.strokeStyle='rgba(255,250,200,'+(.5+.3*hot)+')';c.lineWidth=1.5;c.setLineDash([5,5]);c.stroke();c.setLineDash([]);
      }
      put(c,SPR.tome,x,f,3,false);
      // 目：視線の向きを、顔のドットを描き替えて見せる（スプライトは 12x14、1ドット=3px）
      const L=x-18,T=f-42,dot=(cx,cy,col)=>{c.fillStyle=col;c.fillRect(L+cx*3,T+cy*3,3,3)};
      dot(5,4,SK);dot(7,4,SK);
      if(this.pose==='right'){dot(6,4,K0);dot(8,4,K0)}
      else if(this.pose==='up'){dot(5,4,SK);dot(5,3,K0);dot(7,3,K0)}
      else if(this.pose==='left'){for(let yy=3;yy<=5;yy++)for(let xx=4;xx<=8;xx++)dot(xx,yy,'#ece8e0')}   // 後頭部
      else{dot(5,4,'#8a5a3a');dot(7,4,'#8a5a3a')}   // 目を細めてお茶
      if(this.pose==='right'){      // 手をかざして柿の木を見張る
        c.fillStyle=pcol('tome','r');c.fillRect(x+4,f-30,6,12);c.fillRect(x+4,f-38,10,4);
        c.fillStyle=SK;c.fillRect(x+8,f-42,12,5);
      }
      if(this.pose==='sip'){
        c.fillStyle='#fff';c.fillRect(x+7,f-28,12,9);c.fillStyle='#c9b8a0';c.fillRect(x+7,f-28,12,3);   // 湯のみ
        c.fillStyle='rgba(255,255,255,.55)';
        for(let i=0;i<3;i++)c.fillRect(x+9+i*3+Math.sin(clock*4+i)*2,f-36-((clock*14+i*5)%12),2,5);       // 湯気
      }
      // 発見メーター（?が満ちていく）
      if(this.meter>.02&&world.alert<=0){
        const m=this.meter,cx=x+4,cy=f-62;
        c.fillStyle='rgba(20,10,30,.7)';c.beginPath();c.arc(cx,cy,13,0,7);c.fill();
        c.strokeStyle=m>.6?'#ff6a4a':'#ffd13a';c.lineWidth=4;c.beginPath();c.arc(cx,cy,9,-Math.PI/2,-Math.PI/2+m*6.283);c.stroke();
        c.fillStyle='#fff';c.font='bold 12px sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText('?',cx,cy+1);
      }
      if(world.alert>0)bang(c,x+4,f-62);
    }};
}

function mkHajime(){
  return{type:'hajime',x:90,dir:1,state:'walk',t:0,ang:0,len:0,L:340,   // 旧170の2倍。伸びる時間も2倍にして先端の速さは変えない
    update(dt){
      const hx=this.x+this.dir*6,hy=FEET-34;
      this.t+=dt;
      if(this.state==='walk'){
        this.x+=this.dir*24*dt;
        if(this.x>140){this.x=140;this.dir=-1}if(this.x<62){this.x=62;this.dir=1}
        this.len=0;
        if(crowFlying()&&Math.hypot(crow.x-hx,crow.y-hy)<260){
          this.state='wind';this.t=0;
          this.ang=Math.atan2(crow.y-hy,crow.x-hx);
          this.dir=crow.x>=this.x?1:-1;
          beep(150,.2,'sawtooth',.05,-40);
          voice('hajime',pick(['いくぞぉ！','そこだっ！','もらった！']),{speed:1.15});
        }
      }else if(this.state==='wind'){
        // 狙いは予告線として固定
        if(this.t>=.6){this.state='thrust';this.t=0}
      }else if(this.state==='thrust'){
        const o=.24,h=.1,b=.5;
        if(this.t<o)this.len=lerp(10,this.L,this.t/o);
        else if(this.t<o+h)this.len=this.L;
        else this.len=lerp(this.L,10,clamp((this.t-o-h)/b,0,1));
        if(crowFlying()){
          const ux=Math.cos(this.ang),uy=Math.sin(this.ang);
          const rx=crow.x-hx,ry=crow.y-hy;
          const k=clamp(rx*ux+ry*uy,0,this.len);
          if(Math.hypot(rx-ux*k,ry-uy*k)<10)hitCrow('高枝ばさみにチョキン！');
        }
        if(this.t>=o+h+b){this.state='rest';this.t=0}
      }else{this.len=0;if(this.t>=1){this.state='walk';this.t=0}}
    },
    draw(c){
      const x=this.x,f=FEET,d=this.dir,hx=x+d*6,hy=f-34;
      put(c,SPR.hajime,x,f-(this.state==='walk'?Math.floor(clock*4)%2:0),3,d<0);
      const ang=(this.state==='walk'||this.state==='rest')?(d>0?-1.2:-Math.PI+1.2):this.ang;
      const len=(this.state==='walk'||this.state==='rest')?60:Math.max(this.len,30);
      const ex=hx+Math.cos(ang)*len,ey=hy+Math.sin(ang)*len;
      if(this.state==='wind'){ // 予告線
        c.strokeStyle='rgba(255,90,90,.45)';c.setLineDash([6,6]);c.lineWidth=2;
        c.beginPath();c.moveTo(hx,hy);c.lineTo(hx+Math.cos(this.ang)*this.L,hy+Math.sin(this.ang)*this.L);c.stroke();c.setLineDash([]);
        bang(c,x,f-72);
      }
      c.strokeStyle='#9aa4ad';c.lineWidth=3;c.beginPath();c.moveTo(hx,hy);c.lineTo(ex,ey);c.stroke();
      // はさみ刃
      c.strokeStyle='#dfe6ea';c.lineWidth=2.5;
      const sx=Math.cos(ang),sy=Math.sin(ang);
      c.beginPath();c.moveTo(ex,ey);c.lineTo(ex+sx*14-sy*6,ey+sy*14+sx*6);c.moveTo(ex,ey);c.lineTo(ex+sx*14+sy*6,ey+sy*14-sx*6);c.stroke();
    }};
}

function mkKunoichi(){

function drawPath(c){

  c.save();
  c.lineCap='round';c.lineJoin='round';
  c.strokeStyle='rgba(20,10,30,.55)';c.lineWidth=7;c.beginPath();c.moveTo(path[0].x,path[0].y);for(const p of path)c.lineTo(p.x,p.y);c.stroke();
  c.strokeStyle='#ffe28a';c.lineWidth=3;c.setLineDash([2,8]);c.beginPath();c.moveTo(path[0].x,path[0].y);for(const p of path)c.lineTo(p.x,p.y);c.stroke();c.setLineDash([]);
  const e=path[path.length-1],q=path[Math.max(0,path.length-4)];
  const a=Math.atan2(e.y-q.y,e.x-q.x);
  c.fillStyle='#ffe28a';c.beginPath();c.moveTo(e.x+Math.cos(a)*10,e.y+Math.sin(a)*10);
  c.lineTo(e.x+Math.cos(a+2.4)*9,e.y+Math.sin(a+2.4)*9);c.lineTo(e.x+Math.cos(a-2.4)*9,e.y+Math.sin(a-2.4)*9);c.fill();

/* ============ 当たり・演出 ============ */
function hitCrow(msg){
  if(crow.mode!=='fly')return;
  crow.mode='hit';crow.t=0;crow.vy=-120;crow.vx=(Math.random()-.5)*80;
  fx.push({x:crow.x,y:crow.y-20,t:1.2,text:msg});
  if(crow.carry.length){fx.push({x:crow.x,y:crow.y-44,t:1.4,text:'柿を落とした…'});for(const k of crow.carry)kakis.push(k);crow.carry=[]}
  caw();
  beep(220,.35,'sawtooth',.07,-180);
  for(let i=0;i<8;i++)fx.push({x:crow.x,y:crow.y,t:.8,vx:(Math.random()-.5)*160,vy:(Math.random()-.9)*120,feather:true});
}

function launch(){
  if(phase!=='aim'||crow.mode!=='perch'||plen<40||paused)return;
  unlock();
  crow.mode='fly';crow.pi=0;crow.pd=0;attempts++;phase='fly';
  for(const e of enemies){if(e.type==='kunoichi')e.cd=.7;if(e.type==='sasuke')e.cd=Math.min(e.cd,.5)}
  beep(500,.15,'triangle',.06,400);
  refreshBar();
}
function clearPath(){if(phase==='aim'){path=[];plen=0;refreshBar()}}

/* ============ 更新 ============ */
function updateCrow(dt){
  const c=crow;c.t+=dt;
  if(c.mode==='perch'){c.x=PERCH.x;c.y=PERCH.y;c.vx=0;c.vy=0;return}
  if(c.mode==='fly'){
    let rem=SPEED*dt,ox=c.x,oy=c.y;
    while(rem>0&&c.pi<path.length-1){
      const a=path[c.pi],b=path[c.pi+1],sl=Math.hypot(b.x-a.x,b.y-a.y)||.001,left=sl-c.pd;
      if(rem<left){c.pd+=rem;rem=0}else{rem-=left;c.pi++;c.pd=0}
    }
    const atEnd=c.pi>=path.length-1;
    if(!atEnd){
      const a=path[c.pi],b=path[c.pi+1],u=c.pd/(Math.hypot(b.x-a.x,b.y-a.y)||1);
      c.x=lerp(a.x,b.x,u);c.y=lerp(a.y,b.y,u);
      c.vx=(c.x-ox)/dt;c.vy=(c.y-oy)/dt;
    }
    for(let i=kakis.length-1;i>=0;i--){     // 通り道の柿はぜんぶ拾う（欲張るほどリスクも増える）
      const k=kakis[i];
      if(Math.hypot(c.x-k.x,c.y-k.y)<k.r+8){
        kakis.splice(i,1);c.carry.push(k);
        beep(660,.12,'square',.06);setTimeout(()=>beep(990,.2,'square',.06),110);caw();
        fx.push({x:c.x,y:c.y-22,t:.9,text:'柿 +'+c.carry.length});
      }
    }
    if(c.carry.length&&(atEnd||kakis.length===0)){c.mode='got';c.t=0;return}
    if(atEnd){c.mode='ret';c.t=0;fx.push({x:c.x,y:c.y-18,t:1,text:'あー届かない…'});return}
  }else if(c.mode==='hit'){
    c.vy+=620*dt;c.x+=c.vx*dt;c.y=Math.min(c.y+c.vy*dt,GY+6);
    if(c.t>1.0){c.mode='ret';c.t=0}
  }else if(c.mode==='ret'){
    const dx=PERCH.x-c.x,dy=PERCH.y-c.y,d=Math.hypot(dx,dy);
    if(d<8){resetCrow();path=[];plen=0;phase='aim';refreshBar()}
    else{c.vx=dx/d*300;c.vy=dy/d*300;c.x+=c.vx*dt;c.y+=c.vy*dt}
  }else if(c.mode==='got'){
    c.vx=140;c.vy=-120;c.x+=c.vx*dt;c.y+=c.vy*dt;
    if(c.t>.9)finishStage();
  }
}

function update(dt){
  clock+=dt;
  if(phase==='aim'||phase==='fly'){
    timeLeft-=dt;
    world.alert=Math.max(0,world.alert-dt);
    const sp=(clock%9)<3?1:0;
    if(sp&&!world.speechT&&enemies.some(e=>e.type==='grandpa'))voice('grandpa',STAGES[stage].say,{speed:.95});
    world.speechT=sp;
    if(timeLeft<=0&&crow.mode!=='got'){timeLeft=0;return gameOver()}
    const m=spd();
    for(const e of enemies)e.update(dt*m);          // 周回ごとに爺さんたちの時間が速く進む（+50%ずつ）
    for(let i=kunai.length-1;i>=0;i--){
      const k=kunai[i];k.x+=k.vx*dt*m;k.y+=k.vy*dt*m;
      if(crowFlying()&&Math.hypot(crow.x-k.x,crow.y-k.y)<11)hitCrow('クナイが刺さった！'),kunai.splice(i,1);
      else if(k.x<-20||k.x>W+20||k.y<-20||k.y>H+20)kunai.splice(i,1);
    }
    updateCrow(dt);
  }
  for(let i=fx.length-1;i>=0;i--){
    const f=fx[i];f.t-=dt;if(f.feather){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=200*dt}
    if(f.t<=0)fx.splice(i,1);
  }
}

/* ============ 描画ループ ============ */
function render(){
  const c=ctx;
  c.setTransform(DPR*S,0,0,DPR*S,0,0);
  if(phase==='ending'&&end){drawEnding(c);return}
  if(!world){drawScene(c);return}
  drawScene(c);
  for(const k of kakis)drawKaki(c,k);
  for(const e of enemies)e.draw(c);
  for(const k of kunai){
    c.save();c.translate(k.x,k.y);c.rotate(Math.atan2(k.vy,k.vx));
    c.fillStyle='#cfd5da';c.beginPath();c.moveTo(8,0);c.lineTo(-5,-3.5);c.lineTo(-3,0);c.lineTo(-5,3.5);c.fill();
    c.strokeStyle='#222';c.lineWidth=2;c.beginPath();c.arc(-8,0,2.5,0,7);c.stroke();c.restore();
  }
  crow.carry.forEach((k,i)=>{const a=i*1.9;put(c,SPR.kaki,crow.x+5+Math.cos(a)*5,crow.y+22+Math.abs(Math.sin(a))*9+i*2,1,false)});
  const perched=crow.mode==='perch';
  drawCrow(c,crow.x,crow.y,perched?1:crow.vx,crow.vy,Math.sin(clock*(crow.mode==='hit'?4:20)),perched||false,crow.mode==='hit'?crow.t*12:0);
  drawDark(c);
  if(phase==='aim'||phase==='fly')drawPath(c);
  for(const f of fx){
    if(f.feather){c.fillStyle='#15121c';c.fillRect(f.x,f.y,4,2)}
    else{bubble(c,f.x,f.y-((f.t0||1.2)-f.t)*18,f.text,f.who&&VOICE[f.who]?VOICE[f.who].col:null)}
  }
  if(phase==='aim'&&!hinted&&stage===0){
    c.fillStyle='rgba(10,5,25,.7)';c.beginPath();c.roundRect(20,512,320,38,10);c.fill();
    c.fillStyle='#ffe9b0';c.font='bold 13px sans-serif';c.textAlign='center';c.textBaseline='middle';
    c.fillText('画面をなぞって飛ぶ道すじを描こう → とびたつ！',W/2,531);
  }else if(phase==='aim'&&path.length>1&&attempts===0){
    c.fillStyle='rgba(10,5,25,.7)';c.beginPath();c.roundRect(40,512,280,32,10);c.fill();
    c.fillStyle='#ffe9b0';c.font='bold 12px sans-serif';c.textAlign='center';c.textBaseline='middle';
    c.fillText('爺さんの動きを見て、押すタイミングを計ろう',W/2,528);
  }
  drawHUD(c);
}

let last=0;
function frame(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  if(!paused&&(phase==='aim'||phase==='fly'))update(dt);
  else if(!paused){clock+=dt;if(phase==='ending'&&end)updateEnding(dt)}
  render();
  requestAnimationFrame(frame);
}

function endKind(){
  const T=[0,1,2,3,4].reduce((a,j)=>a+(taken[j]||1),0);   // 五日間の合計（各日最低1）= 5〜25
  return{T:T,R:clamp(5-Math.round((T-5)/4),0,5)};          // R=エンディングの木に残る柿（0〜5）
}
function showEnding(){
  const e=endKind();
  end={t:0,R:e.R,T:e.T,done:{},card:false,spit:-9};
  phase='ending';paused=false;
  lap++;lsSet('lap',lap);cleared=0;lsSet('cleared',0);     // 一周クリア：次の周は爺さんたちが+50%速く、色もかわる
  kakis=SLOTS.slice(0,e.R).map(p=>({x:p[0],y:p[1],r:11}));
  world={alert:0,speechT:0};fx=[];kunai=[];
  buildTree(kakis);
  hideOv();refreshBar();
}
const END_SPLIT=7,END_CARD=12.5;
function updateEnding(dt){
  end.t+=dt;
  const E=ENDS[end.R],t=end.t,once=(k,at,fn)=>{if(t>=at&&!end.done[k]){end.done[k]=1;fn()}};
  const gx=190,gy=FEET-70;
  if(t<END_SPLIT){
    E.a.forEach((l,i)=>once('a'+i,l[0],()=>say('grandpa',l[1],gx,gy-E.dy,2.2,l[2])));
    if(E.cheer)for(let i=1;i<5;i++)once('h'+i,.5+i*1.35,()=>voice('grandpa',pick(['やった！','ほいっ！','よっしゃ！']),{speed:1.3,pitch:1.25}));
    if(E.kid)for(let i=0;i<4;i++)once('k'+i,1.2+i*1.7,()=>{const o=orbit(end.t);say('kid',pick(['わーい！','じいじー！','ぐるぐるー','ころんだー！']),clamp(o.x,40,320),FEET-62,1.1,{speed:1.1})});
  }else{
    once('c',END_SPLIT+1.4,slurp);
    once('d',END_SPLIT+3.4,slurp);
    if(E.kid)once('e',END_SPLIT+2.2,()=>say('kid','たのしー！',clamp(orbit(end.t).x,40,320),FEET-60,1.1));
    once('f',END_SPLIT+4.6,()=>{
      say('grandpa',E.bsay,gx,gy-14,2.8,{pitch:.9,speed:.85});
      if(E.kid){end.spit=end.t;beep(300,.25,'sawtooth',.06,-220)}     // お茶をぶーっ
    });
  }
  for(let i=fx.length-1;i>=0;i--){fx[i].t-=dt;if(fx[i].t<=0)fx.splice(i,1)}
  if(t>=END_CARD&&!end.card)showEndCard();
}
function orbit(t){   // 孫が爺さんのまわりをぐるぐる（速さにムラ・ぴょんぴょん・ときどきすってんころりん）
  const a=t*2.6+.8*Math.sin(t*1.7),vx=-Math.sin(a);
  const cyc=t%4.6,tum=(cyc>3.6&&cyc<4.3)?(cyc-3.6)/.7:-1;   // 転ぶ（宙返り）
  const hop=tum>=0?Math.sin(tum*Math.PI)*34:Math.abs(Math.sin(t*8))*11;
  const rot=tum>=0?tum*Math.PI*2*(vx<0?-1:1):Math.sin(t*8)*.12;
  return{x:190+Math.cos(a)*78,y:FEET-8+Math.sin(a)*14,front:Math.sin(a)>0,vx:vx,hop:hop,rot:rot,tum:tum};
}
function showEndCard(){
  end.card=true;
  const E=ENDS[end.R],sp=spd().toFixed(1);
  showOv('<h2>おしまい</h2><p class="sub">五日間でカラスがとった柿 <b>'+end.T+'こ</b><br>木に残った柿 <b>'+end.R+'こ</b></p>'+
    '<p>エンディング：<b>'+E.name+'</b></p>'+
    '<p class="sub">残り 5・4・3こ＝ハッピー（孫が来る）／ 2・1・0こ＝さみしい<br>とりすぎず、でも腹は満たせるか。</p>'+
    '<p class="sub">一周クリア！ つぎは <b>'+(lap+1)+'周目</b>。爺さんたちは素早さ <b>×'+sp+'</b>、服の色もかわる…</p>'+
    '<button class="btn" data-act="intro" data-i="0">'+(lap+1)+'周目へ（一日目から）</button><button class="btn g" data-act="title">タイトルへ</button>','ttl');
}
function drawKidAt(c,t){
  const o=orbit(t);
  c.fillStyle='rgba(0,0,0,.25)';c.beginPath();c.ellipse(o.x,o.y+4,Math.max(5,13-o.hop*.2),4,0,0,7);c.fill();
  c.save();c.translate(o.x,o.y+4-o.hop-20);c.rotate(o.rot);
  put(c,SPR.kid,0,20,3,o.vx<0,o.tum>=0?1:(o.hop<1.5?.88:1.06));       // 着地でつぶれ、跳ぶと伸びる
  c.restore();
  if(o.tum>.55){c.fillStyle='#ffd13a';c.font='bold 14px sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText('★',o.x+12,o.y-o.hop-44);c.fillText('✦',o.x-12,o.y-o.hop-50)}   // ぶつけた星
  return o;
}
function drawRain(c,a){
  c.strokeStyle='rgba(190,210,255,'+a+')';c.lineWidth=1;
  for(let i=0;i<46;i++){const x=(i*37+clock*60)%W,y=(i*53+clock*420)%GY;c.beginPath();c.moveTo(x,y);c.lineTo(x-3,y+9);c.stroke()}
}
function drawEnding(c){
  const t=end.t,B=t>=END_SPLIT,R=end.R,E=ENDS[R];
  const sleeve=pcol('grandpa','b'),sleeveD=pcol('grandpa','B');
  drawScene(c);
  for(const q of kakis)drawKaki(c,q);
  // ムード
  if(!B){
    if(R===0){c.fillStyle='rgba(30,40,80,.5)';c.fillRect(0,0,W,GY+2);drawRain(c,.5)}
    else if(R<=2){
      c.fillStyle=R===1?'rgba(30,40,80,.38)':'rgba(40,36,70,.2)';c.fillRect(0,0,W,GY+2);
      if(R===1){c.fillStyle='#8a5a2a';for(let i=0;i<3;i++)c.fillRect((i*120+60+Math.sin(clock*1.5+i)*20)%W,(clock*22+i*90)%GY,5,3)}   // 枯れ葉
    }else{
      for(let i=0;i<22;i++){      // きらきら・紙吹雪
        const x=(i*41+Math.sin(clock*2+i)*14)%W,y=(i*67+clock*(R===4?70:R===3?45:30))%GY;
        c.fillStyle=['#ffd13a','#ff7a6b','#7ad7ff','#b6f06a'][i%4];
        if(R===4)c.fillRect(Math.round(x/3)*3,Math.round(y/3)*3,6,3);
        else{const r=2+Math.abs(Math.sin(clock*4+i))*2;c.fillRect(Math.round(x),Math.round(y),r,r)}
      }
    }
  }else{
    c.fillStyle='rgba(60,20,50,.25)';c.fillRect(0,0,W,GY+2);   // 夕暮れ
    if(R===0)drawRain(c,.3);
  }
  const gx=190,f=FEET;
  const o=orbit(t),fl=E.kid&&o.x<gx;      // 爺さんは孫を目で追う（ぐるぐるで首がせわしない）
  if(E.kid&&!o.front)drawKidAt(c,t);
  // ---- 爺さん
  if(!B){
    if(R===0){
      const sh=Math.sin(t*3)*1.5;
      c.save();c.translate(gx+sh,f);c.rotate(.12);
      put(c,SPR.grandpa,0,0,3,false,.74);c.restore();
      // 頬に手（袖と肌）／縦線（ガーン）
      c.fillStyle=sleeve;c.fillRect(gx-17,f-34,7,14);c.fillRect(gx+10,f-34,7,14);
      c.fillStyle=SK;c.fillRect(gx-15,f-40,6,6);c.fillRect(gx+9,f-40,6,6);
      c.fillStyle='rgba(120,110,200,.85)';for(let i=0;i<5;i++)c.fillRect(gx-15+i*7,f-72,3,12+((i*7)%3)*5);
      c.fillStyle='#7ad7ff';const ty=(t*40)%24;c.fillRect(gx-8,f-62+ty,3,5);c.fillRect(gx+8,f-62+((ty+10)%24),3,5);   // 涙
    }else if(R===1){
      const sh=Math.sin(t*1.6)*1.2;
      c.save();c.translate(gx+sh,f);c.rotate(-.1);put(c,SPR.grandpa,0,0,3,false,.8);c.restore();
      c.fillStyle='rgba(70,70,95,.9)';c.beginPath();c.ellipse(gx,f-84,26,9,0,0,7);c.fill();c.beginPath();c.ellipse(gx-14,f-80,12,7,0,0,7);c.fill();c.beginPath();c.ellipse(gx+15,f-80,13,7,0,0,7);c.fill();   // 頭上のどんより雲
      c.fillStyle='#d6cdf0';c.font='bold 13px sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText('ずーん',gx,f-95+Math.sin(t*2)*2);
      c.fillStyle='rgba(255,255,255,.55)';for(let i=0;i<3;i++){const u=(t*.8+i*.33)%1;c.beginPath();c.arc(gx+20+u*16,f-44-u*26,3+u*5,0,7);c.fill()}   // ため息
    }else if(R===2){
      const nod=Math.floor(t*2.2)%2;
      put(c,SPR.grandpa,gx,f-nod*2,3,false);
      c.fillStyle=sleeveD;c.fillRect(gx-22,f-33-nod*2,44,11);                                  // 組んだ腕
      c.fillStyle=SK;c.fillRect(gx-22,f-33-nod*2,7,7);c.fillRect(gx+15,f-33-nod*2,7,7);
      c.fillStyle='#ffe28a';c.font='bold 13px sans-serif';c.textAlign='center';c.textBaseline='middle';
      if(t>.8)c.fillText('1',gx-6,f-88);if(t>2)c.fillText('2',gx+8,f-88);
    }else if(R===3){
      const st=Math.floor(t*4.5)%2,dx=(st?1:-1)*9,hop=Math.abs(Math.sin(t*9))*7,ay=f-hop;
      c.fillStyle='rgba(0,0,0,.25)';c.beginPath();c.ellipse(gx+dx,f+2,20-hop,5,0,0,7);c.fill();
      put(c,SPR.grandpa,gx+dx,ay,3,st===1);
      c.fillStyle=sleeve;c.fillRect(gx+dx-26,ay-(st?40:68),7,26);c.fillRect(gx+dx+19,ay-(st?68:40),7,26);       // 腕を交互に上げる
      c.fillStyle=SK;c.fillRect(gx+dx-26,ay-(st?48:76),7,8);c.fillRect(gx+dx+19,ay-(st?76:48),7,8);
      c.fillStyle='#ffd13a';c.font='bold 16px sans-serif';c.textAlign='center';c.fillText('♪',gx+40+Math.sin(t*5)*3,f-84-(t*20)%14);c.fillText('♫',gx-40-Math.sin(t*4)*3,f-76-(t*17)%14);
    }else if(R===4){
      const hop=Math.abs(Math.sin(t*4.4))*40;
      put(c,SPR.grandpa,gx,f-hop,3,fl,hop<3?.92:1);
      const ay=f-hop;
      c.fillStyle=sleeve;c.fillRect(gx-26,ay-72,7,28);c.fillRect(gx+19,ay-72,7,28);     // 万歳の腕
      c.fillStyle=SK;c.fillRect(gx-26,ay-80,7,8);c.fillRect(gx+19,ay-80,7,8);
      c.fillStyle='rgba(0,0,0,.25)';c.beginPath();c.ellipse(gx,f+2,22-hop*.25,5,0,0,7);c.fill();
    }else{
      put(c,SPR.grandpa,gx,f,3,fl);
      c.fillStyle=sleeveD;c.fillRect(gx-24,f-32,48,12);                                    // 抱える腕
      // 柿の山
      const pile=[[-18,-34],[-6,-40],[8,-38],[20,-33],[-12,-50],[4,-52],[16,-48],[-2,-64],[-20,-48]];
      pile.forEach((q,i)=>put(c,SPR.kaki,gx+q[0],f+q[1]+4+Math.sin(t*3+i)*.8,1,false));
      c.fillStyle='#ffd13a';c.font='bold 16px sans-serif';c.textAlign='center';c.fillText('♪',gx+34+Math.sin(t*5)*3,f-84-(t*20)%14);
    }
  }else{
    // 縁側でお茶
    c.fillStyle='#6a4a30';c.fillRect(104,f-4,172,10);c.fillStyle='#4a321f';c.fillRect(104,f+6,172,4);
    c.fillStyle='#3a281a';c.fillRect(112,f+10,8,16);c.fillRect(260,f+10,8,16);
    put(c,SPR.grandpa,gx,f-4,3,fl,.82);
    const sip=(Math.sin((t-END_SPLIT)*1.5)>.2);
    const cy=f-(sip?46:30);
    c.fillStyle='#fff';c.fillRect(gx+6,cy,13,10);c.fillStyle='#c9b8a0';c.fillRect(gx+6,cy,13,3);
    c.fillStyle='rgba(255,255,255,.6)';for(let i=0;i<3;i++)c.fillRect(gx+8+i*4+Math.sin(clock*3+i)*2,cy-8-((clock*16+i*6)%14),2,5);
    if(R===0){c.fillStyle='#7ad7ff';const ty=(t*40)%22;c.fillRect(gx-8,f-62+ty,3,5);c.fillRect(gx+8,f-62+((ty+10)%22),3,5)}   // しくしく
    const u=t-end.spit;
    if(u>=0&&u<.9){   // お茶ぶーっ
      c.fillStyle='rgba(190,225,150,.9)';
      for(let i=0;i<16;i++)c.fillRect(gx+16+u*(70+i*9),cy+(i%5-2)*3+170*u*u*(.5+(i%3)*.25)-u*28,3,3);
    }
    if(t>END_SPLIT+4.6){c.fillStyle='#fff';c.font='bold 22px sans-serif';c.textAlign='center';c.textBaseline='middle';
      c.fillText(E.kid?'？':'…',gx+Math.sin(clock*6)*2,f-84-Math.abs(Math.sin(clock*4))*4)}
  }
  if(E.kid&&o.front)drawKidAt(c,t);
  // セリフ
  for(const q of fx){const dy=((q.t0||1.2)-q.t)*10;bubble(c,q.x,q.y-dy,q.text,q.who&&VOICE[q.who]?VOICE[q.who].col:null)}
  // 字幕
  const lines=B?E.b:E.sub;
  const show=B?(t>END_SPLIT+.5?(t>END_SPLIT+3.2?2:1):0):(t>.4?2:0);
  if(show&&!end.card){
    c.fillStyle='rgba(10,5,25,.72)';c.beginPath();c.roundRect(14,516,332,38,10);c.fill();
    c.fillStyle='#ffe9b0';c.font='bold 12px sans-serif';c.textAlign='center';c.textBaseline='middle';
    c.fillText(lines[0],W/2,529);if(show>1)c.fillText(lines[1],W/2,544);
  }
  // 場面転換のフェード
  let fa=0;if(t>END_SPLIT-.5&&t<END_SPLIT)fa=(t-(END_SPLIT-.5))/.5;else if(t>=END_SPLIT&&t<END_SPLIT+.5)fa=1-(t-END_SPLIT)/.5;
  if(fa>0){c.fillStyle='rgba(8,4,18,'+fa+')';c.fillRect(0,0,W,H)}
  if(!end.card){c.fillStyle='rgba(255,255,255,.6)';c.font='10px sans-serif';c.textAlign='right';c.textBaseline='top';c.fillText('タップでスキップ',W-8,6)}
}

/* ============ UI（オーバーレイ） ============ */
const ov=document.getElementById('ov'),card=document.getElementById('card');
function showOv(html,cls){card.innerHTML=html;ov.className='on'+(cls?' '+cls:'')}
function hideOv(){ov.className=''}
function refreshBar(){
  bar.go.disabled=!(phase==='aim'&&crow&&crow.mode==='perch'&&plen>=40);
}

function showTitle(){
  phase='title';paused=false;applyLap();
  playBgm(0);
  let st='';
  for(let i=0;i<5;i++)st+='<button class="st'+(i<cleared?' done':'')+'" data-act="stage" data-i="'+i+'">'+(i+1)+'</button>';
  showOv('<h1>夕暮れカラスの柿どろぼう</h1><p class="sub">〜爺さんと竹箒と、五日間の攻防〜</p>'+
    '<p>日が暮れるまで、あと<b>1分</b>。トリ目で、もうすぐ何も見えなくなる。<br>なぞって飛行ルートを描き、「とびたつ！」で柿をねらえ。</p>'+(lap>0?'<p class="sub"><b>'+(lap+1)+'周目</b> ・ 爺さんたちの素早さ ×'+spd().toFixed(1)+'</p>':'')+
    '<div class="row">'+st+'</div>'+
    '<button class="btn" data-act="stage" data-i="'+Math.min(cleared,4)+'">'+(cleared>0?'つづきから':'はじめる')+'</button>','ttl');
  refreshBar();
}
function showIntro(i){
  phase='intro';applyLap();const s=STAGES[i];
  world=null;
  showOv('<h2>'+s.day+'</h2><p>'+s.line+'</p><div class="who">見張り：'+s.who+'</div>'+
    '<p class="sub">制限時間 1分 ・ 日が暮れるほど視界が狭くなる</p>'+(lap>0?'<p class="sub"><b>'+(lap+1)+'周目</b> ・ 爺さんたちの素早さ ×'+spd().toFixed(1)+'（服の色がかわった）</p>':'')+
    '<button class="btn" data-act="start" data-i="'+i+'">庭をのぞく</button>');
}
function finishStage(){
  const n=crow.carry.length;
  taken[stage]=n;lsSet('taken',taken);
  phase='clear';cleared=Math.max(cleared,stage+1);lsSet('cleared',cleared);refreshBar();
  if(stage===4){showEnding();return}
  showOv('<h2>柿、ゲット！</h2><p>'+STAGES[stage].day+'の収穫は <b>'+n+'こ</b>。とびたち '+attempts+'回、のこり '+Math.ceil(timeLeft)+'秒。</p>'+
    '<p class="sub">とりすぎると、最後に爺さんが泣くかもしれない…</p>'+
    '<p>…しかし、翌日。爺さんは警戒を高めている。</p>'+
    '<button class="btn" data-act="intro" data-i="'+(stage+1)+'">つぎの日へ</button><button class="btn g" data-act="title">タイトルへ</button>');
}
function gameOver(){
  phase='over';refreshBar();
  showOv('<h2>日が暮れた…</h2><p>もう何も見えない。<br>腹ペコのまま、カラスは電線で夜を迎えた。</p>'+
    '<button class="btn" data-act="intro" data-i="'+stage+'">もういちど</button><button class="btn g" data-act="title">タイトルへ</button>');
}
function setPause(p){
  if(p===paused)return;
  if(p&&!(phase==='aim'||phase==='fly'))return;
  paused=p;
  if(p)showOv('<h2>ポーズ中</h2><button class="btn" data-act="resume">つづける</button><button class="btn g" data-act="title">タイトルへ</button>');
  else hideOv();
}

ov.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  unlock();
  const a=b.dataset.act,i=+b.dataset.i;
  if(a==='stage'||a==='intro'){showIntro(i)}
  else if(a==='start'){hideOv();startStage(i)}
  else if(a==='resume'){setPause(false)}
  else if(a==='title'){paused=false;showTitle()}
});
document.getElementById('pause').addEventListener('click',()=>{unlock();setPause(!paused)});
document.getElementById('mute').addEventListener('click',()=>{unlock();muted=!muted;lsSet('mute',muted);applyMute()});
document.getElementById('clr').addEventListener('click',clearPath);
bar.go.addEventListener('click',launch);
document.addEventListener('visibilitychange',()=>{if(document.hidden)setPause(true)});
addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();launch()}
  else if(e.code==='KeyP'||e.code==='Escape')setPause(!paused);
  else if(e.code==='KeyC'||e.code==='Backspace')clearPath();
});

/* ============ 入力（Pointer Events + setPointerCapture） ============ */
function pt(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/S,y:(e.clientY-r.top)/S}}
cv.addEventListener('pointerdown',e=>{
  unlock();
  if(phase==='ending'&&end&&!end.card){end.t=end.t<END_SPLIT?END_SPLIT:END_CARD;return}
  if(phase!=='aim'||paused||!crow||crow.mode!=='perch')return;
  e.preventDefault();
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
  const p=pt(e);drag={x0:p.x,y0:p.y};
  path=[{x:PERCH.x,y:PERCH.y}];plen=0;hinted=true;refreshBar();
});
cv.addEventListener('pointermove',e=>{
  if(!drag)return;
  const p=pt(e);
  const nx=clamp(PERCH.x+(p.x-drag.x0)*GAIN,10,W-10),ny=clamp(PERCH.y+(p.y-drag.y0)*GAIN,40,GY+8);
  const l=path[path.length-1],d=Math.hypot(nx-l.x,ny-l.y);
  if(d>=5&&plen+d<=INK){path.push({x:nx,y:ny});plen+=d;refreshBar()}
});
function endDrag(){drag=null}
cv.addEventListener('pointerup',endDrag);
cv.addEventListener('pointercancel',endDrag);
cv.addEventListener('lostpointercapture',endDrag);

/* ============ リサイズ・起動 ============ */
function resize(){
  const w=document.getElementById('wrap');
  S=Math.min(w.clientWidth/W,w.clientHeight/H);
  DPR=Math.min(window.devicePixelRatio||1,2.5);
  cv.style.width=(W*S)+'px';cv.style.height=(H*S)+'px';
  cv.width=Math.round(W*S*DPR);cv.height=Math.round(H*S*DPR);
}
addEventListener('resize',resize);addEventListener('orientationchange',resize);
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h){this.rect(x,y,w,h)};
}
resetCrow();world=null;enemies=[];kakis=STAGES[0].kaki.map(p=>({x:p[0],y:p[1],r:11}));kunai=[];fx=[];buildTree(kakis);
resize();applyMute();applyLap();showTitle();
requestAnimationFrame(frame);
</script>
</body>
</html>
