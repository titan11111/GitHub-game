<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ころがり急便</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Shippori+Mincho:wght@800&family=Zen+Antique&display=swap">
<style>
/* layout: 全画面3Dの上に「配達伝票」風の紙パネルを重ねる。色は柿色の配達員×苔むした廃村の夕暮れ */
:root{
  color-scheme:dark;
  --ink:#10160f; --ink2:#1b2418; --paper:#efe6cf; --paper-dim:#b9b196;
  --kaki:#f0752b; --moss:#9dbb62; --curse:#9a5cf0; --stamp:#d8362b;
  --line:rgba(239,230,207,.22);
  --news:#d6ccb2; --news-ink:#15110c; --f-news:"Zen Antique","Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --fc-red:#8d1f2b; --fc-gold:#cfa94e; --fc-black:#17171a; --blood:#d4161c;
  --f-horror:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-disp:"Dela Gothic One","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--ink);color:var(--paper);font-family:var(--f-body);font-weight:500;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;filter:saturate(.62) contrast(1.12)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--kaki);outline-offset:2px}

.ov{position:absolute;inset:0;display:grid;place-items:center;padding-block:20px;padding-inline:16px;overflow-y:auto;background:linear-gradient(180deg,rgba(16,22,15,.6),rgba(16,22,15,.88))}
.btn{background:var(--kaki);color:#1a0d04;border:0;border-radius:4px;padding:12px 22px;font-weight:900;font-size:16px;letter-spacing:.06em}
.btn.ghost{background:transparent;color:var(--paper);border:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}

/* title：説明は置かない。闇 → 触れる → 音 → 題字 → ひとこと → ボタン の順に出す */
#title{background:none;padding:0;overflow:hidden}
#title::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 44%,rgba(10,2,3,.38),rgba(4,1,2,.96) 70%)}
#title::after{content:"";position:absolute;inset:0;z-index:1;background:#030101;pointer-events:none;transition:opacity 4.5s ease-out}
#title.open::after{opacity:0}
#gate{position:absolute;inset:0;z-index:3;background:none;border:0;padding:0 16px;font-family:var(--f-horror);font-weight:800;color:var(--paper);text-align:center}
#gate b,#gate small{display:block}
#gate b{font-size:clamp(20px,5.4vw,30px);letter-spacing:.32em;text-indent:.32em;animation:breath 3.2s ease-in-out infinite}
#gate small{margin-top:16px;font-size:12px;letter-spacing:.4em;text-indent:.4em;color:var(--paper-dim)}
#title.open #gate{display:none}
#title .box{position:relative;z-index:2;text-align:center;display:grid;gap:clamp(16px,4vh,30px);justify-items:center;padding:20px 16px;visibility:hidden}
#title.open .box{visibility:visible}
#title .sub{font-family:var(--f-horror);font-weight:800;font-size:clamp(12px,3.2vw,16px);letter-spacing:.7em;text-indent:.7em;color:var(--paper-dim)}
#title h1{position:relative;font-family:var(--f-news);font-weight:400;font-size:clamp(42px,13vw,112px);line-height:1.1;margin:0;color:var(--paper);letter-spacing:.04em;white-space:nowrap;text-shadow:0 0 22px rgba(212,22,28,.75),0 0 70px rgba(212,22,28,.45),0 3px 0 #000}
#title h1 .b{position:absolute;inset:0;color:var(--blood);opacity:0}
#title .omen{margin:0;font-family:var(--f-horror);font-weight:800;font-size:clamp(15px,4vw,21px);letter-spacing:.22em;text-indent:.22em;color:var(--blood);text-shadow:0 0 14px rgba(212,22,28,.6),0 1px 0 #000}
#bStart:focus-visible{outline:1px solid var(--paper-dim);outline-offset:5px}
#bStart{background:rgba(4,1,2,.5);color:var(--paper);border:1px solid var(--blood);border-radius:2px;padding:14px 34px;font-family:var(--f-horror);font-weight:800;font-size:17px;letter-spacing:.4em;text-indent:.4em;box-shadow:0 0 18px rgba(212,22,28,.3),inset 0 0 14px rgba(212,22,28,.14)}
.eye{position:absolute;left:var(--x);top:var(--y);width:5px;height:5px;border-radius:50%;background:var(--blood);box-shadow:15px 0 0 var(--blood),0 0 9px 2px rgba(212,22,28,.8),15px 0 9px 2px rgba(212,22,28,.8);opacity:0}
#title.open .sub{animation:tIn 2.2s .5s both}
#title.open h1{animation:tH 2.6s 1.5s both}
#title.open h1 .a{animation:swA 11s 7s infinite}
#title.open h1 .b{animation:swB 11s 7s infinite}
#title.open .omen{animation:tIn 2.4s 3.6s both}
#title.open #bStart{animation:tIn 1.6s 5s both,beat 1.6s 6.6s infinite}
#title.open .eye{animation:eye 13s var(--d) infinite}
@keyframes breath{0%,100%{opacity:.22}50%{opacity:.95}}
@keyframes tIn{from{opacity:0;transform:translateY(8px);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes tH{0%{opacity:0;transform:scale(1.28);filter:blur(14px)}60%{opacity:1}100%{opacity:1;transform:none;filter:blur(0)}}
@keyframes swA{0%,89%,91%,92.9%,94.6%,100%{opacity:1}90%{opacity:.25}93%,94.5%{opacity:0}}
@keyframes swB{0%,92.9%,94.6%,100%{opacity:0}93%,94.5%{opacity:1}}
@keyframes beat{0%,28%,100%{box-shadow:0 0 18px rgba(212,22,28,.3),inset 0 0 14px rgba(212,22,28,.14)}8%,20%{box-shadow:0 0 38px rgba(212,22,28,.75),inset 0 0 22px rgba(212,22,28,.35)}14%{box-shadow:0 0 22px rgba(212,22,28,.4),inset 0 0 14px rgba(212,22,28,.2)}}
@keyframes eye{0%,8%,62%,100%{opacity:0}16%,40%,44%,56%{opacity:.85}42%{opacity:0}}

/* select */
#select .box{width:min(880px,100%);display:grid;gap:16px}
#select h2,#brief h2{font-family:var(--f-disp);font-weight:400;margin:0;font-size:24px;letter-spacing:.1em}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--ink2);border:1px solid var(--line);border-radius:4px;padding:12px;text-align:left;display:grid;gap:4px;min-width:0}
.tile b{font-family:var(--f-disp);font-weight:400;font-size:18px}
.tile .no{font-family:var(--f-disp);color:var(--kaki);font-size:13px;letter-spacing:.1em}
.tile small{color:var(--paper-dim);font-size:12px}
.tile .bt{font-variant-numeric:tabular-nums;color:var(--moss);font-size:13px}
.tile[disabled]{opacity:.38;cursor:not-allowed}

/* 配達伝票 */
.slip{width:min(520px,100%);background:var(--paper);color:#1d1a12;border-radius:3px;padding:18px 18px 16px;display:grid;gap:12px;box-shadow:0 18px 50px rgba(0,0,0,.55);position:relative}
.slip::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:repeating-linear-gradient(90deg,var(--kaki) 0 14px,transparent 14px 22px)}
.slip h2{color:#1d1a12;font-size:20px;margin-top:6px}
.slip dl{margin:0;display:grid;grid-template-columns:5.5em 1fr;border:2px solid #1d1a12}
.slip dt,.slip dd{margin:0;padding:8px 10px;border-bottom:1px solid #1d1a12;line-height:1.55;min-width:0}
.slip dt{background:#1d1a12;color:var(--paper);font-weight:700;font-size:12px;letter-spacing:.12em;display:flex;align-items:center}
.slip dl>:nth-last-child(-n+2){border-bottom:0}
.slip dd b{font-weight:900}
.slip .btn.ghost{color:#1d1a12;border-color:#1d1a12}
.stamp{position:absolute;right:14px;top:22px;font-family:var(--f-disp);font-size:22px;color:var(--stamp);border:4px solid var(--stamp);border-radius:6px;padding:2px 10px;transform:rotate(9deg);opacity:.9;letter-spacing:.08em}
.stamp.ok{color:#2c7a3d;border-color:#2c7a3d}
.say{font-weight:700;font-size:17px;line-height:1.6}
.say::before{content:"「"}.say::after{content:"」"}

/* HUD */
#hud{position:absolute;inset:0;pointer-events:none;font-variant-numeric:tabular-nums}
#hud .tl{position:absolute;left:12px;top:10px;display:grid;gap:2px;text-shadow:0 2px 6px #000}
#hud .tl b{font-family:var(--f-disp);font-weight:400;font-size:18px}
#hud .tl span{font-size:12px;color:var(--paper)}
#quit{pointer-events:auto;position:absolute;right:12px;top:10px;background:rgba(16,22,15,.6);border:1px solid var(--line);border-radius:4px;padding:6px 10px;font-size:12px}
#race{position:absolute;left:50%;top:52px;transform:translateX(-50%);width:min(520px,calc(100% - 32px));display:grid;gap:5px}
#track{position:relative;height:10px;background:rgba(16,22,15,.7);border:1px solid var(--line);border-radius:6px}
#track i{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:var(--f-disp);font-size:12px}
#mYou{background:var(--kaki);color:#1a0d04;z-index:2}
#mTruck{background:var(--paper);color:var(--stamp);border-radius:4px}
#track::after{content:"客";position:absolute;right:-12px;top:50%;margin-top:-13px;width:24px;height:26px;display:grid;place-items:center;font-family:var(--f-disp);font-size:12px;color:var(--moss)}
#eta{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:700;text-shadow:0 2px 6px #000}
#eta .warn{color:var(--stamp)}
#nav{position:absolute;left:50%;top:104px;transform:translateX(-50%);display:grid;justify-items:center;gap:2px;text-shadow:0 2px 6px #000}
#arrow{width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-bottom:26px solid var(--moss);filter:drop-shadow(0 2px 3px #000)}
#dist{font-weight:900;font-size:15px}
#gauge{position:absolute;left:12px;bottom:182px;width:150px;display:grid;gap:3px;font-size:11px;font-weight:700;letter-spacing:.1em;text-shadow:0 2px 6px #000}
#gauge div{height:8px;background:rgba(16,22,15,.7);border:1px solid var(--line);border-radius:5px;overflow:hidden}
#gbar{display:block;height:100%;width:100%;background:var(--kaki)}
#speed{position:absolute;right:12px;bottom:178px;font-family:var(--f-disp);font-size:22px;text-shadow:0 2px 6px #000}
#speed small{font-family:var(--f-body);font-size:11px;margin-left:3px}
#toast{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%);max-width:calc(100% - 32px);background:rgba(16,22,15,.86);border:1px solid var(--line);border-left:5px solid var(--kaki);padding:10px 16px;font-weight:700;font-size:17px;line-height:1.5;text-align:center}
#big{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-disp);font-size:clamp(80px,26vw,200px);color:var(--paper);text-shadow:0 6px 0 #000}
#curse{position:absolute;inset:0;background:radial-gradient(circle,transparent 35%,rgba(120,60,220,.6));opacity:0;transition:opacity .3s}

/* 不穏 */
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 32%,rgba(0,0,0,.8))}
#wh{position:absolute;font-family:var(--f-horror);font-weight:800;font-size:clamp(18px,4.6vw,30px);color:var(--blood);opacity:0;text-shadow:0 0 12px rgba(212,22,28,.6);white-space:nowrap}
#stk{color:var(--blood);font-family:var(--f-horror);font-weight:800;font-size:14px;min-height:1.2em}
#gong{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-family:var(--f-disp);font-size:clamp(54px,17vw,130px);color:var(--paper);text-shadow:0 5px 0 #000,0 0 30px rgba(0,0,0,.8);opacity:0;white-space:nowrap}
#flash{position:absolute;inset:0;background:var(--paper);opacity:0}
#grain{position:absolute;inset:-64px;opacity:.09;pointer-events:none;animation:gr .5s steps(1) infinite}
@keyframes gr{0%{transform:translate(0,0)}25%{transform:translate(-30px,20px)}50%{transform:translate(20px,-40px)}75%{transform:translate(-50px,-10px)}}
#result{place-items:end center}
@media (prefers-reduced-motion:reduce){#grain,#gate b,#title.open *{animation:none!important}#title::after{transition:none}}
#dread{position:absolute;inset:0;background:radial-gradient(circle,transparent 28%,rgba(150,8,12,.8));opacity:0}
#doom{position:absolute;inset:0;pointer-events:none;display:grid;align-content:end;gap:14px;padding:16px 16px 11%;text-align:center;font-family:var(--f-horror);font-weight:800;background:radial-gradient(circle at 50% 38%,transparent 18%,rgba(18,0,0,.9))}
#dSay{margin:0;font-size:clamp(22px,5.4vw,40px);color:var(--blood);text-shadow:0 0 18px rgba(212,22,28,.7),0 2px 0 #000;animation:shk .09s steps(2) infinite;min-height:1.5em}
#dDoom{margin:0 auto;max-width:30em;font-size:clamp(15px,3.6vw,22px);line-height:1.9;color:var(--paper);text-shadow:0 2px 6px #000;min-height:5.7em}
@keyframes shk{0%{transform:translate(1px,0)}100%{transform:translate(-1px,1px)}}
@media (prefers-reduced-motion:reduce){#dSay{animation:none}}
.slip.dark{background:#160708;color:var(--paper);box-shadow:0 0 70px rgba(212,22,28,.45)}
.slip.dark::before{background:repeating-linear-gradient(90deg,var(--blood) 0 14px,transparent 14px 22px)}
.slip.dark h2{color:var(--blood);font-family:var(--f-horror)}
.slip.dark .say{color:var(--blood);font-family:var(--f-horror)}
.slip.dark dl{border-color:var(--blood)}
.slip.dark dt{background:var(--blood);color:#160708}
.slip.dark dt,.slip.dark dd{border-bottom-color:var(--blood)}
.slip.dark .btn.ghost{color:var(--paper);border-color:var(--line)}

/* 結果＝古い怪奇新聞の紙面（縦書き・右から左へ） */
.news{width:min(600px,100%);display:grid;gap:12px}
.paper{position:relative;writing-mode:vertical-rl;height:min(58vh,440px);overflow-x:auto;overflow-y:hidden;padding:14px 12px;color:var(--news-ink);font-family:var(--f-horror);font-weight:800;
  background:radial-gradient(ellipse at 18% 80%,rgba(90,60,20,.28),transparent 45%),radial-gradient(ellipse at 85% 10%,rgba(90,60,20,.2),transparent 40%),var(--news);
  border:1px solid var(--news-ink);outline:3px double var(--news-ink);outline-offset:-7px;box-shadow:0 18px 50px rgba(0,0,0,.6)}
.mast{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--news-ink);color:var(--news);padding:12px 5px;margin-left:12px;font-family:var(--f-news);font-weight:400}
.mast span{font-size:clamp(24px,6.4vw,34px);letter-spacing:.14em;white-space:nowrap}
.mast small{font-size:11px;letter-spacing:.1em;font-family:var(--f-horror);white-space:nowrap}
.paper h2{font-family:var(--f-news);font-weight:400;font-size:clamp(34px,9.5vw,56px);line-height:1.12;letter-spacing:.03em;margin:0 0 0 10px;padding-left:10px;border-left:3px solid var(--news-ink);color:var(--news-ink);max-height:100%}
.paper .say{font-family:var(--f-horror);font-size:clamp(17px,4.4vw,21px);line-height:1.5;margin:0 0 0 10px;padding-left:10px;border-left:1px solid var(--news-ink)}
.art p{margin:0 0 0 10px;font-size:14.5px;line-height:1.8;text-align:justify;font-weight:800}
.art .note{border:1px solid var(--news-ink);padding:8px 5px;margin-left:0}
.paper .stamp{right:auto;top:auto;left:16px;bottom:16px;writing-mode:horizontal-tb;background:rgba(214,204,178,.75)}
.news.dark .paper{background:radial-gradient(ellipse at 30% 70%,rgba(212,22,28,.22),transparent 55%),#120909;color:#e4d9c0;border-color:var(--blood);outline-color:var(--blood)}
.news.dark .mast{background:var(--blood);color:#120909}
.news.dark h2{color:var(--blood);border-left-color:var(--blood)}
.news.dark .say{color:var(--blood);border-left-color:var(--blood)}
.news.dark .art .note{border-color:var(--blood)}
.news.dark .stamp{background:rgba(18,9,9,.8)}

/* ファミコンコントローラー */
#pad{position:absolute;left:0;right:0;bottom:0;padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.fc{pointer-events:auto;max-width:520px;margin:0 auto;background:var(--fc-red);border-radius:12px;padding:8px;box-shadow:0 6px 0 #4d0f17,0 10px 24px rgba(0,0,0,.6)}
.plate{background:linear-gradient(180deg,#e2c36f,var(--fc-gold));border-radius:6px;padding:10px 16px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}
#dp{position:relative;width:116px;height:116px;touch-action:none;cursor:pointer}
#dp i{position:absolute;background:var(--fc-black);border-radius:5px;box-shadow:0 3px 0 #000}
#dp .h{left:0;right:0;top:38px;height:40px}
#dp .v{top:0;bottom:0;left:38px;width:40px}
#dp b{position:absolute;left:47px;top:47px;width:22px;height:22px;border-radius:50%;background:#33333a;transform:translate(var(--dx,0px),var(--dy,0px))}
.mid{display:flex;justify-content:center;gap:10px;align-self:end;padding-bottom:4px}
.mid button{position:relative;width:44px;height:15px;margin-top:18px;border:0;border-radius:8px;background:#3a3a40;box-shadow:0 2px 0 #000}
.mid button::before,.ab button::after{content:attr(data-l);position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;color:var(--fc-red);font-weight:900;font-size:10px;letter-spacing:.06em}
.mid button::before{bottom:19px}
.ab{display:flex;gap:14px;padding-bottom:18px}
.ab button{position:relative;width:60px;height:60px;border-radius:50%;border:0;background:var(--fc-black);box-shadow:0 4px 0 #000;touch-action:none}
.ab button::after{top:66px;font-size:11px}
.ab button.on{transform:translateY(3px);box-shadow:0 1px 0 #000;background:#35353c}
</style>
<style>body{margin:0}img{max-width:100%}</style>
</head>
<body>

<div id="app">
  <canvas id="c"></canvas>
  <div id="grain"></div>

  <div id="hud" hidden>
    <div id="vig"></div><div id="dread"></div><div id="wh"></div><div id="gong">ゴンッ</div><div id="flash"></div>
    <div class="tl"><b id="hName"></b><span id="hCust"></span></div>
    <button id="quit" type="button">やめる</button>
    <div id="race">
      <div id="track"><i id="mTruck">偽</i><i id="mYou">己</i></div>
      <div id="eta"><span id="hTime">0.0秒</span><span id="hEta"></span></div>
    </div>
    <div id="nav"><div id="arrow"></div><div id="dist"></div><div id="stk"></div></div>
    <div id="gauge">ダッシュ<div><span id="gbar"></span></div></div>
    <div id="speed"><span id="spd">0</span><small>km/h</small></div>
    <div id="curse"></div>
    <div id="toast" hidden></div>
    <div id="big" hidden></div>
  </div>

  <div id="pad" hidden><div class="fc"><div class="plate">
    <div id="dp" role="group" aria-label="十字キー"><i class="h"></i><i class="v"></i><b></b></div>
    <div class="mid"><button id="bSel" type="button" data-l="SELECT" aria-label="SELECT 村をえらぶ"></button><button id="bSta" type="button" data-l="START" aria-label="START 一時停止"></button></div>
    <div class="ab"><button id="bB" type="button" data-l="B ダッシュ" aria-label="B ダッシュ"></button><button id="bA" type="button" data-l="A ジャンプ" aria-label="A ジャンプ"></button></div>
  </div></div></div>
  <div id="doom" hidden><p id="dSay"></p><p id="dDoom"></p></div>

  <section class="ov" id="title">
    <i class="eye" style="--x:9%;--y:24%;--d:6s"></i><i class="eye" style="--x:82%;--y:31%;--d:9.5s"></i><i class="eye" style="--x:16%;--y:76%;--d:12s"></i><i class="eye" style="--x:74%;--y:82%;--d:15.5s"></i>
    <button id="gate" type="button" autofocus><b>お届け物です</b><small>画面に触れる</small></button>
    <div class="box">
      <div class="sub">廃村宛　全十便</div>
      <h1 aria-label="ころがり急便"><span class="a">ころがり急便</span><span class="b" aria-hidden="true">かえれぬ急便</span></h1>
      <p class="omen">受取人は、まだ、そこにいる。</p>
      <button class="btn" id="bStart" type="button">配達に出る</button>
    </div>
  </section>

  <section class="ov" id="select" hidden>
    <div class="box">
      <h2>届け先の廃村</h2>
      <div id="grid"></div>
      <div class="row"><button class="btn ghost" id="bSound" type="button">音：あり</button></div>
    </div>
  </section>

  failP={x:tx,z:tz,h:c.boss?13.4:EYEH[c.t],r:c.t==='wander'?(c.boss?3.2:2.2):c.in?.7:1,gap:Math.max(1,Math.round(d*1.5))};
  world.traverse(o=>{if(o.userData.red)o.visible=true});
  if(c.pr){c.pr.rotation.x=0;c.pr.position.set(0,0,0);if(c.fu)c.fu.visible=false}if(c.h&&c.h.userData.scream){c.h.userData.scream();c.h.userData.hd.rotation.set(0,0,0)}
  const b=Math.atan2(-failDir[0],-failDir[1]);
  dolls.forEach((o,i)=>{const a=b+(i-(dolls.length-1)/2)*.3,r=(8+(i%3)*3.5)*failP.r;o.x=tx+Math.sin(a)*r;o.z=tz+Math.cos(a)*r});
  scene.background.set(0x100203);scene.fog.color.set(0x100203);scene.fog.near=3;scene.fog.far=60*failP.r;hemi.color.set(0xff4a3a);hemi.groundColor.set(0x200000);hemi.intensity=.2;sunL.intensity=.04;lamp.intensity=2.6;
  runner.visible=truck.visible=false;shade.visible=false;stalker.visible=false;stk.on=false;
  failTxt=[c.n.split(' ').pop()+'「'+c.ng+'」',DOOM[c.n]||'荷物は、届かなかった。'];
  $('dSay').textContent='';$('dDoom').textContent='';$('hud').hidden=true;$('pad').hidden=true;$('doom').hidden=false;
  clearTimeout(resT);resT=setTimeout(()=>{if(state!=='end'||endWin!==false)return;$('rSlip').className='news dark';$('rMast').textContent='号外　廃村恐怖新聞';$('rStamp').textContent='受取拒否';$('rStamp').className='stamp';$('rTitle').textContent='荷物、届かず';$('rSay').textContent=c.ng;
    $('rDate').textContent=newsDate();$('rList').innerHTML='<p>【'+S.name+'発】ころがり急便の配達員は'+newsDate().slice(2)+'、'+c.n+'への配達で、偽配達人に先を越された。その差、わずか'+kan(failP.gap)+'メートル。客は受け取りを拒んだ。</p><p>'+failTxt[1]+'　配達員のその後の消息は、わかっていない。</p><p class="note">◆次こそ　道は遠回り。光の柱へ一直線に、下り坂でＢダッシュ。</p>';
    $('rNext').hidden=true;show('result')},7400)}

$('gate').onclick=()=>{audioOn();music('title');$('title').classList.add('open');sfx.whisper();setTimeout(()=>{if(state==='title')$('bStart').focus({preventScroll:true})},5200)};
$('bStart').onclick=()=>{audioOn();goSelect()};

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;anim+=dt;
  drone(state==='end'?endWin===false:mBad&&state!=='title'&&state!=='select'&&state!=='pause');
  if(state==='pause'){renderer.render(scene,cam);requestAnimationFrame(frame);return}
  if(toastT>0){toastT-=dt;if(toastT<=0)$('toast').hidden=true}
  if(state==='count'){const p=Math.ceil(countT);countT-=dt;const n=Math.ceil(countT);if(n!==p){n>0?sfx.tick():sfx.go()}
    $('big').textContent=n>0?n:'出発！';if(countT<=-.5){$('big').hidden=true}
    if(countT<=0&&state==='count'){state='play';pl.upT=0;sfx.bump()}
    stepCusts(0)}
  if(state==='play'){readInput();step(dt);if(TR.eta<8||(stk.on&&stk.d<22)){hbT-=dt;if(hbT<=0){sfx.heart();hbT=.42+TR.eta*.07}}if(countT>-.6){countT-=dt;if(countT<=-.6)$('big').hidden=true}hud()}
  else if(state==='end'){endT+=dt;if(endWin&&endT>3.2&&!winRed){winRed=1;const c=custs[custs.length-1];(c.t==='jizo'?c.st.find(q=>q.real).m:c.g).traverse(o=>{if(o.userData.red)o.visible=true});sfx.whisper()}if(failC){$('dSay').textContent=failTxt[0].slice(0,Math.max(0,((endT-.9)*13)|0));$('dDoom').textContent=failTxt[1].slice(0,Math.max(0,((endT-3.2)*15)|0))}inp.steer=0;inp.thr=endWin&&endT>1.6?1:0;inp.jump=inp.dash=false;stepPlayer(dt);if(endWin===false&&TR.s<TR.total){TR.s=Math.min(TR.total,TR.s+TR.v*dt*.5);placeTruck()}stepCusts(dt)}
  else stepCusts(dt);
  syncMeshes(dt);camera(dt);renderer.render(scene,cam);requestAnimationFrame(frame);
}
(()=>{const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d'),d=g.createImageData(128,128);for(let i=0;i<d.data.length;i+=4){const v=(Math.random()*255)|0;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}g.putImageData(d,0,0);$('grain').style.backgroundImage='url('+c.toDataURL()+')'})();
resize();loadStage(9);state='title';show('title');
window.__g={adv(t){endT+=t},load:loadStage,step,inp,pl,TR,get custs(){return custs},get cur(){return cur},get state(){return state},set state(v){state=v},H,STAGES,get music(){return{cur:mCur,want:mWant,paused:mEl?mEl.paused:null,t:mEl?+mEl.currentTime.toFixed(1):0,gain:mG?+mG.gain.value.toFixed(2):null,bad:mBad}},win:()=>win(),fail:()=>fail()};
requestAnimationFrame(frame);
})();
