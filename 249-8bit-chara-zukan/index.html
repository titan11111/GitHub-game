    <style>
        body {
            font-family: 'DotGothic16', sans-serif;
            background-color: #0f0f1b;
            color: #e0e6ed;
            image-rendering: pixelated;
        }
        .font-pixel {
            font-family: 'Press Start 2P', monospace;
        }
        .pixel-border {
            box-shadow: 
                -4px 0 0 0 #3b82f6,
                4px 0 0 0 #3b82f6,
                0 -4px 0 0 #3b82f6,
                0 4px 0 0 #3b82f6;
        }
        .pixel-card {
            background-color: #181829;
            border: 4px solid #282846;
            transition: all 0.2s ease;
        }
        .pixel-card:hover {
            border-color: #6366f1;
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.2);
        }
        .pixel-canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        /* Custom scrollbar for pixel aesthetic */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }
        ::-webkit-scrollbar-track {
            background: #0f0f1b;
        }
        ::-webkit-scrollbar-thumb {
            background: #3b82f6;
            border-radius: 0px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #60a5fa;
        }
    
/* ===== ファミコン風コントローラー（iOS前提・DOMオーバーレイ型） ===== */
:root{ --fc-pad-h: 190px; }
html,body{ -webkit-text-size-adjust:100%; }
body{ touch-action:manipulation; }
#fcpad{
  position:fixed; left:0; right:0; bottom:0; z-index:9999;
  display:flex; justify-content:center;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.45) 28%,rgba(0,0,0,.72) 100%);
  touch-action:none; -webkit-user-select:none; user-select:none;
  -webkit-tap-highlight-color:transparent;
}
#fcpad *{ touch-action:none; -webkit-user-select:none; user-select:none; }
.fc-shell{
  width:100%; max-width:560px;
  display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:10px;
  background:#c9c5bd; border:3px solid #2b2b2b; border-radius:10px;
  padding:12px 14px; box-shadow:0 6px 0 #1a1a1a, 0 10px 22px rgba(0,0,0,.5);
}
/* --- 十字キー --- */
.fc-dpad{ position:relative; width:min(40vw,136px); height:min(40vw,136px); flex:none; }
.fc-cross{ position:absolute; inset:0; pointer-events:none;
  background:
    linear-gradient(#2e2e2e,#2e2e2e) center/34% 100% no-repeat,
    linear-gradient(#2e2e2e,#2e2e2e) center/100% 34% no-repeat;
  filter:drop-shadow(0 2px 0 #111);
}
.fc-cross::after{ content:""; position:absolute; left:50%; top:50%; width:22%; height:22%;
  transform:translate(-50%,-50%); border-radius:50%; background:#444; box-shadow:inset 0 0 0 2px #1d1d1d; }
.fc-d{ position:absolute; margin:0; padding:0; border:0; background:transparent; cursor:pointer; }
.fc-d.u{ left:33%; top:0; width:34%; height:36%; }
.fc-d.d{ left:33%; bottom:0; width:34%; height:36%; }
.fc-d.l{ left:0; top:33%; width:36%; height:34%; }
.fc-d.r{ right:0; top:33%; width:36%; height:34%; }
.fc-d::before{ content:""; position:absolute; inset:14%; border-radius:3px; background:#f0f0f0; opacity:0; }
.fc-dpad.press-up .fc-d.u::before,
.fc-dpad.press-down .fc-d.d::before,
.fc-dpad.press-left .fc-d.l::before,
.fc-dpad.press-right .fc-d.r::before{ opacity:.22; }
.fc-d:focus-visible{ outline:3px solid #ffd23f; outline-offset:-4px; }
/* --- SELECT / START --- */
.fc-mid{ display:flex; flex-direction:column; gap:8px; align-items:center; justify-content:center; }
.fc-sys{ font:700 11px/1 "DotGothic16",system-ui,sans-serif; letter-spacing:.06em; color:#e8e8e8;
  background:#3a3a3a; border:2px solid #1d1d1d; border-radius:999px;
  padding:7px 14px; min-width:74px; cursor:pointer; box-shadow:0 3px 0 #141414; }
.fc-sys.on{ background:#6a6a6a; }
.fc-sys:active,.fc-sys.press{ transform:translateY(3px); box-shadow:none; }
.fc-sys:focus-visible{ outline:3px solid #ffd23f; outline-offset:2px; }
/* --- A / B --- */
.fc-ab{ display:flex; align-items:center; gap:12px; transform:rotate(-14deg); }
.fc-ab-btn{ width:min(16vw,60px); height:min(16vw,60px); border-radius:50%;
  background:#c0202e; border:3px solid #6d1018; color:#ffe9e9;
  font:700 17px/1 "Press Start 2P","DotGothic16",system-ui,sans-serif;
  cursor:pointer; box-shadow:0 5px 0 #5a0d14; display:flex; align-items:center; justify-content:center; }
.fc-ab-btn.press{ transform:translateY(5px); box-shadow:none; background:#e03a48; }
.fc-ab-btn:focus-visible{ outline:3px solid #ffd23f; outline-offset:3px; }
.fc-hint{ position:absolute; left:0; right:0; top:-24px; text-align:center; pointer-events:none; }
.fc-hint span{ display:inline-block; max-width:94%; padding:3px 10px; border-radius:4px;
  background:rgba(12,10,28,.88); color:#ffe9a8;
  font:12px/1.5 "DotGothic16",system-ui,sans-serif; }
@media (max-height:620px){
  .fc-dpad{ width:104px; height:104px; }
  .fc-ab-btn{ width:48px; height:48px; font-size:14px; }
  .fc-shell{ padding:8px 10px; }
  :root{ --fc-pad-h:150px; }
}
@media (min-width:900px){ #fcpad{ background:none; } }

        /* ---- FCパッド用のページ側調整 ---- */
        body { padding-bottom: calc(var(--fc-pad-h) + 16px); }

        // Web Audio API Synthesizer for 8-bit sound effects
        class RetroAudio {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playBeep(freq = 440, type = 'square', duration = 0.1) {
                if (!appState.soundEnabled) return;
                try {
                    this.init();
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);

                    gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            }

            playSelect() {
                this.playBeep(587.33, 'square', 0.08); // D5
                setTimeout(() => this.playBeep(880, 'square', 0.1), 80); // A5
            }

            playJump() {
                if (!appState.soundEnabled) return;
                try {
                    this.init();
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'square';
                    osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(600, this.ctx.currentTime + 0.15);

                    gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.15);
                } catch(e) {}
            }

            playAttack() {
                if (!appState.soundEnabled) return;
                try {
                    this.init();
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(100, this.ctx.currentTime + 0.1);

                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.1);
                } catch(e) {}
            }
        }

        const audio = new RetroAudio();

        function getPixelColor(charSymbol, paletteName) {
            if (paletteName !== 'default' && PALETTES[paletteName] && PALETTES[paletteName][charSymbol]) {
                return PALETTES[paletteName][charSymbol];
            }
            // Hex color or palette color
            if (charSymbol.startsWith('#')) return charSymbol;
            return COLOR_MAP[charSymbol] || 'transparent';
        }

        // Draw 16x16 Pixel Character to Canvas
        function drawCharacterToCanvas(canvas, gridData, paletteName = 'default', scale = 8, bounceOffset = 0) {
            const ctx = canvas.getContext('2d');
            const size = 16;
            canvas.width = size * scale;
            canvas.height = size * scale;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let r = 0; r < size; r++) {
                const row = gridData[r];
                for (let c = 0; c < size; c++) {
                    const charSymbol = row[c] || '.';
                    const color = getPixelColor(charSymbol, paletteName);

                    if (color !== 'transparent') {
                        ctx.fillStyle = color;
                        // Add slight bounce effect if specified
                        const yPos = (r + bounceOffset) * scale;
                        ctx.fillRect(c * scale, yPos, scale, scale);
                    }
                }
            }
        }

        function renderCharacterGrid() {
            const container = document.getElementById('character-grid');
            container.innerHTML = '';

            CHARACTERS.forEach((char, index) => {
                // Category Filter
                if (appState.currentFilter !== 'all' && char.category !== appState.currentFilter) {
                    return;
                }

                const card = document.createElement('div');
                card.className = 'pixel-card rounded-xl p-3 flex flex-col items-center text-center cursor-pointer relative group';
                card.onclick = () => openEditor(index);

                // Badge Number
                const numBadge = document.createElement('span');
                numBadge.className = 'absolute top-2 left-2 text-[10px] font-pixel text-slate-500 group-hover:text-yellow-400';
                numBadge.textContent = `#${String(char.id).padStart(2, '0')}`;
                card.appendChild(numBadge);

                // Canvas Container
                const canvasBox = document.createElement('div');
                canvasBox.className = 'my-2 bg-slate-950/60 p-2 rounded-lg border border-slate-800 flex items-center justify-center';
                
                const canvas = document.createElement('canvas');
                canvas.className = 'pixel-canvas';
                drawCharacterToCanvas(canvas, char.data, appState.currentPalette, 6);
                canvasBox.appendChild(canvas);
                card.appendChild(canvasBox);

                // Character Name & Desc
                const nameEl = document.createElement('h3');
                nameEl.className = 'text-sm font-bold text-slate-200 group-hover:text-indigo-300 mt-1 truncate w-full';
                nameEl.textContent = char.name;
                card.appendChild(nameEl);

                const descEl = document.createElement('p');
                descEl.className = 'text-[11px] text-slate-400 line-clamp-1 mt-0.5';
                descEl.textContent = char.desc;
                card.appendChild(descEl);

                // Hover edit action label
                const editLabel = document.createElement('div');
                editLabel.className = 'mt-2 text-[10px] text-indigo-400 opacity-0 group-hover:opacity-100 font-bold transition flex items-center gap-1';
                editLabel.innerHTML = '<i class="fas fa-edit"></i> 編集・拡大';
                card.appendChild(editLabel);

                container.appendChild(card);
            });
        }

        function openEditor(index) {
            audio.playSelect();
            appState.editingCharIndex = index;
            const char = CHARACTERS[index];

            // Deep copy 16x16 data
            appState.editingGrid = char.data.map(row => row.split(''));
            appState.history = [JSON.parse(JSON.stringify(appState.editingGrid))];

            document.getElementById('editor-id-badge').textContent = String(char.id).padStart(2, '0');
            document.getElementById('editor-title').textContent = char.name;
            document.getElementById('editor-category').textContent = `カテゴリ: ${getCategoryName(char.category)}`;

            setupEditorPalette();
            renderEditorCanvas();

            document.getElementById('editor-modal').classList.remove('hidden');
        }

        function getCategoryName(cat) {
            switch(cat) {
                case 'hero': return 'ヒーロー/味方';
                case 'monster': return 'モンスター';
                case 'scifi': return 'SF / ロボット';
                case 'animal': return 'アニマル';
                default: return 'その他';
            }
        }

        function setupEditorPalette() {
            const container = document.getElementById('editor-palette');
            container.innerHTML = '';

            const colors = Object.values(COLOR_MAP).filter(c => c !== 'transparent');

            colors.forEach(color => {
                const swatch = document.createElement('button');
                swatch.className = `w-7 h-7 rounded border-2 border-slate-700 transition transform hover:scale-110 ${appState.selectedColor === color ? 'ring-2 ring-yellow-400 border-white' : ''}`;
                swatch.style.backgroundColor = color;
                swatch.onclick = () => {
                    audio.playBeep(600, 'sine', 0.05);
                    appState.selectedColor = color;
                    setupEditorPalette();
                };
                container.appendChild(swatch);
            });
        }

        function renderEditorCanvas() {
            const canvas = document.getElementById('editor-canvas');
            const ctx = canvas.getContext('2d');
            const size = 16;
            const scale = 20; // 320x320

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Checkered Background for Transparency
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    if ((r + c) % 2 === 0) {
                        ctx.fillStyle = '#1e1e30';
                    } else {
                        ctx.fillStyle = '#141424';
                    }
                    ctx.fillRect(c * scale, r * scale, scale, scale);
                }
            }

            // Draw Pixels
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    const symbol = appState.editingGrid[r][c];
                    const color = symbol.startsWith('#') ? symbol : (COLOR_MAP[symbol] || 'transparent');

                    if (color !== 'transparent') {
                        ctx.fillStyle = color;
                        ctx.fillRect(c * scale, r * scale, scale, scale);
                    }

                    // Grid line
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
                    ctx.strokeRect(c * scale, r * scale, scale, scale);
                }
            }
        }

        // Editor Canvas Mouse Interactivity
        let isDrawing = false;

        function handleCanvasPointer(e) {
            const canvas = document.getElementById('editor-canvas');
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const col = Math.floor(x / (rect.width / 16));
            const row = Math.floor(y / (rect.height / 16));

            if (row >= 0 && row < 16 && col >= 0 && col < 16) {
                applyTool(row, col);
            }
        }

        function applyTool(row, col) {
            const grid = appState.editingGrid;
            const targetColor = appState.selectedTool === 'eraser' ? '.' : appState.selectedColor;

            if (appState.selectedTool === 'pen' || appState.selectedTool === 'eraser') {
                if (grid[row][col] !== targetColor) {
                    grid[row][col] = targetColor;
                    audio.playBeep(400 + row * 20, 'square', 0.02);
                    renderEditorCanvas();
                }
            } else if (appState.selectedTool === 'bucket') {
                const startSymbol = grid[row][col];
                if (startSymbol !== targetColor) {
                    floodFill(row, col, startSymbol, targetColor);
                    audio.playBeep(500, 'square', 0.08);
                    saveHistory();
                    renderEditorCanvas();
                }
            }
        }

        function floodFill(r, c, target, replacement) {
            if (r < 0 || r >= 16 || c < 0 || c >= 16) return;
            if (appState.editingGrid[r][c] !== target) return;

            appState.editingGrid[r][c] = replacement;

            floodFill(r + 1, c, target, replacement);
            floodFill(r - 1, c, target, replacement);
            floodFill(r, c + 1, target, replacement);
            floodFill(r, c - 1, target, replacement);
        }

        function saveHistory() {
            appState.history.push(JSON.parse(JSON.stringify(appState.editingGrid)));
            if (appState.history.length > 20) appState.history.shift();
        }

        function openArena() {
            audio.playSelect();
            const modal = document.getElementById('arena-modal');
            modal.classList.remove('hidden');

            const select = document.getElementById('arena-char-select');
            select.innerHTML = '';
            CHARACTERS.forEach((c, idx) => {
                const opt = document.createElement('option');
                opt.value = idx;
                opt.textContent = `${c.id}. ${c.name}`;
                select.appendChild(opt);
            });
            select.value = appState.arenaCharIndex;

            // Reset Physics
            appState.arenaX = 200;
            appState.arenaY = 180;
            appState.arenaVx = 0;
            appState.arenaVy = 0;

            requestAnimationFrame(updateArenaLoop);
        }

        function updateArenaLoop() {
            const modal = document.getElementById('arena-modal');
            if (modal.classList.contains('hidden')) return;

            const canvas = document.getElementById('arena-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 600;
            canvas.height = 300;

            // Physics Update
            appState.arenaX += appState.arenaVx;
            appState.arenaY += appState.arenaVy;

            // Gravity
            if (appState.arenaY < 180) {
                appState.arenaVy += 0.8;
                appState.isJumping = true;
            } else {
                appState.arenaY = 180;
                appState.arenaVy = 0;
                appState.isJumping = false;
            }

            // Friction
            appState.arenaVx *= 0.8;

            // Boundaries
            if (appState.arenaX < 20) appState.arenaX = 20;
            if (appState.arenaX > canvas.width - 50) appState.arenaX = canvas.width - 50;

            // Clear Background
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Ground & Retro Grid Pattern
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0, 240, canvas.width, 60);
            ctx.fillStyle = '#ec4899';
            ctx.fillRect(0, 236, canvas.width, 4);

            // Draw Pixel Stars in Background
            ctx.fillStyle = '#ffffff';
            for (let i = 0; i < 30; i++) {
                const sx = (i * 37) % canvas.width;
                const sy = (i * 19) % 180;
                ctx.fillRect(sx, sy, 2, 2);
            }

            // Draw Character
            const char = CHARACTERS[appState.arenaCharIndex];
            const charCanvas = document.createElement('canvas');
            const bounce = (Math.abs(appState.arenaVx) > 0.5 && !appState.isJumping) ? (Math.sin(Date.now() / 80) > 0 ? -2 : 0) : 0;
            drawCharacterToCanvas(charCanvas, char.data, appState.currentPalette, 3, 0);

            ctx.save();
            if (appState.arenaFacing === 'left') {
                ctx.translate(appState.arenaX + 48, appState.arenaY + bounce);
                ctx.scale(-1, 1);
                ctx.drawImage(charCanvas, 0, 0);
            } else {
                ctx.drawImage(charCanvas, appState.arenaX, appState.arenaY + bounce);
            }
            ctx.restore();

            // Character Name Tag
            ctx.font = '12px "DotGothic16"';
            ctx.fillStyle = '#fef08a';
            ctx.textAlign = 'center';
            ctx.fillText(char.name, appState.arenaX + 24, appState.arenaY - 10);

            requestAnimationFrame(updateArenaLoop);
        }

        function exportSingleImage() {
            audio.playSelect();
            const size = 16;
            const scale = 32; // High res 512x512
            const canvas = document.createElement('canvas');
            canvas.width = size * scale;
            canvas.height = size * scale;
            const ctx = canvas.getContext('2d');

            const grid = appState.editingGrid;
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    const symbol = grid[r][c];
                    const color = symbol.startsWith('#') ? symbol : (COLOR_MAP[symbol] || 'transparent');
                    if (color !== 'transparent') {
                        ctx.fillStyle = color;
                        ctx.fillRect(c * scale, r * scale, scale, scale);
                    }
                }
            }

            const char = CHARACTERS[appState.editingCharIndex];
            const link = document.createElement('a');
            link.download = `8bit_char_${char.id}_${char.name}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        function exportSpriteSheetAll() {
            audio.playSelect();
            const cols = 6;
            const rows = Math.ceil(CHARACTERS.length / cols);
            const pixelSize = 16;
            const scale = 4; // 64x64 per character
            const charWidth = pixelSize * scale;
            const charHeight = pixelSize * scale;

            const canvas = document.createElement('canvas');
            canvas.width = cols * charWidth;
            canvas.height = rows * charHeight;
            const ctx = canvas.getContext('2d');

            CHARACTERS.forEach((char, idx) => {
                const cX = (idx % cols) * charWidth;
                const cY = Math.floor(idx / cols) * charHeight;

                const charCanvas = document.createElement('canvas');
                drawCharacterToCanvas(charCanvas, char.data, appState.currentPalette, scale);
                ctx.drawImage(charCanvas, cX, cY);
            });

            const link = document.createElement('a');
            link.download = `8bit_characters_30_spritesheet.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderCharacterGrid();

            // Category Filter Buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    audio.playSelect();
                    document.querySelectorAll('.filter-btn').forEach(b => {
                        b.classList.remove('bg-indigo-600', 'text-white', 'border-indigo-400');
                        b.classList.add('bg-slate-800', 'text-slate-300', 'border-slate-600');
                    });
                    e.target.classList.remove('bg-slate-800', 'text-slate-300', 'border-slate-600');
                    e.target.classList.add('bg-indigo-600', 'text-white', 'border-indigo-400');

                    appState.currentFilter = e.target.getAttribute('data-category');
                    renderCharacterGrid();
                });
            });

            // Palette Select
            document.getElementById('palette-select').addEventListener('change', (e) => {
                audio.playSelect();
                appState.currentPalette = e.target.value;
                renderCharacterGrid();
            });

            // Sound Toggle
            document.getElementById('btn-sound').addEventListener('click', () => {
                appState.soundEnabled = !appState.soundEnabled;
                const icon = document.getElementById('sound-icon');
                if (appState.soundEnabled) {
                    icon.className = 'fas fa-volume-up text-yellow-400';
                    audio.playSelect();
                } else {
                    icon.className = 'fas fa-volume-mute text-slate-500';
                }
            });

            // Export All Button
            document.getElementById('btn-export-all').addEventListener('click', exportSpriteSheetAll);

            // Arena Modal Trigger
            document.getElementById('btn-arena').addEventListener('click', openArena);
            document.getElementById('close-arena').addEventListener('click', () => {
                document.getElementById('arena-modal').classList.add('hidden');
            });

            // Editor Close
            document.getElementById('close-modal').addEventListener('click', () => {
                // Apply edit back to character data if edited
                if (appState.editingCharIndex !== null && appState.editingGrid) {
                    CHARACTERS[appState.editingCharIndex].data = appState.editingGrid.map(row => row.join(''));
                    renderCharacterGrid();
                }
                document.getElementById('editor-modal').classList.add('hidden');
            });

            // Tools Selection
            document.getElementById('tool-pen').addEventListener('click', () => {
                appState.selectedTool = 'pen';
                updateToolButtons('tool-pen');
            });
            document.getElementById('tool-eraser').addEventListener('click', () => {
                appState.selectedTool = 'eraser';
                updateToolButtons('tool-eraser');
            });
            document.getElementById('tool-bucket').addEventListener('click', () => {
                appState.selectedTool = 'bucket';
                updateToolButtons('tool-bucket');
            });

            function updateToolButtons(activeId) {
                audio.playBeep(500, 'sine', 0.05);
                ['tool-pen', 'tool-eraser', 'tool-bucket'].forEach(id => {
                    const btn = document.getElementById(id);
                    if (id === activeId) {
                        btn.className = 'tool-btn active p-2 bg-indigo-600 text-white rounded text-xs font-bold flex items-center justify-center gap-1';
                    } else {
                        btn.className = 'tool-btn p-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded text-xs font-bold flex items-center justify-center gap-1';
                    }
                });
            }

            // Custom Color Picker
            document.getElementById('custom-color-picker').addEventListener('input', (e) => {
                appState.selectedColor = e.target.value;
                setupEditorPalette();
            });

            // Undo & Reset Buttons
            document.getElementById('btn-undo').addEventListener('click', () => {
                if (appState.history.length > 1) {
                    appState.history.pop();
                    appState.editingGrid = JSON.parse(JSON.stringify(appState.history[appState.history.length - 1]));
                    renderEditorCanvas();
                    audio.playBeep(300, 'sine', 0.05);
                }
            });

            document.getElementById('btn-reset').addEventListener('click', () => {
                const original = CHARACTERS[appState.editingCharIndex].data;
                appState.editingGrid = original.map(row => row.split(''));
                saveHistory();
                renderEditorCanvas();
                audio.playBeep(200, 'sawtooth', 0.1);
            });

            document.getElementById('btn-download-single').addEventListener('click', exportSingleImage);

            // Canvas Interaction Listeners
            const canvas = document.getElementById('editor-canvas');
            canvas.addEventListener('mousedown', (e) => {
                isDrawing = true;
                saveHistory();
                handleCanvasPointer(e);
            });
            canvas.addEventListener('mousemove', (e) => {
                if (isDrawing && appState.selectedTool !== 'bucket') {
                    handleCanvasPointer(e);
                }
            });
            window.addEventListener('mouseup', () => {
                isDrawing = false;
            });

            // Touch events for mobile editor
            canvas.addEventListener('touchstart', (e) => {
                isDrawing = true;
                saveHistory();
                handleCanvasPointer(e.touches[0]);
                e.preventDefault();
            });
            canvas.addEventListener('touchmove', (e) => {
                if (isDrawing && appState.selectedTool !== 'bucket') {
                    handleCanvasPointer(e.touches[0]);
                }
                e.preventDefault();
            });
            canvas.addEventListener('touchend', () => {
                isDrawing = false;
            });

            // Arena Character Switch
            document.getElementById('arena-char-select').addEventListener('change', (e) => {
                appState.arenaCharIndex = parseInt(e.target.value);
                audio.playSelect();
            });

            // Arena Buttons Controls
            document.getElementById('btn-move-left').addEventListener('click', () => {
                appState.arenaVx = -6;
                appState.arenaFacing = 'left';
            });
            document.getElementById('btn-move-right').addEventListener('click', () => {
                appState.arenaVx = 6;
                appState.arenaFacing = 'right';
            });
            document.getElementById('btn-action-jump').addEventListener('click', () => {
                if (!appState.isJumping) {
                    appState.arenaVy = -12;
                    audio.playJump();
                }
            });
            document.getElementById('btn-action-attack').addEventListener('click', () => {
                audio.playAttack();
                appState.arenaVx = appState.arenaFacing === 'right' ? 8 : -8;
            });

            // Keyboard Control for Arena
            window.addEventListener('keydown', (e) => {
                const modal = document.getElementById('arena-modal');
                if (modal.classList.contains('hidden')) return;

                if (e.key === 'ArrowLeft') {
                    appState.arenaVx = -6;
                    appState.arenaFacing = 'left';
                } else if (e.key === 'ArrowRight') {
                    appState.arenaVx = 6;
                    appState.arenaFacing = 'right';
                } else if (e.key === 'ArrowUp' || e.key === ' ') {
                    if (!appState.isJumping) {
                        appState.arenaVy = -12;
                        audio.playJump();
                    }
                } else if (e.key === 'z' || e.key === 'Z') {
                    audio.playAttack();
                    appState.arenaVx = appState.arenaFacing === 'right' ? 8 : -8;
                }
            });
        });
    </script>

    </div>

    <script>
/* ===== FCPad: ファミコン風コントローラー入力層 =====
   ・Pointer Events に一本化し setPointerCapture で押しっぱなしの取りこぼしを防ぐ
   ・down / repeat / up の3フェーズを配信。held(btn) で押下状態も取れる
   ・キーボード: ←→↑↓ / X・Space=A / Z=B / Enter=START / Shift=SELECT           */
const FCPad = (function(){
  const DIRS = ['up','down','left','right'];
  const held = Object.create(null);
  const timers = Object.create(null);
  const subs = [];
  const root = document.getElementById('fcpad');
  const dpad = document.getElementById('fc-dpad');
  const REPEAT_DELAY = 300, REPEAT_EVERY = 95;

  function emit(btn, phase){ for(const f of subs){ try{ f(btn, phase); }catch(e){ console.error(e); } } }
  function visual(btn, on){
    if (DIRS.includes(btn)) { dpad.classList.toggle('press-'+btn, on); return; }
    const el = root.querySelector('[data-fc="'+btn+'"]');
    if (el) el.classList.toggle('press', on);
  }
  function down(btn){
    if (held[btn]) return;
    held[btn] = true; visual(btn, true); emit(btn,'down');
    if (DIRS.includes(btn)) {
      timers[btn] = setTimeout(function tick(){
        if(!held[btn]) return;
        emit(btn,'repeat');
        timers[btn] = setTimeout(tick, REPEAT_EVERY);
      }, REPEAT_DELAY);
    }
  }
  function up(btn){
    if (!held[btn]) return;
    held[btn] = false; visual(btn, false); clearTimeout(timers[btn]); emit(btn,'up');
  }

  root.querySelectorAll('[data-fc]').forEach(el=>{
    const btn = el.dataset.fc;
    el.addEventListener('pointerdown', e=>{
      e.preventDefault();
      try{ el.setPointerCapture(e.pointerId); }catch(_){}
      down(btn);
    });
    const release = e=>{ e.preventDefault(); up(btn); };
    el.addEventListener('pointerup', release);
    el.addEventListener('pointercancel', release);
    el.addEventListener('lostpointercapture', ()=>up(btn));
    el.addEventListener('contextmenu', e=>e.preventDefault());
  });
  window.addEventListener('blur', ()=>Object.keys(held).forEach(up));
  document.addEventListener('visibilitychange', ()=>{ if(document.hidden) Object.keys(held).forEach(up); });

  const KEYMAP = {ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',
                  x:'a',X:'a',' ':'a',z:'b',Z:'b',Enter:'start',Shift:'select'};
  window.addEventListener('keydown', e=>{ const b=KEYMAP[e.key]; if(b && !e.repeat){ e.preventDefault(); down(b); } });
  window.addEventListener('keyup',   e=>{ const b=KEYMAP[e.key]; if(b){ e.preventDefault(); up(b); } });

  return {
    on(fn){ subs.push(fn); },
    held(btn){ return !!held[btn]; },
    hint(text){
      let h = root.querySelector('.fc-hint');
      if(!h){ h = document.createElement('div'); h.className='fc-hint'; root.appendChild(h); }
      h.textContent = ''; if(text){ const sp=document.createElement('span'); sp.textContent=text; h.appendChild(sp); }
    },
    toggleLamp(btn, on){ const el = root.querySelector('[data-fc="'+btn+'"]'); if(el) el.classList.toggle('on', !!on); }
  };
})();

    </script>
    <script>
    /* ===== FCパッドと 8bitキャラ図鑑 のつなぎ =====
       画面ごとに割り当てを切り替える:
         図鑑   … 十字=カード移動 / A=ひらく / B=カテゴリ切替 / START=アリーナ / SELECT=音
         エディタ… 十字=ドットカーソル / A=描く / B=消す / START=閉じる / SELECT=音
         アリーナ… 十字=移動(押しっぱなし) / A=ジャンプ / B=攻撃 / START=閉じる / SELECT=音     */
    window.addEventListener('DOMContentLoaded', () => {
      const $ = id => document.getElementById(id);
      const editorModal = () => $('editor-modal');
      const arenaModal  = () => $('arena-modal');
      const isOpen = el => el && !el.classList.contains('hidden');

      let gridCur = 0;                 // 図鑑カードのカーソル
      let ec = {r:8, c:8};             // エディタのドットカーソル
      const CATS = ['all','hero','monster','scifi','animal'];

      function mode(){
        if (isOpen(arenaModal()))  return 'arena';
        if (isOpen(editorModal())) return 'editor';
        return 'grid';
      }
      function cards(){ return Array.from(document.querySelectorAll('#character-grid .pixel-card')); }
      function cols(){
        const list = cards(); if (list.length < 2) return 1;
        const top = list[0].getBoundingClientRect().top;
        let n = 0; for (const el of list){ if (Math.abs(el.getBoundingClientRect().top - top) < 4) n++; else break; }
        return Math.max(1, n);
      }
      function paintGrid(){
        const list = cards();
        if (!list.length) return;
        gridCur = Math.max(0, Math.min(gridCur, list.length - 1));
        list.forEach((el,i)=>el.classList.toggle('fc-cur', i===gridCur));
        list[gridCur].scrollIntoView({block:'nearest'});
      }
      function moveGrid(dr, dc){
        const list = cards(); if (!list.length) return;
        const w = cols();
        let i = gridCur + dc + dr * w;
        if (i < 0 || i >= list.length) return;
        gridCur = i; audio.playBeep(700,'square',0.03); paintGrid();
      }
      function cycleCategory(){
        const cur = appState.currentFilter;
        const next = CATS[(CATS.indexOf(cur) + 1) % CATS.length];
        const btn = document.querySelector('.filter-btn[data-category="'+next+'"]');
        if (btn) btn.click();
        gridCur = 0; setTimeout(paintGrid, 0);
      }

      /* --- エディタのドットカーソル --- */
      function paintEditorCursor(){
        const canvas = $('editor-canvas'); if (!canvas) return;
        const ctx = canvas.getContext('2d'); const scale = 20;
        ctx.strokeStyle = '#fde047'; ctx.lineWidth = 3;
        ctx.strokeRect(ec.c*scale+1.5, ec.r*scale+1.5, scale-3, scale-3);
        ctx.strokeStyle = '#000'; ctx.lineWidth = 1;
        ctx.strokeRect(ec.c*scale+0.5, ec.r*scale+0.5, scale-1, scale-1);
      }
      const _renderEditorCanvas = renderEditorCanvas;
      window.renderEditorCanvas = function(){ _renderEditorCanvas(); if (isOpen(editorModal())) paintEditorCursor(); };
      renderEditorCanvas = window.renderEditorCanvas;
      function moveEditor(dr, dc){
        ec.r = Math.max(0, Math.min(15, ec.r + dr));
        ec.c = Math.max(0, Math.min(15, ec.c + dc));
        audio.playBeep(620,'square',0.02);
        renderEditorCanvas();
      }

      /* --- アリーナ: 押しっぱなしで走る --- */
      const ARENA_SPEED = 5.2;
      (function arenaHold(){
        if (isOpen(arenaModal())) {
          if (FCPad.held('left'))  { appState.arenaVx = -ARENA_SPEED; appState.arenaFacing = 'left';  }
          if (FCPad.held('right')) { appState.arenaVx =  ARENA_SPEED; appState.arenaFacing = 'right'; }
        }
        requestAnimationFrame(arenaHold);
      })();

      function hint(){
        FCPad.hint({
          grid  : '十字=選ぶ / A=ひらく / B=カテゴリ / START=アリーナ',
          editor: '十字=カーソル / A=描く / B=消す / START=閉じる',
          arena : '十字=移動 / A=ジャンプ / B=攻撃 / START=閉じる'
        }[mode()]);
      }

      FCPad.on((btn, phase) => {
        audio.init && audio.init();
        if (audio.ctx && audio.ctx.state === 'suspended') audio.ctx.resume();
        const m = mode();
        if (phase === 'up') return;

        if (m === 'arena') {
          if (btn === 'left'  && phase === 'down') { appState.arenaVx = -ARENA_SPEED; appState.arenaFacing = 'left';  }
          if (btn === 'right' && phase === 'down') { appState.arenaVx =  ARENA_SPEED; appState.arenaFacing = 'right'; }
          if (btn === 'up' || btn === 'a') { if (phase === 'down' && !appState.isJumping) { appState.arenaVy = -12; audio.playJump(); } }
          if (btn === 'b' && phase === 'down') { audio.playAttack(); appState.arenaVx = appState.arenaFacing === 'right' ? 8 : -8; }
          if (btn === 'start' && phase === 'down') { $('close-arena').click(); setTimeout(hint,0); }
          if (btn === 'select' && phase === 'down') { $('btn-sound').click(); FCPad.toggleLamp('select', appState.soundEnabled); }
          return;
        }

        if (m === 'editor') {
          if (btn === 'up')    moveEditor(-1, 0);
          if (btn === 'down')  moveEditor( 1, 0);
          if (btn === 'left')  moveEditor( 0,-1);
          if (btn === 'right') moveEditor( 0, 1);
          if (btn === 'a' && phase === 'down') { saveHistory(); applyTool(ec.r, ec.c); renderEditorCanvas(); }
          if (btn === 'b' && phase === 'down') {
            const keep = appState.selectedTool; appState.selectedTool = 'eraser';
            saveHistory(); applyTool(ec.r, ec.c); appState.selectedTool = keep; renderEditorCanvas();
          }
          if (btn === 'start' && phase === 'down') { $('close-modal').click(); setTimeout(()=>{paintGrid();hint();},0); }
          if (btn === 'select' && phase === 'down') { $('btn-sound').click(); FCPad.toggleLamp('select', appState.soundEnabled); }
          return;
        }

        // grid
        if (btn === 'up')    moveGrid(-1, 0);
        if (btn === 'down')  moveGrid( 1, 0);
        if (btn === 'left')  moveGrid( 0,-1);
        if (btn === 'right') moveGrid( 0, 1);
        if (phase !== 'down') return;
        if (btn === 'a')      { const el = cards()[gridCur]; if (el) { el.click(); ec = {r:8,c:8}; setTimeout(()=>{renderEditorCanvas();hint();},0); } }
        if (btn === 'b')      cycleCategory();
        if (btn === 'start')  { $('btn-arena').click(); setTimeout(hint,0); }
        if (btn === 'select') { $('btn-sound').click(); FCPad.toggleLamp('select', appState.soundEnabled); }
      });

      // 図鑑の再描画でカーソルが消えるので貼り直す
      const _renderCharacterGrid = renderCharacterGrid;
      window.renderCharacterGrid = function(){ _renderCharacterGrid(); paintGrid(); };
      renderCharacterGrid = window.renderCharacterGrid;

      paintGrid();
      FCPad.toggleLamp('select', appState.soundEnabled);
      hint();
    });
    </script>
</body>
</html>
