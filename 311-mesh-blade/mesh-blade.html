<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>MESH BLADE ぬるぬる剣姫</title>
<style>
:root{
  --bg:#e7e3f6; --panel:#d5cff0; --ink:#1b1736; --btn:#ffffff; --line:#8f86c9; --hot:#e0267f; --cool:#0a8fb0;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#07061a; --panel:#12102b; --ink:#ece8ff; --btn:#211d47; --line:#3b3577; --hot:#ff4fa3; --cool:#4fe0ff;
  }
}
:root[data-theme="dark"]{
  --bg:#07061a; --panel:#12102b; --ink:#ece8ff; --btn:#211d47; --line:#3b3577; --hot:#ff4fa3; --cool:#4fe0ff;
}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;position:relative;
  display:flex;flex-direction:column;
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;
}
#stage{flex:1;min-height:0;position:relative;background:#0a0918}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#pad{
  height:164px;flex:none;display:flex;justify-content:space-between;align-items:center;
  padding:10px 16px;background:var(--panel);border-top:3px solid var(--line);
}
#dpad{display:flex;width:156px;height:84px;border-radius:14px;overflow:hidden;border:3px solid var(--line);background:var(--btn);touch-action:none}
#dpad span{flex:1;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;color:var(--ink);pointer-events:none}
#dpad span+span{border-left:3px solid var(--line)}
#dpad span.on{background:var(--cool);color:#07061a}
#acts{position:relative;width:176px;height:140px}
.btn{
  position:absolute;border-radius:50%;border:3px solid var(--line);background:var(--btn);color:var(--ink);
  font:900 22px/1 inherit;font-family:inherit;display:flex;align-items:center;justify-content:center;
  padding:0;touch-action:none;-webkit-tap-highlight-color:transparent;
}
.btn small{position:absolute;bottom:-16px;left:0;right:0;text-align:center;font-size:10px;font-weight:700;opacity:.75}
.btn.on{background:var(--hot);color:#fff;transform:scale(.94)}
.btn:focus-visible{outline:3px solid var(--cool);outline-offset:2px}
#bAtk{right:0;bottom:22px;width:84px;height:84px;font-size:30px;border-color:var(--hot)}
#bJmp{right:92px;bottom:0;width:62px;height:62px}
#bDsh{right:70px;top:0;width:54px;height:54px;font-size:19px}
@media (max-height:480px){
  #pad{position:absolute;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);background:transparent;border:0;pointer-events:none;height:150px;padding:6px 22px}
  #dpad,.btn{pointer-events:auto;opacity:.62}
}
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div id="pad">
  <div id="dpad" aria-label="左右移動"><span id="dl">◀</span><span id="dr">▶</span></div>
  <div id="acts">
    <button class="btn" id="bDsh" aria-label="ダッシュ">疾<small>ダッシュ</small></button>
    <button class="btn" id="bJmp" aria-label="ジャンプ">跳<small>ジャンプ</small></button>
    <button class="btn" id="bAtk" aria-label="斬る">斬<small>斬る</small></button>
  </div>
</div>
<script>
(()=>{
'use strict';
const cv=document.getElementById('c'),g=cv.getContext('2d');
const TAU=Math.PI*2,PI=Math.PI;
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);};
const mod=(a,n)=>((a%n)+n)%n;
const FONT='"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",system-ui,sans-serif';

/* ---------- 画面 ---------- */
let CW=440,CH=300,SC=1,VW=440,VH=300,DPR=1,GY=216;
function resize(){
  const r=cv.parentElement.getBoundingClientRect();
  if(r.width<2||r.height<2)return;
  DPR=Math.min(window.devicePixelRatio||1,2);
  CW=r.width;CH=r.height;
  cv.width=Math.round(CW*DPR);cv.height=Math.round(CH*DPR);
  SC=Math.min(CW/440,CH/300);VW=CW/SC;VH=CH/SC;GY=VH*0.72;
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,200));

/* ---------- 音 ---------- */
let AC=null,noiseBuf=null;
function au(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}}
  if(AC&&AC.state==='suspended'){try{AC.resume();}catch(e){}}
}
function beep(type,f0,f1,dur,vol){
  if(!AC)return;
  try{
    const t=AC.currentTime,o=AC.createOscillator(),gn=AC.createGain();
    o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
    gn.gain.setValueAtTime(vol,t);gn.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(gn);gn.connect(AC.destination);o.start(t);o.stop(t+dur+0.02);
  }catch(e){}
}
function noise(dur,vol,rate){
  if(!AC)return;
  try{
    if(!noiseBuf){noiseBuf=AC.createBuffer(1,AC.sampleRate*0.4,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
    const t=AC.currentTime,s=AC.createBufferSource(),gn=AC.createGain();
    s.buffer=noiseBuf;s.playbackRate.value=rate||1;
    gn.gain.setValueAtTime(vol,t);gn.gain.exponentialRampToValueAtTime(0.001,t+dur);
    s.connect(gn);gn.connect(AC.destination);s.start(t);s.stop(t+dur+0.02);
  }catch(e){}
}
const SFX={
  slash:n=>{noise(0.12,0.16,1.6+n*0.3);beep('triangle',900+n*200,300,0.09,0.06);},
  hit:()=>{beep('square',240,70,0.1,0.12);noise(0.06,0.14,0.8);},
  kill:()=>{beep('square',520,1040,0.12,0.09);},
  jump:()=>beep('square',330,660,0.1,0.07),
  dash:()=>noise(0.16,0.12,2.4),
  hurt:()=>{beep('sawtooth',220,50,0.3,0.14);noise(0.2,0.12,0.5);},
  wave:()=>{beep('square',440,440,0.08,0.07);setTimeout(()=>beep('square',660,660,0.14,0.07),90);},
  warn:()=>beep('sawtooth',160,320,0.2,0.08)
};

/* ---------- 入力 ---------- */
const keys={l:false,r:false};
const buf={jump:0,atk:0,dash:0};
function press(k){
  au();
  if(k==='l'||k==='r'){keys[k]=true;return;}
  if(state==='title'){startGame();return;}
  if(state==='over'){if(overT>0.8)startGame();return;}
  buf[k]=0.16;
}
function release(k){if(k==='l'||k==='r')keys[k]=false;}
const KM={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',Space:'jump',ArrowUp:'jump',KeyW:'jump',KeyJ:'atk',KeyZ:'atk',Enter:'atk',KeyK:'dash',KeyX:'dash',ShiftLeft:'dash',ShiftRight:'dash'};
window.addEventListener('keydown',e=>{const k=KM[e.code];if(!k)return;e.preventDefault();if(e.repeat)return;press(k);});
window.addEventListener('keyup',e=>{const k=KM[e.code];if(k){e.preventDefault();release(k);}});
function bindBtn(id,k){
  const el=document.getElementById(id);
  el.addEventListener('pointerdown',e=>{e.preventDefault();try{el.setPointerCapture(e.pointerId);}catch(_){ }el.classList.add('on');press(k);});
  const up=e=>{e.preventDefault();el.classList.remove('on');release(k);};
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
  el.addEventListener('contextmenu',e=>e.preventDefault());
}
bindBtn('bAtk','atk');bindBtn('bJmp','jump');bindBtn('bDsh','dash');
(()=>{
  const el=document.getElementById('dpad'),dl=document.getElementById('dl'),dr=document.getElementById('dr');
  let pid=null;
  const set=e=>{const r=el.getBoundingClientRect();const left=e.clientX<r.left+r.width/2;keys.l=left;keys.r=!left;dl.classList.toggle('on',left);dr.classList.toggle('on',!left);};
  const clr=()=>{pid=null;keys.l=keys.r=false;dl.classList.remove('on');dr.classList.remove('on');};
  el.addEventListener('pointerdown',e=>{e.preventDefault();au();pid=e.pointerId;try{el.setPointerCapture(pid);}catch(_){ }set(e);});
  el.addEventListener('pointermove',e=>{if(e.pointerId===pid)set(e);});
  el.addEventListener('pointerup',clr);el.addEventListener('pointercancel',clr);
  el.addEventListener('contextmenu',e=>e.preventDefault());
})();
/* タイトル：ドラッグで目線、タップで開始 */
const look={x:0,y:0,on:false,sx:0,sy:0,st:0};
cv.addEventListener('pointerdown',e=>{e.preventDefault();au();look.on=true;look.sx=e.clientX;look.sy=e.clientY;look.st=performance.now();setLook(e);});
cv.addEventListener('pointermove',e=>{if(look.on||e.pointerType==='mouse')setLook(e);});
cv.addEventListener('pointerup',e=>{
  look.on=false;
  const moved=Math.hypot(e.clientX-look.sx,e.clientY-look.sy),dt=performance.now()-look.st;
  if(moved<10&&dt<350){if(state==='title')startGame();else if(state==='over'&&overT>0.8)startGame();}
});
cv.addEventListener('pointercancel',()=>{look.on=false;});
function setLook(e){
  const r=cv.getBoundingClientRect();
  look.x=clamp(((e.clientX-r.left)/r.width-0.5)*2.6,-1,1);
  look.y=clamp(((e.clientY-r.top)/r.height-0.45)*2.6,-1,1);
  look.last=performance.now();
}

/* ---------- 揺れもの（物理演算） ---------- */
function mkChain(n,len,grav,damp){return{n,len,grav,damp,init:false,p:Array.from({length:n+1},()=>({x:0,y:0,px:0,py:0}))};}
function stepChain(c,ax,ay,s,dt,wind,floor){
  const P=c.p,L=c.len*s;
  if(c.init&&Math.hypot(P[1].x-ax,P[1].y-ay)>L*c.n*3)c.init=false;
  if(!c.init){for(let i=0;i<=c.n;i++){P[i].x=P[i].px=ax;P[i].y=P[i].py=ay+i*L;}c.init=true;}
  P[0].x=ax;P[0].y=ay;
  const d=Math.pow(c.damp,dt*60);
  for(let i=1;i<=c.n;i++){
    const q=P[i],vx=(q.x-q.px)*d,vy=(q.y-q.py)*d;
    q.px=q.x;q.py=q.y;q.x+=vx+wind*s*dt*dt;q.y+=vy+c.grav*s*dt*dt;
  }
  for(let k=0;k<3;k++)for(let i=1;i<=c.n;i++){
    const a=P[i-1],b=P[i];let dx=b.x-a.x,dy=b.y-a.y;const m=Math.hypot(dx,dy)||1e-4,t=L/m;
    b.x=a.x+dx*t;b.y=a.y+dy*t;if(b.y>floor)b.y=floor;
  }
}
function drawChain(c,s,w0,w1,col){
  const P=c.p;g.strokeStyle=col;g.lineCap='round';
  for(let i=1;i<=c.n;i++){g.lineWidth=lerp(w0,w1,(i-1)/(c.n-1||1))*s;g.beginPath();g.moveTo(P[i-1].x,P[i-1].y);g.lineTo(P[i].x,P[i].y);g.stroke();}
}
function ik(ax,ay,bx,by,l1,l2,dir){
  let dx=bx-ax,dy=by-ay,d=Math.hypot(dx,dy);const m=l1+l2-0.01;
  if(d>m){dx*=m/d;dy*=m/d;d=m;}if(d<1e-3)d=1e-3;
  const a=(l1*l1-l2*l2+d*d)/(2*d),h=Math.sqrt(Math.max(0,l1*l1-a*a));
  return[ax+dx*a/d-dy/d*h*dir,ay+dy*a/d+dx/d*h*dir,ax+dx,ay+dy];
}
function ell(x,y,rx,ry){g.beginPath();g.ellipse(x,y,Math.max(0.01,rx),Math.max(0.01,ry),0,0,TAU);g.fill();}

/* ---------- Live2D風リグ ----------
   パーツ分け → パラメータ(顔の向き/目の開き/目線/口/呼吸) → 視差変形 → 物理(髪・マフラー) */
const C={skin:'#ffe6d8',skinD:'#f0b9a8',hair:'#f1ecff',hairD:'#a094e4',line:'#2a1840',eye:'#ff3d94',suit:'#2a3074',trim:'#4fe0ff',skirt:'#ff4fa3',boot:'#12143a',scarf:'#4fe0ff',blade:'#f6fdff'};
const SWING=[[-2.3,0.9,44],[1.3,-2.0,44],[-2.9,1.35,54]];
class Rig{
  constructor(){
    this.t=Math.random()*9;this.blink=2;this.open=1;this.ex=0;this.ey=0;this.aho=0;this.ahoV=0;this.sw=2.0;this.mouth=0;
    this.pony=mkChain(8,6.4,620,0.93);this.lockL=mkChain(4,5.2,700,0.9);this.lockR=mkChain(4,5.2,700,0.9);this.scarf=mkChain(7,6.6,260,0.95);
    this.o=null;
  }
  update(dt,o){
    this.t+=dt;const s=o.s||1,f=o.f,fs=f>=0?1:-1,mv=o.mv||0,ph=o.ph||0;
    // まばたき
    this.blink-=dt;if(this.blink<-0.14)this.blink=1.6+Math.random()*3.2;
    this.open=this.blink<0?Math.abs(this.blink+0.07)/0.07:1;
    this.ex=lerp(this.ex,o.ex||0,1-Math.pow(0.001,dt));this.ey=lerp(this.ey,o.ey||0,1-Math.pow(0.001,dt));
    this.mouth=lerp(this.mouth,o.mouth||0,1-Math.pow(0.0001,dt));
    // アホ毛ばね
    const tg=-(o.vxn||0)*0.9;this.ahoV+=((tg-this.aho)*140-this.ahoV*9)*dt;this.aho+=this.ahoV*dt;
    // ポーズ
    const br=Math.sin(this.t*2.4),bob=Math.abs(Math.sin(ph))*2.2*mv+br*0.5,a=o.lean||0;
    const hip={x:0,y:-45+bob},sh={x:hip.x+Math.sin(a)*27,y:hip.y-Math.cos(a)*27-br*0.4};
    const tilt=a*0.5+(o.tilt||0),hd={x:sh.x+Math.sin(tilt)*18+f*1.5,y:sh.y-Math.cos(tilt)*18};
    let f1,f2;
    if(o.dash){f1={x:fs*11,y:-2};f2={x:-fs*15,y:-6};}
    else if(o.air){if(o.vy>0){f1={x:fs*4,y:-1};f2={x:-fs*6,y:-7};}else{f1={x:fs*8,y:-10};f2={x:-fs*9,y:-3};}}
    else{
      const sw=13*mv;
      f1={x:Math.sin(ph)*sw*fs+4*(1-mv),y:-Math.max(0,Math.cos(ph))*7*mv};
      f2={x:Math.sin(ph+PI)*sw*fs-4*(1-mv),y:-Math.max(0,Math.cos(ph+PI))*7*mv};
    }
    // 剣
    let th,len=44,trail=null;
    if(o.atk){const S=SWING[o.atk.n],q=1-Math.pow(1-Math.min(1,o.atk.p/0.55),3);th=lerp(S[0],S[1],q);len=S[2];this.sw=th;trail={a:S[0],b:th,al:clamp(1-o.atk.p*1.15,0,1),r:len+22};}
    else{this.sw=lerp(this.sw,o.air?1.2:2.0,1-Math.pow(0.0005,dt));th=this.sw;}
    const sa={x:sh.x+fs*2,y:sh.y+2},hand={x:sa.x+Math.cos(th)*19*fs,y:sa.y+Math.sin(th)*19},tip={x:hand.x+Math.cos(th)*len*fs,y:hand.y+Math.sin(th)*len};
    const bh=o.air?{x:sh.x-fs*13,y:sh.y+9}:{x:sh.x-fs*4-Math.sin(ph)*9*mv*fs,y:sh.y+22-mv*4};
    this.o=o;this.pz={s,f,fs,hip,sh,hd,tilt,f1,f2,sa,hand,tip,bh,th,trail,sk:(o.vxn||0)*4+this.aho*2};
    // 揺れもの
    const ct=Math.cos(tilt),st=Math.sin(tilt),W=(hx,hy)=>[o.x+(hd.x+hx*ct-hy*st)*s,o.y+(hd.y+hx*st+hy*ct)*s];
    const fl=o.floor==null?1e9:o.floor;
    let q=W(-f*11,-9);stepChain(this.pony,q[0],q[1],s,dt,0,fl);
    q=W(-12.5+f*2,1);stepChain(this.lockL,q[0],q[1],s,dt,0,fl);
    q=W(12.5+f*2,1);stepChain(this.lockR,q[0],q[1],s,dt,0,fl);
    stepChain(this.scarf,o.x+(sh.x-f*5)*s,o.y+(sh.y-5)*s,s,dt,Math.sin(this.t*3.1)*260-fs*200,fl);
  }
  draw(){
    const o=this.o,z=this.pz;if(!o)return;const s=z.s,fs=z.fs,f=z.f;
    drawChain(this.scarf,s,6.5,4.5,C.scarf);
    drawChain(this.pony,s,9.5,2.2,C.hairD);drawChain(this.pony,s,5,1.2,C.hair);
    g.save();g.translate(o.x,o.y);g.scale(s,s);g.lineCap='round';g.lineJoin='round';
    // 奥の腕
    let e=ik(z.sh.x-fs*3,z.sh.y+2,z.bh.x,z.bh.y,12,12,fs);
    g.strokeStyle='#1d2258';g.lineWidth=4.2;g.beginPath();g.moveTo(z.sh.x-fs*3,z.sh.y+2);g.lineTo(e[0],e[1]);g.lineTo(e[2],e[3]);g.stroke();
    g.fillStyle=C.skinD;ell(e[2],e[3],2.4,2.4);
    // 脚
    for(const[ft,hx,dark]of[[z.f2,-fs*2.5,1],[z.f1,fs*2.5,0]]){
      const k=ik(z.hip.x+hx,z.hip.y,ft.x,ft.y,22,22,-fs);
      g.lineWidth=5.6;g.strokeStyle=dark?C.skinD:C.skin;g.beginPath();g.moveTo(z.hip.x+hx,z.hip.y);g.lineTo(k[0],k[1]);g.stroke();
      g.strokeStyle=C.boot;g.beginPath();g.moveTo(k[0],k[1]);g.lineTo(k[2],k[3]);g.stroke();
      g.lineWidth=4.6;g.beginPath();g.moveTo(k[2],k[3]-1);g.lineTo(k[2]+fs*5,k[3]-1);g.stroke();
      g.strokeStyle=C.trim;g.lineWidth=1.2;g.beginPath();g.moveTo(k[0]-2.6,k[1]+1);g.lineTo(k[0]+2.6,k[1]+1);g.stroke();
    }
    // スカート
    g.fillStyle=C.skirt;g.beginPath();g.moveTo(z.hip.x-6.5,z.hip.y-9);g.lineTo(z.hip.x+6.5,z.hip.y-9);
    g.lineTo(z.hip.x+13.5-z.sk,z.hip.y+9);g.quadraticCurveTo(z.hip.x-z.sk,z.hip.y+12,z.hip.x-13.5-z.sk,z.hip.y+9);g.closePath();g.fill();
    g.strokeStyle='#c22a78';g.lineWidth=1;g.beginPath();g.moveTo(z.hip.x,z.hip.y-8);g.lineTo(z.hip.x-z.sk*0.6,z.hip.y+9.5);g.stroke();
    // 胴
    g.fillStyle=C.suit;g.beginPath();g.moveTo(z.sh.x-8,z.sh.y);g.lineTo(z.sh.x+8,z.sh.y);g.lineTo(z.hip.x+6,z.hip.y-7);g.lineTo(z.hip.x-6,z.hip.y-7);g.closePath();g.fill();
    g.strokeStyle=C.trim;g.lineWidth=1.3;g.beginPath();g.moveTo(z.sh.x-4+f*2,z.sh.y+1);g.lineTo(z.sh.x+f*3,z.sh.y+7);g.lineTo(z.sh.x+4+f*2,z.sh.y+1);g.stroke();
    // 首・マフラーの結び目
    g.strokeStyle=C.skinD;g.lineWidth=4;g.beginPath();g.moveTo(z.sh.x,z.sh.y);g.lineTo(z.hd.x,z.hd.y+8);g.stroke();
    g.fillStyle=C.scarf;ell(z.sh.x,z.sh.y-2.5,8.5,3.6);
    // 頭
    g.save();g.translate(z.hd.x,z.hd.y);g.rotate(z.tilt);this.head(f,o);g.restore();
    // 斬撃の軌跡
    if(z.trail&&z.trail.al>0.02){
      const T=z.trail,ccw=T.b<T.a;
      g.save();g.translate(z.sa.x,z.sa.y);g.scale(fs,1);
      g.globalAlpha=T.al*0.85;g.fillStyle=C.trim;g.beginPath();g.arc(0,0,T.r,T.a,T.b,ccw);g.arc(0,0,T.r*0.5,T.b,T.a,!ccw);g.closePath();g.fill();
      g.globalAlpha=T.al;g.fillStyle='#fff';g.beginPath();g.arc(0,0,T.r,lerp(T.a,T.b,0.45),T.b,ccw);g.arc(0,0,T.r*0.82,T.b,lerp(T.a,T.b,0.45),!ccw);g.closePath();g.fill();
      g.restore();g.globalAlpha=1;
    }
    // 剣を持つ腕
    e=ik(z.sa.x,z.sa.y,z.hand.x,z.hand.y,10.5,10.5,Math.sin(z.th)>0.2?fs:-fs);

  g.fillStyle='rgba(0,0,0,.35)';ell(e.x,0,e.t==='brute'?24:13,e.t==='brute'?5:3.5);
  if(e.t==='slime'){
    const q=Math.sin(e.ph*7)*0.12+(e.onG?0:-0.2),w=14*(1+q),h=19*(1-q);
    g.fillStyle=fl?'#fff':'#39d977';g.beginPath();g.moveTo(e.x-w,e.y);g.bezierCurveTo(e.x-w,e.y-h*1.3,e.x+w,e.y-h*1.3,e.x+w,e.y);g.closePath();g.fill();
    g.fillStyle=fl?'#fff':'#9dffc0';ell(e.x-w*0.35,e.y-h*0.68,w*0.22,h*0.12);
    const d=p.x>e.x?1.5:-1.5;g.fillStyle='#0b091b';ell(e.x-4+d,e.y-h*0.4,2,2.6);ell(e.x+4+d,e.y-h*0.4,2,2.6);
  }else if(e.t==='bat'){
    const fp=Math.sin(e.ph*18)*9;g.fillStyle=fl?'#fff':'#8a4dff';
    for(const sd of[-1,1]){g.beginPath();g.moveTo(e.x+sd*4,e.y);g.lineTo(e.x+sd*19,e.y-6-fp);g.lineTo(e.x+sd*15,e.y+2-fp*0.3);g.lineTo(e.x+sd*10,e.y+6);g.closePath();g.fill();}
    g.fillStyle=fl?'#fff':'#5b2bc4';ell(e.x,e.y,8,8);g.beginPath();g.moveTo(e.x-6,e.y-6);g.lineTo(e.x-4,e.y-13);g.lineTo(e.x-1,e.y-7);g.moveTo(e.x+6,e.y-6);g.lineTo(e.x+4,e.y-13);g.lineTo(e.x+1,e.y-7);g.fill();
    g.fillStyle='#ff4f5f';ell(e.x-3,e.y-1,1.7,1.7);ell(e.x+3,e.y-1,1.7,1.7);
  }else{
    const wd=e.st==='wind',ln=wd?-e.dir*5:e.st==='lunge'?e.dir*8:0,blink=wd&&Math.floor(e.tm*16)%2===0;
    g.fillStyle=fl||blink?'#fff':'#7a1f4f';g.beginPath();
    g.moveTo(e.x-20,e.y);g.lineTo(e.x-20+ln*0.4,e.y-40);g.lineTo(e.x-12+ln,e.y-58);g.lineTo(e.x+12+ln,e.y-58);g.lineTo(e.x+20+ln*0.4,e.y-40);g.lineTo(e.x+20,e.y);g.closePath();g.fill();
    g.fillStyle=fl?'#fff':'#4a1232';g.fillRect(e.x-20,e.y-14,40,5);g.fillRect(e.x-16+ln*0.6,e.y-34,32,4);
    g.fillStyle=wd?'#ff3030':'#4fe0ff';ell(e.x+ln+e.dir*4,e.y-46,5,wd?5:3.4);g.fillStyle='#0b091b';ell(e.x+ln+e.dir*5.5,e.y-46,2,2);
    if(wd)txt('!',e.x,e.y-74,20,'#ff3030','center','#0b091b');
  }
}
function drawParts(){
  for(const q of parts){
    const a=clamp(q.life/q.max,0,1);g.globalAlpha=a;
    if(q.k===0){g.fillStyle=q.col;g.fillRect(q.x-q.sz/2,q.y-q.sz/2,q.sz,q.sz);}
    else if(q.k===1){g.strokeStyle=q.col;g.lineWidth=3*a+0.5;g.beginPath();g.arc(q.x,q.y,q.sz*(1-a*0.8),0,TAU);g.stroke();}
    else if(q.k===2){g.globalAlpha=Math.min(1,a*2);txt(q.s,q.x,q.y,12,q.col,'center','#0b091b');}
    else{g.fillStyle=q.col;g.globalAlpha=a*0.6;g.fillRect(q.x-q.sz/2,q.y,q.sz,1.6);}
  }
  g.globalAlpha=1;
}
function heart(x,y,s,on){
  g.beginPath();g.moveTo(x,y+s*0.9);g.bezierCurveTo(x-s*1.5,y-s*0.2,x-s*0.7,y-s*1.2,x,y-s*0.35);g.bezierCurveTo(x+s*0.7,y-s*1.2,x+s*1.5,y-s*0.2,x,y+s*0.9);
  if(on){g.fillStyle='#ff4fa3';g.fill();}g.lineWidth=1.4;g.strokeStyle=on?'#fff':'#5a5296';g.stroke();
}
function render(){
  g.setTransform(DPR*SC,0,0,DPR*SC,0,0);
  if(state==='title'){
    drawBG(T*12);
    g.fillStyle='rgba(10,9,24,.45)';g.fillRect(0,0,VW,VH);
    rigT.draw();
    txt('MESH BLADE',VW/2,VH*0.1,Math.min(40,VW*0.085),'#fff','center','#ff4fa3');
    txt('ぬるぬる剣姫',VW/2,VH*0.1+30,13,'#4fe0ff','center','#0a0918');
    if(Math.floor(T*2)%2===0)txt('タップでスタート',VW/2,VH*0.88,17,'#fff','center','#0a0918');
    txt('ドラッグすると目で追うよ',VW/2,VH*0.88+22,10.5,'#cfc6ff','center','#0a0918');
    if(best>0)txt('BEST '+best,VW/2,VH*0.1+50,11,'#ffd24f','center','#0a0918');
    return;
  }
  drawBG(camX);
  const sx=shake?(Math.random()-0.5)*shake:0,sy=shake?(Math.random()-0.5)*shake:0;
  g.save();g.translate(-camX+sx,GY+sy);
  // 闘技場の端
  for(const sd of[-1,1]){g.fillStyle='rgba(255,79,163,.25)';g.fillRect(sd*(ARENA+14)-2,-300,4,300);}
  for(const e of enemies)drawEnemy(e);
  g.fillStyle='rgba(0,0,0,.35)';ell(p.x,0,13*clamp(1+p.y/160,0.4,1),3.5);
  if(!(p.inv>0&&state==='play'&&Math.floor(T*22)%2===0))rigP.draw();
  drawParts();
  g.restore();
  // HUD
  for(let i=0;i<5;i++)heart(16+i*19,18,7,i<p.hp);
  txt(String(score).padStart(6,'0'),VW-10,17,17,'#fff','right','#0a0918');
  txt('WAVE '+wave,VW-10,36,10.5,'#4fe0ff','right','#0a0918');
  if(combo>1){const k=1+Math.max(0,comboT-2.4)*2.5;txt(combo+' HIT',VW-12,64,17*k,'#ffd24f','right','#0a0918');}
  if(banner>0&&state==='play'){g.globalAlpha=clamp(banner*2,0,1);txt(bannerTxt,VW/2,VH*0.3,30,'#fff','center','#ff4fa3');g.globalAlpha=1;}
  if(state==='over'){
    g.fillStyle='rgba(10,9,24,'+clamp(overT*1.2,0,0.72)+')';g.fillRect(0,0,VW,VH);
    if(overT>0.4){
      txt('GAME OVER',VW/2,VH*0.3,34,'#fff','center','#ff4fa3');
      txt('スコア '+score+'　ウェーブ '+wave,VW/2,VH*0.3+38,14,'#fff','center','#0a0918');
      txt(score>=best&&score>0?'ベスト更新！':'ベスト '+best,VW/2,VH*0.3+60,12,'#ffd24f','center','#0a0918');
      if(overT>0.8&&Math.floor(T*2)%2===0)txt('タップでもう一回',VW/2,VH*0.3+92,15,'#4fe0ff','center','#0a0918');
    }
  }
}
let lastT=0;
function frame(t){
  const dt=Math.min(0.033,Math.max(0.001,(t-lastT)/1000));lastT=t;
  if(stop>0){stop-=dt;T+=dt*0.2;}else update(dt);
  render();
  requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(t=>{lastT=t;resize();requestAnimationFrame(frame);});
})();
</script>
</body>
