<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <meta name="theme-color" content="#06141d" />
  <title>223｜SKY HUNT — 急降下ハンティング</title>
  <style>
    :root{--ink:#eaf7ff;--muted:#9ab2bd;--lime:#d8ff54;--orange:#ff9a3c;--red:#ff5f57;--glass:rgba(4,18,27,.74)}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#06141d;color:var(--ink);font-family:Inter,"Noto Sans JP",system-ui,sans-serif}
    body{touch-action:none;overscroll-behavior:none}.app{position:relative;width:100%;height:100%;isolation:isolate;background:#0b3044}
    canvas{display:block;width:100%;height:100%}.grain{position:absolute;inset:0;pointer-events:none;opacity:.055;mix-blend-mode:screen;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E")}
    .hud{position:absolute;inset:0;pointer-events:none;padding:clamp(14px,2vw,26px);display:grid;grid-template-columns:1fr auto 1fr;grid-template-rows:auto 1fr auto;gap:12px}
    .brand{align-self:start}.brand b{display:block;font-size:clamp(18px,2vw,28px);line-height:.9;letter-spacing:.16em}.brand small{color:var(--lime);font-weight:800;letter-spacing:.18em;font-size:11px}
    .score{justify-self:center;text-align:center}.score label,.stat label{display:block;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.16em}.score strong{font-size:clamp(30px,4vw,54px);font-variant-numeric:tabular-nums;letter-spacing:.04em;line-height:1}.lives{justify-self:end;font-size:19px;letter-spacing:.18em;color:var(--orange)}
    .altimeter{grid-column:3;grid-row:2;justify-self:end;align-self:center;display:flex;align-items:center;gap:11px}.alt-track{position:relative;width:6px;height:min(34vh,290px);border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden}.alt-fill{position:absolute;left:0;right:0;bottom:0;height:100%;background:linear-gradient(var(--lime),var(--orange),var(--red));transform-origin:bottom}.alt-numbers{display:flex;flex-direction:column;gap:2px}.alt-numbers strong{font-size:clamp(24px,3vw,38px);font-variant-numeric:tabular-nums}.alt-numbers span{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.12em}.danger{color:var(--red)!important}
    .radar{grid-column:1;grid-row:2;align-self:end;width:114px;height:114px;border:1px solid rgba(216,255,84,.38);border-radius:50%;position:relative;background:radial-gradient(circle,rgba(216,255,84,.05) 0 2px,transparent 3px),repeating-radial-gradient(circle,transparent 0 24px,rgba(216,255,84,.12) 25px);overflow:hidden}.radar::before,.radar::after{content:"";position:absolute;background:rgba(216,255,84,.16)}.radar::before{height:1px;left:0;right:0;top:50%}.radar::after{width:1px;top:0;bottom:0;left:50%}.radar i{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--lime);box-shadow:0 0 8px var(--lime);transform:translate(-50%,-50%)}
    .mission{grid-column:1/-1;grid-row:3;align-self:end;display:flex;justify-content:center}.mission-inner{max-width:680px;text-align:center}.callout{font-weight:900;letter-spacing:.18em;font-size:clamp(13px,1.6vw,18px);text-shadow:0 2px 14px #000}.callout em{color:var(--lime);font-style:normal}.hint{margin-top:4px;color:rgba(234,247,255,.7);font-size:12px;font-weight:700}.combo{position:absolute;left:50%;top:26%;transform:translate(-50%,-50%) scale(.8);opacity:0;font-size:clamp(32px,7vw,86px);font-weight:1000;font-style:italic;color:var(--lime);text-shadow:0 5px 0 rgba(0,0,0,.25);letter-spacing:-.05em;pointer-events:none}.combo.pop{animation:combo .7s ease-out}@keyframes combo{0%{opacity:0;transform:translate(-50%,-30%) scale(.55)}25%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-70%) scale(1.08)}}
    .speed-lines{position:absolute;inset:-25%;pointer-events:none;opacity:0;background:repeating-conic-gradient(from 0deg at 50% 50%,transparent 0deg 7deg,rgba(255,255,255,.12) 7.2deg 7.45deg,transparent 7.7deg 13deg);mask-image:radial-gradient(circle,transparent 0 20%,#000 62%,#000);transition:opacity .12s}.speed-lines.on{opacity:.74;animation:spin .5s linear infinite}@keyframes spin{to{transform:rotate(.8deg) scale(1.02)}}
    .overlay{position:absolute;inset:0;display:grid;place-items:center;padding:22px;background:linear-gradient(115deg,rgba(3,15,22,.94),rgba(3,15,22,.48));backdrop-filter:blur(8px);z-index:10;transition:.35s}.overlay.hidden{opacity:0;visibility:hidden;pointer-events:none}.card{width:min(760px,100%);border-left:5px solid var(--lime);padding:clamp(22px,5vw,58px);background:linear-gradient(135deg,rgba(11,39,51,.95),rgba(4,19,28,.94));box-shadow:0 28px 90px rgba(0,0,0,.45)}
    .eyebrow{color:var(--lime);font-size:12px;font-weight:900;letter-spacing:.22em}.card h1{margin:8px 0 12px;font-size:clamp(48px,11vw,108px);line-height:.76;letter-spacing:-.07em;font-weight:1000;font-style:italic}.card h1 span{display:block;color:transparent;-webkit-text-stroke:1px rgba(234,247,255,.72)}.lead{font-size:clamp(16px,2vw,21px);line-height:1.65;max-width:580px;margin:24px 0;color:#d7e5eb}.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.rule{border-top:1px solid rgba(255,255,255,.2);padding:12px 4px}.rule b{display:block;color:var(--orange);font-size:21px}.rule span{font-size:12px;color:var(--muted);line-height:1.5}.start{pointer-events:auto;border:0;border-radius:0;background:var(--lime);color:#081218;font-weight:1000;font-size:17px;letter-spacing:.12em;padding:16px 28px;cursor:pointer;box-shadow:6px 6px 0 rgba(255,154,60,.8);transition:.15s}.start:hover{transform:translate(-2px,-2px);box-shadow:9px 9px 0 rgba(255,154,60,.8)}.start:active{transform:translate(4px,4px);box-shadow:2px 2px 0 rgba(255,154,60,.8)}
    .controls{position:absolute;inset:0;z-index:4;pointer-events:none;display:none}.pad{position:absolute;left:20px;bottom:22px;width:132px;height:132px}.ctrl{pointer-events:auto;position:absolute;width:46px;height:46px;border:1px solid rgba(255,255,255,.4);background:rgba(4,18,27,.57);color:white;border-radius:50%;font-size:20px;display:grid;place-items:center;user-select:none}.ctrl[data-k="up"]{left:43px;top:0}.ctrl[data-k="down"]{left:43px;bottom:0}.ctrl[data-k="left"]{left:0;top:43px}.ctrl[data-k="right"]{right:0;top:43px}.dive-btn{pointer-events:auto;position:absolute;right:22px;bottom:28px;width:102px;height:102px;border-radius:50%;border:2px solid var(--lime);background:rgba(4,18,27,.65);color:var(--lime);font-weight:1000;letter-spacing:.08em;box-shadow:inset 0 0 0 7px rgba(216,255,84,.09)}.dive-btn.active{background:var(--lime);color:#07151d;transform:scale(.96)}
    @media (pointer:coarse),(max-width:760px){.controls{display:block}.hud{padding:14px}.radar{width:78px;height:78px;align-self:center}.mission{padding-bottom:118px}.hint{display:none}.alt-track{height:26vh}.rules{grid-template-columns:1fr}.rule{display:flex;gap:12px;align-items:center}.rule b{min-width:54px}.card{padding:24px}.lead{margin:16px 0}.card h1{font-size:58px}}
  </style>
</head>
<body>
<main class="app" aria-label="急降下ハンティングゲーム">
  <canvas id="game" aria-label="大空を飛ぶ鷹のゲーム画面"></canvas>
  <div class="speed-lines" id="speedLines"></div><div class="grain"></div>
  <section class="hud" aria-live="polite">
    <div class="brand"><b>SKY HUNT</b><small>RAPTOR UNIT 01</small></div>
    <div class="score"><label>SCORE</label><strong id="score">00000</strong></div>
    <div class="lives" id="lives">◆ ◆ ◆</div>
    <div class="radar" id="radar"></div>
    <div class="altimeter"><div class="alt-track"><div class="alt-fill" id="altFill"></div></div><div class="alt-numbers"><span>ALTITUDE</span><strong id="altitude">1800</strong><span id="speed">GLIDE</span></div></div>
    <div class="mission"><div class="mission-inner"><div class="callout" id="callout"><em>獲物の真上へ。</em> SPACE長押しで急降下</div><div class="hint">移動：WASD / 矢印　急降下：SPACE　ポーズ：P</div></div></div>
  </section>
  <div class="combo" id="combo"></div>
  <div class="controls" aria-label="タッチ操作">
    <div class="pad"><button class="ctrl" data-k="up" aria-label="上">▲</button><button class="ctrl" data-k="left" aria-label="左">◀</button><button class="ctrl" data-k="right" aria-label="右">▶</button><button class="ctrl" data-k="down" aria-label="下">▼</button></div>
    <button class="dive-btn" id="diveBtn">DIVE</button>
  </div>
  <div class="overlay" id="overlay">
    <section class="card"><div class="eyebrow">TOP-DOWN DIVE ACTION</div><h1>SKY<span>HUNT</span></h1><p class="lead" id="lead">大空から獲物を見定め、一気に急降下。鳩はジグザグ、カラスは寸前で切り返す。低空でぶつかれば捕獲、地面まで落ちれば失速。</p><div class="rules"><div class="rule"><b>01</b><span>高空で獲物の真上を取る</span></div><div class="rule"><b>02</b><span>SPACE長押しで急降下</span></div><div class="rule"><b>03</b><span>高度260m以下で捕獲</span></div></div><button class="start" id="start">狩りを始める</button></section>
  </div>
</main>
<script>
(()=>{
  'use strict';
  const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');
  const el={score:document.querySelector('#score'),lives:document.querySelector('#lives'),alt:document.querySelector('#altitude'),altFill:document.querySelector('#altFill'),speed:document.querySelector('#speed'),callout:document.querySelector('#callout'),combo:document.querySelector('#combo'),overlay:document.querySelector('#overlay'),start:document.querySelector('#start'),lead:document.querySelector('#lead'),lines:document.querySelector('#speedLines'),radar:document.querySelector('#radar'),dive:document.querySelector('#diveBtn')};
  let W=0,H=0,dpr=1,last=0,state='menu',score=0,lives=3,combo=0,altitude=1800,divePower=0,time=0,shake=0,flash=0;
  const keys={},player={x:0,y:0,vx:0,vy:0,bank:0},prey=[],clouds=[],particles=[];
  let audio=null;
  function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);if(!player.x){player.x=W/2;player.y=H/2} makeClouds()}
  function makeClouds(){clouds.length=0;for(let i=0;i<18;i++)clouds.push({x:Math.random()*W,y:Math.random()*H,r:35+Math.random()*90,z:Math.random()})}
  function spawn(type){const edge=Math.floor(Math.random()*4),m=80;let x,y;if(edge===0){x=Math.random()*W;y=-m}else if(edge===1){x=W+m;y=Math.random()*H}else if(edge===2){x=Math.random()*W;y=H+m}else{x=-m;y=Math.random()*H}const a=Math.atan2(H/2-y,W/2-x)+(Math.random()-.5);prey.push({type:type||((Math.random()<.34)?'crow':'pigeon'),x,y,vx:Math.cos(a)*80,vy:Math.sin(a)*80,turn:Math.random()*6.28,wing:Math.random()*6.28,marked:0})}
  function reset(){score=0;lives=3;combo=0;altitude=1800;divePower=0;time=0;player.x=W/2;player.y=H/2;player.vx=player.vy=0;prey.length=0;particles.length=0;for(let i=0;i<7;i++){spawn(i<2?'crow':null);prey[i].x=90+Math.random()*(W-180);prey[i].y=90+Math.random()*(H-180)}updateHud()}
  function sound(freq,dur=.1,type='sine',vol=.08){if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}
  function start(){reset();state='playing';el.overlay.classList.add('hidden');sound(220,.12,'sawtooth',.05)}
  function updateHud(){el.score.textContent=String(score).padStart(5,'0');el.lives.textContent=Array(lives).fill('◆').join(' ');el.alt.textContent=Math.max(0,Math.round(altitude));el.altFill.style.transform=`scaleY(${Math.max(.02,altitude/1800)})`;el.speed.textContent=divePower>.72?'TERMINAL SPEED':divePower>.25?'DIVING':'GLIDE';el.speed.classList.toggle('danger',altitude<220)}
  function end(){state='gameover';el.lead.textContent=`最終スコア ${String(score).padStart(5,'0')}。獲物の進行方向より少し先へ照準を置くと、急旋回にも追いつける。`;el.start.textContent='もう一度、空へ';el.overlay.classList.remove('hidden')}
  function burst(x,y,color){for(let i=0;i<24;i++){const a=Math.random()*6.28,s=50+Math.random()*240;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.5+Math.random()*.45,color})}}
  function hit(p){const value=p.type==='crow'?250:100;combo++;score+=value*combo;el.combo.textContent=`${p.type==='crow'?'CROW':'PIGEON'} +${value*combo}${combo>1?`  ×${combo}`:''}`;el.combo.classList.remove('pop');void el.combo.offsetWidth;el.combo.classList.add('pop');burst(p.x,p.y,p.type==='crow'?'#26323b':'#e8f1f5');prey.splice(prey.indexOf(p),1);spawn();altitude=Math.min(1800,altitude+360);divePower*=.28;shake=12;flash=.22;sound(p.type==='crow'?160:260,.16,'square',.08);setTimeout(()=>sound(520,.09,'triangle',.05),70)}
  function crash(){lives--;combo=0;altitude=1180;divePower=0;shake=22;flash=.42;sound(65,.45,'sawtooth',.11);el.callout.innerHTML='<em>低すぎる！</em> 翼を立て直せ';if(lives<=0)end()}
  function update(dt){if(state!=='playing')return;time+=dt;const ax=((keys.ArrowRight||keys.d)?1:0)-((keys.ArrowLeft||keys.a)?1:0),ay=((keys.ArrowDown||keys.s)?1:0)-((keys.ArrowUp||keys.w)?1:0);const dive=keys[' ']||keys.dive;divePower+=((dive?1:0)-divePower)*Math.min(1,dt*(dive?2.5:3.5));const steer=290+(1-divePower)*120;player.vx+=(ax*steer-player.vx*3.5)*dt;player.vy+=(ay*steer-player.vy*3.5)*dt;player.x+=player.vx*dt;player.y+=player.vy*dt;player.x=Math.max(38,Math.min(W-38,player.x));player.y=Math.max(38,Math.min(H-38,player.y));player.bank+=(ax-player.bank)*dt*6;
    if(dive){altitude-=dt*(240+680*divePower)}else altitude+=dt*(altitude<900?430:140);altitude=Math.min(1800,altitude);if(altitude<=35)crash();
    for(const p of prey){p.turn+=dt*(p.type==='crow'?4.8:3.1);const dx=player.x-p.x,dy=player.y-p.y,d=Math.hypot(dx,dy)||1;let panic=Math.max(0,1-d/260)*Math.max(0,(900-altitude)/900);const zig=Math.sin(p.turn)*(p.type==='crow'?360:230);let tx=p.vx,ty=p.vy;if(panic){tx+=-dx/d*440*panic+(-dy/d)*zig*panic;ty+=-dy/d*440*panic+(dx/d)*zig*panic;p.marked=1}else{tx+=Math.cos(p.turn*.37)*30;ty+=Math.sin(p.turn*.41)*30;p.marked*=.94}const cap=p.type==='crow'?255:205,sp=Math.hypot(tx,ty)||1;if(sp>cap){tx=tx/sp*cap;ty=ty/sp*cap}p.vx+=(tx-p.vx)*dt*(p.type==='crow'?3.7:2.5);p.vy+=(ty-p.vy)*dt*(p.type==='crow'?3.7:2.5);p.x+=p.vx*dt;p.y+=p.vy*dt;p.wing+=dt*(10+Math.hypot(p.vx,p.vy)/30);if(p.x<-120||p.x>W+120||p.y<-120||p.y>H+120){p.x=(p.x+W+240)%(W+240)-120;p.y=(p.y+H+240)%(H+240)-120}}
    const target=prey.reduce((a,p)=>Math.hypot(p.x-player.x,p.y-player.y)<Math.hypot(a.x-player.x,a.y-player.y)?p:a,prey[0]);const td=Math.hypot(target.x-player.x,target.y-player.y);if(altitude<270&&divePower>.48&&td<38)hit(target);
    for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy*=.96;p.life-=dt;if(p.life<=0)particles.splice(i,1)}
    el.lines.classList.toggle('on',divePower>.38);el.callout.innerHTML=altitude<300?(td<85?'<em>LOCK!</em> そのまま突っ込め':'<em>低空！</em> 獲物へ寄せろ'):divePower>.55?'<em>DIVE</em> 翼で進路を微調整':'<em>獲物の真上へ。</em> SPACE長押しで急降下';shake*=Math.pow(.03,dt);flash=Math.max(0,flash-dt);updateHud();updateRadar()
  }
  function updateRadar(){el.radar.replaceChildren();for(const p of prey){const i=document.createElement('i'),dx=(p.x-player.x)/Math.max(W,H)*100,dy=(p.y-player.y)/Math.max(W,H)*100;i.style.left=`${50+dx}%`;i.style.top=`${50+dy}%`;i.style.background=p.type==='crow'?'#ff9a3c':'#d8ff54';el.radar.append(i)}}
  function roundedRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
  function drawGround(scale){const z=1+(1-altitude/1800)*1.35;ctx.save();ctx.translate(W/2,H/2);ctx.scale(z,z);ctx.translate(-W/2,-H/2);const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#3a6b5c');g.addColorStop(.46,'#4e7955');g.addColorStop(1,'#315e51');ctx.fillStyle=g;ctx.fillRect(-W,-H,W*3,H*3);const cell=150;for(let y=-cell;y<H+cell;y+=cell)for(let x=-cell;x<W+cell;x+=cell){const n=Math.sin(x*.017+y*.011);ctx.fillStyle=n>0?'rgba(208,197,122,.14)':'rgba(22,71,58,.16)';ctx.fillRect(x+Math.sin(y)*18,y,cell-5,cell-5)}ctx.strokeStyle='rgba(227,210,160,.42)';ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(-100,H*.2);ctx.bezierCurveTo(W*.25,H*.48,W*.64,H*.12,W+120,H*.72);ctx.stroke();ctx.strokeStyle='rgba(77,129,151,.75)';ctx.lineWidth=24;ctx.beginPath();ctx.moveTo(W*.15,-100);ctx.bezierCurveTo(W*.07,H*.32,W*.46,H*.65,W*.34,H+100);ctx.stroke();ctx.restore();
    const haze=ctx.createRadialGradient(W/2,H/2,40,W/2,H/2,Math.max(W,H)*.7);haze.addColorStop(0,`rgba(142,205,226,${altitude/4200})`);haze.addColorStop(1,`rgba(48,126,162,${.42+altitude/5000})`);ctx.fillStyle=haze;ctx.fillRect(0,0,W,H)
  }
  function drawCloud(c){const factor=(altitude/1800-c.z)*1.7;if(factor<-.25)return;const sc=1.4-factor*.42+(1-altitude/1800)*.8,alpha=Math.max(0,Math.min(.5,.42-Math.abs(factor)*.2));ctx.save();ctx.translate(c.x,c.y);ctx.scale(sc,sc);ctx.fillStyle=`rgba(236,248,255,${alpha})`;ctx.filter='blur(8px)';ctx.beginPath();ctx.ellipse(-c.r*.35,0,c.r*.62,c.r*.35,0,0,6.28);ctx.ellipse(c.r*.25,-c.r*.12,c.r*.72,c.r*.45,0,0,6.28);ctx.fill();ctx.filter='none';ctx.restore()}
  function drawPrey(p){const near=1.03+(1-altitude/1800)*.22,ang=Math.atan2(p.vy,p.vx)+Math.PI/2,flap=Math.sin(p.wing)*.55;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(ang);ctx.scale(near,near);ctx.shadowColor='rgba(0,0,0,.35)';ctx.shadowBlur=10;ctx.shadowOffsetY=8;ctx.fillStyle=p.type==='crow'?'#101b21':'#d9e3e6';ctx.beginPath();ctx.moveTo(0,-15);ctx.lineTo(-5,-4);ctx.quadraticCurveTo(-25,-8,-27-25*flap);ctx.quadraticCurveTo(-19,10,-5,12);ctx.lineTo(0,23);ctx.lineTo(5,12);ctx.quadraticCurveTo(19,10,27-25*flap);ctx.quadraticCurveTo(25,-8,5,-4);ctx.closePath();ctx.fill();if(p.type==='pigeon'){ctx.fillStyle='#496f79';ctx.beginPath();ctx.arc(0,-7,5,0,6.28);ctx.fill()}ctx.restore();if(p.marked>.2||Math.hypot(p.x-player.x,p.y-player.y)<150){ctx.strokeStyle=p.type==='crow'?'rgba(255,154,60,.75)':'rgba(216,255,84,.62)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(p.x,p.y,31+Math.sin(time*5)*3,0,6.28);ctx.stroke()}}
  function drawHawk(){const s=1+divePower*.38,tilt=player.bank*.22;ctx.save();ctx.translate(player.x,player.y);ctx.rotate(tilt);ctx.scale(s,s);ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=18+divePower*25;ctx.shadowOffsetY=14+divePower*12;const flap=Math.sin(time*7)*(1-divePower)*5;ctx.fillStyle='#3b2618';ctx.strokeStyle='#e0b55a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-32);ctx.lineTo(-10,-8);ctx.quadraticCurveTo(-50,-20-flap,-71,-3+flap);ctx.quadraticCurveTo(-40,7,-14,16);ctx.lineTo(-5,34);ctx.lineTo(0,25);ctx.lineTo(5,34);ctx.lineTo(14,16);ctx.quadraticCurveTo(40,7,71,-3+flap);ctx.quadraticCurveTo(50,-20-flap,10,-8);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#d8b66f';ctx.beginPath();ctx.moveTo(0,-34);ctx.lineTo(-8,-15);ctx.lineTo(0,-2);ctx.lineTo(8,-15);ctx.closePath();ctx.fill();ctx.fillStyle='#f0c34f';ctx.beginPath();ctx.moveTo(0,-36);ctx.lineTo(-3,-29);ctx.lineTo(5,-31);ctx.closePath();ctx.fill();ctx.restore();
    ctx.strokeStyle=`rgba(216,255,84,${.25+divePower*.45})`;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(player.x,player.y,62-divePower*14,0,6.28);ctx.stroke();ctx.beginPath();ctx.moveTo(player.x-14,player.y);ctx.lineTo(player.x+14,player.y);ctx.moveTo(player.x,player.y-14);ctx.lineTo(player.x,player.y+14);ctx.stroke()
  }
  function render(){ctx.save();if(shake)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);drawGround();for(const c of clouds)drawCloud(c);for(const p of prey)drawPrey(p);for(const p of particles){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,2+p.life*5,0,6.28);ctx.fill()}ctx.globalAlpha=1;drawHawk();if(flash){ctx.fillStyle=`rgba(216,255,84,${flash})`;ctx.fillRect(0,0,W,H)}ctx.restore();if(divePower>.18){const v=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.25,W/2,H/2,Math.max(W,H)*.74);v.addColorStop(0,'transparent');v.addColorStop(1,`rgba(1,8,12,${divePower*.62})`);ctx.fillStyle=v;ctx.fillRect(0,0,W,H)}}
  function loop(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);render();requestAnimationFrame(loop)}
  addEventListener('resize',resize);addEventListener('keydown',e=>{if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();keys[e.key]=true;if(e.key.toLowerCase()==='p')state=state==='playing'?'paused':state==='paused'?'playing':state});addEventListener('keyup',e=>keys[e.key]=false);el.start.addEventListener('click',start);
  document.querySelectorAll('.ctrl').forEach(b=>{const k=b.dataset.k,down=e=>{e.preventDefault();keys[k==='up'?'ArrowUp':k==='down'?'ArrowDown':k==='left'?'ArrowLeft':'ArrowRight']=true},up=e=>{e.preventDefault();keys[k==='up'?'ArrowUp':k==='down'?'ArrowDown':k==='left'?'ArrowLeft':'ArrowRight']=false};b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up)});el.dive.addEventListener('pointerdown',e=>{e.preventDefault();keys.dive=true;el.dive.classList.add('active')});['pointerup','pointercancel','pointerleave'].forEach(n=>el.dive.addEventListener(n,e=>{e.preventDefault();keys.dive=false;el.dive.classList.remove('active')}));
  resize();for(let i=0;i<7;i++){spawn();prey[i].x=80+Math.random()*(W-160);prey[i].y=80+Math.random()*(H-160)}requestAnimationFrame(loop)
})();
</script>
