<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#14171a">
<title>或る孤島のかくれんぼ ― 日暮れまでに、五人</title>
<style>
/* ---------- iOS 共通ヘッダー（body=manipulation / canvas=none の2段構え） ---------- */
:root{
  --bg:#080c16; --fg:#e8e4da; --dim:#9aa3b2; --line:rgba(120,190,215,.26);
  --neon:#3df2ff; --shu:#ff2e5b; --kin:#f2c14e; --fuji:#8a6bff;
  --stam:#4f6b78;
  box-sizing:border-box;
}
*{box-sizing:inherit}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden;position:fixed;width:100%;
  font-family:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP",serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  -webkit-text-size-adjust:100%;touch-action:manipulation;overscroll-behavior:none}
canvas#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-feature-settings:"tnum"}

/* ---------- 和風サイバーパンク：背景レイヤーと走査線 ---------- */
canvas#fx{position:fixed;inset:0;width:100%;height:100%;display:none;z-index:18;pointer-events:none}
canvas#fx.on{display:block}
#scan{position:fixed;inset:0;z-index:31;pointer-events:none;display:none;mix-blend-mode:overlay;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.30) 0 1px,rgba(255,255,255,.028) 1px 3px)}
#scan.on{display:block}
@media (prefers-reduced-motion: reduce){#scan{display:none!important}}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:3}
#readout{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:calc(env(safe-area-inset-left,0px) + 12px);
  font-size:12px;line-height:1.75;color:var(--dim);letter-spacing:.05em;text-shadow:0 0 1px #000,0 1px 4px rgba(0,0,0,.85)}
#readout b{color:var(--fg);font-weight:400}
#readout b.press{color:var(--shu);text-shadow:0 0 7px rgba(255,46,91,.65)}
#compass{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translateX(-50%);opacity:.82}
#marks{position:absolute;left:calc(env(safe-area-inset-left,0px) + 12px);bottom:calc(env(safe-area-inset-bottom,0px) + 200px);
  display:flex;gap:7px;align-items:center}
#marks i{font-style:normal;font-size:15px;color:rgba(154,163,178,.34);letter-spacing:0;
  text-shadow:none;transition:color .35s,text-shadow .35s}
#marks i.got{color:var(--neon);text-shadow:0 0 9px rgba(61,242,255,.85),0 0 22px rgba(61,242,255,.35)}
#stamWrap{position:absolute;left:calc(env(safe-area-inset-left,0px) + 12px);bottom:calc(env(safe-area-inset-bottom,0px) + 182px);
  width:112px;height:3px;background:rgba(255,255,255,.13);overflow:hidden}
#stamBar{display:block;height:100%;width:100%;background:var(--stam);transition:width .25s linear}
#status{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 46px);
  font-size:14px;color:#e2dcd2;text-shadow:0 0 1px #000,0 2px 6px rgba(0,0,0,.9);width:72vw;max-width:320px;text-align:center;line-height:1.75;opacity:.96}
#prompt{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 160px);
  font-size:13px;color:var(--fg);background:rgba(8,12,22,.8);padding:5px 12px;white-space:nowrap;border:1px solid var(--line);
  text-shadow:0 1px 4px #000;opacity:0;transition:opacity .18s;letter-spacing:.05em}
#prompt.on{opacity:1}
#log{position:absolute;right:calc(env(safe-area-inset-right,0px) + 12px);top:calc(env(safe-area-inset-top,0px) + 152px);
  width:min(48vw,250px);font-size:12.5px;line-height:1.75;text-align:right;color:#ddd6c9;text-shadow:0 0 1px #000,0 2px 5px rgba(0,0,0,.85)}
#log div{opacity:0;transition:opacity .5s}
#log div.on{opacity:.95}
#carry{position:absolute;right:calc(env(safe-area-inset-right,0px) + 12px);bottom:calc(env(safe-area-inset-bottom,0px) + 178px);
  font-size:11px;line-height:1.9;color:var(--dim);text-align:right;letter-spacing:.05em;text-shadow:0 1px 3px #000}
#carry span{color:var(--neon)}
#vig{position:absolute;inset:0;transition:box-shadow .8s}
#pulse{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 42%,rgba(61,242,255,.34));opacity:0;transition:opacity .25s}
#ear{position:absolute;inset:0;opacity:0;transition:opacity .5s;
  background:radial-gradient(circle at var(--ex,50%) var(--ey,50%),rgba(61,242,255,.30),rgba(61,242,255,0) 44%)}
#ear.on{opacity:1}
#guide{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 82px);transform:translateX(-50%);
  max-width:70vw;padding:7px 12px;background:rgba(5,12,23,.88);border:1px solid rgba(61,242,255,.65);
  color:#e9fbff;font-size:13px;text-align:center;line-height:1.45;text-shadow:0 1px 3px #000;
  opacity:0;transition:opacity .2s;white-space:nowrap}
#guide.on{opacity:1}
/* 発見した名前のネオン */
#found{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);opacity:0;
  font-size:clamp(30px,10vw,58px);letter-spacing:.3em;color:var(--neon);white-space:nowrap;
  text-shadow:0 0 12px rgba(61,242,255,.9),0 0 34px rgba(61,242,255,.45),0 0 2px #fff}
#found.on{animation:foundIn 1.5s ease-out forwards}
@keyframes foundIn{
  0%{opacity:0;transform:translate(-50%,-50%) scale(1.22);filter:blur(7px)}
  16%{opacity:1;transform:translate(-46%,-50%) scale(1)}
  20%{transform:translate(-52%,-50%)}
  24%{transform:translate(-50%,-50%)}
  74%{opacity:1}
  100%{opacity:0}
}
@media (prefers-reduced-motion: reduce){#found.on{animation:none;opacity:1}}

/* ---------- controls（iOS：ファミコン準拠パッド＋右スティック視点） ---------- */
#ctl{position:fixed;inset:auto 0 0 0;z-index:5;pointer-events:none;
  padding:0 calc(8px + env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) calc(8px + env(safe-area-inset-left,0px))}
#ctl.hide{display:none}
.fc-body{pointer-events:auto;max-width:520px;margin:0 auto}
.fc-plate{display:flex;align-items:flex-end;justify-content:space-between;gap:6px;
  padding:6px 8px;background:linear-gradient(180deg,rgba(12,18,28,.55),rgba(6,10,18,.82));
  border:2px solid rgba(61,242,255,.22);box-shadow:0 4px 0 rgba(0,0,0,.45)}
.fc-col{display:flex;align-items:center;min-width:0}
.fc-col-m{flex:1;flex-direction:column;justify-content:flex-end;gap:2px;padding-bottom:2px}
.fc-col-l,.fc-col-r{flex-direction:column;align-items:center;gap:4px}
.fc-ablabel{font-size:8px;letter-spacing:.18em;color:var(--dim)}
.fc-recess{display:flex;gap:8px;padding:2px 4px 0}
.fc-slot{display:flex;flex-direction:column;align-items:center;gap:1px}
.fc-pill{width:42px;height:14px;border-radius:7px;background:linear-gradient(#2a3344,#151c28);
  border:2px solid #3a4558;box-shadow:inset 0 1px 0 rgba(255,255,255,.12);padding:0}
.fc-pill:active,.fc-pill.is-pressed{transform:translateY(1px);box-shadow:inset 0 2px 4px rgba(0,0,0,.5)}
.fc-print{font-size:7px;letter-spacing:.06em;color:var(--dim)}
.fc-abhouse{display:flex;gap:10px;padding:4px;background:rgba(0,0,0,.25);border-radius:999px;border:1px solid var(--line)}
.fc-round{width:min(14vw,56px);height:min(14vw,56px);border-radius:50%;font-size:13px;font-weight:700;
  letter-spacing:.05em;background:linear-gradient(145deg,#c03848,#8a2030);border:3px solid #2a1018;
  box-shadow:0 3px 0 #1a0808;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.4);padding:0;
  transition:transform .08s ease,opacity .08s ease}
.fc-round#fcA{background:linear-gradient(145deg,#d04838,#902818)}
.fc-round:active,.fc-round.is-pressed{transform:scale(.92);opacity:.88}
.fc-ablabels{display:flex;gap:12px;font-size:9px;color:var(--dim);letter-spacing:.04em}
.dpad{width:min(42vw,148px);height:min(42vw,148px);position:relative;
  background:linear-gradient(145deg,#1a2234,#0c1018);border:3px solid #2a3548;border-radius:4px;
  box-shadow:0 4px 0 rgba(0,0,0,.5);touch-action:none}
.dpad .arr{position:absolute;width:28%;height:28%;display:flex;align-items:center;justify-content:center;
  font-size:11px;color:rgba(200,220,235,.35);pointer-events:none}
.dpad .arr.u{top:3%;left:50%;transform:translateX(-50%)}
.dpad .arr.d{bottom:3%;left:50%;transform:translateX(-50%)}
.dpad .arr.l{left:5%;top:50%;transform:translateY(-50%)}
.dpad .arr.r{right:5%;top:50%;transform:translateY(-50%)}
.dpad.press-u .arr.u,.dpad.press-d .arr.d,.dpad.press-l .arr.l,.dpad.press-r .arr.r{color:var(--neon);text-shadow:0 0 8px rgba(61,242,255,.6)}
.dpad-nub{position:absolute;left:50%;top:50%;width:22%;height:22%;transform:translate(-50%,-50%);
  background:#252f42;border:2px solid #3a4558;border-radius:2px;pointer-events:none}
.stick{width:min(28vw,100px);height:min(28vw,100px);border-radius:50%;border:1px solid var(--line);
  background:radial-gradient(circle,rgba(10,16,26,.2),rgba(10,16,26,.55));position:relative;pointer-events:auto;touch-action:none;
  overflow:visible;transition:opacity .15s}
/* 親指の位置がずれても掴めるよう、見た目の円より広い当たり judgement を持たせる */
.stick::after{content:'';position:absolute;inset:-40px;border-radius:50%}
.stick .knob{position:absolute;left:50%;top:50%;width:44%;height:44%;border-radius:50%;
  background:rgba(200,230,240,.34);border:1px solid rgba(61,242,255,.42);transform:translate(-50%,-50%);pointer-events:none;transition:background .12s}
.stick.on{border-color:rgba(61,242,255,.5)}
.stick.on .knob{background:rgba(61,242,255,.4);box-shadow:0 0 14px rgba(61,242,255,.4)}
.stick em{position:absolute;left:50%;bottom:-15px;transform:translateX(-50%);font-size:9px;font-style:normal;color:var(--dim);letter-spacing:.2em}
button{font-family:inherit;color:var(--fg);background:rgba(10,16,26,.66);border:1px solid var(--line);cursor:pointer;
  transition:transform .08s ease,opacity .08s ease}
button:active{transform:scale(.92);opacity:.88;background:rgba(61,242,255,.18)}
button:focus-visible{outline:2px solid var(--neon);outline-offset:2px}
#fcA.hot{border-color:var(--neon);box-shadow:0 0 14px rgba(61,242,255,.45)}
#fcB.on{background:linear-gradient(145deg,#4a6888,#2a4058)}
#topbtns{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:calc(env(safe-area-inset-right,0px) + 12px);z-index:6;display:flex;gap:6px}
#topbtns button{width:36px;height:30px;font-size:11px;letter-spacing:.04em}
#sideL{position:fixed;left:calc(env(safe-area-inset-left,0px) + 12px);bottom:calc(env(safe-area-inset-bottom,0px) + 250px);z-index:6;display:flex;flex-direction:column;gap:6px}
#sideL button{width:58px;min-height:44px;font-size:11px;letter-spacing:.06em}
#callLine{position:absolute;left:12px;right:12px;top:18%;text-align:center;font-size:clamp(32px,9vw,56px);
  letter-spacing:.16em;color:#f4f0e6;text-shadow:0 2px 0 #14110c,0 0 16px rgba(0,0,0,.75);
  opacity:0;transition:opacity .25s}
#callLine.on{opacity:1}
#sideL button.on{background:rgba(61,242,255,.26)}
#bListen{border-color:rgba(61,242,255,.7);color:#e9fbff;background:rgba(8,30,43,.82)}
#kbhint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 8px);
  font-size:10px;color:var(--dim);letter-spacing:.08em;z-index:4;pointer-events:none;white-space:nowrap}

/* ---------- overlays ---------- */
.sheet{position:fixed;inset:0;z-index:32;display:none;align-items:center;justify-content:center;padding:18px;
  background:linear-gradient(rgba(4,7,14,.88),rgba(4,7,14,.96));overflow:auto;overscroll-behavior:contain}
body.sheet-open #hud,body.sheet-open #topbtns,body.sheet-open #sideL,body.sheet-open #ctl,body.sheet-open #kbhint{
  visibility:hidden;pointer-events:none}
.sheet.on{display:flex}
/* 背景の絵を見せる画面だけ覆いを薄くし、文字は影で読ませる */
.sheet.art{background:linear-gradient(rgba(4,7,14,.30),rgba(4,7,14,.62) 42%,rgba(4,7,14,.86))}
.sheet.art .panel p,.sheet.art .kv,.sheet.art h2{text-shadow:0 1px 3px #000,0 2px 12px rgba(0,0,0,.95)}
.sheet.art .go{background:rgba(6,12,22,.72)}
.panel{width:100%;max-width:460px}
h1{font-size:clamp(30px,8.6vw,50px);margin:0;font-weight:400;letter-spacing:.12em;line-height:1.2}
h1 small{display:block;font-size:12px;letter-spacing:.34em;color:var(--dim);margin-top:12px}
h1.neon{color:#f3fbff;text-shadow:0 0 6px rgba(61,242,255,.9),0 0 20px rgba(61,242,255,.5),0 0 42px rgba(61,242,255,.22),0 2px 0 rgba(255,46,91,.35)}
h1.neon small{color:var(--neon);text-shadow:0 0 10px rgba(61,242,255,.6)}
h1.shu{color:#fff1f3;text-shadow:0 0 6px rgba(255,46,91,.9),0 0 20px rgba(255,46,91,.45),0 0 40px rgba(255,46,91,.2)}
h1.shu small{color:var(--shu);text-shadow:0 0 10px rgba(255,46,91,.55)}
h1.kin{color:#fff8e8;text-shadow:0 0 6px rgba(242,193,78,.9),0 0 22px rgba(242,193,78,.45),0 0 44px rgba(242,193,78,.2)}
h1.kin small{color:var(--kin);text-shadow:0 0 10px rgba(242,193,78,.55)}
.rule{height:1px;background:linear-gradient(90deg,transparent,var(--line) 12%,var(--line) 88%,transparent);margin:18px 0}
.panel p{font-size:13.5px;line-height:2;margin:0 0 14px;color:#c6ccd6}
.panel p.q{color:var(--dim);font-size:12px;line-height:1.95}
.panel h2{font-size:12px;letter-spacing:.24em;color:var(--dim);font-weight:400;margin:20px 0 10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12px;line-height:1.8;color:#bcc4d0}
.kv b{font-weight:400;color:var(--dim);white-space:nowrap}
.kv span.hit{color:var(--neon)}
.kv span.miss{color:var(--shu)}
.go{display:block;width:100%;padding:15px;margin-top:14px;font-size:15px;letter-spacing:.24em;background:rgba(61,242,255,.09)}
.go.sub{padding:11px;font-size:13px;letter-spacing:.2em;background:rgba(255,255,255,.04)}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13px}
.opt:last-of-type{border-bottom:0}
.opt input[type=range]{width:132px;accent-color:#3df2ff}
.tgl{width:66px;height:28px;font-size:11px;letter-spacing:.1em}
.tgl.on{background:rgba(61,242,255,.28)}
#mapc{width:100%;height:auto;display:block;background:#0b1018;border:1px solid var(--line)}
.mapnote{font-size:11px;color:var(--dim);line-height:1.85;margin-top:10px}

/* ---------- じゃんけん ---------- */
#janHands{display:flex;gap:10px;margin:16px 0 4px}
#janHands button{flex:1;padding:18px 0;font-size:15px;letter-spacing:.14em}
#janHands button:disabled{opacity:.35}
#janBoard{margin-top:14px}
#janCount{position:fixed;inset:0;z-index:34;display:none;align-items:center;justify-content:center;
  background:#04070e;color:var(--neon);font-size:clamp(64px,26vw,190px);letter-spacing:.1em;
  text-shadow:0 0 18px rgba(61,242,255,.8),0 0 60px rgba(61,242,255,.3)}
#janCount.on{display:flex}
#janCount small{position:absolute;bottom:16%;left:0;right:0;text-align:center;font-size:13px;letter-spacing:.4em;color:var(--dim);text-shadow:none}

@media (prefers-reduced-motion: reduce){#status,#prompt,#log div,#vig,#ear{transition:none}}
@media (max-height:680px){
  .dpad{width:120px;height:120px} .stick{width:88px;height:88px} .fc-round{width:50px;height:50px;font-size:11px}
  #carry{bottom:calc(env(safe-area-inset-bottom,0px) + 148px)}
  #marks{bottom:calc(env(safe-area-inset-bottom,0px) + 170px)}
  #stamWrap{bottom:calc(env(safe-area-inset-bottom,0px) + 154px)}
  #prompt{bottom:calc(env(safe-area-inset-bottom,0px) + 132px)}
  #sideL{bottom:calc(env(safe-area-inset-bottom,0px) + 214px)}
  #log{top:calc(env(safe-area-inset-top,0px) + 132px)}
}

/* ---------- 横持ち（探すゲームなので、画面をできるだけ広くあける） ---------- */
#rotate{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;pointer-events:none;
  background:#04070e;color:var(--fg);text-align:center;letter-spacing:.18em;font-size:15px;line-height:2.3}
#rotate b{color:var(--neon);font-weight:400;text-shadow:0 0 12px rgba(61,242,255,.6)}
#rotate small{display:block;margin-top:16px;font-size:11px;color:var(--dim);letter-spacing:.24em}
@media (orientation:portrait) and (pointer:coarse){#rotate{display:flex}}

@media (orientation:landscape) and (max-height:560px){
  /* ファミコン筐体の板をやめ、十字キーとボタンを両隅へ寄せて視界を空ける */
  .fc-body{max-width:none}
  .fc-plate{background:none;border:0;box-shadow:none;padding:0}
  .fc-recess{display:none}                 /* START/SELECT は右上の 地図／Ⅱ に集約済み */
  .dpad{width:min(40vh,132px);height:min(40vh,132px)}
  .stick{width:min(26vh,86px);height:min(26vh,86px)}
  .fc-round{width:min(16vh,52px);height:min(16vh,52px);font-size:12px}
  /* 左上は「時刻・残り・五人・息」を縦に積む。左下は十字キーのために空ける */
  #readout{font-size:11px;line-height:1.7}
  #marks{top:calc(env(safe-area-inset-top,0px) + 52px)!important;bottom:auto!important;gap:5px}
  #marks i{font-size:13px}
  #stamWrap{top:calc(env(safe-area-inset-top,0px) + 74px)!important;bottom:auto!important;width:92px}
  #sideL{top:calc(env(safe-area-inset-top,0px) + 88px)!important;bottom:auto!important;gap:4px}
  #sideL button{width:50px;min-height:34px;font-size:10px}
  #sideL button{width:60px;min-height:44px}
  #log{top:calc(env(safe-area-inset-top,0px) + 42px)!important;width:min(30vw,216px);font-size:11px;line-height:1.6}
  #carry{bottom:calc(env(safe-area-inset-bottom,0px) + 190px);font-size:10.5px;line-height:1.8}
  #prompt{bottom:calc(env(safe-area-inset-bottom,0px) + 10px)}
  #status{top:calc(env(safe-area-inset-top,0px) + 28px);font-size:12.5px;width:46vw}
  #callLine{top:24%;font-size:clamp(28px,6.5vw,52px)}
  h1{font-size:clamp(22px,4.6vw,34px)}
  h1 small{margin-top:4px}
  .sheet{padding:8px}
  .panel{max-width:min(540px,92vw);max-height:calc(100dvh - 16px);overflow:auto}
  .rule{margin:10px 0}
  .go{padding:10px;margin-top:8px;font-size:13px}
  .opt{padding:7px 0;font-size:12px}
  .panel p{font-size:12.5px;margin:0 0 8px;line-height:1.7}
  #mapc{max-height:28vh}
}

</style>
</head>
<body class="sheet-open">
<div class="sheet art on" id="shTitle"><div class="panel">
  <h1 class="neon">或る孤島の<br>かくれんぼ<small>日 暮 れ ま で に 、 五 人</small></h1>
  <div class="rule"></div>
  <button class="go" id="bStart">じ ゃ ん け ん を す る</button>
  <p class="q" id="bestRec" style="text-align:center;margin-top:14px"></p>
</div></div>

<div class="sheet art" id="shJan"><div class="panel">
  <h1 class="neon">じゃんけん<small>六 人 の 輪</small></h1>
  <div class="rule"></div>
  <p id="janTxt">だれが鬼になるか。手を出せ。</p>
  <div id="janHands">
    <button class="jan" data-h="0" aria-label="グーを出す">グー</button>
    <button class="jan" data-h="1" aria-label="チョキを出す">チョキ</button>
    <button class="jan" data-h="2" aria-label="パーを出す">パー</button>
  </div>
  <div class="kv" id="janBoard"></div>
  <p class="q" id="janRound"></p>
</div></div>

<div id="janCount"><span id="janNum">０</span><small>お に は 目 を つ ぶ る</small></div>

<canvas id="scene"></canvas>

<div id="hud">
  <div id="readout" class="mono"></div>
  <canvas id="compass" width="260" height="20"></canvas>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
let near=null;

/* ==========================================================================
   1. コントロールパネル（設定の保存／入力／ポーズ／ミュート）
      ゲームロジックより先に、ここだけで成立する状態を作る。
      2026-09-26: 操作性の改善8点（SPEC §5）をこの節に集約した。
   ========================================================================== */
let AC=null,master=null,noiseBuf=null,windG=null,surfG=null,neonG=null,neonF=null;
let state='title',last=performance.now();

const KEY='tg.259.';
const store={
  get(k,d){try{const v=localStorage.getItem(KEY+k);return v===null?d:JSON.parse(v);}catch(e){return d;}},
  set(k,v){try{localStorage.setItem(KEY+k,JSON.stringify(v));}catch(e){}}
};
const S={
  mute:store.get('mute',false), vol:store.get('vol',.7), sens:store.get('sens',1),
  bob:store.get('bob',true),    pad:store.get('pad',isTouch),
  scan:store.get('scan',true), bgm:store.get('bgm',true)
};
const LIMIT=360;                                   // 日暮れまで6分（SPEC §2）
const fmtClock=s=>{const m=(1020+s*.30)|0;return String(((m/60)|0)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0');};
const fmtDur=s=>{s=Math.max(0,s|0);return ((s/60)|0)+'分'+String(s%60).padStart(2,'0')+'秒';};

/* BGM「鬼が笑う夜の隅」（bgm-oni-no-yoru.mp3）。ミュートと音量はゲーム内の音と同じつまみに従う */
const bgmEl=$('bgm');
function bgmSync(){
  const on=S.bgm&&!S.mute;
  bgmEl.volume=clamp(S.vol*.62,0,1);
  if(on){ if(bgmEl.paused){const p=bgmEl.play();if(p&&p.catch)p.catch(()=>{});} }
  else if(!bgmEl.paused)bgmEl.pause();
}
function syncCfg(){
  const tg=(id,v)=>{$(id).textContent=v?'ON':'OFF';$(id).classList.toggle('on',v);};
  tg('oMute',S.mute);tg('oBob',S.bob);tg('oPad',S.pad);tg('oScan',S.scan);tg('oBgm',S.bgm);
  $('oVol').value=S.vol;$('oSens').value=S.sens;
  $('ctl').classList.toggle('hide',!S.pad);
  $('scan').classList.toggle('on',S.scan);
  if(master)master.gain.value=S.mute?0:S.vol;
  bgmSync();
  syncLabels();
}
function actionLabel(n){
  if(!n)return '耳を澄ます';
  if(n.type==='kid')return 'みつけた';
  return '見る';
}
function syncLabels(){
  const a=actionLabel(near);
  const ba=$('fcA');
  ba.textContent=a;
  ba.classList.toggle('hot',!!near&&near.type==='kid');
  ba.setAttribute('aria-label',a);
  $('labA').textContent='A '+a;
  $('labB').textContent='B ダッシュ切替';
  $('fcB').setAttribute('aria-label','ダッシュ切替');
  if(!isTouch){
    const run='Shift ダッシュ切替';
    $('kbhint').textContent='W A S D 移動　Q E 振り向く　'+run+'　C+前進 登る　Space '+a+'　Tab 耳を澄ます　F 明かり　M 地図　P 中断';
  }
}
function sheet(id,on){
  $(id).classList.toggle('on',on);
  document.body.classList.toggle('sheet-open',!!document.querySelector('.sheet.on'));
}
const sheetOpen=id=>$(id).classList.contains('on');
function opt(id,key,prop){$(id).onclick=()=>{S[prop]=!S[prop];store.set(key,S[prop]);syncCfg();};}
opt('oMute','mute','mute');opt('oBob','bob','bob');opt('oPad','pad','pad');
opt('oScan','scan','scan');opt('oBgm','bgm','bgm');
$('bPad').onclick=()=>{S.pad=!S.pad;store.set('pad',S.pad);syncCfg();};
$('oVol').oninput=e=>{S.vol=+e.target.value;store.set('vol',S.vol);syncCfg();};
$('oSens').oninput=e=>{S.sens=+e.target.value;store.set('sens',S.sens);};

/* --- ポーズ（改善6：1行の文字ではなく、そこから操作できる画面にする） --- */
let resumeTo='';                                   // 設定・地図から戻る先
function openCfg(from){resumeTo=from||'';if(state==='play')state='pause';sheet('shCfg',true);}
$('bCfg').onclick=()=>openCfg('');
$('bPCfg').onclick=()=>{sheet('shPause',false);openCfg('shPause');};
function tryResumePlay(){
  if(state!=='pause'||sheetOpen('shPause')||portraitLocked())return;
  state='play';last=performance.now();
}
$('bCfgClose').onclick=()=>{
  sheet('shCfg',false);
  if(resumeTo){sheet(resumeTo,true);resumeTo='';}
  else tryResumePlay();
};
function toggleMap(from){
  if(sheetOpen('shMap')){sheet('shMap',false);
    if(resumeTo){sheet(resumeTo,true);resumeTo='';}
    else tryResumePlay();
    return;}
  if(state!=='play'&&state!=='pause')return;
  resumeTo=from||'';if(state==='play')state='pause';
  drawMap();sheet('shMap',true);
}
$('bMap').onclick=()=>toggleMap('');
$('bPMap').onclick=()=>{sheet('shPause',false);toggleMap('shPause');};
$('bMapClose').onclick=()=>toggleMap();

function pauseInfo(){
  const left=Math.max(0,LIMIT-t);
  $('pauseInfo').innerHTML='<b>日暮れまで</b><span'+(left<60?' class="miss"':'')+'>'+fmtDur(left)+'</span>'
    +'<b>みつけた</b><span class="hit">'+foundCount()+' / 5</span>'
    +'<b>まだの子</b><span>'+(kids.filter(k=>!k.found).map(k=>k.name).join('　')||'いない')+'</span>';
}
function togglePause(){
  if(state==='play'){state='pause';pauseInfo();sheet('shPause',true);bgmEl.pause();}
  else if(state==='pause'&&sheetOpen('shPause')){
    if(portraitLocked())return;
    sheet('shPause',false);state='play';last=performance.now();bgmSync();
  }
}
$('bPause').onclick=togglePause;
$('bResume').onclick=togglePause;
$('bPQuit').onclick=()=>location.reload();
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play'){state='pause';pauseInfo();sheet('shPause',true);}});
/* 縦持ちのあいだは進行を止める。案内の下にタップが抜けても、開始と再開は受けない */
const mqPortrait=matchMedia('(orientation:portrait) and (pointer:coarse)');
const portraitLocked=()=>mqPortrait.matches;
const rotateGate=()=>{
  if(!portraitLocked())return;
  if(state==='play'){state='pause';pauseInfo();sheet('shPause',true);bgmEl.pause();}
};
mqPortrait.addEventListener?mqPortrait.addEventListener('change',rotateGate):mqPortrait.addListener(rotateGate);
rotateGate();

/* --- キーボード --- */
const keys={};
addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(e.code==='KeyP'||e.code==='Escape')togglePause();
  else if(e.code==='KeyM')toggleMap('');
  else if(e.code==='KeyO')openCfg('');
  else if(e.code==='KeyF')toggleLight();
  else if(e.code==='Digit0'){S.mute=!S.mute;store.set('mute',S.mute);syncCfg();}
  else if(e.code==='Tab'){e.preventDefault();listen();}
  else if(e.code==='Space'||e.code==='Enter'){e.preventDefault();doAction();}
  else if((e.code==='ShiftLeft'||e.code==='ShiftRight')&&!e.repeat){e.preventDefault();runOn();}
});
addEventListener('keyup',e=>{
  keys[e.code]=false;
});

/* --- スティック（改善1：フローティング／改善2：デッドゾーンと非線形カーブ） --- */
let sx=0,sy=0,running=false;
const DZ=.16;
function curve(v,p){                                // デッドゾーンを切り、残りを p 乗で伸ばす
  const a=Math.abs(v);
  if(a<DZ)return 0;
  const n=(a-DZ)/(1-DZ);
  return Math.sign(v)*Math.pow(n,p);
}
function bindStick(el,cb,pow){
  let id=null,cx=0,cy=0,home=null;
  const k=el.querySelector('.knob'),R=48;
  const mv=e=>{
    let dx=e.clientX-cx,dy=e.clientY-cy;const l=Math.hypot(dx,dy);
    if(l>R){dx*=R/l;dy*=R/l;}
    k.style.transform='translate(calc(-50% + '+dx.toFixed(1)+'px),calc(-50% + '+dy.toFixed(1)+'px))';
    cb(curve(dx/R,pow),curve(dy/R,pow),Math.min(1,l/R));
  };
  el.addEventListener('pointerdown',e=>{
    e.preventDefault();id=e.pointerId;
    try{el.setPointerCapture(id);}catch(_){}
    const r=el.getBoundingClientRect();
    if(!home)home={x:r.left+r.width/2,y:r.top+r.height/2};
    // 触った場所を中心にする。輪ごとそこへ寄せるので、指と円がずれない
    cx=e.clientX;cy=e.clientY;
    el.style.transform='translate('+(cx-home.x).toFixed(1)+'px,'+(cy-home.y).toFixed(1)+'px)';
    el.classList.add('on');mv(e);
  });
  el.addEventListener('pointermove',e=>{if(e.pointerId===id)mv(e);});
  const up=e=>{
    if(e.pointerId!==id)return;id=null;
    el.classList.remove('on');el.style.transform='';
    k.style.transform='translate(-50%,-50%)';cb(0,0,0);
  };
  ['pointerup','pointercancel','lostpointercapture'].forEach(t=>el.addEventListener(t,up));
}
let moveMag=0;

/* --- 走る（Bを押すたびにダッシュと歩きを切り替える） --- */
function setRun(v){ running=!!v; $('fcB').classList.toggle('on',running); }
function runOn(){ setRun(!running); }
function tapFb(){try{navigator.vibrate&&navigator.vibrate(14);}catch(_){}}
function bindTap(el,fn){
  el.addEventListener('pointerdown',e=>{e.preventDefault();try{el.setPointerCapture(e.pointerId);}catch(_){}
    el.classList.add('is-pressed');tapFb();fn();});
  const up=()=>el.classList.remove('is-pressed');
  ['pointerup','pointercancel','lostpointercapture'].forEach(t=>el.addEventListener(t,up));
}
const padK={l:0,r:0,u:0,d:0};
function bindDpad(el){
  const set=e=>{
    const r=el.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
    padK.l=x<-.12?1:0;padK.r=x>.12?1:0;padK.u=y<-.12?1:0;padK.d=y>.12?1:0;
    el.classList.toggle('press-l',padK.l);el.classList.toggle('press-r',padK.r);
    el.classList.toggle('press-u',padK.u);el.classList.toggle('press-d',padK.d);
  };
  const clear=()=>{padK.l=padK.r=padK.u=padK.d=0;el.classList.remove('press-l','press-r','press-u','press-d');};
  el.addEventListener('pointerdown',e=>{e.preventDefault();try{el.setPointerCapture(e.pointerId);}catch(_){}set(e);});
  el.addEventListener('pointermove',e=>{if(el.hasPointerCapture(e.pointerId))set(e);});
  ['pointerup','pointercancel','lostpointercapture'].forEach(t=>el.addEventListener(t,clear));
}
bindDpad($('dpad'));
bindTap($('fcB'),runOn);
bindTap($('fcA'),()=>doAction());
bindTap($('fcStart'),()=>togglePause());
bindTap($('fcSelect'),()=>toggleMap(''));
let lastTouchEnd=0;
document.addEventListener('touchend',e=>{const now=Date.now();if(now-lastTouchEnd<=300)e.preventDefault();lastTouchEnd=now;},{passive:false});
document.addEventListener('touchmove',e=>{if(e.target.closest('.sheet'))return;e.preventDefault();},{passive:false});
document.addEventListener('dblclick',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('selectstart',e=>e.preventDefault());

bindStick($('stLook'),(x,y)=>{sx=x;sy=y;},2);
$('bLight').addEventListener('pointerdown',e=>{e.preventDefault();tapFb();toggleLight();});
bindTap($('bListen'),()=>listen());
let climbHeld=false;
const climbBtn=$('bClimb');
climbBtn.addEventListener('pointerdown',e=>{e.preventDefault();climbHeld=true;climbBtn.classList.add('on');try{climbBtn.setPointerCapture(e.pointerId);}catch(_){}});
['pointerup','pointercancel','lostpointercapture'].forEach(type=>climbBtn.addEventListener(type,()=>{climbHeld=false;climbBtn.classList.remove('on');}));

/* --- 画面ドラッグ（軽いタップは［みつけた］／感度を画面幅で正規化） --- */
const cv=$('scene');
let dragId=null,dx0=0,dy0=0,tapT=0,tapMove=0;
const lookK=()=>3.1/Math.min(innerWidth,innerHeight);
cv.addEventListener('pointerdown',e=>{
  if(state!=='play')return;
  dragId=e.pointerId;dx0=e.clientX;dy0=e.clientY;tapT=performance.now();tapMove=0;
  try{cv.setPointerCapture(dragId);}catch(_){}
});
cv.addEventListener('pointermove',e=>{
  if(e.pointerId!==dragId)return;
  const mx=e.clientX-dx0,my=e.clientY-dy0;
  tapMove+=Math.abs(mx)+Math.abs(my);
  P.yaw-=mx*lookK()*S.sens;
  P.pitch=clamp(P.pitch-my*lookK()*S.sens,-1.1,1.1);
  dx0=e.clientX;dy0=e.clientY;
});
['pointerup','pointercancel','lostpointercapture'].forEach(t=>cv.addEventListener(t,e=>{
  if(e.pointerId!==dragId)return;
  dragId=null;
  if(t==='pointerup'&&tapMove<12&&performance.now()-tapT<280)doAction();
}));

/* --- ゲームパッド --- */
const gpv={mx:0,my:0,lx:0,ly:0,run:false};const gpPrev={};
function pollPad(){
  const list=navigator.getGamepads?navigator.getGamepads():[];
  for(let i=0;i<list.length;i++){
    const g=list[i];if(!g)continue;
    const b=n=>!!(g.buttons[n]&&g.buttons[n].pressed);
    gpv.mx=curve(g.axes[0]||0,1.35);gpv.my=curve(g.axes[1]||0,1.35);
    gpv.lx=curve(g.axes[2]||0,2);gpv.ly=curve(g.axes[3]||0,2);
    if(b(12))gpv.my=-1;if(b(13))gpv.my=1;if(b(14))gpv.mx=-1;if(b(15))gpv.mx=1;
    gpv.run=false;
    const edge=(n,fn)=>{const now=b(n);if(now&&!gpPrev[n])fn();gpPrev[n]=now;};
    edge(2,doAction);edge(1,doAction);edge(3,toggleLight);edge(4,()=>toggleMap(''));edge(9,togglePause);
    edge(0,()=>{if(state==='title')$('bStart').click(); else runOn();});
    edge(5,runOn);edge(7,runOn);
    return;
  }
  gpv.mx=gpv.my=gpv.lx=gpv.ly=0;gpv.run=false;
}

$('kbhint').textContent='';
syncCfg();
{const b=store.get('bestFind',0);if(b)$('bestRec').textContent='五人そろえた最短　'+fmtDur(b);}

/* ==========================================================================
   2. 音（効果音は合成。BGMだけ外部ファイル。長調のアルペジオは鳴らさない）
      気配は「どちらから聞こえるか」が手がかりなので、すべて左右に振る。
   ========================================================================== */
function audioInit(){
  if(AC)return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=S.mute?0:S.vol;master.connect(AC.destination);
    const len=AC.sampleRate*3;noiseBuf=AC.createBuffer(1,len,AC.sampleRate);
    const d=noiseBuf.getChannelData(0);let lp=0;
    for(let i=0;i<len;i++){const w=Math.random()*2-1;lp=lp*.7+w*.3;d[i]=lp*1.5;}
    const layer=(cut,type,gain,q)=>{
      const s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;
      const f=AC.createBiquadFilter();f.type=type;f.frequency.value=cut;if(q)f.Q.value=q;
      const g=AC.createGain();g.gain.value=gain;
      s.connect(f).connect(g).connect(master);s.start();return {g:g,f:f};
    };
    windG=layer(520,'lowpass',.05).g;
    surfG=layer(240,'lowpass',.06).g;
    const n=layer(1450,'bandpass',0,7);neonG=n.g;neonF=n.f;   // 日が落ちてから灯るネオンの唸り
  }catch(e){AC=null;}
}
/* pan: -1=左 0=正面 1=右。対応していない端末では素通り */
function panner(p){
  if(!AC||p===undefined||p===null)return master;
  try{const n=AC.createStereoPanner();n.pan.value=clamp(p,-1,1);n.connect(master);return n;}
  catch(e){return master;}
}
function burst(cut,dur,vol,type,q,pan){
  if(!AC)return;const t0=AC.currentTime;
  const s=AC.createBufferSource();s.buffer=noiseBuf;s.playbackRate.value=.7+Math.random()*.6;

function box(w,h,d,mat,x,y,z,collide,uv){

function mesaFace(x,z,mx,mz,cy){

function inShelterAt(x,z){
  for(let i=0;i<shelters.length;i++){const s=shelters[i];
    if(x>s.x-s.w/2&&x<s.x+s.w/2&&z>s.z-s.d/2&&z<s.z+s.d/2)return true;}
  return false;
}
/* いちばん近い遮蔽物。HIDE_REACH 以内でなければ「隠れていない」＝道端に立っている。
   2026-09-27: 身を寄せる距離まで詰める。
   2026-09-27夕: 壁のそばに立つだけでは不可。物陰の裏側（広場から見て隠れる側）に寄せる。 */
const HIDE_REACH=.72, HIDE_MIN_H=.8;
function coverNear(x,z,maxD){
  let best=null,bd=maxD||HIDE_REACH;
  for(let i=0;i<covers.length;i++){
    const c=covers[i];
    if(c.h<HIDE_MIN_H)continue;
    const dx=Math.max(Math.abs(x-c.x)-c.w/2,0),dz=Math.max(Math.abs(z-c.z)-c.d/2,0);
    const d=Math.hypot(dx,dz);
    if(d<bd){bd=d;best=c;}
  }
  return best;
}
function coverDist(c,x,z){
  const dx=Math.max(Math.abs(x-c.x)-c.w/2,0),dz=Math.max(Math.abs(z-c.z)-c.d/2,0);
  return Math.hypot(dx,dz);
}
function openSides(x,z){
  let n=0;
  for(const v of [[1.6,0],[-1.6,0],[0,1.6],[0,-1.6]]){
    const nx=x+v[0],nz=z+v[1];
    if(inBounds(nx,nz)&&!hit(nx,nz)&&!coverNear(nx,nz,.55))n++;
  }
  return n;
}
function cornered(x,z){
  const near=[];
  for(let i=0;i<covers.length;i++){
    const c=covers[i];
    if(c.h<HIDE_MIN_H)continue;
    if(coverDist(c,x,z)<1.35)near.push(c);
  }
  if(near.length<2)return false;
  for(let i=0;i<near.length;i++){
    for(let j=i+1;j<near.length;j++){
      const a=Math.atan2(near[i].x-x,near[i].z-z);
      const b=Math.atan2(near[j].x-x,near[j].z-z);
      let d=Math.abs(a-b);if(d>Math.PI)d=Math.PI*2-d;
      if(d>.7)return true;                       // 二つの物が角を作っている
    }
  }
  return false;
}
function hideOk(x,z){
  if(inShelterAt(x,z))return true;
  if(!coverNear(x,z,HIDE_REACH))return false;
  if(openSides(x,z)<=1)return true;              // 出口が一方だけの窪み
  return cornered(x,z);                          // 長い壁の道端立ちは不可
}
function hideFacing(x,z){
  const c=coverNear(x,z,60);
  if(!c)return Math.random()*6.2832;
  return Math.atan2(c.x-x,c.z-z)+Math.PI;
}
/* 物の陰へ寄せる。広場側に顔を出す位置は、反対側へ回す */
function tuckHide(x,z){
  if(inShelterAt(x,z)){
    let best=null,bd=1e9;
    for(let i=0;i<covers.length;i++){
      const c=covers[i];
      if(c.h<1.6)continue;
      const d=coverDist(c,x,z);
      if(d<bd){bd=d;best=c;}
    }
    if(!best)return {x:x,z:z};
    const sx=Math.sign(x-best.x)||1,sz=Math.sign(z-best.z)||1;
    const nx=best.x+sx*(best.w/2+.42),nz=best.z+sz*(best.d/2+.42);
    return canStand(nx,nz,groundY(nx,nz))?{x:nx,z:nz}:{x:x,z:z};
  }
  const c=coverNear(x,z,8);
  if(!c)return {x:x,z:z};
  const fromPlaza=Math.atan2(PLAZA.x-c.x,PLAZA.z-c.z);
  const ox=-Math.sin(fromPlaza),oz=-Math.cos(fromPlaza);
  const nx=c.x+ox*(c.w/2+.48),nz=c.z+oz*(c.d/2+.48);
  if(canStand(nx,nz,groundY(nx,nz))&&hideOk(nx,nz))return {x:nx,z:nz};
  const sides=[[c.w/2+.48,0],[-(c.w/2+.48),0],[0,c.d/2+.48],[0,-(c.d/2+.48)]];
  let pick=null,ps=1e9;
  for(const s of sides){
    const px=c.x+s[0],pz=c.z+s[1];
    if(!canStand(px,pz,groundY(px,pz)))continue;
    if(!hideOk(px,pz)&&!coverNear(px,pz,.8))continue;
    const open=openSides(px,pz);
    if(open<ps){ps=open;pick={x:px,z:pz};}
  }
  return pick||{x:x,z:z};
}

/* 1階の室内（床・低い天井・奥壁＋間仕切り。外壁の高さとは別） */
function buildInterior(x,z,w,d,h,door){
  const t=.7,iw=w-t*2.6,id=d-t*2.6;
  const roomH=Math.min(3.85,Math.max(3.05,h*.42));
  const yMid=roomH*.46,thick=.48,wallY=roomH*.9;

  box(iw,.14,id,M.intFloor,x,.07,z,false,false);
  box(iw*.8,.18,id*.6,M.roof,x,roomH,z-id*.08,false,false);
  if(door==='n')box(iw*.72,wallY,thick,M.intWall,x-iw*.3,yMid,z,false,false);
  else if(door==='s')box(iw*.72,wallY,thick,M.intWall,x+iw*.3,yMid,z,false,false);
  else if(door==='e')box(thick,wallY,id*.72,M.intWall,x,yMid,z-id*.3,false,false);
  else box(thick,wallY,id*.72,M.intWall,x,yMid,z+id*.3,false,false);
  if(door==='n'||door==='s'){
    const wx=x+(door==='n'?1:-1)*iw*.16;
    box(thick,wallY,id*.36,M.intWall,wx,yMid,z-id*.28,false,false);
    box(thick,wallY,id*.36,M.intWall,wx,yMid,z+id*.28,false,false);
  }else{
    const wz=z+(door==='e'?1:-1)*id*.16;
    box(iw*.36,wallY,thick,M.intWall,x-iw*.28,yMid,wz,false,false);
    box(iw*.36,wallY,thick,M.intWall,x+iw*.28,yMid,wz,false,false);
  }
}
function shelter(x,z,w,d,h,name,door){
  const t=.7,gap=3.6;
  const wall=(cx,cz,cw,cd)=>{
    const g=new THREE.BoxGeometry(cw,h,cd);scaleUV(g,cw,h,cd);
    const m=new THREE.Mesh(g,MATS6);m.position.set(cx,h/2,cz);scene.add(m);
    colliders.push({x:cx,z:cz,w:cw,d:cd});
  };
  // 南北の壁（x方向の端） s:'s'=x小 / 'n'=x大
  [[-1,'s'],[1,'n']].forEach(p=>{
    const cx=x+p[0]*(w/2-t/2);
    if(door===p[1]){ wall(cx,z-(d+gap)/4,t,(d-gap)/2); wall(cx,z+(d+gap)/4,t,(d-gap)/2); }
    else wall(cx,z,t,d);
  });
  // 東西の壁（z方向の端） 'w'=z小 / 'e'=z大
  [[-1,'w'],[1,'e']].forEach(p=>{
    const cz=z+p[0]*(d/2-t/2);
    if(door===p[1]){ wall(x-(w+gap)/4,cz,(w-gap)/2,t); wall(x+(w+gap)/4,cz,(w-gap)/2,t); }
    else wall(x,cz,w,t);
  });
  // 崩れ残った床スラブ＝屋根のかわり
  box(w*.8,.45,d*.8,M.roof,x,h*.4,z,false,false);
  box(w*.5,.45,d*.5,M.roof,x-w*.1,h*.76,z+d*.08,false,false);
  shelters.push({x:x,z:z,w:w-t*2.6,d:d-t*2.6,door:door});
  buildInterior(x,z,w,d,h,door);
  covers.push({x:x,z:z,w:w,d:d,h:h});
  BLD.push({x:x,z:z,w:w,d:d,h:h,name:name,enter:true});
  rubbleAround(x,z,w,d);
  facade(x,z,w,d,h,door);
}

function keepLane(z0,z1,x0,x1){
  for(let i=colliders.length-1;i>=0;i--){
    const c=colliders[i];
    const overlap=!(c.z+c.d/2<z0||c.z-c.d/2>z1||c.x+c.w/2<x0||c.x-c.w/2>x1);
    if(!overlap)continue;
    if(c.w>20||c.d>20)continue;                 // 建物本体は残す
    colliders.splice(i,1);
  }
}

/* ==========================================================================
   4. 隠れ場所（拾う物は無い。かくれんぼなので、島に落ちているのは瓦礫だけ）
   ========================================================================== */
/* 候補座標が壁の中に入っていたら、螺旋に探して立てる点へ寄せる */
function freeSpot(x,z,requireHide){
  const ok=(nx,nz)=>{
    const gy=groundY(nx,nz);
    if(!canStand(nx,nz,gy))return null;
    if(requireHide&&!hideOk(nx,nz))return null;
    return {x:nx,z:nz};
  };
  let p=ok(x,z);
  if(p)return p;
  /* 隠れ場所は遠くへ逃がさない（外すと道端まで流れる）。それ以外は広く探す */
  const maxR=requireHide?2.2:18;
  for(let r=1;r<=maxR;r++){
    for(let a=0;a<16;a++){
      const th=a/16*6.2832,nx=x+Math.cos(th)*r*1.05,nz=z+Math.sin(th)*r*1.05;
      p=ok(nx,nz);if(p)return p;
    }
  }
  if(requireHide){
    for(let t=0;t<24;t++){
      const s=shelters[(Math.random()*shelters.length)|0];
      const nx=s.x+(Math.random()-.5)*s.w*.75,nz=s.z+(Math.random()-.5)*s.d*.75;
      p=ok(nx,nz);if(p)return p;
    }
  }
  p=ok(x,z);
  const raw=p||{x:x,z:z};
  if(requireHide){
    const t=tuckHide(raw.x,raw.z);
    if(ok(t.x,t.z))return t;
    let best=null,bd=1e9;
    for(const key in NOOK){
      const n=NOOK[key];
      const d=Math.hypot(n.x-x,n.z-z);
      if(d<bd&&ok(n.x,n.z)){bd=d;best={x:n.x,z:n.z};}
    }
    if(best)return best;
  }
  return raw;
}

/* 広場から歩いて塗れるマス。屋根の上や段の壁の向こうには置かない */
function walkFlood(sx,sz){
  const s=1.15;
  const key=(x,z)=>Math.round(x/s)+','+Math.round(z/s);
  const seen=new Set();
  const q=[[sx,sz,groundY(sx,sz)]];
  seen.add(key(sx,sz));
  const d=[[s,0],[-s,0],[0,s],[0,-s],[s,s],[s,-s],[-s,s],[-s,-s]];
  for(let i=0;i<q.length;i++){
    const x=q[i][0],z=q[i][1],cy=q[i][2];
    for(let k=0;k<8;k++){
      const nx=x+d[k][0],nz=z+d[k][1],kk=key(nx,nz);
      if(seen.has(kk))continue;
      if(!canStand(nx,nz,cy))continue;
      seen.add(kk);
      q.push([nx,nz,groundY(nx,nz)]);
    }
  }
  return (x,z)=>{
    if(!canStand(x,z,groundY(x,z)))return false;
    if(seen.has(key(x,z)))return true;
    for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++){
      if(seen.has(key(x+i*s,z+j*s)))return true;
    }
    return false;
  };
}

    return covers.every(c=>Math.abs(q.x-c.x)>=c.w/2+.18||Math.abs(q.z-c.z)>=c.d/2+.18);
  };

      &&far(q.x,q.z)&&reach(q.x,q.z)&&(def.name!=='ハナ'||hanaSafe(q));

      fx:p.x,fz:p.z});
  });

function pushTrail(){
  const l=trail[trail.length-1];
  if(!l||Math.hypot(l[0]-P.x,l[1]-P.z)>.5)trail.push([P.x,P.z]);
  if(trail.length>90)trail.shift();
}
function findKid(k){
  k.found=true;
  if(guideKid===k){guideKid=null;guideT=0;}
  k.g.scale.set(1,1,1);
  k.order=foundCount()-1;
  showFound(k.name);
  sfx.found();
  note(k.name+'をみつけた。「ばれた」と言って、うしろについてきた。');
  $('pulse').style.opacity=.55;
  clearTimeout(findKid._to);findKid._to=setTimeout(()=>{$('pulse').style.opacity=0;},260);
  try{navigator.vibrate&&navigator.vibrate(40);}catch(_){}
  hud();
  if(foundCount()>=5){goHomeT=.01;say('五人そろった。帰ろう。',6);sfx.allFound();}
}
function updateKids(dt){
  for(let i=0;i<kids.length;i++){
    const k=kids[i];
    k.phase+=dt;
    const d=Math.hypot(k.x-P.x,k.z-P.z);
    if(!k.found){
      k.g.visible=d<34;
      /* 気配：14m以内で、距離に応じた間隔と音量で鳴る。方向は左右に振る */
      k.cueT-=dt;
      if(k.cueT<=0&&d<14){
        k.cueT=1.1+d*.22+Math.random()*.8;
        const v=clamp(1-d/14,.08,1);
        sfx[k.cue](v,panOf(k.x,k.z));
      }
      if(d<6&&!k.noted){k.noted=true;note(k.near);}
      if(d>9)k.noted=false;
      k.g.position.y=groundY(k.x,k.z)+Math.sin(k.phase*1.6)*.006;
      continue;
    }
    /* 見つかった子は足跡をたどる */
    k.g.visible=true;
    const idx=trail.length-1-(k.order+1)*4;
    const tp=idx>=0?trail[idx]:[P.x,P.z];
    k.fx+=(tp[0]-k.fx)*Math.min(1,dt*3.4);
    k.fz+=(tp[1]-k.fz)*Math.min(1,dt*3.4);
    const mv=Math.hypot(k.fx-k.x,k.fz-k.z);
    if(mv>.002)k.g.rotation.y=Math.atan2(k.fx-k.x,k.fz-k.z);
    k.x=k.fx;k.z=k.fz;
    k.g.position.set(k.x,groundY(k.x,k.z)+Math.abs(Math.sin(k.phase*7))*.03*Math.min(1,mv*60),k.z);
    const ud=k.g.userData,sw=Math.sin(k.phase*9)*Math.min(.55,mv*22);
    if(ud.legR&&ud.legL){ud.legR.rotation.x=sw;ud.legL.rotation.x=-sw;}
    if(ud.armR&&ud.armL){ud.armR.rotation.x=-sw*.7;ud.armL.rotation.x=sw*.7;}
    if(ud.head)ud.head.rotation.y=Math.sin(k.phase*1.7)*.12;
  }
}
function showFound(name){
  const el=$('found');
  el.textContent=name;el.classList.remove('on');
  void el.offsetWidth;                          // アニメーションを確実に再生させる
  el.classList.add('on');
}

const P={x:PLAZA.x,z:PLAZA.z,yaw:Math.PI*.55,pitch:0,vx:0,vz:0,y:1.28,   // 子供なので目線は1.28m
         stam:100,lightOn:false,batt:100,up:0,roof:null,grip:null,face:true};
let t=0,bobT=0,shake=0,flash=0,stepT=0,breathT=0,creakT=10,
    fallT=8,sayT=0,lastArea='',areaSaid={},goHomeT=0,earCd=0,guideT=0,guideKid=null,neonOn=false;

/* 空（夕方から夜へ。6分で落ちる） */
const W={rain:0,wind:.24,wave:.8,vis:190,light:.92};
function weather(){
  const seg=(a,b,v0,v1)=>v0+(v1-v0)*clamp((t-a)/(b-a),0,1);
  if(t<120)      W.light=seg(0,120,.92,.72);
  else if(t<260) W.light=seg(120,260,.72,.26);
  else if(t<330) W.light=seg(260,330,.26,.10);
  else           W.light=seg(330,LIMIT,.10,.035);
  W.wind=.20+Math.sin(t*.043)*.07;
  W.wave=.7+Math.sin(t*.031)*.15;
  W.vis=200-clamp(t/LIMIT,0,1)*126;
}

function say(msg,sec){$('status').textContent=msg||'';sayT=msg?(sec||3.4):0;}
const logs=[].slice.call($('log').children);
function note(msg){
  for(let i=0;i<logs.length-1;i++){logs[i].textContent=logs[i+1].textContent;logs[i].className=logs[i+1].className;}
  const l=logs[logs.length-1];l.textContent=msg;l.className='on';
  clearTimeout(l._to);l._to=setTimeout(()=>{l.className='';},5400);
}
const cmp=$('compass').getContext('2d');
function drawCompass(){
  cmp.clearRect(0,0,260,20);
  const deg=((-P.yaw*180/Math.PI-90)%360+360)%360;   // +x=北・+z=東
  cmp.font='11px "Hiragino Mincho ProN",serif';cmp.textAlign='center';
  for(let a=-90;a<=90;a+=15){
    const d=((deg+a)%360+360)%360,px=130+a*1.35,major=(d%90===0);
    cmp.fillStyle=major?'rgba(200,226,236,.9)':'rgba(200,226,236,.3)';
    cmp.fillRect(px,major?4:8,1,major?7:4);
    if(major)cmp.fillText(['北','東','南','西'][(d/90)|0],px,19);
  }
  cmp.fillStyle='rgba(61,242,255,.85)';cmp.fillRect(130,0,1,6);
}
const markEls=[].slice.call($('marks').children);
function statusLine(){
  const left=LIMIT-t,n=foundCount();
  if(goHomeT>0)return '';
  if(left<30)return '日が落ちる。';
  if(left<75)return 'もう暗い。あと少しで何も見えなくなる。';
  if(n===0&&t<24)return '十数えた。どこにも、いない。';
  if(n===4)return 'あと一人。';
  if(W.light<.2&&!P.lightOn)return '暗い。明かりを点けたほうがいい。';
  if(n===0)return 'まだ一人も見つけていない。';
  return 'あと'+(5-n)+'人。';
}
function hud(){
  const left=Math.max(0,LIMIT-t);
  $('readout').innerHTML='<b>'+fmtClock(t)+'</b>　日暮れまで <b'+(left<60?' class="press"':'')+'>'+fmtDur(left)+'</b>'
    +'<br>電池 <b>'+(P.batt|0)+'</b> %';
  const n=foundCount();
  for(let i=0;i<markEls.length;i++)markEls[i].classList.toggle('got',i<n);
  $('stamBar').style.width=clamp(P.stam,0,100)+'%';
  const row=kids.filter(k=>k.found).map(k=>k.name);
  $('carry').innerHTML=row.length?'うしろ<br><span>'+row.join('</span><br><span>')+'</span>':'うしろ<br>だれもいない';
  drawCompass();
  const dark=1-W.light;
  $('vig').style.boxShadow='inset 0 0 '+((70+dark*90)|0)+'px '+((16+dark*34)|0)+'px rgba(0,0,0,'+(.26+dark*.3).toFixed(2)+')';
}

/* ==========================================================================
   7. 相互作用
   ========================================================================== */
function inShelter(){
  for(let i=0;i<shelters.length;i++){const s=shelters[i];
    if(P.x>s.x-s.w/2&&P.x<s.x+s.w/2&&P.z>s.z-s.d/2&&P.z<s.z+s.d/2)return true;}
  return false;
}
/* 改善5：距離だけでなく「見ている方向との角度」で重みを付ける。
   真正面のものは近く、背後のものは遠く評価する。 */
function aim(x,z,d){
  const fx=-Math.sin(P.yaw),fz=-Math.cos(P.yaw);
  const c=((x-P.x)*fx+(z-P.z)*fz)/(d||1);        // 1=正面 / -1=真後ろ
  return d*(1+(1-c)*.85);
}
/* 目で見えているか。壁ごしに「みつけた」が出ると、誰もいない場所でボタンを押すことになる。
   子は物の陰に身を寄せているので、背にしている物で塞がないよう手前0.7mで打ち切る */
function losClear(x0,z0,x1,z1){
  const dx=x1-x0,dz=z1-z0,d=Math.hypot(dx,dz);
  if(d<1.6)return true;                          // 手の届く距離なら、陰にいても見えている
  const stop=d-.7,n=Math.max(2,Math.ceil(stop/.45));
  for(let i=1;i<=n;i++){
    const f=(stop*i/n)/d;
    if(hit(x0+dx*f,z0+dz*f,.06))return false;
  }
  return true;
}
function findNear(){
  let best=null,bs=1e9;
  const take=(s,o)=>{if(s<bs){bs=s;best=o;}};
  for(let i=0;i<kids.length;i++){
    const k=kids[i];if(k.found)continue;
    const d=Math.hypot(k.x-P.x,k.z-P.z);
    if(d<3.4&&losClear(P.x,P.z,k.x,k.z))take(aim(k.x,k.z,d),{type:'kid',k:k,label:'みつけた'});
  }
  for(let i=0;i<creatures.length;i++){
    const c=creatures[i];
    if(c.gone||!c.g.visible)continue;
    const d=Math.hypot(c.x-P.x,c.z-P.z);
    if(d<4.2&&losClear(P.x,P.z,c.x,c.z))take(aim(c.x,c.z,d),{type:'critter',c:c,label:'見る：'+c.label});
  }
  return best;
}
/* 耳を澄ます（矢印は出さない。音の向きと、画面の縁のにじみだけ） */
function listen(){
  if(state!=='play')return;
  if(earCd>0){guideT=Math.max(guideT,2);return;}
  const rest=kids.filter(k=>!k.found);
  if(!rest.length)return;
  let k=rest[0],bd=1e9;
  rest.forEach(r=>{const d=Math.hypot(r.x-P.x,r.z-P.z);if(d<bd){bd=d;k=r;}});
  earCd=5;guideT=9;guideKid=k;
  sfx[k.cue](1,panOf(k.x,k.z));
  /* 画面のどちら側からの音か。前後は「にじみ」の位置で示す */
  const fx=-Math.sin(P.yaw),fz=-Math.cos(P.yaw),rx=Math.cos(P.yaw),rz=-Math.sin(P.yaw);
  const dx=k.x-P.x,dz=k.z-P.z,d=Math.hypot(dx,dz)||1;
  const rb=Math.atan2((dx*rx+dz*rz)/d,(dx*fx+dz*fz)/d);   // -π..π（0=正面）
  const ex=clamp(50+rb/(Math.PI*.62)*54,3,97);
  const ear=$('ear');
  ear.style.setProperty('--ex',ex.toFixed(1)+'%');
  ear.style.setProperty('--ey',(Math.abs(rb)>Math.PI*.62?68:44)+'%');
  ear.classList.add('on');
  clearTimeout(listen._to);listen._to=setTimeout(()=>ear.classList.remove('on'),2000);
  /* にじみと同じ向きを、断定せず一行にする */
  let side;
  if(Math.abs(rb)>Math.PI*.62) side=rb<0?'うしろ、左の方かな。':'うしろ、右の方かな。';
  else if(Math.abs(rb)<Math.PI*.18) side='まえの方かな。';
  else if(rb<0) side=rb<-Math.PI*.38?'左の方かな。':'左まえの方かな。';
  else side=rb>Math.PI*.38?'右の方かな。':'右まえの方かな。';
  note(bd<18?'息が近い。'+side:'かすかに──'+side);
}
function updateGuide(dt){
  const el=$('guide');
  if(guideT>0&&guideKid&&!guideKid.found){
    guideT-=dt;
    const kidHigh=groundY(guideKid.x,guideKid.z)>MESA.top-1;
    const useStair=kidHigh&&groundY(P.x,P.z)<MESA.top-1;
    const targetX=useStair?STAIR.x1+2:guideKid.x;
    const targetZ=useStair?(STAIR.z0+STAIR.z1)/2:guideKid.z;
    const dx=targetX-P.x,dz=targetZ-P.z,d=Math.hypot(dx,dz);
    const forward=dx*-Math.sin(P.yaw)+dz*-Math.cos(P.yaw);
    const right=dx*Math.cos(P.yaw)-dz*Math.sin(P.yaw);
    const angle=Math.atan2(right,forward);
    const arrow=Math.abs(angle)<.39?'↑':Math.abs(angle)>2.75?'↓':angle>0?(angle<1.35?'↗':'→'):(angle> -1.35?'↖':'←');
    el.textContent=useStair?arrow+' 高い所の子へ：まず階段（約'+Math.max(1,Math.round(d))+'m）':arrow+' 子どもの気配  約'+Math.max(1,Math.round(d))+'m';
    el.classList.add('on');return;
  }
  guideKid=null;
  const stairD=Math.hypot(P.x-STAIR.x1,P.z-(STAIR.z0+STAIR.z1)/2);
  if(stairD<18&&groundY(P.x,P.z)<MESA.top-1){
    el.textContent='階段：両側の壁の間を、岩山の方向へ進む';el.classList.add('on');return;
  }
  if(wallTouch(P.x,P.z,.65)){
    el.textContent='建物に登る：登るボタン（Cキー）を押しながら前進';el.classList.add('on');return;
  }
  el.classList.remove('on');
}
function doAction(){
  if(state==='title'){$('bStart').click();return;}
  if(state!=='play')return;
  if(!near){listen();return;}
  const n=near;
  if(n.type==='kid'){
    if(!ready){say('まだ、声が返ってこない。',1.6);return;}
    findKid(n.k);return;
  }
  if(n.type==='critter'){
    const c=n.c;
    if(!c.quizzed){note(c.hint);c.quizzed=true;}
    else{
      note(c.hint2);c.gone=true;
      if(c.kind==='dog')sfx.bark(1,0);
      else if(c.kind==='cat')sfx.mew(1,0);
      else sfx.patter();
    }
    return;
  }
}
function toggleLight(){
  if(P.batt<=0){note('電池が切れている。');return;}
  P.lightOn=!P.lightOn;
  $('bLight').classList.toggle('on',P.lightOn);
  burst(2200,.05,.045,'bandpass',4);
}

/* ==========================================================================
   8. 崩落（かくれんぼではダメージを与えない。驚かせるだけ。
      「子供の気配だと思って近寄ったら瓦礫だった」を成立させる演出）
   ========================================================================== */
const falls=[];
function spawnFall(){
  const b=BLD[(Math.random()*BLD.length)|0];
  const side=Math.random()<.5;
  const x=b.x+(side?(Math.random()-.5)*b.w:(Math.random()<.5?-1:1)*(b.w/2+1.6));
  const z=b.z+(side?(Math.random()<.5?-1:1)*(b.d/2+1.6):(Math.random()-.5)*b.d);
  if(!inBounds(x,z))return;
  const s=.5+Math.random()*1.1;
  const rock=new THREE.Mesh(new THREE.BoxGeometry(s,s*.7,s),M.rock);
  rock.position.set(x,b.h+1,z);rock.visible=false;scene.add(rock);
  const arr=new Float32Array(30);
  for(let i=0;i<10;i++){arr[i*3]=x+(Math.random()-.5)*1.2;arr[i*3+1]=b.h*.6+Math.random()*2;arr[i*3+2]=z+(Math.random()-.5)*1.2;}
  const dg=new THREE.BufferGeometry();dg.setAttribute('position',new THREE.BufferAttribute(arr,3));
  const dust=new THREE.Points(dg,new THREE.PointsMaterial({color:0x8d8578,size:.16,transparent:true,opacity:.5}));
  scene.add(dust);
  if(Math.hypot(x-P.x,z-P.z)<26)sfx.patter(panOf(x,z));
  falls.push({x:x,z:z,rock:rock,dust:dust,vy:0,st:'warn',t:0,life:7});
}

/* ==========================================================================
   9. 進行
   ========================================================================== */
function step(dt){
  t+=dt;weather();
  pushTrail();

  /* 移動（改善2：デッドゾーンと非線形カーブ済みの値が jx/jy に来る
     改善8：加減速を入れて足を滑らせない） */
  let ix=0,iz=0;
  if(keys.KeyW||keys.ArrowUp)iz+=1;
  if(keys.KeyS||keys.ArrowDown)iz-=1;
  if(keys.KeyA||keys.ArrowLeft)ix-=1;
  if(keys.KeyD||keys.ArrowRight)ix+=1;
  if(padK.u)iz+=1;if(padK.d)iz-=1;if(padK.l)ix-=1;if(padK.r)ix+=1;
  ix+=gpv.mx;iz+=-gpv.my;
  const il=Math.hypot(ix,iz);if(il>1){ix/=il;iz/=il;}
  const moving=il>.06;
  moveMag=Math.min(1,il);
  if(keys.KeyQ)P.yaw+=1.9*dt*S.sens;               // マウスを使わずに振り向く
  if(keys.KeyE)P.yaw-=1.9*dt*S.sens;
  P.yaw-=(sx+gpv.lx)*2.5*dt*S.sens;
  P.pitch=clamp(P.pitch-(sy+gpv.ly)*1.7*dt*S.sens,-1.1,1.1);

  const spent=P.stam<6;
  const dash=(running||gpv.run)&&moving&&!spent;
  const spd=(dash?8.1:2.8)*(P.stam<22?.86:1);
  P.stam=clamp(P.stam+(dash?-15:(moving?7:14))*dt,0,100);

  const fx=-Math.sin(P.yaw),fz=-Math.cos(P.yaw),rx=Math.cos(P.yaw),rz=-Math.sin(P.yaw);
  const tvx=(fx*iz+rx*ix)*spd,tvz=(fz*iz+rz*ix)*spd;
  const k=1-Math.exp(-dt/(moving?.12:.09));         // 立ち上がり0.12秒・停止0.09秒
  P.vx+=(tvx-P.vx)*k;P.vz+=(tvz-P.vz)*k;
  const x0=P.x,z0=P.z,up0=P.up,roof0=P.roof;
  stepClimber(P,P.vx*dt,P.vz*dt,dt,iz>.18&&moving&&(climbHeld||keys.KeyC),false);
  if(P.x===x0)P.vx=0;
  if(P.z===z0)P.vz=0;
  const foot=P.roof?P.roof.h:groundY(P.x,P.z)+P.up;
  P.y=foot+1.28;
  if(up0<.05&&P.up>.1)note(P.grip==='mesa'?'岩肌に手をかけた。':'壁にとりついた。');
  if(!roof0&&P.roof)note('屋根まで登った。');

  /* 足音 */
  const realMove=Math.hypot(P.vx,P.vz);
  if(realMove>.4){
    bobT+=dt*(dash?11:7.4);
    stepT-=dt*(dash?2.2:1.4);
    if(stepT<=0){stepT=1;sfx.step(inShelter()?'conc':'gravel');}
  }

  /* 息 */
  breathT-=dt;
  if(breathT<=0){const hard=P.stam<35;breathT=hard?1.15:2.8;if(realMove>.4||hard)sfx.breath(hard);}

  /* エリア。入ったときだけ、その場所の匂いと足元を一行出す */
  const area=areaAt(P.x,P.z);
  /* 境界線の上で行き来しても鳴り続けないよう、同じ場所は30秒あけて1回だけにする */
  if(area){
    if(area.id!==lastArea&&t-(areaSaid[area.id]||-1e3)>30){areaSaid[area.id]=t;note(area.enter);}
    lastArea=area.id;
  }else lastArea='';

  /* 明かり */
  if(P.lightOn){P.batt-=.42*dt;
    if(P.batt<=0){P.batt=0;P.lightOn=false;$('bLight').classList.remove('on');note('明かりが落ちた。');}}
  torch.intensity=P.lightOn?5.2:0;
  torchFill.intensity=P.lightOn?1.25:0;
  if(earCd>0)earCd-=dt;

  /* 日が落ちるとネオンが灯る（和風サイバーパンクが前景化する瞬間） */
  if(!neonOn&&W.light<.22){
    neonOn=true;neonSigns.forEach(s=>{s.visible=true;});
    sfx.neonPop();note('どこかで、古い看板に電気が入った。');
  }
  if(neonOn)neonPulse(dt);

  /* 崩落（ダメージなし） */
  fallT-=dt;
  if(fallT<=0){fallT=7+Math.random()*7;spawnFall();}
  for(let i=falls.length-1;i>=0;i--){
    const f=falls[i];f.t+=dt;
    if(f.st==='warn'){
      f.dust.material.opacity=Math.max(0,.5-f.t*.5);
      if(f.t>.95){f.st='fall';f.rock.visible=true;scene.remove(f.dust);f.dust.geometry.dispose();}
    }else if(f.st==='fall'){
      f.vy-=42*dt;f.rock.position.y+=f.vy*dt;f.rock.rotation.x+=dt*4.5;f.rock.rotation.z+=dt*2.8;
      if(f.rock.position.y<=.35){
        f.rock.position.y=.35;f.st='land';
        const d=Math.hypot(f.x-P.x,f.z-P.z);sfx.thud(d);
        if(d<4)note('すぐ横で、庇が剥がれ落ちた。──子供ではない。');
        if(d<16)shake=Math.max(shake,.34*(1-d/16));
      }
    }else{f.life-=dt;if(f.life<0){scene.remove(f.rock);f.rock.geometry.dispose();falls.splice(i,1);}}
  }

  /* 建物の軋み */
  creakT-=dt;if(creakT<=0){creakT=12+Math.random()*16;if(nearBuilding()<24)sfx.creak();}

  updateKids(dt);
  updateCreatures(dt);
  updateGuide(dt);

  /* 五人そろったら、みんなで帰る */
  if(goHomeT>0){
    goHomeT+=dt;
    const dx=PLAZA.x-P.x,dz=PLAZA.z-P.z,d=Math.hypot(dx,dz);
    if(d>1.2){P.x+=dx/d*Math.min(d,5.4*dt);P.z+=dz/d*Math.min(d,5.4*dt);}
    P.yaw+=(Math.atan2(-dx,-dz)-P.yaw)*Math.min(1,dt*1.6);
    if(goHomeT>3.4){end('win');return;}
  }else if(t>=LIMIT){end('dusk');return;}

  /* 手の届くもの */
  near=findNear();
  const pr=$('prompt');
  if(near){pr.textContent=near.label;pr.classList.add('on');}else pr.classList.remove('on');
  $('fcA').disabled=false;
  syncLabels();

  sayT-=dt;
  if(sayT<=0)$('status').textContent=statusLine();
}
function nearBuilding(){
  let m=1e9;
  for(let i=0;i<BLD.length;i++){const b=BLD[i];
    const d=Math.hypot(b.x-P.x,b.z-P.z)-Math.max(b.w,b.d)/2;if(d<m)m=d;}
  return m;
}

/* ==========================================================================
   10. 描画（夕方 → 薄暮 → 夜。落ちる光そのものが制限時間の表示になる）
   ========================================================================== */
const cEve=new THREE.Color(0x9a6f4e),      // 夕方
      cDeep=new THREE.Color(0x2a2c45),     // 薄暮（藍）
      cNight=new THREE.Color(0x080c16),    // 夜
      tmp=new THREE.Color();
function render(dt,now){
  const pa=seaGeo.attributes.position,amp=.2+W.wave*.16;
  for(let i=0;i<pa.count;i++){
    const x=pa.getX(i),z=pa.getZ(i);
    pa.setY(i,Math.sin(x*.07+now*1.05)*amp+Math.cos(z*.09+now*1.35)*amp*.7);
  }
  pa.needsUpdate=true;
  if((((now*60)|0)%6)===0)seaGeo.computeVertexNormals();
  sea.position.y=-2.4;

  const L=W.light;
  if(L>.26)tmp.copy(cDeep).lerp(cEve,clamp((L-.26)/.66,0,1));
  else tmp.copy(cNight).lerp(cDeep,clamp((L-.035)/.225,0,1));
  scene.background.copy(tmp);scene.fog.color.copy(tmp);
  scene.fog.near=6;
  scene.fog.far=W.vis;
  hemi.intensity=.055+L*.70;      // 夜は落としきる。ネオンと懐中電灯だけが頼りになる
  sky.intensity=.03+L*1.02;
  fill.intensity=.03+L*.18;
  sky.color.setRGB(1,.72+L*.22,.46+L*.4);            // 低い夕日ほど赤い
  sky.position.set(-120,8+L*70,40);
  sea.material.color.setHex(L<.25?0x16202c:(L<.6?0x2b3440:0x3d4450));


  if(AC){
    const k=AC.currentTime,sh=inShelter();
    windG.gain.setTargetAtTime(.024+W.wind*(sh?.05:.16),k,.7);
    surfG.gain.setTargetAtTime(.03+W.wave*.03,k,.9);
    neonG.gain.setTargetAtTime(neonOn?(sh?.004:.012):0,k,1.2);
  }

  shake=Math.max(0,shake-dt*1.3);
  const sway=S.bob?Math.sin(bobT)*.042+Math.sin(bobT*.5)*.018:0;
  placeCamera(sway,shake);
  renderer.render(scene,camera);
}
function placeCamera(sway,shake){
  const jx=(Math.random()-.5)*shake,jz=(Math.random()-.5)*shake;
  const foot=P.roof?P.roof.h:groundY(P.x,P.z)+P.up;
  const eyeY=foot+1.28+sway;                    // 子供の目線
  camera.position.set(P.x+jx,eyeY+(Math.random()-.5)*shake,P.z+jz);
  camera.rotation.order='YXZ';
  camera.rotation.y=P.yaw;camera.rotation.x=P.pitch;camera.rotation.z=0;
}

/* ==========================================================================
   11. 地図（紙。自分の位置はおおよそ。子供の居場所は載らない）
   ========================================================================== */
const mapJit={x:0,z:0,t:-99};
function drawMap(){
  const mc=$('mapc'),g=mc.getContext('2d'),W0=mc.width,H0=mc.height;
  const mx=x=>W0/2+(x/ (ISL.x1-ISL.x0) )*(W0-56);
  const mz=z=>H0/2+(z/ (ISL.z1-ISL.z0) )*(H0-56);
  g.fillStyle='#0b1018';g.fillRect(0,0,W0,H0);
  // 方眼（サイバーパンクの下地）
  g.strokeStyle='rgba(61,242,255,.08)';g.lineWidth=1;
  for(let x=0;x<W0;x+=22){g.beginPath();g.moveTo(x,0);g.lineTo(x,H0);g.stroke();}
  for(let y=0;y<H0;y+=22){g.beginPath();g.moveTo(0,y);g.lineTo(W0,y);g.stroke();}
  // 島の輪郭
  g.strokeStyle='rgba(61,242,255,.55)';g.lineWidth=1.6;
  g.strokeRect(mx(ISL.x0),mz(ISL.z0),mx(ISL.x1)-mx(ISL.x0),mz(ISL.z1)-mz(ISL.z0));
  // 岩山
  g.strokeStyle='rgba(242,193,78,.5)';g.setLineDash([4,3]);
  g.strokeRect(mx(MESA.x0),mz(MESA.z0),mx(MESA.x1)-mx(MESA.x0),mz(MESA.z1)-mz(MESA.z0));
  g.setLineDash([]);
  // 建物
  BLD.forEach(b=>{
    g.strokeStyle=b.enter?'rgba(232,228,218,.85)':'rgba(154,163,178,.45)';
    g.lineWidth=b.enter?1.4:1;
    g.strokeRect(mx(b.x-b.w/2),mz(b.z-b.d/2),(b.w/(ISL.x1-ISL.x0))*(W0-56),(b.d/(ISL.z1-ISL.z0))*(H0-56));
  });
  // 桟橋
  g.strokeStyle='rgba(61,242,255,.7)';g.lineWidth=2;
  g.beginPath();g.moveTo(mx(PIER.x),mz(ISL.z0));g.lineTo(mx(PIER.x),mz(PIER.z));g.stroke();
  // 地名
  g.fillStyle='#cfd8e2';g.font='10px "Hiragino Mincho ProN",serif';g.textAlign='center';
  g.fillText('ドルフィン桟橋',mx(PIER.x)+2,mz(ISL.z0)-20);
  g.fillText('広場',mx(PLAZA.x),mz(PLAZA.z)-7);
  g.fillText('岩山・祠',mx(34),mz(-17));
  g.fillText('地獄段',mx(67),mz(-14)+3);
  g.fillText('65号棟',mx(96),mz(12)+3);
  g.fillText('学校',mx(126),mz(-22)+3);
  g.fillText('30号棟',mx(-92),mz(-18)+3);
  g.fillText('総合事務所',mx(-124),mz(12)+3);
  g.fillText('南護岸',mx(8),mz(-47)+4);
  g.fillText('プール',mx(128),mz(4)+3);
  // 方位（右が北）
  const ax=W0-52,ay=H0-22;
  g.strokeStyle='#3df2ff';g.lineWidth=1.4;
  g.beginPath();g.moveTo(ax-26,ay);g.lineTo(ax,ay);g.stroke();
  g.beginPath();g.moveTo(ax-8,ay-4);g.lineTo(ax,ay);g.lineTo(ax-8,ay+4);g.fill();
  g.fillStyle='#3df2ff';g.font='11px "Hiragino Mincho ProN",serif';g.fillText('北',ax+11,ay+4);
  // 自分の位置（おおよそ。ぶれる）
  if(t-mapJit.t>6){mapJit.x=(Math.random()-.5)*16;mapJit.z=(Math.random()-.5)*7;mapJit.t=t;}
  const px=mx(P.x+mapJit.x),pz=mz(P.z+mapJit.z);
  g.strokeStyle='rgba(255,46,91,.85)';g.lineWidth=1.5;
  g.beginPath();g.arc(px,pz,10,0,6.3);g.stroke();
  g.setLineDash([3,3]);g.beginPath();g.arc(px,pz,18,0,6.3);g.stroke();g.setLineDash([]);
  $('mapNote').textContent='手で描いた略図。右が北。子供の居場所は、ここには載っていない。'
    +'　みつけた：'+foundCount()+' / 5';
}

/* ==========================================================================
   12. 和風サイバーパンクの背景（2D canvas。three.js には触らない）
   ========================================================================== */
const fx=$('fx'),fg=fx.getContext('2d');
let fxMode='title',fxT=0,fxLast=0,fxRun=true;
const FXP={
  title:{a:'61,242,255',b:'255,46,91'},
  jan:  {a:'242,193,78',b:'61,242,255'},
  win:  {a:'61,242,255',b:'242,193,78'},
  dusk: {a:'255,46,91',b:'138,107,255'}
};
const fxDrops=[];
for(let i=0;i<70;i++)fxDrops.push({x:Math.random(),y:Math.random(),v:.25+Math.random()*.9,l:.04+Math.random()*.1});
function fxSize(){
  const d=Math.min(devicePixelRatio,1.25);
  fx.width=Math.round(innerWidth*d);fx.height=Math.round(innerHeight*d);
}
fxSize();addEventListener('resize',fxSize);
function fxDraw(now){
  if(!fxRun){return;}
  const dt=Math.min(.06,(now-fxLast)/1000);fxLast=now;fxT+=dt;
  const w=fx.width,h=fx.height,pal=FXP[fxMode]||FXP.title;
  const HZ=h*.72;                                  // 水平線
  /* 空 */
  const gr=fg.createLinearGradient(0,0,0,HZ);
  gr.addColorStop(0,'#0c1730');gr.addColorStop(.5,'#18244a');gr.addColorStop(.86,'#3a2a52');gr.addColorStop(1,'#5a2f46');
  fg.fillStyle=gr;fg.fillRect(0,0,w,HZ);
  /* 水平線の帯（日が残っている側） */
  const gl=fg.createLinearGradient(0,HZ-h*.1,0,HZ);
  gl.addColorStop(0,'rgba('+pal.b+',0)');gl.addColorStop(1,'rgba('+pal.b+',.34)');
  fg.fillStyle=gl;fg.fillRect(0,HZ-h*.1,w,h*.1);
  /* 海 */
  const gs=fg.createLinearGradient(0,HZ,0,h);
  gs.addColorStop(0,'#0a1626');gs.addColorStop(1,'#04070e');
  fg.fillStyle=gs;fg.fillRect(0,HZ,w,h-HZ);
  /* 麻の葉（空の下地・ごく薄く） */
  fg.strokeStyle='rgba('+pal.a+',.045)';fg.lineWidth=Math.max(1,w/1400);
  const u=w*.06;
  for(let y=0;y<HZ;y+=u){
    for(let x=-u;x<w+u;x+=u){
      fg.beginPath();fg.moveTo(x,y);fg.lineTo(x+u,y+u);fg.moveTo(x+u,y);fg.lineTo(x,y+u);
      fg.moveTo(x+u/2,y);fg.lineTo(x+u/2,y+u);fg.stroke();
    }
  }
  /* 島のシルエット（或る孤島＝細長い箱の連なり）と縁のネオン */
  const seed=[.10,.30,.16,.46,.28,.58,.38,.24,.50,.34,.18,.40,.12];
  const bw=w/(seed.length-1);
  fg.fillStyle='#03050a';
  seed.forEach((sd,i)=>{
    const x=bw*i-bw*.5,bh=HZ*sd*.52;
    fg.fillRect(x,HZ-bh,bw,bh+2);
    fg.strokeStyle='rgba('+(i%3===0?pal.b:pal.a)+',.42)';fg.lineWidth=Math.max(1,w/760);
    fg.beginPath();fg.moveTo(x,HZ-bh);fg.lineTo(x+bw,HZ-bh);fg.stroke();
  });
  /* 窓のあかり */
  for(let i=0;i<150;i++){
    const col=i%(seed.length-1), sd=seed[col];
    const bh=HZ*sd*.52;
    const px=bw*col-bw*.5+((i*37)%10+1)/12*bw;
    const py=HZ-bh+((i*53)%10+1)/12*bh;
    if(py>HZ-4)continue;
    if(Math.sin(fxT*1.1+i*1.7)<-.25)continue;
    fg.fillStyle='rgba('+(i%7===0?pal.b:pal.a)+',.55)';
    fg.fillRect(px,py,Math.max(1.6,w/330),Math.max(2.4,w/250));
  }
  /* 小さな横型ネオン（島の看板。文字は置かず、光の棒として置く） */
  [[.18,.30],[.62,.46],[.84,.22]].forEach((b,i)=>{
    const bx=w*b[0],by=HZ-HZ*seed[Math.min(seed.length-1,(b[0]*(seed.length-1))|0)]*.52-h*.02;
    const bwid=w*.09*(1+b[1]*.4),bhei=Math.max(2.5,h*.006);
    const on=Math.sin(fxT*(1.6+i*.4))>-.6;
    fg.save();
    fg.shadowColor='rgba('+(i===1?pal.b:pal.a)+',1)';fg.shadowBlur=on?w*.028:0;
    fg.fillStyle='rgba('+(i===1?pal.b:pal.a)+','+(on?.9:.18)+')';
    fg.fillRect(bx,by,bwid,bhei);
    fg.restore();
  });
  /* 海面の反射 */
  fg.globalAlpha=.16;
  for(let i=0;i<26;i++){
    const rx=(i*97)%100/100*w, ry=HZ+((i*61)%100)/100*(h-HZ);
    fg.fillStyle='rgba('+((i%4===0)?pal.b:pal.a)+',.7)';
    fg.fillRect(rx,ry,w*.012+Math.sin(fxT*2+i)*w*.006,Math.max(1,h*.0015));
  }
  fg.globalAlpha=1;
  /* 青海波（水際） */
  fg.strokeStyle='rgba('+pal.a+',.22)';fg.lineWidth=Math.max(1,w/900);
  const r=w*.055;
  for(let row=0;row<4;row++){
    const cy=HZ+h*.055+row*r*.6;
    for(let cx=-r;cx<w+r;cx+=r*1.05){
      fg.beginPath();fg.arc(cx+(row%2?r*.52:0),cy,r,Math.PI*1.06,Math.PI*1.94);fg.stroke();
    }
  }
  /* 雨のような光の筋 */
  fg.strokeStyle='rgba('+pal.a+',.22)';fg.lineWidth=Math.max(1,w/1100);
  fxDrops.forEach(d=>{
    d.y+=d.v*dt*.5;if(d.y>1.1){d.y=-.1;d.x=Math.random();}
    fg.beginPath();fg.moveTo(d.x*w,d.y*h);fg.lineTo(d.x*w+w*.004,(d.y+d.l)*h);fg.stroke();
  });
  /* グリッチ（たまに横へずらす） */
  if(Math.random()<.035){
    const gy=Math.random()*h,gh=h*(.01+Math.random()*.04),off=(Math.random()-.5)*w*.05;
    try{const img=fg.getImageData(0,gy,w,gh);fg.putImageData(img,off,gy);}catch(e){}
    fg.fillStyle='rgba('+pal.b+',.12)';fg.fillRect(0,gy,w,gh);
  }
}

/* ==========================================================================
   13. じゃんけん（プレイヤーの手は改変しない。勝ちは出さない。
       あいこ／三すくみは引き直し。3回目で必ず負ける）
   ========================================================================== */
const HANDS=['グー','チョキ','パー'];
let janRound=0;
function shuffle5(a){
  const h=a.slice();
  for(let i=4;i>0;i--){const j=(Math.random()*(i+1))|0;const t=h[i];h[i]=h[j];h[j]=t;}
  return h;
}
function janPlay(my){
  if(portraitLocked())return;
  janRound++;
  const loseHand=[2,0,1][my];                      // 自分に勝つ手。自分の手は触らない
  let others, kind;                                // lose | tie | sukumi
  if(janRound>=3){
    kind='lose';
    others=[loseHand,loseHand,loseHand,loseHand,loseHand];
  }else{
    const r=Math.random();
    if(r<0.34){ kind='lose'; others=[loseHand,loseHand,loseHand,loseHand,loseHand]; }
    else if(r<0.67){ kind='sukumi'; others=shuffle5([0,1,2,0,1]); }
    else { kind='tie'; others=[my,my,my,my,my]; }
  }
  const names=['ミチル','タケシ','サエ','ゴロウ','ハナ'];
  const lost=kind==='lose';
  $('janBoard').innerHTML='<b>じぶん</b><span'+(lost?' class="miss"':'')+'>'+HANDS[my]+'</span>'
    +names.map((n,i)=>'<b>'+n+'</b><span>'+HANDS[others[i]]+'</span>').join('');
  sfx.janHit();
  if(lost){
    $('janTxt').textContent='ひとりだけ、負けた。';
    $('janRound').textContent='鬼は、じぶん。';
    document.querySelectorAll('.jan').forEach(b=>b.disabled=true);
    sfx.janLose();
    setTimeout(startCount,1100);
  }else{
    $('janTxt').textContent=kind==='sukumi'?'三すくみ。もう一回。':'あいこ。もう一回。';
    $('janRound').textContent=janRound+'回目';
  }
}
document.querySelectorAll('.jan').forEach(b=>{
  b.addEventListener('click',e=>{e.preventDefault();janPlay(+b.dataset.h);});
});

/* 十数える */
function startCount(){
  sheet('shJan',false);
  fxRun=false;fx.classList.remove('on');
  $('janCount').classList.add('on');
  $('janCount').querySelector('small').textContent='お に は 目 を つ ぶ る';
  const KAN=['０','１','２','３','４','５','６','７','８','９','十'];
  let n=0;
  const tick=()=>{
    $('janNum').textContent=KAN[n];
    sfx.count(n);
    if(n%2===0)burst(1000,.2,.04,'bandpass',2,(Math.random()*2-1));   // 散っていく足音
    n++;
    if(n<=10)setTimeout(tick,330);
    else setTimeout(beginPlay,620);
  };
  tick();
}
function beginPlay(){
  $('janCount').classList.remove('on');
  state='play';last=performance.now();
  ready=false;
  callLine('もーいいかい',1.5);                       // 鬼（じぶん）が叫ぶ
  burst(520,.5,.05,'bandpass',3);
  setTimeout(()=>{
    if(state==='over')return;
    callLine('もういいよ',2.2);                       // 島のどこかから、五つの声が返る
    for(let i=0;i<5;i++)setTimeout(()=>burst(430+i*70,.35,.045,'bandpass',3,(Math.random()*2-1)),i*110);
    ready=true;
    note('五人が、どこかに隠れている。壁も岩も登れる。');
  },1600);
}

/* ==========================================================================
   14. 結末
   ========================================================================== */
function end(kind){
  if(state==='over')return;
  state='over';
  const best=store.get('bestFind',0);
  const n=foundCount();
  let rec='';
  if(kind==='win'){
    if(!best||t<best){store.set('bestFind',Math.round(t));rec='最短記録を更新した。';}
    else rec='これまでの最短　'+fmtDur(best);
  }else rec=best?('これまでの最短　'+fmtDur(best)):'五人見つけていない。';

  let html;
  if(kind==='win'){
    html='<h1 class="neon">みつけた<small>五 人 、 そ ろ っ た</small></h1><div class="rule"></div>'
      +'<p>広場に戻ると、五人が横に並んだ。だれも、けがはしていない。</p>'
      +'<p class="q">島の看板に、ひとつずつ電気が入っていく。帰ろう、と誰かが言った。</p>'
      +'<div class="kv"><b>かかった時間</b><span class="hit">'+fmtDur(t)+'</span>'
      +'<b>日暮れまで</b><span>'+fmtDur(Math.max(0,LIMIT-t))+' 残していた</span></div>';
    fxMode='win';
  }else{
    const miss=kids.filter(k=>!k.found);
    html='<h1 class="shu">日が落ちた<small>か く れ ん ぼ 　 お わ り</small></h1><div class="rule"></div>'
      +'<p>空の色が変わって、輪郭が見えなくなった。「もう、いいよ」と声がして、'
      +(miss.length===1?'ひとりが':'みんなが')+'出てきた。</p>'
      +'<div class="kv"><b>みつけた</b><span class="hit">'+n+' / 5</span>'
      +miss.map(k=>'<b>'+k.name+'</b><span class="miss">'+k.where+'に いた</span>').join('')+'</div>';
    fxMode='dusk';
    sfx.dusk();
  }
  $('endPanel').innerHTML=html+'<p class="q" style="margin-top:14px;text-align:center">'+rec+'</p>'
    +'<button class="go" id="bAgain">も う 一 度</button>';
  fxRun=true;fxLast=performance.now();fx.classList.add('on');
  bgmEl.pause();                                   // 結末は環境音と余韻だけにする
  sheet('shEnd',true);
  $('bAgain').onclick=()=>location.reload();
}

/* ==========================================================================
   15. 開始・ループ
   ========================================================================== */
placeKids();
$('bStart').onclick=()=>{
  if(portraitLocked())return;
  audioInit();
  if(AC&&AC.state==='suspended')AC.resume();
  bgmEl.load();                                    // preload=none なのでここで初めて読む
  syncCfg();
  sheet('shTitle',false);
  fxMode='jan';
  sheet('shJan',true);
  janRound=0;
  document.querySelectorAll('.jan').forEach(b=>b.disabled=false);
  $('janTxt').textContent='だれが鬼になるか。手を出せ。';
  $('janRound').textContent='';
};

function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(now-last)/1000);last=now;
  pollPad();
  if(state==='play'){step(dt);if(state==='play')hud();}
  if(fxRun&&(state==='title'||state==='over'||sheetOpen('shJan')))fxDraw(now);
  else if(state!=='title')render(dt,now/1000);
}
weather();hud();
camera.position.set(P.x,P.y,P.z);camera.rotation.y=P.yaw;
fxLast=performance.now();
requestAnimationFrame(loop);
})();
</script>
