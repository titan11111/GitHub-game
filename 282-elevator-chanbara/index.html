<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>昇降斬 ─ ELEVATOR CHANBARA</title>
<style>
  :root{
    --sumi:#0b1018;      /* 墨 */
    --ai:#16233a;        /* 藍 */
    --tetsu:#2b3a52;     /* 鉄紺 */
    --tsuki:#c0342b;     /* 血月 */
    --kin:#e0b062;       /* 金 */
    --gin:#e8edf2;       /* 銀 */
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--sumi);color:var(--gin);
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;overflow-x:hidden}
  #wrap{max-width:820px;margin:0 auto;padding:8px 8px 24px}
  h1{font-size:15px;letter-spacing:.4em;margin:6px 0 8px;color:var(--kin);font-weight:400}
  h1 span{color:var(--gin);letter-spacing:.1em;font-size:11px;margin-left:.6em}
  canvas{display:block;width:100%;aspect-ratio:4/3;background:#05070c;
    border:1px solid var(--tetsu);touch-action:none}
  #pad{margin-top:10px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .btn{user-select:none;padding:14px 0;text-align:center;font-size:17px;
    background:linear-gradient(#1d2b41,#101a29);border:1px solid var(--tetsu);
    color:var(--gin);border-radius:3px;letter-spacing:.08em}
  .btn:active,.btn.on{background:linear-gradient(#3a5075,#22314a);border-color:var(--kin);color:var(--kin)}
  .btn.big{grid-column:span 4;font-size:15px;color:#5a6a82;border-color:#22314a}
  .btn.big.ready{color:var(--tsuki);border-color:var(--tsuki);
    background:linear-gradient(#2a1216,#160a0c);animation:pulse 1s infinite}
  @keyframes pulse{50%{box-shadow:0 0 14px rgba(192,52,43,.55)}}
  #note{margin-top:14px;font-size:12.5px;line-height:1.85;color:#8fa0b8}
  #note b{color:var(--kin);font-weight:400}
  @media(prefers-reduced-motion:reduce){.btn.big.ready{animation:none}}
</style>
</head>
<body>
<div id="wrap">
  <h1>昇 降 斬<span>三機の籠で斬り結ぶ</span></h1>
  <canvas id="cv" width="800" height="600"></canvas>

  <div id="pad">
    <div class="btn" data-k="left">◀</div>
    <div class="btn" data-k="right">▶</div>
    <div class="btn" data-k="up">昇 ▲</div>
    <div class="btn" data-k="down">降 ▼</div>
    <div class="btn" data-k="jump">跳</div>
    <div class="btn" data-k="a">小斬</div>
    <div class="btn" data-k="b">大斬</div>
    <div class="btn" data-k="g">受</div>
    <div class="btn big" id="issenBtn" data-k="s">一 閃（怒り満タンで解放）</div>
  </div>

  <div id="note">
    <b>昇降</b>：▲▼で自分が乗っている籠だけを動かす。籠は放っておくとじわじわ落ちる。<br>
    <b>跳</b>：隣の籠へ飛び移る。空中で小斬／大斬を押すと<b>飛び込み斬り</b>。高さ差が武器。<br>
    <b>受</b>：押した瞬間の8フレームが<b>弾き</b>。成功で相手は大硬直、怒りも溜まる。<br>
    大斬は受けをぶち破る。読み合いは「小斬で崩す／大斬で割る／弾きで返す」の三竦み。<br>
    キーボード：←→↑↓ ／ Z小斬 ／ X大斬 ／ C受 ／ Space跳 ／ V一閃
  </div>
</div>

<script>
(()=>{
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=800,H=600;
const SX=[150,400,650];          // 籠の中心X
const TOPY=180,BOTY=515;         // 床面Yの可動域
const HALF=74;                   // 籠内で歩ける半幅

const ATK={
  a:{name:'小斬',start:6,act:4,rec:11,dmg:8,reach:78,kb:9,stop:5,rage:6},
  b:{name:'大斬',start:15,act:6,rec:25,dmg:23,reach:104,kb:22,stop:13,rage:12,crush:true},
  air:{name:'飛込斬',start:4,act:22,rec:0,dmg:15,reach:74,kb:16,stop:9,rage:9},
  s:{name:'一閃',start:22,act:7,rec:30,dmg:46,reach:132,kb:34,stop:22,rage:0,pierce:true}
};

let S=null;
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;

function makeChar(shaft,x,face,isP){
  return{shaft,x,y:BOTY,face,isP,hp:100,rage:0,st:'idle',t:0,atk:null,hitDone:false,
    guard:false,parry:0,stun:0,air:false,lt:0,ldur:0,lx0:0,lx1:0,ly0:0,lto:0,
    bob:Math.random()*6,think:0,in:{left:0,right:0,up:0,down:0,jump:0,a:0,b:0,g:0,s:0}};
}

function newMatch(){
  S={mode:'title',round:1,win:[0,0],timer:60*60,hitstop:0,shake:0,flash:0,
     msg:'',msgT:0,endT:0,elev:[BOTY,BOTY-90,BOTY-40],p:null,e:null,fx:[],pt:[],slow:0};
  resetRound();
}
function resetRound(){
  S.elev=[BOTY,BOTY-90,BOTY-40];
  S.p=makeChar(0,SX[0]-30,1,true);
  S.e=makeChar(2,SX[2]+30,-1,false);
  S.p.y=S.elev[0];S.e.y=S.elev[2];
  S.timer=60*60;S.fx=[];S.pt=[];S.endT=0;S.slow=0;
}

/* ---------- 入力 ---------- */
const keymap={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',
  ' ':'jump',z:'a',x:'b',c:'g',v:'s',Z:'a',X:'b',C:'g',V:'s'};
const pressed={};
function setKey(k,v){
  if(!k)return;
  if(S.mode!=='fight'&&v){ if(S.mode==='title'){S.mode='fight';} else if(S.mode==='matchEnd'&&S.endT>90){newMatch();S.mode='fight';} return;}
  pressed[k]=v;
}
addEventListener('keydown',e=>{const k=keymap[e.key];if(k){e.preventDefault();setKey(k,1);}},{passive:false});
addEventListener('keyup',e=>{const k=keymap[e.key];if(k){e.preventDefault();setKey(k,0);}},{passive:false});

document.querySelectorAll('.btn').forEach(el=>{
  const k=el.dataset.k;
  const on=e=>{e.preventDefault();el.classList.add('on');setKey(k,1);};
  const off=e=>{e.preventDefault();el.classList.remove('on');setKey(k,0);};
  el.addEventListener('pointerdown',on);
  el.addEventListener('pointerup',off);
  el.addEventListener('pointercancel',off);
  el.addEventListener('pointerleave',off);
});
cv.addEventListener('pointerdown',e=>{e.preventDefault();
  if(S.mode==='title')S.mode='fight';
  else if(S.mode==='matchEnd'&&S.endT>90){newMatch();S.mode='fight';}
});

/* ---------- エフェクト ---------- */
function slash(x,y,face,a0,a1,r,col){S.fx.push({x,y,face,a0,a1,r,t:0,life:11,col:col||'#eef4ff'});}
function burst(x,y,n,col,pw){
  for(let i=0;i<n;i++){const a=rnd(0,Math.PI*2),s=rnd(1,pw||6);
    S.pt.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1.5,life:rnd(16,34),col});}
}
function popup(x,y,txt,col){S.pt.push({x,y,vx:0,vy:-1.1,life:40,col,txt});}

/* ---------- 当たり判定 ---------- */
function tryHit(a,d,def){
  if(a.hitDone)return;
  const hx=a.x+a.face*def.reach*0.55;
  const dy=a.air?(d.y-a.y):(d.y-a.y);
  if(Math.abs(d.x-hx)<def.reach*0.55+22 && dy>-70 && dy<58 && d.st!=='dead'){
    a.hitDone=true;applyHit(a,d,def);
  }
}
function applyHit(a,d,def){
  const px=(a.x+d.x)/2,py=d.y-58;
  // 弾き
  if(d.guard&&d.parry>0&&!def.pierce){
    a.st='stun';a.t=0;a.stun=42;a.atk=null;
    d.rage=clamp(d.rage+26,0,100);
    S.hitstop=16;S.shake=9;S.flash=.5;
    burst(px,py,26,'#ffe9a8',9);popup(px,py-16,'弾き','#e0b062');
    slash(px,py,1,-1.5,1.5,64,'#ffe9a8');
    return;
  }
  // ガード
  if(d.guard&&!def.pierce){
    if(def.crush){ d.st='stagger';d.t=0;d.guard=false;
      d.hp=clamp(d.hp-6,0,100);
      S.hitstop=10;S.shake=7;burst(px,py,14,'#8fb4ff',5);popup(px,py-16,'受け崩し','#8fb4ff');
    }else{
      d.hp=clamp(d.hp-2,0,100);S.hitstop=4;burst(px,py,8,'#8fb4ff',4);
    }
    d.x+=a.face*6;d.rage=clamp(d.rage+4,0,100);
    return;
  }
  // クリーンヒット
  d.hp=clamp(d.hp-def.dmg,0,100);
  d.rage=clamp(d.rage+def.dmg*1.1,0,100);
  a.rage=clamp(a.rage+def.rage,0,100);
  d.st='hit';d.t=0;d.guard=false;d.parry=0;
  d.x=clamp(d.x+a.face*def.kb,SX[d.shaft]-HALF,SX[d.shaft]+HALF);
  S.hitstop=def.stop;S.shake=def.stop*0.9;S.flash=def.dmg>20?.6:.22;
  burst(px,py,def.dmg>20?34:16,'#d94b3e',def.dmg>20?11:6);
  burst(px,py,10,'#fff2d0',7);
  popup(px,py-20,def.dmg,def.dmg>20?'#ff6a58':'#ffd9a0');
  if(d.hp<=0){d.st='dead';d.t=0;S.hitstop=26;S.slow=110;endRound();}
}

/* ---------- ラウンド ---------- */
function endRound(){
  if(S.endT>0)return;
  S.endT=1;
  const pd=S.p.hp<=0,ed=S.e.hp<=0;
  if(ed&&!pd){S.win[0]++;S.msg='一 本';}
  else if(pd&&!ed){S.win[1]++;S.msg='取られた';}
  else{S.msg='相 打 ち';}
}
function nextRound(){
  if(S.win[0]>=2||S.win[1]>=2){S.mode='matchEnd';S.endT=0;
    S.msg=S.win[0]>=2?'勝　負　あ　り':'討　た　れ　た';return;}
  S.round++;resetRound();
}

/* ---------- 移動・状態 ---------- */
function canAct(c){return c.stun<=0&&c.st!=='hit'&&c.st!=='dead'&&c.st!=='stagger'&&c.st!=='stun'&&!c.atk;}

function updateChar(c){
  const I=c.in;
  if(c.st==='dead'){c.t++;return;}
  if(c.stun>0)c.stun--;
  c.t++;

  // 復帰系
  if(c.st==='hit'&&c.t>16)c.st='idle';
  if(c.st==='stagger'&&c.t>34)c.st='idle';
  if(c.st==='stun'&&c.stun<=0)c.st='idle';
  if(c.st==='land'&&c.t>c.landLag)c.st='idle';

  // 攻撃進行
  if(c.atk){
    const d=c.atk.def,e=c.atk;
    e.f++;
    if(e.f===d.start){
      const r=d.reach;
      slash(c.x+c.face*r*0.45,c.y-62,c.face,-1.9,0.7,r*0.72,d===ATK.s?'#ffd9a0':'#eef4ff');
      if(d===ATK.s){S.flash=.35;burst(c.x,c.y-60,20,'#ffd9a0',8);}
    }
    if(e.f>=d.start&&e.f<d.start+d.act){
      tryHit(c,c===S.p?S.e:S.p,d);
    }
    if(e.f>=d.start+d.act+d.rec){c.atk=null;c.st='idle';}
    if(!c.air&&c.atk){c.guard=false;c.parry=0;return;}   // 地上攻撃中は移動不可
  }

  // 空中
  if(c.air){
    c.lt++;
    const p=clamp(c.lt/c.ldur,0,1);
    c.x=lerp(c.lx0,c.lx1,p);
    c.y=lerp(c.ly0,S.elev[c.lto],p)-Math.sin(p*Math.PI)*118;
    if(!c.atk&&(I.a||I.b)){
      c.atk={def:ATK.air,f:0};c.hitDone=false;c.st='airatk';
    }
    if(p>=1){
      const drop=Math.max(0,S.elev[c.lto]-c.ly0);
      c.air=false;c.shaft=c.lto;c.y=S.elev[c.lto];
      c.x=clamp(c.x,SX[c.shaft]-HALF,SX[c.shaft]+HALF);
      c.atk=null;c.st='land';c.t=0;c.landLag=drop>170?18:7;
      burst(c.x,c.y,drop>170?14:8,'#5f7ca0',drop>170?5:3);
    }
    return;
  }

  // 地上：籠に追従
  c.y=S.elev[c.shaft];

  // 受け
  if(canAct(c)&&I.g){
    if(!c.guard){c.guard=true;c.parry=8;}
    else if(c.parry>0)c.parry--;
    c.st='guard';
  }else{c.guard=false;c.parry=0;if(c.st==='guard')c.st='idle';}

  if(!canAct(c))return;

  // 昇降
  if(I.up)S.elev[c.shaft]-=2.7;
  if(I.down)S.elev[c.shaft]+=2.7;

  if(c.guard)return;

  // 一閃
  if(I.s&&c.rage>=100){c.rage=0;c.atk={def:ATK.s,f:0};c.hitDone=false;c.st='issen';S.shake=6;return;}
  if(I.b){c.atk={def:ATK.b,f:0};c.hitDone=false;c.st='atkB';return;}
  if(I.a){c.atk={def:ATK.a,f:0};c.hitDone=false;c.st='atkA';return;}

  // 跳
  if(I.jump){
    const dir=I.left?-1:I.right?1:c.face;
    const to=clamp(c.shaft+dir,0,2);
    if(to!==c.shaft){
      c.air=true;c.lt=0;c.ldur=28;c.lx0=c.x;c.lx1=SX[to];c.ly0=c.y;c.lto=to;
      c.face=dir;c.st='air';c.atk=null;
      return;
    }
  }

  // 歩き
  let mv=0;
  if(I.left)mv-=1;if(I.right)mv+=1;
  if(mv){
    c.face=mv;
    c.x=clamp(c.x+mv*2.7,SX[c.shaft]-HALF,SX[c.shaft]+HALF);
    c.st='walk';
  }else if(c.st==='walk')c.st='idle';
}

/* ---------- 敵AI ---------- */
function ai(){
  const e=S.e,p=S.p,I=e.in;
  for(const k in I)I[k]=0;
  if(e.st==='dead'||S.endT>0)return;
  e.think--;

  const aggro=1+(1-e.hp/100)*1.1;           // 追い詰められるほど攻める
  const dx=p.x-e.x,adx=Math.abs(dx);
  const dyE=S.elev[p.shaft]-S.elev[e.shaft];

  if(!e.air&&!e.atk&&e.stun<=0)e.face=dx>0?1:-1;

  // 逃げ判断
  if(e.hp<32&&e.hp<p.hp&&Math.random()<0.008&&e.shaft===p.shaft){
    e.flee=90;
  }
  if(e.flee>0){
    e.flee--;
    if(e.shaft===p.shaft){I.jump=1;I[e.shaft>0?'left':'right']=1;}
    else I.up=1;
    return;
  }

  if(e.shaft!==p.shaft){
    // 高さを合わせてから飛ぶ
    if(Math.abs(dyE)>34){ if(dyE<0)I.up=1; else I.down=1; }
    else if(e.think<=0){
      I.jump=1;I[p.shaft>e.shaft?'right':'left']=1;
      e.think=26;
    }
    // たまに上取りして飛び込み狙い
    if(Math.random()<0.012*aggro){I.up=1;I.down=0;}
    return;
  }

  // 同じ籠：間合い
  if(e.air){ if(adx<70&&Math.random()<0.2)I.a=1; return; }

  const reach=95;
  if(adx>reach){
    I[dx>0?'right':'left']=1;
  }else{
    if(e.think<=0){
      const r=Math.random()*aggro;
      if(p.atk&&r<0.55){I.g=1;e.think=22;}          // 割り込みガード（弾き狙い）
      else if(r<0.9){I.a=1;e.think=20;}
      else if(r<1.35){I.b=1;e.think=42;}
      else if(r<1.6){I.g=1;e.think=26;}
      else {I[dx>0?'left':'right']=1;e.think=16;}
      if(e.rage>=100&&Math.random()<0.45){I.s=1;e.think=60;}
    }else if(p.atk&&p.atk.f<4&&Math.random()<0.25)I.g=1;
  }
}

/* ---------- 更新 ---------- */
function update(){
  if(S.mode!=='fight'){ if(S.endT>0)S.endT++; return; }
  if(S.hitstop>0){S.hitstop--;S.shake*=.9;return;}
  if(S.slow>0){S.slow--;if(S.slow%2)return;}

  // 入力反映
  for(const k in S.p.in)S.p.in[k]=pressed[k]?1:0;
  if(S.endT>0)for(const k in S.p.in)S.p.in[k]=0;
  ai();

  // 籠の自然降下
  for(let i=0;i<3;i++)S.elev[i]=clamp(S.elev[i]+0.17,TOPY,BOTY);

  updateChar(S.p);updateChar(S.e);
  for(let i=0;i<3;i++)S.elev[i]=clamp(S.elev[i],TOPY,BOTY);

  // 押し合い
  if(S.p.shaft===S.e.shaft&&!S.p.air&&!S.e.air){
    const d=S.e.x-S.p.x;
    if(Math.abs(d)<34){const s=Math.sign(d)||1;
      S.p.x=clamp(S.p.x-s*1.1,SX[S.p.shaft]-HALF,SX[S.p.shaft]+HALF);
      S.e.x=clamp(S.e.x+s*1.1,SX[S.e.shaft]-HALF,SX[S.e.shaft]+HALF);}
  }

  S.shake*=.88;S.flash*=.86;
  S.fx=S.fx.filter(f=>++f.t<f.life);
  S.pt=S.pt.filter(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=q.txt?0:.34;q.vx*=.95;return --q.life>0;});

  if(S.endT>0){S.endT++;if(S.endT>150)nextRound();return;}

  S.timer--;
  if(S.timer<=0){S.timer=0;
    if(S.p.hp>S.e.hp){S.win[0]++;S.msg='時 間 勝 ち';}
    else if(S.e.hp>S.p.hp){S.win[1]++;S.msg='時 間 負 け';}
    else S.msg='引 き 分 け';
    S.endT=1;
  }
}

/* ---------- 描画 ---------- */
function bg(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0a1526');g.addColorStop(.55,'#0a0f19');g.addColorStop(1,'#05070c');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // 血月
  ctx.save();ctx.globalAlpha=.85;
  const mg=ctx.createRadialGradient(400,150,10,400,150,150);
  mg.addColorStop(0,'rgba(192,52,43,.55)');mg.addColorStop(1,'rgba(192,52,43,0)');
  ctx.fillStyle=mg;ctx.beginPath();ctx.arc(400,150,150,0,7);ctx.fill();
  ctx.fillStyle='#8f2a24';ctx.beginPath();ctx.arc(400,150,64,0,7);ctx.fill();
  ctx.restore();
  // 遠景の城
  ctx.fillStyle='#0d1523';
  ctx.beginPath();ctx.moveTo(0,H);ctx.lineTo(0,470);
  for(let i=0;i<16;i++){const x=i*52;ctx.lineTo(x,470-((i*37)%60));ctx.lineTo(x+52,470-((i*37)%60));}
  ctx.lineTo(W,H);ctx.closePath();ctx.fill();
}
function shafts(){
  for(let i=0;i<3;i++){
    const x=SX[i],y=S.elev[i];
    // 塔
    ctx.fillStyle='rgba(20,30,48,.55)';ctx.fillRect(x-96,0,192,H);
    ctx.strokeStyle='#1e2c44';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(x-96,0);ctx.lineTo(x-96,H);ctx.moveTo(x+96,0);ctx.lineTo(x+96,H);ctx.stroke();
    // 綱
    ctx.strokeStyle='#3a4b66';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(x-46,0);ctx.lineTo(x-46,y-8);ctx.moveTo(x+46,0);ctx.lineTo(x+46,y-8);ctx.stroke();
    // 籠
    ctx.fillStyle='#20304a';ctx.fillRect(x-92,y,184,13);
    ctx.fillStyle='#33496c';ctx.fillRect(x-92,y,184,4);
    ctx.strokeStyle='#4a628c';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(x-92,y+13);ctx.lineTo(x-78,y+30);ctx.moveTo(x+92,y+13);ctx.lineTo(x+78,y+30);ctx.stroke();
    // 提灯
    for(const s of[-1,1]){
      const lx=x+s*80;
      const lg=ctx.createRadialGradient(lx,y-12,2,lx,y-12,58);
      lg.addColorStop(0,'rgba(224,176,98,.42)');lg.addColorStop(1,'rgba(224,176,98,0)');
      ctx.fillStyle=lg;ctx.beginPath();ctx.arc(lx,y-12,58,0,7);ctx.fill();
      ctx.fillStyle='#e0b062';ctx.beginPath();ctx.ellipse(lx,y-12,6,9,0,0,7);ctx.fill();
    }
    // 高さ目盛
    ctx.fillStyle='rgba(224,176,98,.20)';
    ctx.fillRect(x+94,TOPY,3,BOTY-TOPY);
    ctx.fillStyle='#e0b062';ctx.fillRect(x+92,y+3,7,7);
  }
}

function limb(x1,y1,x2,y2,w,col){
  ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
}
function drawChar(c,body,accent){
  const t=c.t;
  let sw=-0.35,lean=0,crouch=0,legs=0,armF=0.5;
  if(c.st==='idle'){sw=-0.35+Math.sin((t+c.bob)*0.06)*0.04;}
  if(c.st==='walk'){legs=Math.sin(t*0.28)*13;sw=-0.4;}
  if(c.st==='guard'){sw=-1.45;lean=-5;crouch=5;}
  if(c.st==='hit'){lean=-13;sw=0.6;crouch=6;}
  if(c.st==='stagger'){lean=-17;sw=1.2;crouch=13;}
  if(c.st==='stun'){lean=-9;sw=1.4;crouch=9;}
  if(c.st==='land'){crouch=12;sw=-0.2;}
  if(c.st==='air'||c.st==='airatk'){legs=-16;crouch=10;sw=c.atk?1.1:-1.9;}
  if(c.atk){
    const d=c.atk.def,f=c.atk.f;
    const pre=f/Math.max(1,d.start);
    if(d===ATK.a){sw=f<d.start?lerp(-0.4,-2.0,pre):lerp(-2.0,0.5,clamp((f-d.start)/4,0,1));}
    if(d===ATK.b){sw=f<d.start?lerp(-0.4,-2.9,pre):lerp(-2.9,0.85,clamp((f-d.start)/5,0,1));crouch=f>d.start?10:0;}
    if(d===ATK.s){sw=f<d.start?lerp(-0.4,-3.2,pre):lerp(-3.2,1.1,clamp((f-d.start)/4,0,1));
      if(f<d.start){lean=-8;crouch=6;}}
    if(d===ATK.air){sw=lerp(-1.9,1.2,clamp(f/8,0,1));}
    armF=0.85;
  }
  ctx.save();
  ctx.translate(c.x,c.y);ctx.scale(c.face,1);
  // 影
  if(!c.air){ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(0,2,22,5,0,0,7);ctx.fill();}
  if(c.st==='dead'){
    ctx.rotate(-1.35);ctx.translate(-40,-14);
  }
  const hipY=-46+crouch,shY=-84+crouch,headY=-99+crouch;
  const lx=lean;
  // 脚
  limb(0,hipY,-9+legs,-22+crouch*.4,7,body);
  limb(-9+legs,-22+crouch*.4,-13+legs*1.3,0,6,body);
  limb(0,hipY,10-legs,-22+crouch*.4,7,body);
  limb(10-legs,-22+crouch*.4,15-legs*1.3,0,6,body);
  // 胴（袴のシルエット）
  ctx.fillStyle=body;
  ctx.beginPath();ctx.moveTo(-13,hipY+4);ctx.lineTo(13,hipY+4);
  ctx.lineTo(9+lx,shY);ctx.lineTo(-9+lx,shY);ctx.closePath();ctx.fill();
  // 襟
  ctx.fillStyle=accent;
  ctx.beginPath();ctx.moveTo(-9+lx,shY);ctx.lineTo(9+lx,shY);ctx.lineTo(4+lx,shY+16);ctx.lineTo(-4+lx,shY+16);ctx.closePath();ctx.fill();
  // 首・頭
  limb(lx,shY,lx*1.2,headY+8,7,body);
  ctx.fillStyle=body;ctx.beginPath();ctx.arc(lx*1.3+2,headY,12,0,7);ctx.fill();
  ctx.fillStyle=accent;ctx.fillRect(lx*1.3-6,headY-4,17,3.5);   // 鉢巻
  // 腕＋刀
  const shx=lx+4,shy=shY+5;
  const hx=shx+Math.cos(sw)*26*armF+10,hy=shy+Math.sin(sw)*26*armF;
  limb(shx,shy,hx,hy,7,body);
  limb(shx-6,shy+3,hx,hy,6,body);
  // 刀身
  const bl=c.atk&&c.atk.def===ATK.s?96:82;
  const tx=hx+Math.cos(sw)*bl,ty=hy+Math.sin(sw)*bl;
  ctx.strokeStyle=c.atk&&c.atk.def===ATK.s?'#ffd9a0':'#dbe6f2';
  ctx.lineWidth=4.5;ctx.beginPath();ctx.moveTo(hx,hy);ctx.lineTo(tx,ty);ctx.stroke();
  ctx.strokeStyle='#e0b062';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(hx-Math.cos(sw)*10,hy-Math.sin(sw)*10);ctx.lineTo(hx+Math.cos(sw)*4,hy+Math.sin(sw)*4);ctx.stroke();
  // 弾き構えの光
  if(c.guard&&c.parry>0){
    ctx.strokeStyle='rgba(255,233,168,.9)';ctx.lineWidth=2.5;
    ctx.beginPath();ctx.arc(14,-56,34,-1.1,1.1);ctx.stroke();
  }
  // 怒りのオーラ
  if(c.rage>=100&&c.st!=='dead'){
    ctx.strokeStyle='rgba(217,75,62,'+(0.35+Math.sin(t*0.2)*0.2)+')';ctx.lineWidth=2;
    ctx.beginPath();ctx.ellipse(0,-52,30,58,0,0,7);ctx.stroke();
  }
  ctx.restore();
}

function fx(){
  for(const f of S.fx){
    const p=f.t/f.life;
    ctx.save();ctx.translate(f.x,f.y);ctx.scale(f.face,1);
    ctx.globalAlpha=(1-p)*0.95;
    ctx.strokeStyle=f.col;ctx.lineWidth=13*(1-p)+2;ctx.lineCap='round';
    ctx.beginPath();ctx.arc(0,0,f.r,lerp(f.a0,f.a1,p*0.35),lerp(f.a0,f.a1,0.55+p*0.45));ctx.stroke();
    ctx.restore();
  }
  ctx.globalAlpha=1;
  for(const q of S.pt){
    if(q.txt!==undefined){
      ctx.globalAlpha=clamp(q.life/28,0,1);
      ctx.fillStyle=q.col;ctx.font='700 22px "Hiragino Mincho ProN",serif';
      ctx.textAlign='center';ctx.fillText(q.txt,q.x,q.y);
    }else{
      ctx.globalAlpha=clamp(q.life/22,0,1);
      ctx.fillStyle=q.col;ctx.fillRect(q.x,q.y,3.2,3.2);
    }
  }
  ctx.globalAlpha=1;ctx.textAlign='left';
}

function bar(x,y,w,v,col,rev){
  ctx.fillStyle='rgba(255,255,255,.09)';ctx.fillRect(x,y,w,14);
  ctx.fillStyle=col;
  const ww=w*v/100;
  ctx.fillRect(rev?x+w-ww:x,y,ww,14);
  ctx.strokeStyle='#4a628c';ctx.lineWidth=1;ctx.strokeRect(x+.5,y+.5,w-1,13);
}
function hud(){
  ctx.font='13px "Hiragino Mincho ProN",serif';
  bar(24,24,290,S.p.hp,'#d9c26a');
  bar(W-314,24,290,S.e.hp,'#c0342b',true);
  bar(24,42,190,S.p.rage,'#d94b3e');
  bar(W-214,42,190,S.e.rage,'#d94b3e',true);
  ctx.fillStyle='#e8edf2';ctx.fillText('侍',24,72);
  ctx.textAlign='right';ctx.fillText('鬼',W-24,72);ctx.textAlign='left';
  if(S.p.rage>=100){ctx.fillStyle='#ff6a58';ctx.fillText('一閃可',44,72);}
  if(S.e.rage>=100){ctx.textAlign='right';ctx.fillStyle='#ff6a58';ctx.fillText('一閃可',W-44,72);ctx.textAlign='left';}
  // 時計
  ctx.textAlign='center';ctx.font='34px "Hiragino Mincho ProN",serif';
  ctx.fillStyle=S.timer<10*60?'#d94b3e':'#e0b062';
  ctx.fillText(Math.ceil(S.timer/60),W/2,50);
  // 星取り
  ctx.font='14px serif';
  for(let i=0;i<2;i++){
    ctx.fillStyle=S.win[0]>i?'#e0b062':'rgba(255,255,255,.16)';
    ctx.beginPath();ctx.arc(W/2-34-i*18,64,6,0,7);ctx.fill();
    ctx.fillStyle=S.win[1]>i?'#c0342b':'rgba(255,255,255,.16)';
    ctx.beginPath();ctx.arc(W/2+34+i*18,64,6,0,7);ctx.fill();
  }
  ctx.fillStyle='#7f8fa6';ctx.font='12px serif';
  ctx.fillText(['一本目','二本目','三本目'][S.round-1]||'',W/2,86);
  ctx.textAlign='left';
}

function overlay(){
  if(S.mode==='title'){
    ctx.fillStyle='rgba(5,7,12,.72)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';
    ctx.fillStyle='#e0b062';ctx.font='58px "Hiragino Mincho ProN",serif';
    ctx.fillText('昇 降 斬',W/2,238);
    ctx.fillStyle='#8fa0b8';ctx.font='16px serif';
    ctx.fillText('三機の籠を昇り、降り、間合いを断つ',W/2,282);
    ctx.fillStyle='#e8edf2';ctx.font='20px serif';
    ctx.fillText('画面をタップして立ち合い開始',W/2,364);
    ctx.textAlign='left';return;
  }
  if(S.endT>0&&S.msg){
    const a=clamp(S.endT/22,0,1);
    ctx.globalAlpha=a;ctx.textAlign='center';
    ctx.fillStyle='rgba(5,7,12,.5)';ctx.fillRect(0,230,W,110);
    ctx.fillStyle='#e0b062';ctx.font='52px "Hiragino Mincho ProN",serif';
    ctx.fillText(S.msg,W/2,305);
    if(S.mode==='matchEnd'&&S.endT>90){
      ctx.fillStyle='#8fa0b8';ctx.font='17px serif';
      ctx.fillText('タップでもう一番',W/2,352);
    }
    ctx.globalAlpha=1;ctx.textAlign='left';
  }
}

function draw(){
  ctx.save();
  const s=S.shake;
  if(s>.4)ctx.translate(rnd(-s,s),rnd(-s,s));
  bg();shafts();
  const first=S.p.y>S.e.y?S.e:S.p, second=first===S.p?S.e:S.p;
  drawChar(first,first.isP?'#101a2b':'#1a0f12',first.isP?'#dbe6f2':'#c0342b');
  drawChar(second,second.isP?'#101a2b':'#1a0f12',second.isP?'#dbe6f2':'#c0342b');
  fx();
  ctx.restore();
  if(S.flash>.02){ctx.fillStyle='rgba(255,240,220,'+S.flash*.55+')';ctx.fillRect(0,0,W,H);}
  hud();overlay();
  document.getElementById('issenBtn').classList.toggle('ready',S.p&&S.p.rage>=100);
}

newMatch();
(function loop(){update();draw();requestAnimationFrame(loop);})();
})();
</script>
