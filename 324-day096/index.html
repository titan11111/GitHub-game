<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#080706"><title>大太鼓 ― 脱力の一打</title><link rel="stylesheet" href="fc-ios-controller.css"><link rel="stylesheet" href="style.css"></head>
<body><main id="stage"><canvas id="scene" aria-label="二人の奏者と大太鼓の舞台"></canvas><canvas id="notes" aria-label="譜面ガイド"></canvas><div id="feedback" aria-live="polite"></div><div id="countdown"></div><div id="stageCaption">音は、離したあとに生まれる。</div></main>
<section id="panel" class="fc-control-deck"><div class="toolbar"><span id="score">0 点</span><span id="combo">自由打ち</span><button id="pause" aria-label="ポーズ">Ⅱ</button><button class="mute" aria-label="音の切り替え">音 ON</button><button id="gear" aria-label="設定">設定</button></div><div class="pads"><button class="pad" data-hand="0" aria-label="左のバチ"><span class="rim">カッ <small>D</small></span><span class="face">ドン <small>F</small></span><span class="padHint">左のバチ · 上へはらうと大ドン</span></button><button class="pad" data-hand="1" aria-label="右のバチ"><span class="rim">カッ <small>K</small></span><span class="face">ドン <small>J</small></span><span class="padHint">右のバチ · すぐ離して響かせる</span></button></div><div id="history">指をすぐ離すと、音が長く響きます</div></section>
<div id="overlay" class="overlay"><section id="menu" class="sheet"></section></div>
<div id="settings" class="overlay" hidden><section class="sheet"><p class="eyebrow">PREFERENCES</p><h2>演奏のしたく</h2><div class="settingsGrid"><label>音量 <output id="volumeValue"></output><input id="volume" type="range" min="0" max="100"></label><label>タイミング補正 <output id="offsetValue"></output><input id="offset" type="range" min="-100" max="100" step="5"></label><label>利き手<select id="hand"><option value="right">右利き</option><option value="left">左利き（左右を交換）</option></select></label><label>画質<select id="quality"><option value="high">高 · 影と光</option><option value="low">低 · 軽い描画</option></select></label><label>譜面ガイド<select id="guide"><option value="on">表示する</option><option value="off">表示しない</option></select></label><label>自由打ちの相方<select id="partner"><option value="on">地打ちあり</option><option value="off">ひとりで打つ</option></select></label><label>自由打ちの速さ <output id="tempoValue"></output><input id="tempo" type="range" min="80" max="160" step="4"></label></div><button id="calibrate">8拍の自動補正</button><p id="calibrationHelp">音に合わせて8回たたいて、ずれを測ります。</p><button id="settingsClose" class="primary">戻る</button></section></div>
<div id="rotate" class="overlay" hidden><section class="sheet"><h2>縦に持ってください</h2><p>両手の親指で、左右のバチを打ちます。</p></section></div>
<script type="module" src="controls.js"></script></body></html>
