<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>COSMIC STRIKE - 縦型シューティング</title>
<style>
    body {
        margin: 0;
        padding: 0;
        background: #000;
        color: #0ff;
        font-family: 'Courier New', monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        image-rendering: pixelated;
    }
    canvas {
        border: 4px solid #0ff;
        box-shadow: 0 0 30px #0ff;
    }
    .info {
        margin-top: 10px;
        color: #0f8;
        text-align: center;
    }
</style>
</head>
<body>
<canvas id="game" width="480" height="640"></canvas>
<div class="info">
    ←→ / A D : 移動　　スペース : 射撃　　P : 一時停止
</div>

<script>
// ====================== COSMIC STRIKE ======================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 480, H = 640;

let gameState = 'title'; // title, playing, paused, gameover
let score = 0;
let highScore = localStorage.getItem('cosmicHigh') || 0;
let lives = 3;
let invincible = 0;
let time = 0;
let spawnRate = 35;

// 入力
const keys = {};
window.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    if (e.key === 'p' || e.key === 'P') togglePause();
});
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

// オーディオ
const audio = new (window.AudioContext || window.webkitAudioContext)();
function playSound(freq, duration, type = 'sawtooth', vol = 0.3) {
    const osc = audio.createOscillator();
    const gain = audio.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audio.currentTime);
    gain.gain.setValueAtTime(vol, audio.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + duration);
    osc.connect(gain).connect(audio.destination);
    osc.start();
    osc.stop(audio.currentTime + duration);
}
function laserSound() { playSound(680, 0.08, 'square', 0.25); }
function explodeSound() {
    playSound(120, 0.4, 'sawtooth', 0.6);
    setTimeout(() => playSound(80, 0.3, 'sawtooth', 0.4), 50);
}

// 背景星
const stars = [];
for (let i = 0; i < 120; i++) {
    stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        size: Math.random() * 2.5 + 0.8,
        speed: Math.random() * 2.2 + 0.8
    });
}

// プレイヤー
const player = {
    x: W/2 - 18,
    y: H - 90,
    w: 36,
    h: 48,
    speed: 6.5
};

// 配列
let bullets = [];
let enemies = [];
let particles = [];

// オブジェクト作成
function createBullet() {
    bullets.push({
        x: player.x + player.w/2 - 3,
        y: player.y - 10,
        w: 6,
        h: 18,
        speed: 14
    });
    laserSound();
}

function createEnemy() {
    const type = Math.random() < 0.6 ? 0 : 1; // 0:直進, 1:波状
    enemies.push({
        x: 30 + Math.random() * (W - 60),
        y: -40,
        w: 32,
        h: 32,
        speed: 2.2 + Math.random() * 1.3,
        type: type,
        phase: Math.random() * Math.PI * 2,
        hp: type === 0 ? 1 : 2,
        score: type === 0 ? 100 : 250
    });
}

function createExplosion(x, y, intensity = 1) {
    explodeSound();
    const colors = ['#ff0', '#f80', '#f44', '#fff'];
    for (let i = 0; i < 28 * intensity; i++) {
        const angle = Math.random() * Math.PI * 2;
        const vel = Math.random() * 5 + 1.5;
        particles.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * vel,
            vy: Math.sin(angle) * vel - 1,
            life: 35 + Math.random() * 25,
            color: colors[Math.floor(Math.random()*colors.length)],
            size: Math.random() * 4 + 2
        });
    }
}

// 衝突判定
function collides(a, b) {
    return !(a.x + a.w < b.x || b.x + b.w < a.x ||
             a.y + a.h < b.y || b.y + b.h < a.y);
}

// メインループ
function loop() {
    time++;
    ctx.fillStyle = '#0a001f';
    ctx.fillRect(0, 0, W, H);

    // 星描画（パララックス）
    ctx.fillStyle = '#fff';
    stars.forEach(s => {
        s.y += s.speed;
        if (s.y > H) s.y = 0;
        ctx.globalAlpha = s.size > 2 ? 0.9 : 0.5;
        ctx.fillRect(s.x, s.y, s.size, s.size);
    });
    ctx.globalAlpha = 1;

    if (gameState === 'playing') {
        // プレイヤー移動
        if ((keys['arrowleft'] || keys['a']) && player.x > 10) player.x -= player.speed;
        if ((keys['arrowright'] || keys['d']) && player.x < W - player.w - 10) player.x += player.speed;

        // 射撃
        if (keys[' '] && time % 6 === 0) {
            createBullet();
        }

        // 敵出現
        if (time % spawnRate === 0) {
            createEnemy();
            if (score > 8000 && Math.random() < 0.4) createEnemy();
        }
        if (score > 15000) spawnRate = 22;

        // 更新
        updateBullets();
        updateEnemies();
        updateParticles();
        checkCollisions();

        // 無敵時間
        if (invincible > 0) invincible--;
    }

    drawPlayer();
    drawBullets();
    drawEnemies();
    drawParticles();
    drawUI();

    if (gameState === 'title') drawTitle();
    if (gameState === 'gameover') drawGameOver();
    if (gameState === 'paused') drawPause();

    requestAnimationFrame(loop);
}

// 各更新関数
function updateBullets() {
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.y -= b.speed;
        if (b.y < -20) bullets.splice(i, 1);
    }
}

function updateEnemies() {
    for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.y += e.speed;

        if (e.type === 1) {
            e.x += Math.sin(time * 0.1 + e.phase) * 2.8;
        }

        if (e.y > H + 20) enemies.splice(i, 1);
    }
}

function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.15; // 重力っぽく
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function checkCollisions() {
    // 弾 vs 敵
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        for (let j = enemies.length - 1; j >= 0; j--) {
            const e = enemies[j];
            if (collides(b, e)) {
                bullets.splice(i, 1);
                e.hp--;
                if (e.hp <= 0) {
                    score += e.score;
                    createExplosion(e.x + e.w/2, e.y + e.h/2, 1.2);
                    enemies.splice(j, 1);
                } else {
                    createExplosion(b.x + 3, b.y, 0.6);
                }
                break;
            }
        }
    }

    // プレイヤー vs 敵
    if (invincible === 0) {
        for (let e of enemies) {
            if (collides(player, e)) {
                lives--;
                createExplosion(player.x + player.w/2, player.y + 20, 2);
                invincible = 90;
                if (lives <= 0) {
                    gameState = 'gameover';
                    if (score > highScore) {
                        highScore = score;
                        localStorage.setItem('cosmicHigh', highScore);
                    }
                }
                break;
            }
        }
    }
}

function drawPlayer() {
    ctx.save();
    ctx.translate(player.x + player.w/2, player.y + player.h/2);

    if (invincible > 0 && time % 6 < 3) {
        ctx.globalAlpha = 0.4;
    }

    ctx.fillStyle = '#00ddff';
    ctx.beginPath();
    ctx.moveTo(0, -22);
    ctx.lineTo(-18, 18);
    ctx.lineTo(-8, 12);
    ctx.lineTo(8, 12);
    ctx.lineTo(18, 18);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#ffee88';
    ctx.beginPath();
    ctx.moveTo(0, -14);
    ctx.lineTo(-6, 0);
    ctx.lineTo(6, 0);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = '#0088ff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-15, 10);
    ctx.lineTo(15, 10);
    ctx.stroke();

    if (time % 3 === 0) {
        ctx.fillStyle = '#ff8800';
        ctx.fillRect(-6, 18, 4, 14);
        ctx.fillRect(2, 18, 4, 14);
    } else {
        ctx.fillStyle = '#ffdd00';
        ctx.fillRect(-5, 19, 3, 12);
        ctx.fillRect(3, 19, 3, 12);
    }

    ctx.restore();
}

function drawBullets() {
    ctx.shadowBlur = 15;
    ctx.shadowColor = '#00ffff';
    for (let b of bullets) {
        ctx.fillStyle = '#00ffff';
        ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.fillStyle = '#aaffff';
        ctx.fillRect(b.x + 1, b.y + 4, 4, 8);
    }
    ctx.shadowBlur = 0;
}

function drawEnemies() {
    for (let e of enemies) {
        ctx.save();
        ctx.translate(e.x + e.w/2, e.y + e.h/2);

        if (e.type === 0) {
            ctx.fillStyle = '#ff3366';
            ctx.beginPath();
            ctx.moveTo(0, -16);
            ctx.lineTo(-16, 16);
            ctx.lineTo(0, 6);
            ctx.lineTo(16, 16);
            ctx.closePath();
            ctx.fill();
        } else {
            ctx.fillStyle = '#ff00aa';
            ctx.beginPath();
            ctx.moveTo(0, -18);
            ctx.lineTo(-17, 15);
            ctx.lineTo(17, 15);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = '#880044';
            ctx.fillRect(-6, -4, 12, 12);
        }
        ctx.restore();
    }
}

function drawParticles() {
    for (let p of particles) {
        const alpha = p.life / 45;
        ctx.globalAlpha = alpha;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
    }
    ctx.globalAlpha = 1;
}

function drawUI() {
    ctx.fillStyle = '#00ffcc';
    ctx.font = 'bold 22px Courier New';
    ctx.fillText('SCORE ' + String(score).padStart(7, '0'), 20, 38);
    ctx.fillText('HI ' + String(highScore).padStart(7, '0'), 280, 38);

    ctx.fillStyle = '#00aaff';
    ctx.font = '18px Courier New';
    ctx.fillText('× ' + lives, 40, H - 25);

    ctx.save();
    ctx.translate(25, H - 35);
    ctx.scale(0.7, 0.7);
    ctx.fillStyle = '#00ddff';
    ctx.beginPath();
    ctx.moveTo(0, -18); ctx.lineTo(-14, 14); ctx.lineTo(14, 14); ctx.closePath();
    ctx.fill();
    ctx.restore();
}

function drawTitle() {
    ctx.fillStyle = '#00ffff';
    ctx.font = 'bold 42px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('COSMIC', W/2, 180);
    ctx.fillText('STRIKE', W/2, 235);

    ctx.font = '22px Courier New';
    ctx.fillStyle = '#ff88ff';
    ctx.fillText('PRESS SPACE TO START', W/2, 380);

    ctx.font = '16px Courier New';
    ctx.fillStyle = '#6666ff';
    ctx.fillText('縦型シューティング', W/2, 460);
}

function drawGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#ff3366';
    ctx.font = 'bold 52px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', W/2, 240);

    ctx.fillStyle = '#00ffff';
    ctx.font = '26px Courier New';
    ctx.fillText('FINAL SCORE: ' + score, W/2, 310);

    ctx.font = '20px Courier New';
    ctx.fillStyle = '#ff88ff';
    ctx.fillText('SPACE でリスタート', W/2, 420);
}

function drawPause() {
    ctx.fillStyle = 'rgba(0,0,30,0.75)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#00ffff';
    ctx.font = 'bold 36px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('PAUSED', W/2, H/2);
}

function startGame() {
    if (gameState === 'playing') return;
    score = 0;
    lives = 3;
    bullets = [];
    enemies = [];
    particles = [];
    player.x = W/2 - 18;
    spawnRate = 35;
    gameState = 'playing';
    invincible = 60;
}

function togglePause() {
    if (gameState === 'playing') gameState = 'paused';
    else if (gameState === 'paused') gameState = 'playing';
}

document.addEventListener('keydown', e => {
    if ((gameState === 'title' || gameState === 'gameover') && e.key === ' ') {
        startGame();
    }
});

loop();
</script>
</body>
</html>
