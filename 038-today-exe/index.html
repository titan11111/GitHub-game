function clamp(v,min,max){ return v<min?min:(v>max?max:v); }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function shuffle(arr){
  var a = arr.slice(), i, j, t;
  for(i=a.length-1;i>0;i--){ j=Math.floor(Math.random()*(i+1)); t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function hhmm(h){
  var hour = Math.floor(h);
  var min  = Math.round((h-hour)*60);
  return (hour<10?"0":"")+hour+":"+(min<10?"0":"")+min;
}
function phaseName(h){
  if(h<9)  return "朝 // 始まり";

  if(h<14) return "昼";
  if(h<17) return "午後 // 眠い時間";
  if(h<20) return "夕 // 巻き返し";
  return "夜 // 無理しがち";
}

function bindTap(el, handler){
  if(!el) return;
  var fired = false;
  var fire = function(e){
    if(e) e.preventDefault();
    el.classList.add("is-pressed");
    if(navigator.vibrate) navigator.vibrate(15);
    handler(e);
  };
  var release = function(){ el.classList.remove("is-pressed"); };
  el.addEventListener("pointerdown", function(e){
    fired = true;
    fire(e);
  });
  el.addEventListener("pointerup", release);
  el.addEventListener("pointercancel", release);
  el.addEventListener("pointerleave", release);
  el.addEventListener("click", function(e){
    e.preventDefault();
    if(fired){ fired = false; return; }
    fire(e);
  });
}

  for(i=0;i<list.length;i++){
    if(list[i].id === id) return list[i];
  }

}

========================================================= */
function loadSave(){
  var def = {high:0, bestRank:"-", bestTitle:"", plays:0};
  try{
    var raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return def;
    var o = JSON.parse(raw);
    return {
      high: typeof o.high === "number" ? o.high : 0,
      bestRank: o.bestRank || "-",
      bestTitle: o.bestTitle || "",
      plays: typeof o.plays === "number" ? o.plays : 0
    };
  }catch(e){ return def; }
}
function writeSave(o){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(o)); }catch(e){}
}
function emptyWeek(){
  return {days:[], carry:null, done:false, weekHigh:0};
}
function loadWeek(){
  try{
    var raw = localStorage.getItem(WEEK_KEY);
    if(!raw) return emptyWeek();
    var o = JSON.parse(raw);
    if(!o || typeof o !== "object") return emptyWeek();
    return {
      days: o.days instanceof Array ? o.days : [],
      carry: o.carry && typeof o.carry === "object" ? o.carry : null,
      done: !!o.done,
      weekHigh: typeof o.weekHigh === "number" ? o.weekHigh : 0
    };
  }catch(e){ return emptyWeek(); }
}
function writeWeek(o){
  try{ localStorage.setItem(WEEK_KEY, JSON.stringify(o)); }catch(e){}
}
function sleepCarry(s){
  return {
    weekday: s.weekday + 1,
    hp: clamp(Math.round(s.hp + 12), 30, 86),
    mp: clamp(Math.round(s.mp + 18), 28, 86),
    sat: clamp(Math.round(s.sat * 0.7 + 15), 22, 80),
    workRun: Math.max(0, (s.workRun||0) - 1),
    weekOverwork: (s.weekOverwork||0) + (s.overwork||0),
    weekRecovery: (s.weekRecovery||0) + (s.recovery||0)
  };
}
function applyCarry(carry){
  if(!carry) return;
  S.weekday = clamp(carry.weekday|0, 0, 4);
  S.hp = clamp(carry.hp|0, 0, 100);
  S.mp = clamp(carry.mp|0, 0, 100);
  S.sat = clamp(carry.sat|0, 0, 100);
  S.workRun = Math.max(0, carry.workRun|0);
  S.weekOverwork = Math.max(0, carry.weekOverwork|0);
  S.weekRecovery = Math.max(0, carry.weekRecovery|0);
}
function persistDay(r){
  var w = loadWeek();
  w.days = w.days || [];
  if(w.days.length && w.days[w.days.length-1].wday === S.weekday) return w;
  w.days.push({
    wday: S.weekday,
    total: r.total,
    rank: r.rank,
    work: r.work,
    health: r.health,
    sat: r.sat,
    overwork: S.overwork,
    recovery: S.recovery
  });
  if(S.weekday < 4){
    w.carry = sleepCarry(S);
    w.done = false;
  }else{
    w.carry = null;
    w.done = true;
    var sum = 0, i;
    for(i=0;i<w.days.length;i++) sum += w.days[i].total;
    w.weekAvg = Math.round(sum / w.days.length);
    w.weekSum = sum;
    if(w.weekAvg > (w.weekHigh||0)) w.weekHigh = w.weekAvg;
  }
  writeWeek(w);
  return w;
}
function weekLine(days){
  var s = "", i;
  for(i=0;i<days.length;i++){
    if(i) s += "　";
    s += WEEKDAYS[days[i].wday]+days[i].rank;
  }
  return s;
}
function weekStory(days){
  if(!days.length) return "1週間が終わった。";
  var n = days.length;
  var hFirst = days[0].health, hLast = days[n-1].health;
  var wFirst = days[0].work, wLast = days[n-1].work;
  var sFirst = days[0].sat, sLast = days[n-1].sat;
  if(hLast < hFirst - 12 && wLast >= wFirst){
    return "成果は増えた。体は減った。成長というより、消耗に近い1週間だ。";
  }
  if(hLast >= hFirst - 4 && wLast > wFirst){
    return "仕事も体力も、金曜の自分が月曜より少し強い。それが成長だ。";
  }
  if(hLast > hFirst && wLast <= wFirst){
    return "数字は控えめでも、金曜の顔は明るい。休めている人の週だ。";
  }
  if(sLast < sFirst - 12){
    return "タスクは終わった。満たされなかった。忙しいだけの1週間になりかけている。";
  }
  return "大きな破綻もなく、大きな跳躍もなく。こういう週を積めるのも、ひとつの強さだ。";
}
function weekRankOf(avg){
  if(avg>=90) return {rank:"S", rtitle:"成長した1週間"};
  if(avg>=80) return {rank:"A", rtitle:"いい1週間"};
  if(avg>=70) return {rank:"B", rtitle:"まあ悪くない週"};
  if(avg>=50) return {rank:"C", rtitle:"疲弊した1週間"};
  return {rank:"D", rtitle:"休まないと続かない"};
}

/* =========================================================
   選択肢の生成
========================================================= */
var lastEventId = "";
function buildTurn(){
  S.turn++;
  var remain = END_HOUR - S.hour;
  var eventChance = 0.5;
  if(S.turn === 1) eventChance = 0;          // 1手目は普通の行動から
  if(remain <= 2) eventChance = 0.25;        // 終盤はイベント控えめ

  var usedEvent = false;
  if(Math.random() < eventChance){
    var pool = EVENTS.filter(function(e){
      if(e.id === lastEventId) return false;
      var w = EVENT_WHEN[e.id];
      if(w && !inWindow(w[0], w[1], S.hour)) return false;
      var wd = EVENT_WDAY[e.id];
      if(wd && wd.indexOf(S.weekday) < 0) return false;
      var at = EVENT_AT[e.id];
      if(at && at !== S.place) return false;
      return true;
    });
    if(pool.length){
      var ev = pick(pool);
      lastEventId = ev.id;
      currentSet = {
        isEvent:true,
        title:ev.title,
        txt:weekdayLead()+"\n"+ev.txt,
        choices: ev.ch.map(function(c){ return c; })
      };
      usedEvent = true;
    }
  }
  if(!usedEvent){
    lastEventId = "";
    var acts = shuffle(actionsNow(S.hour, remain));
    var chosen = [];
    var hasWork=false, hasRest=false;
    var i;
    var must = null;
    if(S.place === "home" && S.hour < 10 && !S.commuted) must = findAction(acts, "commute");
    if(S.place === "office" && S.hour >= 17) must = findAction(acts, "leave");
    if(must){
      chosen.push(must);
      if(must.type==="work") hasWork=true;
      if(must.type==="rest") hasRest=true;
    }
    for(i=0;i<acts.length && chosen.length<3;i++){
      var a = acts[i];
      if(chosen.indexOf(a)>=0) continue;
      if(chosen.length===2 && !hasWork && a.type!=="work") continue;
      if(chosen.length===2 && !hasRest && a.type!=="rest") continue;
      chosen.push(a);
      if(a.type==="work") hasWork=true;
      if(a.type==="rest") hasRest=true;
    }
    for(i=0;i<acts.length && chosen.length<3;i++){
      if(chosen.indexOf(acts[i])<0) chosen.push(acts[i]);
    }
    currentSet = {
      isEvent:false,
      title:"> 次の行動を選択してください",
      txt:weekdayLead()+"\n時計は "+hhmm(S.hour)+"。"+placeName()+"。",
      choices: shuffle(chosen)
    };
  }
}

/* =========================================================
   行動の適用
========================================================= */
function applyChoice(c){
  var d = {hp:0, mp:0, work:0, sat:0, time:c.time};
  var notes = [];
  var isWork = (c.work||0) > 0 || c.type==="work";
  var isRest = c.type==="rest";

  var hp = c.hp||0, mp = c.mp||0, wk = c.work||0, st = c.sat||0;

  // --- MP不足ペナルティ ---
  if(isWork && S.mp < 20){
    wk = Math.round(wk*0.5);
    hp -= 5;
    st -= 3;
    notes.push({cls:"down", t:"集中力が切れている。効率が半分になった。"});
  }

  // --- OVERWORK 判定 ---
  S.owFlag = false;
  if(isWork && S.hp <= 25){
    S.owFlag = true;
    S.overwork++;
    wk = Math.round(wk*0.6);
    hp -= 6;
    st -= 6;
    notes.push({cls:"down", t:"OVERWORK！ 体力が限界。成果も気分も削れていく。"});
  }

  // --- 連続で仕事し続けた場合 ---
  if(isWork){
    S.workRun++; S.restRun = 0;
    if(S.workRun >= 4){
      var pen = 4 + S.weekday;
      hp -= pen; st -= pen;
      notes.push({cls:"down", t:weekdayName()+"。連続仕事"+S.workRun+"回。今週の疲れが重なっている。"});
    }
  }else{
    S.restRun++; S.workRun = 0;
  }

  // --- RECOVERY BONUS 判定 ---
  S.rcFlag = false;
  if(isRest && hp > 0 && S.hp <= 45){
    S.rcFlag = true;
    S.recovery++;
    hp = Math.round(hp*1.5);
    mp += 8;
    st += 6;
    notes.push({cls:"up", t:"RECOVERY BONUS！ 必要なタイミングで休めた。回復量アップ。"});
  }

  // --- 休みすぎ（元気なのに休憩が続く） ---
  if(isRest && S.restRun >= 3 && S.hp > 60){
    st -= 7;
    notes.push({cls:"down", t:"体は元気なのに、何も進んでいない。物足りなさが残る。"});
  }

  // --- 逓減：満ちているものは、それ以上あまり増えない ---
  if(hp > 0 && S.hp >= 80) hp = Math.round(hp*0.4);
  if(mp > 0 && S.mp >= 80) mp = Math.round(mp*0.4);
  if(st > 0 && S.sat >= 75) st = Math.round(st*0.5);

  // --- 夜の作業は削れる ---
  if(isWork && S.hour >= 20){
    hp -= 4;
    notes.push({cls:"down", t:"夜の作業は、昼の倍つかれる。"});
  }

  // --- 昼寝の時間帯補正 ---
  if(c.name && c.name.indexOf("昼寝")>=0 && (S.hour < 12 || S.hour >= 16)){
    hp = Math.round(hp*0.6); mp = Math.round(mp*0.6);
    notes.push({cls:"flat", t:"この時間の昼寝は、少し効きが弱い。"});
  }

  // --- ゾーン表示 ---
  S.znFlag = (S.mp >= 70 && isWork);
  if(S.znFlag){
    wk = Math.round(wk*1.15);
    notes.push({cls:"up", t:"集中力が高い。作業がよく進む。"});
  }

  var beforeHp = S.hp, beforeMp = S.mp, beforeSat = S.sat, beforeWork = S.work;
  S.hp   = clamp(S.hp + hp, 0, 100);
  S.mp   = clamp(S.mp + mp, 0, 100);
  S.sat  = clamp(S.sat + st, 0, 100);
  S.work = Math.max(0, S.work + wk);
  S.hour = S.hour + c.time;
  if(S.hour > END_HOUR) S.hour = END_HOUR;

  if(c.id === "commute"){
    S.place = "office";
    S.commuted = true;
  }
  if(c.id === "leave"){
    S.place = "home";
  }
  if(S.hour >= END_HOUR && S.place === "office"){
    S.place = "home";
    notes.push({cls:"flat", t:"終電。今日の自分を、職場に置いて帰った。"});
  }

  d.hp = S.hp - beforeHp;
  d.mp = S.mp - beforeMp;
  d.sat = S.sat - beforeSat;
  d.work = S.work - beforeWork;

  S.log.push(hhmm(S.hour)+" "+c.name);

  lastResult = {
    title: c.name,
    txt: c.txt || "",
    d: d,
    notes: notes
  };
}

/* =========================================================
   スコア計算
========================================================= */
function calcScore(){
  var workScore = clamp(Math.round(S.work/1.25), 0, 100);
  var healthScore = clamp(Math.round(S.hp - S.overwork*7 + Math.min(S.recovery,4)*3), 0, 100);
  var satScore = clamp(Math.round(S.sat), 0, 100);

  // 加重幾何平均：どれか1つが低いと全体が伸びない＝バランス重視
  var gw = Math.max(workScore,1), gh = Math.max(healthScore,1), gs = Math.max(satScore,1);
  var total = Math.exp(0.35*Math.log(gw) + 0.30*Math.log(gh) + 0.35*Math.log(gs));

  var bonus = 0;
  if(workScore>=75 && healthScore>=75 && satScore>=75) bonus = 8;
  else if(workScore>=60 && healthScore>=60 && satScore>=60) bonus = 4;
  total = clamp(Math.round(total + bonus), 0, 100);

  var rank, rtitle, comment;
  if(total>=90){ rank="S"; rtitle="最高の一日"; }
  else if(total>=80){ rank="A"; rtitle="いい一日"; }
  else if(total>=70){ rank="B"; rtitle="まあ悪くない"; }
  else if(total>=50){ rank="C"; rtitle="ちょっと無理した"; }
  else { rank="D"; rtitle="今日は休もう"; }

  var min = Math.min(workScore, healthScore, satScore);
  if(bonus===8){
    comment = "仕事も、体も、気持ちも、どれも欠けていない。\nこういう日を「ちゃんと生きた日」と呼ぶんだと思う。";
  }else if(min===healthScore && healthScore<60){
    comment = "成果は出た。でも体を削って買った成果だ。\n"+ (S.weekday<4 ? "明日の自分は、今日のツケを払うことになる。" : "この疲れは、来週の自分に残る。");
  }else if(min===satScore && satScore<60){
    comment = "タスクは減った。けれど「今日、何が良かった？」に答えられない。\n寄り道の時間も、たぶん仕事のうち。";
  }else if(min===workScore && workScore<60){
    comment = "よく休めた一日。体も気持ちも軽い。\n"+ (S.weekday<4 ? "あとは、明日ちょっとだけ手を動かせたら完璧。" : "金曜に余白を残せたのは、立派な仕事だ。");
  }else{
    comment = "大きな失敗もなく、大きな充実もなく。\nこういう日を積み重ねられるのも、ひとつの強さだ。";
  }
  if(S.overwork>=3) comment += "\n\n※ OVERWORK "+S.overwork+"回。頑張りすぎのサインです。";

  return {
    work:workScore, health:healthScore, sat:satScore,
    total:total, rank:rank, rtitle:rtitle, comment:comment, bonus:bonus
  };
}

    extra = '<div class="nextrow"><button class="bigbtn sub" id="btnResetWeek">週をやり直す</button></div>';
  }else if(w.done && w.days && w.days.length){
    lead = "先週は "+weekLine(w.days)+"。<br>平均 <b>"+(w.weekAvg||0)+"</b>。同じ体で、もう一週いける。";
    startLabel = "▶ 新しい週をはじめる";
  }
  screenEl.innerHTML =
    '<div class="view view-title">'+
      '<div class="view-body">'+
        '<div class="bootline">C:\\TODAY.EXE <span class="caret"></span></div>'+
        '<div class="logo">'+
          '<h1>TODAY.exe</h1>'+
          '<p>1日を攻略する。でも頑張りすぎてもいけない。</p>'+
        '</div>'+
        '<div class="lead">'+lead+'</div>'+
        '<div class="rec">'+rec+'</div>'+
      '</div>'+
      '<div class="view-actions">'+
        '<div class="nextrow"><button class="bigbtn" id="btnStart">'+startLabel+'</button></div>'+
        extra+
        '<div class="hint">[1][2][3] でも選べます</div>'+
      '</div>'+
    '</div>';
  bindTap(document.getElementById("btnStart"), function(){ startGame(false); });
  var rst = document.getElementById("btnResetWeek");
  if(rst) bindTap(rst, function(){ startGame(true); });
  if(globalAUD()) AUD.playBgm("title");
}

function renderPlay(){
  mode = "play";
  setScreenTod(S.hour);
  syncChrome();
  var head = statusHTML(lastResult && lastResult.from ? lastResult.from : null);
  var body = "";

  if(lastResult){
    body =
      '<div class="view view-play is-beat">'+head+
        '<div class="view-body"><div class="msgbox is-result">'+
          '<div class="stick-animation" id="stickAnim" hidden></div>'+
          '<div class="evtitle normal">&gt; '+lastResult.title+'</div>'+
          '<div class="evtext">'+lastResult.txt+'</div>'+
          notesHTML(lastResult.notes)+
        '</div></div>'+
        '<div class="view-actions"><div class="nextrow"><button class="bigbtn" id="btnNext">▼ つづける</button></div></div>'+
      '</div>';
    screenEl.innerHTML = body;
    bindTap(document.getElementById("btnNext"), nextTurn);
    if(typeof STICK !== "undefined") STICK.play(screenEl, lastResult);
    return;
  }

  var cs = "";
  for(var j=0;j<currentSet.choices.length;j++){
    var c = currentSet.choices[j];
    var chips = '<span class="chip time">'+c.time+'h</span>';
    cs += '<button class="choice" data-i="'+j+'">'+
            '<span class="num">'+(j+1)+'</span>'+
            imgTag(actionIconSrc(c), "cic", "")+
            '<span class="body"><span class="cname">'+c.name+'</span>'+
            '<span class="cost chips">'+chips+'</span></span>'+
          '</button>';
  }

  var evPic = (currentSet.isEvent && lastEventId) ? imgTag(EVENT_IMG[lastEventId], "evimg", "") : "";
  body =
    '<div class="view view-play">'+head+
      '<div class="view-body"><div class="msgbox'+(currentSet.isEvent?" is-event":"")+'">'+
        '<div class="evhead"><div class="evtitle'+(currentSet.isEvent?"":" normal")+'">'+currentSet.title+'</div>'+evPic+'</div>'+
        '<div class="evtext">'+currentSet.txt.replace(/\n/g, "<br>")+'</div>'+
      '</div></div>'+
      '<div class="view-actions"><div class="choices">'+cs+'</div></div>'+
    '</div>';

  screenEl.innerHTML = body;

  var btns = screenEl.querySelectorAll(".choice");
  for(var k=0;k<btns.length;k++){
    (function(btn){
      bindTap(btn, function(){
        choose(parseInt(btn.getAttribute("data-i"),10));
      });
    })(btns[k]);
  }
}

function renderResult(){
  mode = "result";
  setScreenTod(END_HOUR);
  var r = calcScore();
  var sv = loadSave();
  sv.plays++;
  var isNew = r.total > sv.high;
  if(isNew){ sv.high = r.total; }
  var order = {S:5,A:4,B:3,C:2,D:1,"-":0};
  if(order[r.rank] > (order[sv.bestRank]||0)){ sv.bestRank = r.rank; sv.bestTitle = r.rtitle; }
  writeSave(sv);
  var w = persistDay(r);
  syncChrome();

  function srow(label, v, color){
    return '<div class="srow"><span class="sl">'+label+'</span>'+
      '<span class="track"><span class="fill" style="width:'+v+'%;background:'+color+'"></span><span class="seg"></span></span>'+
      '<span class="sv">'+v+'</span></div>';
  }

  var isWeekEnd = S.weekday >= 4;
  var wr = isWeekEnd ? weekRankOf(w.weekAvg||r.total) : null;
  var headlineRank = isWeekEnd ? wr.rank : r.rank;
  var headlineTitle = isWeekEnd ? wr.rtitle : r.rtitle;
  var comment = isWeekEnd ? weekStory(w.days) : r.comment.split("\n")[0];
  var nextLabel = isWeekEnd ? "▶ 新しい週" : ("▶ "+WEEKDAYS[S.weekday+1]+"曜日へ");
  var totalLabel = isWeekEnd ? "WEEK AVG" : "TODAY";
  var totalVal = isWeekEnd ? (w.weekAvg||r.total) : r.total;
  var recLine = isWeekEnd
    ? weekLine(w.days)+"　SUM "+(w.weekSum||0)
    : weekdayName()+"　OW "+S.overwork+"　RC "+S.recovery;

  screenEl.innerHTML =
    '<div class="view view-result">'+
      '<div class="view-body">'+
        '<div class="clockrow"><span class="clock">23:00</span><span class="phase">'+(isWeekEnd?"金曜が終わった":(weekdayName()+"が終わった"))+'</span></div>'+
        '<div class="rank">'+imgTag(RANK_IMG[headlineRank], "rankimg", "")+
          '<div class="rkcol"><div class="rk '+headlineRank+'">'+headlineRank+'</div><div class="rt rk '+headlineRank+'">「'+headlineTitle+'」</div></div></div>'+
        '<div class="scorelist">'+
          srow("仕事", r.work, "linear-gradient(90deg,#7fff4d,#00f0ff)")+
          srow("健康", r.health, "linear-gradient(90deg,#ff2bd6,#ff7a3d)")+
          srow("満足", r.sat, "linear-gradient(90deg,#ffb300,#ffe14d)")+
        '</div>'+
        '<div class="total"><div class="tl">'+totalLabel+'</div><div class="tv">'+totalVal+'</div>'+
          (r.bonus>0 && !isWeekEnd?'<div class="note">BALANCE +'+r.bonus+'</div>':'')+
          (isNew && !isWeekEnd?'<div class="new">★ NEW HIGH ★</div>':'')+
        '</div>'+
        '<div class="comment">'+comment+'</div>'+
        '<div class="rec">'+recLine+'</div>'+
      '</div>'+
      '<div class="view-actions">'+
        '<div class="nextrow"><button class="bigbtn" id="btnRetry">'+nextLabel+'</button></div>'+
        '<div class="nextrow"><button class="bigbtn sub" id="btnTitle">タイトルへ</button></div>'+
      '</div>'+
    '</div>';

  bindTap(document.getElementById("btnRetry"), function(){
    if(isWeekEnd) startGame(true);
    else startGame(false);
  });
  bindTap(document.getElementById("btnTitle"), renderTitle);
  playSE("result");
  if(headlineRank === "S"){
    setTimeout(function(){ playSE("rank_s"); }, 400);
  }
  if(globalAUD()) AUD.playBgm("result");
}

function startGame(resetWeek){
  if(globalAUD()) AUD.unlock();
  playSE("select");
  newGame();
  lastResult = null;
  if(resetWeek){
    var prev = loadWeek();
    writeWeek({days:[], carry:null, done:false, weekHigh:prev.weekHigh||0});
  }else{
    var w = loadWeek();
    if(w.carry && w.carry.weekday >= 1 && w.carry.weekday <= 4){
      applyCarry(w.carry);
    }else if(w.done){
      writeWeek({days:[], carry:null, done:false, weekHigh:w.weekHigh||0});
    }
  }
  buildTurn();
  if(globalAUD()) AUD.playBgm("day");
  renderPlay();
}

function choose(i){
  if(mode!=="play" || lastResult) return;
  var c = currentSet.choices[i];
  if(!c) return;
  playSE("click");
  var from = {hp:S.hp, mp:S.mp, work:S.work, sat:S.sat};
  applyChoice(c);
  if(S.owFlag) playSE("overwork");
  else if(S.rcFlag) playSE("recovery");
  else if(c.type==="rest") playSE("rest");
  else if((c.work||0)>0 || c.type==="work") playSE("work");
  syncBgm();
  lastResult.from = from;
  lastResult.to = {hp:S.hp, mp:S.mp, work:S.work, sat:S.sat};
  lastResult.animId = (typeof STICK !== "undefined") ? STICK.animKey(c) : "";
  renderPlay();
}

function nextTurn(){
  playSE("select");
  lastResult = null;
  S.owFlag=false; S.rcFlag=false; S.znFlag=false;
  if(S.hour >= END_HOUR){
    renderResult();
    return;
  }
  playSE("time");
  buildTurn();
  if(currentSet && currentSet.isEvent) playSE("event");
  syncBgm();
  renderPlay();
}

/* =========================================================
   入力
========================================================= */
document.addEventListener("keydown", function(e){
  if(e.key==="1"||e.key==="2"||e.key==="3"){
    if(mode==="play" && !lastResult){ choose(parseInt(e.key,10)-1); }
  }
  if(e.key==="Enter"||e.key===" "){
    var b = document.getElementById("btnNext") || document.getElementById("btnStart") || document.getElementById("btnRetry");
    if(b){ e.preventDefault(); b.click(); }
  }
});

var hm = document.getElementById("helpModal");
hm.addEventListener("click", function(e){ if(e.target===hm) hm.hidden = true; });

bindTap(document.getElementById("btnMute"), function(){
  if(globalAUD()) AUD.toggleMute();
});
bindTap(document.getElementById("btnCrt"), function(){
  playSE("click");
  document.body.classList.toggle("nocrt");
});
bindTap(document.getElementById("btnHelp"), function(){
  playSE("click");
  hm.hidden = false;
});
bindTap(document.getElementById("btnHelpClose"), function(){
  playSE("click");
  hm.hidden = true;
});

var lastTap = 0;
document.addEventListener("touchstart", function(e){
  var now = Date.now();
  if(now - lastTap < 300) e.preventDefault();
  lastTap = now;
}, {passive:false});
var lastTouchEnd = 0;
document.addEventListener("touchend", function(e){
  var now = Date.now();
  if(now - lastTouchEnd <= 300) e.preventDefault();
  lastTouchEnd = now;
}, {passive:false});
document.addEventListener("dblclick", function(e){ e.preventDefault(); });
document.addEventListener("contextmenu", function(e){ e.preventDefault(); });
document.addEventListener("touchmove", function(e){ e.preventDefault(); }, {passive:false});
document.addEventListener("selectstart", function(e){ e.preventDefault(); });
document.addEventListener("dragstart", function(e){ e.preventDefault(); });

if(globalAUD()) AUD.syncButton();

/* start */
renderTitle();

})();
</script>
<canvas id="probe" width="2" height="2" aria-hidden="true"></canvas>
</body>
</html>
