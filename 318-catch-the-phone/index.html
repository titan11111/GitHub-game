const readingScreen=new THREE.Vector3(),readingEye=new THREE.Vector3(),readingDir=new THREE.Vector3();

function updateReadingPose(n,dt){
if(!n.phone)return;n.readTime=(n.readTime||0)+dt;const frame=renderer.info.render.frame;if(n.readPoseFrame===frame)return;n.readPoseFrame=frame;const P=n.parts;const t=n.readTime+n.phase;

readingDir.subVectors(readingScreen,readingEye).normalize();

const PR_CAP=Math.min(devicePixelRatio,1.5);
let prNow=PR_CAP,adaptAcc=0,adaptN=0,shadowsOn=true,warm=0,slowRuns=0,fastRuns=0;
function applyPr(){renderer.setPixelRatio(prNow);renderer.setSize(innerWidth,innerHeight);}
function adaptQuality(dt){
if(document.hidden||dt>.5)return;if(++warm<45)return;
adaptAcc+=dt;adaptN++;if(adaptN<30)return;
const avg=adaptAcc/adaptN;adaptAcc=0;adaptN=0;
if(avg>.036){slowRuns++;fastRuns=0;}else if(avg<.02){fastRuns++;slowRuns=0;}else{slowRuns=0;fastRuns=0;}

}else if(fastRuns>=3&&prNow<PR_CAP-.01){fastRuns=0;prNow=Math.min(PR_CAP,prNow*1.25);applyPr();}
}
(()=>{try{const gl=renderer.getContext(),ex=gl.getExtension('WEBGL_debug_renderer_info'),name=ex?String(gl.getParameter(ex.UNMASKED_RENDERER_WEBGL)):'';if(/swiftshader|llvmpipe|software|basic render/i.test(name)){prNow=.5;LOD_DIST=9;shadowsOn=false;renderer.shadowMap.enabled=false;renderer.setPixelRatio(prNow);renderer.setSize(innerWidth,innerHeight);}}catch{}})();
