<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>おたすけ巨神マモルG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Mochiy+Pop+One&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d2b36;--mustard:#f2b705;--teal:#0f7c80;--coral:#ff5a4e;--sky:#9fdcff;--panel:#fffaf0;--panel-ink:#1d2b36;--shadow:#1d2b36;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:#1f2e39;--panel-ink:#fff4d6;--shadow:#000}}
:root[data-theme="dark"]{--panel:#1f2e39;--panel-ink:#fff4d6;--shadow:#000}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sky);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;color:var(--panel-ink)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;z-index:5;pointer-events:none}
.card{background:var(--panel);color:var(--panel-ink);border:3px solid var(--ink);border-radius:14px;box-shadow:3px 3px 0 var(--shadow)}
#score{top:calc(env(safe-area-inset-top,0px) + 8px);left:calc(env(safe-area-inset-left,0px) + 8px);padding:4px 10px 5px;border-radius:12px}
#score .rank{font-family:"Mochiy Pop One",sans-serif;font-size:10px;color:var(--teal)}
#score .n{font-family:"Mochiy Pop One",sans-serif;font-size:16px;line-height:1.1}
#score .next{font-size:10px;font-weight:800;opacity:.85}
#score .n small{font-size:10px;font-family:"M PLUS Rounded 1c",sans-serif;font-weight:800;margin-left:2px}
#mini{top:calc(env(safe-area-inset-top,0px) + 8px);right:calc(env(safe-area-inset-right,0px) + 8px);width:78px;height:78px;border-radius:50%;overflow:hidden}
#mini canvas{width:100%;height:100%;display:block}
#bMute{position:fixed;z-index:22;top:calc(env(safe-area-inset-top,0px) + 92px);right:calc(env(safe-area-inset-right,0px) + 8px);width:44px;height:44px;border-radius:50%;font-size:19px;line-height:1;padding:0;cursor:pointer;pointer-events:auto;display:grid;place-items:center;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#quests{top:calc(env(safe-area-inset-top,0px) + 76px);left:calc(env(safe-area-inset-left,0px) + 8px);list-style:none;margin:0;padding:0;display:flex;gap:8px}
#quests li{position:relative;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border-color:var(--c);border-width:3px;box-shadow:2px 2px 0 var(--shadow)}
#quests li.focus{background:var(--c);transform:scale(1.12)}
#quests .qi{font-size:20px;line-height:1}
#quests b{position:absolute;right:-8px;bottom:-6px;font-size:10px;padding:0 4px;border-radius:8px;background:var(--coral);color:#fff;font-family:"Mochiy Pop One",sans-serif}
#compass{top:calc(env(safe-area-inset-top,0px) + 126px);left:calc(env(safe-area-inset-left,0px) + 8px);display:flex;align-items:center;gap:6px}
#arrowWrap{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--mustard);flex:none}
#arrow{width:20px;height:20px}
#clabel{font-weight:800;font-size:12px;padding:3px 10px;max-width:min(420px,calc(100vw - 70px));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:999px}
#toast{left:50%;top:calc(env(safe-area-inset-top,0px) + 170px);transform:translate(-50%,0) scale(.92);opacity:0;padding:10px 16px;font-weight:800;font-size:15px;text-align:center;max-width:86vw;transition:opacity .2s,transform .2s}
#toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
#prompt{left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 126px);transform:translateX(-50%);padding:7px 14px;font-weight:800;font-size:14px;background:var(--mustard);color:#1d2b36;display:none;white-space:nowrap}
#prompt.show{display:block}
@keyframes pulse{50%{transform:translateX(-50%) scale(1.06)}}
@keyframes pulseB{50%{transform:scale(1.07)}}
#prompt.show{animation:pulse .9s ease-in-out infinite}
#touch{display:none}
#keys{left:calc(env(safe-area-inset-left,0px) + 10px);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);font-size:12px;padding:8px 12px;line-height:1.7}
kbd{font-family:inherit;font-weight:800;border:2px solid var(--ink);border-radius:6px;padding:0 5px;background:var(--mustard);color:#1d2b36}
@media (pointer:coarse){#touch{display:block}#keys{display:none}#prompt{bottom:calc(env(safe-area-inset-bottom,0px) + 180px)}}
#joyZone{position:fixed;left:0;bottom:0;width:50vw;height:55vh;z-index:6;touch-action:none}
#joyBase{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:3px solid rgba(29,43,54,.55);background:rgba(255,250,240,.35);display:none;z-index:7;pointer-events:none}
#joyKnob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;border-radius:50%;background:var(--mustard);border:3px solid var(--ink)}
#btns{position:fixed;right:calc(env(safe-area-inset-right,0px) + 14px);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:8;display:flex;gap:12px;align-items:flex-end}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{font-family:"Mochiy Pop One",sans-serif;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--shadow);border-radius:50%;width:64px;height:64px;font-size:12px;background:var(--panel);color:var(--panel-ink);touch-action:none;display:grid;place-items:center;line-height:1.15;padding:0;cursor:pointer}
.btn.on{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
#bHelp{width:92px;height:92px;background:var(--coral);color:#fff;font-size:14px}
#bHelp.ready{background:#ff2f6a;animation:pulseB .8s ease-in-out infinite}
#ending{position:fixed;inset:0;z-index:24;display:none;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);background:rgba(159,220,255,.94);overflow:auto}
#ending.show{display:grid}
#ecard{position:relative;max-width:400px;width:100%;padding:20px;text-align:center}
#ecard .fw{font-size:54px;line-height:1;margin-bottom:4px;animation:pop .9s ease-in-out infinite alternate}
@keyframes pop{from{transform:scale(1)}to{transform:scale(1.14)}}
#ecard h2{font-family:"Mochiy Pop One",sans-serif;font-weight:400;font-size:clamp(20px,6.5vw,27px);line-height:1.3;margin:0 0 12px;color:var(--mustard);-webkit-text-stroke:2px #1d2b36;paint-order:stroke fill;text-shadow:3px 3px 0 #1d2b36}
#ecard .es{margin:0 0 6px;font-size:16px;font-weight:800}
#ecard .es b{font-family:"Mochiy Pop One",sans-serif;font-size:26px;color:var(--coral);margin:0 3px}
#ecard #eBest{display:block;font-size:12px;color:var(--teal);margin-top:2px}
#ecard .er{margin:10px 0 16px;font-size:15px;font-weight:800;padding:8px;border:3px solid var(--ink);border-radius:12px;background:rgba(242,183,5,.25)}
#ebtns{display:grid;gap:10px}
@media (prefers-reduced-motion:reduce){#ecard .fw{animation:none}}
#title{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);background:#9fdcff;overflow:auto}
#title::before{content:"";position:fixed;left:50%;bottom:-38vmin;width:90vmin;height:90vmin;margin-left:-45vmin;border-radius:50%;background:#ffe07a;border:4px solid #1d2b36}
#tcard{position:relative;max-width:440px;width:100%;padding:22px 22px 20px}
#tcard h1 rt{font-size:.34em;font-family:"M PLUS Rounded 1c",sans-serif;font-weight:800;-webkit-text-stroke:0;text-shadow:none;color:var(--panel-ink)}
#tcard .lead{font-size:15px;font-weight:800}
#tcard .cheer{font-size:13px;font-weight:800;color:var(--teal);margin:0 0 14px}
#tcard h1{font-family:"Mochiy Pop One",sans-serif;font-weight:400;font-size:clamp(30px,9vw,42px);line-height:1.15;margin:0 0 10px;color:var(--mustard);-webkit-text-stroke:2px #1d2b36;paint-order:stroke fill;text-shadow:3px 3px 0 #1d2b36;letter-spacing:.02em}
#tcard p{margin:0 0 12px;line-height:1.8;font-size:16px}
#tcard ul{list-style:none;padding:0;margin:0 0 14px;display:grid;grid-template-columns:1fr 1fr;gap:6px}
#tcard li{font-size:14.5px;font-weight:800;padding:6px 8px;border:2px solid var(--ink);border-radius:10px}
.how{font-size:14px;line-height:1.8;margin:0 0 16px;padding:10px 12px;border-radius:10px;background:rgba(15,124,128,.12)}
#modes{display:grid;grid-template-columns:1.35fr 1fr;gap:10px;align-items:stretch}
#startKids{font-size:22px;padding:16px 8px}
.startBtn{font-family:"Mochiy Pop One",sans-serif;font-size:18px;width:100%;padding:12px 8px;border:3px solid var(--ink);border-radius:14px;background:var(--coral);color:#fff;box-shadow:4px 4px 0 var(--shadow);cursor:pointer}
#startAdult{background:var(--teal)}
.startBtn small{display:block;font-size:11px;font-family:"M PLUS Rounded 1c",sans-serif;font-weight:800;margin-top:2px}
.startBtn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--shadow)}
.startBtn:focus-visible,.btn:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
body.kids .btn{width:80px;height:80px;font-size:15px}
body.kids #bHelp{width:112px;height:112px;font-size:18px}
body.kids #clabel{font-size:13px}
body.kids #toast{font-size:17px}
body.kids #prompt{font-size:19px;padding:10px 18px}
.btn.lit{background:var(--mustard);color:#1d2b36}
.btn.hint{background:var(--mustard);color:#1d2b36;animation:pulseB .7s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){#prompt.show,#bHelp.ready,.btn.hint{animation:none}}
</style>
</head>
<body>
<audio id="bgm" src="bgm.m4a" loop preload="auto" playsinline></audio>
<div id="title">
  <div id="tcard" class="card">
    <h1>おたすけ<ruby>巨神<rt>きょしん</rt></ruby><br>マモルG</h1>
    <p class="lead">まちで だれかが こまってる。<br>きみが きょだいロボに なって、たすけに いこう！</p>
    <ul>
      <li>🐱 おちそうな ねこ</li>
      <li>👵 にもつが おもい おばあさん</li>
      <li>🚗 くるまが うごかない おじさん</li>
      <li>🎈 ふうせんを なくした こ</li>
    </ul>
    <p class="cheer">⭐ たすけるたびに ロボが かっこよく なるよ！</p>
    <div class="how" id="how"></div>
    <div id="modes"><button class="startBtn" id="startKids">▶ はじめる<small>こども・かんたん</small></button><button class="startBtn" id="startAdult">おとなモード<small>じかんせいげん あり</small></button></div>
  </div>
</div>
<canvas id="c"></canvas>

<div id="score" class="hud card"><div class="rank" id="rank">見習いロボ</div><div class="n"><span id="helped">0</span><small id="unit">人たすけた</small> <span id="pts">0</span><small>pt</small></div><div class="next" id="next"></div></div>
<div id="mini" class="hud card"><canvas id="mcv" width="184" height="184"></canvas></div>
<div id="compass" class="hud" style="display:none">
  <div id="arrowWrap" class="card"><svg id="arrow" viewBox="0 0 24 24"><path d="M12 2 L20 20 L12 15.5 L4 20 Z" fill="#1d2b36"/></svg></div>
  <div id="clabel" class="card"></div>
</div>
<ul id="quests" class="hud"></ul>
<button id="bMute" class="hud card" aria-label="音を消す">🔊</button>
<div id="toast" class="hud card"></div>
<div id="prompt" class="hud card"></div>

<div id="ending"><div id="ecard" class="card">
  <div class="fw">🎉</div>
  <h2>まちの みんなが<br>えがおに なった！</h2>
  <p class="es">たすけた ひと <b id="eHelped">0</b>にん</p>
  <p class="es"><b id="ePts">0</b>てん<span id="eBest"></span></p>
  <p class="er" id="eRank"></p>
  <div id="ebtns">
    <button class="startBtn" id="eMore">▶ もっと たすける</button>
    <button class="startBtn" id="eAgain">さいしょから</button>
  </div>
</div></div>
<div id="keys" class="hud card"><kbd>W A S D</kbd> 移動　<kbd>Space</kbd> 上昇　<kbd>Shift</kbd> 下降<br><kbd>E</kbd> たすける　<kbd>← →</kbd> かドラッグで視点</div>

<div id="touch">
  <div id="joyZone"></div>
  <div id="joyBase"><div id="joyKnob"></div></div>
  <div id="btns">
    <div class="stack">
      <button class="btn" id="bUp" aria-label="上昇">▲<br>上昇</button>
      <button class="btn" id="bDown" aria-label="下降">▼<br>下降</button>
    </div>
    <button class="btn" id="bHelp" aria-label="たすける">✋<br>たすける</button>
  </div>
</div>


<script src="three.min.js"></script>
<script>
(()=>{
const V3=THREE.Vector3;
const rand=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const damp=(a,b,k,dt)=>a+(b-a)*(1-Math.exp(-k*dt));
function lerpAngle(a,b,t){const P=Math.PI*2;let d=((b-a+Math.PI)%P+P)%P-Math.PI;return a+d*Math.min(1,t);}
const xzDist=(a,b)=>Math.hypot(a.x-b.x,a.z-b.z);
const coarse=matchMedia('(pointer:coarse)').matches;
let KIDS=true;const K=(k,a)=>KIDS?k:a;const RR=r=>KIDS?r*1.4:r;
document.getElementById('how').innerHTML=coarse
 ?'ひだりがわを ゆびで なぞると あるくよ。<br>⬆のぼる を おすと そらへ、⬇おりる で じめんへ。<br>ちかくで ✋たすける ボタン！'
 :'WASDで いどう、Spaceで のぼる、Shiftで おりる。<br>ちかくで Eキーを おすと たすけるよ。';

/* ---------- renderer ---------- */
const canvas=document.getElementById('c');
const COARSE=matchMedia('(pointer:coarse)').matches;
const renderer=new THREE.WebGLRenderer({canvas,antialias:!COARSE,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,COARSE?1.5:1.75));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=COARSE?THREE.PCFShadowMap:THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9fdcff);
scene.fog=new THREE.Fog(0x9fdcff,140,390);
const camera=new THREE.PerspectiveCamera(60,1,0.5,900);
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w/h<0.8?68:60;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();

scene.add(new THREE.HemisphereLight(0xe6f6ff,0x6e8f58,0.78));
const sun=new THREE.DirectionalLight(0xfff0d0,0.85);
sun.castShadow=true;sun.shadow.mapSize.set(COARSE?768:1024,COARSE?768:1024);
const SHW=COARSE?58:80;
Object.assign(sun.shadow.camera,{left:-SHW,right:SHW,top:SHW,bottom:-SHW,near:10,far:COARSE?240:320});
sun.shadow.camera.updateProjectionMatrix();scene.add(sun,sun.target);

const MC={};
function mat(c){return MC[c]||(MC[c]=new THREE.MeshLambertMaterial({color:c}));}
function bx(w,h,d,c,x,y,z,p,cast=true){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),typeof c==='string'?mat(c):c);m.position.set(x,y,z);m.castShadow=cast;m.receiveShadow=true;(p||scene).add(m);return m;}
function cyl(rt,rb,h,c,x,y,z,p,seg=10){const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),typeof c==='string'?mat(c):c);m.position.set(x,y,z);m.castShadow=true;(p||scene).add(m);return m;}
function sph(r,c,x,y,z,p){const m=new THREE.Mesh(new THREE.SphereGeometry(r,14,10),mat(c));m.position.set(x,y,z);m.castShadow=true;(p||scene).add(m);return m;}

/* ---------- world ---------- */
const ROADS=[-120,-80,-40,0,40,80,120];
const bc=i=>-100+i*40;
const blds=[],towers=[],houses=[],cliffs=[];
const ground=new THREE.Mesh(new THREE.PlaneGeometry(800,800),mat('#9dcf6f'));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

(function roads(){
  const c=document.createElement('canvas');c.width=64;c.height=64;const x=c.getContext('2d');
  x.fillStyle='#4b525b';x.fillRect(0,0,64,64);x.fillStyle='#f4f1e6';x.fillRect(30,8,4,24);
  x.fillStyle='#cfc9ba';x.fillRect(0,0,3,64);x.fillRect(61,0,3,64);
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(1,26);
  const rm=new THREE.MeshLambertMaterial({map:t});
  ROADS.forEach(p=>{
    const a=new THREE.Mesh(new THREE.PlaneGeometry(10,260),rm);a.rotation.x=-Math.PI/2;a.position.set(p,0.03,0);a.receiveShadow=true;scene.add(a);
    const b=new THREE.Mesh(new THREE.PlaneGeometry(10,260),rm);b.rotation.set(-Math.PI/2,0,Math.PI/2);b.position.set(0,0.05,p);b.receiveShadow=true;scene.add(b);
  });
})();

const winBase=(()=>{const c=document.createElement('canvas');c.width=128;c.height=128;const x=c.getContext('2d');
  x.fillStyle='#ffffff';x.fillRect(0,0,128,128);
  const lit=[[0,0],[1,1]];
  for(let i=0;i<2;i++)for(let j=0;j<2;j++){x.fillStyle=(i===1&&j===0)?'#fff0b0':'#9fc3d6';x.fillRect(i*64+14,j*64+12,36,40);x.fillStyle='rgba(255,255,255,.55)';x.fillRect(i*64+16,j*64+14,8,36);}
  return c;})();
function winTex(rx,ry){const t=new THREE.CanvasTexture(winBase);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);return t;}
const PAL=['#f3d8b6','#cfe0e8','#f6c6b0','#c7dfc5','#dcd0ef','#f2e6a7','#b9d3f0','#f0cfd8'];

function tree(x,z,s=1){const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);
  cyl(0.35*s,0.45*s,2.4*s,'#8a5a36',0,1.2*s,0,g);
  const leaf=new THREE.Mesh(new THREE.IcosahedronGeometry(2.1*s,0),mat(pick(['#4f9d4a','#5fae55','#3f8a44'])));leaf.position.y=3.6*s;leaf.castShadow=true;g.add(leaf);}

function towerBlock(cx,cz){
  const dc=Math.hypot(cx,cz);
  for(const sx of[-1,1])for(const sz of[-1,1]){
    const lx=cx+sx*7.5,lz=cz+sz*7.5;
    if(Math.random()<0.1){tree(lx,lz,1.2);continue;}
    const w=rand(7.5,10),d=rand(7.5,10);
    const h=Math.round(Math.max(9,(46-dc*0.2)*rand(0.55,1.1)));
    const col=pick(PAL);
    const side=new THREE.MeshLambertMaterial({color:col,map:winTex(Math.max(1,Math.round(w/6.5)),Math.max(1,Math.round(h/7)))});
    const roof=mat(new THREE.Color(col).offsetHSL(0,-0.05,-0.14).getStyle());
    const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),[side,side,roof,roof,side,side]);
    m.position.set(lx,h/2,lz);m.castShadow=true;m.receiveShadow=true;scene.add(m);
    bx(rand(1.5,2.5),1.2,rand(1.5,2.5),'#cfd6db',lx+rand(-2,2),h+0.6,lz+rand(-2,2));
    const b={minX:lx-w/2,maxX:lx+w/2,minZ:lz-d/2,maxZ:lz+d/2,h,kind:'tower',cx,cz,sx,sz,lx,lz};
    blds.push(b);towers.push(b);
  }
}
function houseBlock(cx,cz){
  for(const dx of[-9,0,9])for(const dz of[-9,0,9]){
    const x=cx+dx,z=cz+dz;
    if(dx===0&&dz===0){tree(x,z,1.1);continue;}
    let f=dz!==0?new V3(0,0,Math.sign(dz)):new V3(Math.sign(dx),0,0);
    const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=Math.atan2(f.x,f.z);scene.add(g);
    bx(6,4,6,pick(['#fff3dc','#ffe4d1','#e7f1ff','#f4f7e6']),0,2,0,g);

function collide(p){
  for(const b of blds){
    if(p.y>=b.h-0.3)continue;
    const cx=clamp(p.x,b.minX,b.maxX),cz=clamp(p.z,b.minZ,b.maxZ);
    let dx=p.x-cx,dz=p.z-cz;const d2=dx*dx+dz*dz;
    if(d2>=RAD*RAD)continue;
    if(d2>1e-6){const d=Math.sqrt(d2),k=(RAD-d)/d;p.x+=dx*k;p.z+=dz*k;}
    else{const o=[[p.x-b.minX,-1,0],[b.maxX-p.x,1,0],[p.z-b.minZ,0,-1],[b.maxZ-p.z,0,1]].sort((a,c)=>a[0]-c[0])[0];
      p.x+=o[1]*(o[0]+RAD);p.z+=o[2]*(o[0]+RAD);}
  }
}
function groundAt(p){let g=0;const r=RAD*0.45;
  for(const b of blds){if(p.y>=b.h-0.8&&p.x>b.minX-r&&p.x<b.maxX+r&&p.z>b.minZ-r&&p.z<b.maxZ+r)g=Math.max(g,b.h);}

/* ---------- audio ---------- */
let ac=null,master=null,noiseBuf=null,jetBp=null,jetGain=null;
let MUTE=localStorage.getItem('tg.258.mute')==='1';
function audioInit(){
  if(ac)return;
  try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(_){ac=null;return;}
  master=ac.createGain();master.gain.value=MUTE?0:0.9;master.connect(ac.destination);
  const n=ac.sampleRate*1.2;noiseBuf=ac.createBuffer(1,n,ac.sampleRate);
  const d=noiseBuf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  const src=ac.createBufferSource();src.buffer=noiseBuf;src.loop=true;
  jetBp=ac.createBiquadFilter();jetBp.type='bandpass';jetBp.frequency.value=850;jetBp.Q.value=0.8;
  jetGain=ac.createGain();jetGain.gain.value=0;
  src.connect(jetBp);jetBp.connect(jetGain);jetGain.connect(master);src.start();
}
const BGM_VOL=0.30;
let bgmEl=null,bgmFade=null;
function bgmStart(){
  if(!bgmEl)bgmEl=document.getElementById('bgm');
  if(!bgmEl||MUTE)return;
  if(bgmEl.paused){bgmEl.volume=0;const pr=bgmEl.play();if(pr&&pr.catch)pr.catch(()=>{});}
  clearInterval(bgmFade);
  bgmFade=setInterval(()=>{const v=Math.min(BGM_VOL,bgmEl.volume+0.02);bgmEl.volume=v;if(v>=BGM_VOL)clearInterval(bgmFade);},60);
}
function setMute(v){MUTE=v;localStorage.setItem('tg.258.mute',v?'1':'0');
  if(!bgmEl)bgmEl=document.getElementById('bgm');
  if(bgmEl){bgmEl.muted=v;if(!v&&bgmEl.paused&&started)bgmStart();}
  if(master)master.gain.setTargetAtTime(v?0:0.9,ac.currentTime,0.05);
  const b=document.getElementById('bMute');if(b){b.textContent=v?'🔇':'🔊';b.setAttribute('aria-label',v?'音を出す':'音を消す');}}
/* ノイズ1発（ガシャーン・ドスンの芯） */
function nz(t,dur,type,f,q,vol,fTo){
  const s2=ac.createBufferSource();s2.buffer=noiseBuf;s2.loop=true;
  const bq=ac.createBiquadFilter();bq.type=type;bq.frequency.setValueAtTime(f,t);bq.Q.value=q;
  if(fTo)bq.frequency.exponentialRampToValueAtTime(fTo,t+dur);
  const g=ac.createGain();g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s2.connect(bq);bq.connect(g);g.connect(master);s2.start(t);s2.stop(t+dur+0.05);
}
/* 単音1発 */
function tn(t,dur,type,f,vol,fTo){
  const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(fTo)o.frequency.exponentialRampToValueAtTime(fTo,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.05);
}
function sfx(kind){
  if(!ac||MUTE)return;const t=ac.currentTime;
  switch(kind){
    case 'step':   /* ドスン（歩く） */
      tn(t,0.20,'sine',105,0.26,52); nz(t,0.13,'lowpass',520,0.7,0.16); break;
    case 'land':   /* ドスン（着地・重い） */
      tn(t,0.38,'sine',88,0.34,34); nz(t,0.26,'lowpass',360,0.8,0.26);
      nz(t+0.02,0.34,'bandpass',180,1.4,0.12); break;
    case 'clang':  /* ガシャーン（つかむ・金属） */
      nz(t,0.45,'bandpass',2600,1.1,0.20,900);
      [372,547,791].forEach((f,i)=>tn(t+i*0.012,0.30,'square',f,0.055));
      tn(t,0.16,'triangle',150,0.10,90); break;
    case 'servo':  /* ウィーン（関節） */
      tn(t,0.18,'sawtooth',220,0.045,560); break;
    case 'help':   [520,780].forEach((f,i)=>tn(t+i*0.09,0.20,'square',f,0.07)); break;
    case 'clear':  [660,880,1320].forEach((f,i)=>tn(t+i*0.10,0.26,'square',f,0.075)); break;
    case 'power':  [523,659,784,1046,1318].forEach((f,i)=>tn(t+i*0.09,0.28,'square',f,0.07));
                   nz(t,0.5,'highpass',1800,0.6,0.08); break;
    case 'fail':   [330,247].forEach((f,i)=>tn(t+i*0.11,0.24,'square',f,0.07)); break;
    default:       tn(t,0.20,'square',440,0.07);
  }
}

const mcv=$('mcv'),mx=mcv.getContext('2d'),mbg=document.createElement('canvas');mbg.width=mbg.height=184;
const MS=184/400,mp=(x,z)=>[(x+200)*MS,(z+200)*MS];
(function(){const x=mbg.getContext('2d');x.fillStyle='#9dcf6f';x.fillRect(0,0,184,184);
  x.fillStyle='#a07e5c';cliffs.forEach(b=>{const[a,c]=mp(b.minX,b.minZ);x.fillRect(a,c,(b.maxX-b.minX)*MS,(b.maxZ-b.minZ)*MS);});
  x.fillStyle='#d9d3c3';for(let i=0;i<6;i++)for(let j=0;j<6;j++){const[a,c]=mp(bc(i)-15,bc(j)-15);x.fillRect(a,c,30*MS,30*MS);}
  x.fillStyle='#a9dc7a';PARK.forEach(k=>{const[i,j]=k.split(',').map(Number);const[a,c]=mp(bc(i)-15,bc(j)-15);x.fillRect(a,c,30*MS,30*MS);});
  x.fillStyle='#8f989f';blds.forEach(b=>{if(b.kind==='rock')return;const[a,c]=mp(b.minX,b.minZ);x.fillRect(a,c,(b.maxX-b.minX)*MS,(b.maxZ-b.minZ)*MS);});
  x.fillStyle='#4b525b';ROADS.forEach(p=>{let[a,c]=mp(p-5,-130);x.fillRect(a,c,10*MS,260*MS);[a,c]=mp(-130,p-5);x.fillRect(a,c,260*MS,10*MS);});
  const[g1,g2]=mp(GARAGE.x,GARAGE.z);x.font='22px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('🔧',g1,g2);})();
function drawMini(t){
  mx.save();mx.clearRect(0,0,184,184);
  const[rx,rz]=mp(R.pos.x,R.pos.z);
  mx.translate(92,92);mx.rotate(camYaw);mx.translate(-rx,-rz);
  mx.drawImage(mbg,0,0);
  missions.forEach(m=>{if(m.done||m.beaconOff)return;const[a,c]=mp(m.target.x,m.target.z);mx.beginPath();mx.arc(a,c,7+Math.sin(t*6)*2,0,Math.PI*2);mx.fillStyle=m.color;mx.fill();mx.lineWidth=3;mx.strokeStyle='#fff';mx.stroke();});
  mx.restore();
  mx.save();mx.translate(92,92);mx.rotate(camYaw+Math.PI-R.root.rotation.y);
  mx.beginPath();mx.moveTo(0,-11);mx.lineTo(8,8);mx.lineTo(0,4);mx.lineTo(-8,8);mx.closePath();mx.fillStyle='#f2b705';mx.fill();mx.lineWidth=3;mx.strokeStyle='#1d2b36';mx.stroke();mx.restore();
}

/* ---------- input ---------- */
const keys={},tin={jx:0,jy:0,up:false,down:false};
addEventListener('keydown',e=>{keys[e.code]=true;if((e.code==='KeyE'||e.code==='Enter')&&!e.repeat&&started)doHelp();
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
let camYaw=0,camPitch=0.32,camPid=null,lpx=0,lpy=0,lastDrag=-10;
canvas.addEventListener('pointerdown',e=>{if(camPid!==null)return;camPid=e.pointerId;lpx=e.clientX;lpy=e.clientY;canvas.setPointerCapture(camPid);});
canvas.addEventListener('pointermove',e=>{if(e.pointerId!==camPid)return;camYaw-=(e.clientX-lpx)*0.006;lastDrag=T;camPitch=clamp(camPitch+(e.clientY-lpy)*0.004,0.06,1.15);lpx=e.clientX;lpy=e.clientY;});
['pointerup','pointercancel'].forEach(ev=>canvas.addEventListener(ev,e=>{if(e.pointerId===camPid)camPid=null;}));
const jz=$('joyZone'),jb=$('joyBase'),jk=$('joyKnob');let jid=null,jx0=0,jy0=0;
jz.addEventListener('pointerdown',e=>{if(jid!==null)return;jid=e.pointerId;jz.setPointerCapture(jid);jx0=e.clientX;jy0=e.clientY;jb.style.left=jx0+'px';jb.style.top=jy0+'px';jb.style.display='block';jk.style.transform='';});
jz.addEventListener('pointermove',e=>{if(e.pointerId!==jid)return;let dx=e.clientX-jx0,dy=e.clientY-jy0;const l=Math.hypot(dx,dy),M=55;if(l>M){dx*=M/l;dy*=M/l;}
  jk.style.transform=`translate(${dx}px,${dy}px)`;tin.jx=dx/M;tin.jy=-dy/M;});
['pointerup','pointercancel'].forEach(ev=>jz.addEventListener(ev,e=>{if(e.pointerId!==jid)return;jid=null;tin.jx=tin.jy=0;jb.style.display='none';}));
function syncBtns(){$('bUp').classList.toggle('lit',tin.up);$('bDown').classList.toggle('lit',tin.down);}
function hold(el,k){el.addEventListener('pointerdown',e=>{e.preventDefault();
    if(KIDS){const o=k==='up'?'down':'up';tin[k]=!tin[k];if(tin[k])tin[o]=false;syncBtns();return;}
    tin[k]=true;el.classList.add('on');try{el.setPointerCapture(e.pointerId);}catch(_){}});
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>el.addEventListener(ev,()=>{if(KIDS)return;tin[k]=false;el.classList.remove('on');}));}
hold($('bUp'),'up');hold($('bDown'),'down');
$('bHelp').addEventListener('pointerdown',e=>{e.preventDefault();$('bHelp').classList.add('on');doHelp();});
['pointerup','pointercancel','pointerleave'].forEach(ev=>$('bHelp').addEventListener(ev,()=>$('bHelp').classList.remove('on')));
document.addEventListener('contextmenu',e=>e.preventDefault());

function begin(kids){
  KIDS=kids;document.body.classList.toggle('kids',kids);
  $('bUp').innerHTML=K('⬆<br>のぼる','▲<br>上昇');$('bDown').innerHTML=K('⬇<br>おりる','▼<br>下降');$('bHelp').innerHTML='✋<br>たすける';
  $('unit').textContent=K('にん たすけた','人たすけた');$('rank').textContent=rankName();updNext();
  if(kids)$('keys').innerHTML='<kbd>W A S D</kbd> あるく　<kbd>Space</kbd> のぼる　<kbd>Shift</kbd> おりる<br><kbd>E</kbd> たすける';
  $('title').style.display='none';started=true;
  audioInit();
  if(ac&&ac.state==='suspended')ac.resume();
  setMute(MUTE);bgmStart();
  spawnMission();setTimeout(spawnMission,5000);setTimeout(spawnMission,12000);
  toast(K('しゅつどう！ ひかりの はしらへ いこう！','しゅつどう！ 光の柱のところで、だれかがこまってるよ'));
}
$('title').addEventListener('pointerdown',()=>{audioInit();if(ac&&ac.state==='suspended')ac.resume();bgmStart();},{once:true});
$('eMore').addEventListener('click',()=>{$('ending').classList.remove('show');started=true;toast(K('まだまだ たすけよう！','まだまだ助けよう！'));});
$('eAgain').addEventListener('click',()=>location.reload());
$('bMute').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();audioInit();setMute(!MUTE);});
setMute(MUTE);
$('startKids').addEventListener('click',()=>begin(true));
$('startAdult').addEventListener('click',()=>begin(false));

/* ---------- loop ---------- */
const tmp=new V3();let shake=0,lastSw=0,hudT=0,T=0;
const clock=new THREE.Clock();
function update(dt){
  T+=dt;
  let ix=(keys.KeyD?1:0)-(keys.KeyA?1:0)+tin.jx, iy=((keys.KeyW||keys.ArrowUp)?1:0)-((keys.KeyS||keys.ArrowDown)?1:0)+tin.jy;
  const il=Math.hypot(ix,iy);if(il>1){ix/=il;iy/=il;}
  if(!started){ix=iy=0;}
  if(keys.ArrowLeft)camYaw+=1.8*dt;if(keys.ArrowRight)camYaw-=1.8*dt;
  const up=started&&(keys.Space||tin.up),down=started&&(keys.ShiftLeft||keys.ShiftRight||keys.KeyC||tin.down);
  const fxv=-Math.sin(camYaw),fzv=-Math.cos(camYaw),rxv=Math.cos(camYaw),rzv=-Math.sin(camYaw);
  const mvx=fxv*iy+rxv*ix,mvz=fzv*iy+rzv*ix;
  const spd=R.grounded?18:30;
  R.vel.x=damp(R.vel.x,mvx*spd,6,dt);R.vel.z=damp(R.vel.z,mvz*spd,6,dt);
  R.pos.x+=R.vel.x*dt;R.pos.z+=R.vel.z*dt;
  if(Math.hypot(mvx,mvz)>0.1)R.root.rotation.y=lerpAngle(R.root.rotation.y,Math.atan2(mvx,mvz),9*dt);
  if(up)R.vy=Math.min(R.vy+40*dt,16);
  else if(down)R.vy=Math.max(R.vy-40*dt,-22);
  else if(!R.grounded)R.vy=damp(R.vy,KIDS?-1.2:-6,3,dt);
  R.pos.y+=R.vy*dt;
  R.pos.x=clamp(R.pos.x,-190,190);R.pos.z=clamp(R.pos.z,-195,190);
  const CEIL=KIDS?60:95;if(R.pos.y>CEIL){R.pos.y=CEIL;R.vy=Math.min(R.vy,0);if(KIDS&&tin.up){tin.up=false;syncBtns();}}
  collide(R.pos);
  const g=groundAt(R.pos);
  const wasAir=!R.grounded;
  if(R.pos.y<=g){R.pos.y=g;if(R.vy<0)R.vy=0;R.grounded=!up;if(wasAir&&R.grounded){shake=0.6;sfx('land');}}
  else R.grounded=false;
  if(KIDS&&tin.down&&R.grounded){tin.down=false;syncBtns();}

  // pose
  const hs=Math.hypot(R.vel.x,R.vel.z);
  let armT=-0.25;
  if(R.grounded){R.phase+=hs*dt*0.32;const sw=Math.sin(R.phase)*Math.min(1,hs/9)*0.7;
    R.legs[0].rotation.x=sw;R.legs[1].rotation.x=-sw;armT=null;
    R.arms[0].rotation.x=damp(R.arms[0].rotation.x,-sw*0.7,12,dt);R.arms[1].rotation.x=damp(R.arms[1].rotation.x,sw*0.7,12,dt);
    R.tilt.rotation.x=damp(R.tilt.rotation.x,0,8,dt);R.tilt.position.y=Math.abs(Math.sin(R.phase))*0.25*Math.min(1,hs/9);
    const s=Math.sign(Math.sin(R.phase));if(hs>4&&s!==lastSw){lastSw=s;shake=Math.max(shake,0.25);sfx('step');}
  }else{
    R.legs[0].rotation.x=damp(R.legs[0].rotation.x,0.35,6,dt);R.legs[1].rotation.x=damp(R.legs[1].rotation.x,0.1,6,dt);
    R.tilt.rotation.x=damp(R.tilt.rotation.x,Math.min(1,hs/30)*0.35,5,dt);R.tilt.position.y=Math.sin(T*2.2)*0.3;
  }
  if(R.carry)armT=R.carry.mode==='top'?-2.9:-1.35;
  if(armT!==null)R.arms.forEach(a=>a.rotation.x=damp(a.rotation.x,armT,8,dt));
  const jet=!R.grounded||up;
  if(jetGain&&ac){const tgt=MUTE?0:(jet?(up?0.20:0.085):0);
    jetGain.gain.setTargetAtTime(tgt,ac.currentTime,0.08);
    jetBp.frequency.setTargetAtTime(up?1450:780,ac.currentTime,0.12);}
  const jb2=R.bigJet?1.45:1;R.flames.forEach(f=>{f.visible=jet;f.scale.set(jb2,-(up?1.6:0.9)*jb2*(0.8+Math.random()*0.4),jb2);});
  updatePower(dt,hs);
  R.root.updateMatrixWorld(true);
  if(R.carry){(R.carry.mode==='top'?R.aTop:R.aFront).getWorldPosition(tmp);R.carry.obj.position.copy(tmp);R.carry.obj.rotation.y=R.root.rotation.y;}

  // camera
  if(KIDS&&started&&Math.hypot(R.vel.x,R.vel.z)>3&&T-lastDrag>1.5&&!keys.ArrowLeft&&!keys.ArrowRight)camYaw=lerpAngle(camYaw,R.root.rotation.y+Math.PI,1.6*dt);
  const sc=R.tilt.scale.x/1.8,d=(innerWidth<innerHeight?46:38)*sc,cp=Math.cos(camPitch);
  const want=new V3(R.pos.x+Math.sin(camYaw)*cp*d,R.pos.y+8*sc+Math.sin(camPitch)*d,R.pos.z+Math.cos(camYaw)*cp*d);
  want.y=Math.max(want.y,2.5);
  camera.position.lerp(want,1-Math.exp(-7*dt));
  shake=damp(shake,0,6,dt);
  camera.position.y+=(Math.random()-0.5)*shake;
  camera.lookAt(R.pos.x,R.pos.y+13*sc,R.pos.z);
  sun.position.set(R.pos.x+60,R.pos.y+130,R.pos.z+40);sun.target.position.copy(R.pos);

  updateAmbient(dt);
  for(const m of missions){m.t+=dt;m.update(dt);
    if(!m.done){const show=!m.beaconOff;m.beacon.visible=show;m.iconSpr.visible=show;
      m.beacon.position.set(m.target.x,90,m.target.z);m.iconSpr.position.set(m.target.x,m.target.y+6+Math.sin(m.t*3)*0.6,m.target.z);}}
  updateFx(dt);

  // HUD
  if(toastT>0){toastT-=dt;if(toastT<=0)$('toast').classList.remove('show');}
  const act=missions.filter(m=>!m.done);
  let f=R.carry?R.carry.m:null;
  if(!f){let bd=1e9;act.forEach(m=>{const dd=xzDist(R.pos,m.target);if(dd<bd){bd=dd;f=m;}});}
  if(f!==focusM){focusM=f;renderQuests();}
  const cmp=$('compass');
  if(f&&started){cmp.style.display='flex';
    const dx=f.target.x-R.pos.x,dz=f.target.z-R.pos.z;
    const ang=Math.atan2(dx*rxv+dz*rzv,dx*fxv+dz*fzv);
    $('arrow').style.transform=`rotate(${ang}rad)`;
    const dist=f.beaconOff?'':` ${Math.round(Math.hypot(dx,dz))}m`;
    $('clabel').textContent=`${f.icon} ${f.title()}${dist}`;
  }else cmp.style.display='none';
  const it=started?interactable():null;
  let ptxt=null,landHint=false;
  if(it)ptxt=`✋ ${it.prompt}${coarse?'':'  [E]'}`;
  else if(R.carry&&!R.grounded&&R.carry.m.near&&R.carry.m.near()){ptxt=R.carry.m.nearText||K('⬇ ここで おりてね！','⬇ ここで着地しよう');landHint=true;}
  $('prompt').className='hud card'+(ptxt?' show':'');
  if(ptxt&&$('prompt').textContent!==ptxt)$('prompt').textContent=ptxt;
  $('bDown').classList.toggle('hint',landHint&&!tin.down);
  $('bHelp').classList.toggle('ready',!!it);
  hudT-=dt;if(hudT<=0){hudT=0.25;if(act.some(m=>m.timer!=null))renderQuests();}
  drawMini(T);
}
let titleFrames=0;
function loop(){const dt=Math.min(clock.getDelta(),0.05);update(dt);
  // タイトル表示中は背景の街を毎フレーム描き直さない（#title が全面を覆っているので見えない）
  if(started||$('ending').classList.contains('show')||titleFrames<3){renderer.render(scene,camera);titleFrames++;}
  requestAnimationFrame(loop);}
camera.position.set(20,20,60);
loop();
})();
</script>
